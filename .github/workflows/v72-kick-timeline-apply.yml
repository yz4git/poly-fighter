name: Apply v7.2 contact-aligned kick timeline

on:
  push:
    branches:
      - improve/procedural-v7-kick-kinematics-20260902
    paths:
      - .github/workflows/v72-kick-timeline-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/procedural-v7-kick-kinematics-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: python scripts/patch-kick-timeline-v72.py
      - run: npm ci --no-audit --no-fund
      - name: Validate v7.2 kick timeline
        run: |
          npm run test:ci:tps
          npm run lint
          npm run build
      - name: Commit v7.2 timeline sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/motion-expansion-runtime.ts
          git commit -m "Align kick contact pose with active frames"
          git push origin HEAD:improve/procedural-v7-kick-kinematics-20260902
