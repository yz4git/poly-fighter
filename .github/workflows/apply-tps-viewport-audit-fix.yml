name: Apply TPS viewport audit fix

on:
  push:
    branches: [feat/procedural-fight-v3-20260902]
    paths:
      - scripts/fix-tps-viewport-audit.py
      - .github/workflows/apply-tps-viewport-audit-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/procedural-fight-v3-20260902
          fetch-depth: 0
      - name: Patch deterministic TPS viewport audit
        run: python3 scripts/fix-tps-viewport-audit.py
      - name: Syntax check
        run: node --check scripts/capture-tps-visual-audit.mjs
      - name: Commit audit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-tps-visual-audit.mjs
          git commit -m "Fix deterministic TPS iPhone viewport audit"
          git pull --rebase origin feat/procedural-fight-v3-20260902
          git push origin HEAD:feat/procedural-fight-v3-20260902
