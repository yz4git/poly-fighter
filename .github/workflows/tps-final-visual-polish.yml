name: TPS final visual polish

on:
  push:
    paths:
      - 'scripts/apply-tps-final-visual-polish.py'
      - '.github/workflows/tps-final-visual-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply visual polish
        run: python3 scripts/apply-tps-final-visual-polish.py
      - name: TPS regression suite
        run: npm run test:ci:tps
      - name: PWA startup regressions
        run: npm run test:pwa
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Publish validated polish
        run: |
          rm -f scripts/apply-tps-final-visual-polish.py .github/workflows/tps-final-visual-polish.yml
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish TPS compact camera and quickstep grounding"
          git push origin HEAD:main
