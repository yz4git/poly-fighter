name: Integrate Quaternius motions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/apply-quaternius-motion-integration.mjs
      - .github/workflows/quaternius-motion-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply runtime retarget integration
        run: node scripts/apply-quaternius-motion-integration.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate motion and fighting rules
        run: npm run test:rules
      - name: Build production app
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Publish validated integration
        run: |
          if [ -z "$(git status --porcelain -- src/game/fighter.ts package.json THIRD_PARTY_NOTICES.md public/sw.js)" ]; then
            echo "Runtime integration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/fighter.ts package.json THIRD_PARTY_NOTICES.md public/sw.js
          git commit -m "Retarget Quaternius CC0 motions into combat runtime"
          git push origin HEAD:main
