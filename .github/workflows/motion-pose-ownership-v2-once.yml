name: POLY FIGHTER Motion Pose Ownership V2 Once

on:
  push:
    branches: [motion-pose-ownership-v2]
    paths:
      - .github/workflows/motion-pose-ownership-v2-once.yml

permissions:
  contents: write

concurrency:
  group: motion-pose-ownership-v2-once
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-pose-ownership-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Wire fixed-tick pose ownership into production runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/game/visual-quaternius-runtime.ts')
          s = runtime.read_text()

          old_import = 'import { retargetMotionClips } from "./motion-retarget";\n'
          new_import = old_import + 'import { attackEntryPreviousPoseWeight, motionPoseOwner, shouldApplyLocomotionFootLock } from "./motion-pose-policy";\n'
          if old_import not in s:
              raise SystemExit('motion-retarget import anchor not found')
          s = s.replace(old_import, new_import, 1)

          old_transition = '''  if (runtime.transitionPose.size) {\n    const weight = 1 - smoothMotion(runtime.transitionAge / runtime.transitionDuration);\n    if (weight <= 0) runtime.transitionPose.clear();\n    else for (const [name, from] of runtime.transitionPose) {\n      const bone = runtime.bones.get(name)!;\n      bone.quaternion.slerp(from.rotation, weight);\n      bone.position.lerp(from.position, weight);\n    }\n  }\n'''
          new_transition = '''  const poseOwner = motionPoseOwner(fighter.state);\n  runtime.host.userData.combatMotionPoseOwner = poseOwner;\n  if (runtime.transitionPose.size) {\n    const attackOwned = poseOwner === "AUTHORED_COMBAT_TIMELINE" && Boolean(move);\n    const weight = attackOwned && move\n      ? attackEntryPreviousPoseWeight(move, fighter.moveTick)\n      : 1 - smoothMotion(runtime.transitionAge / runtime.transitionDuration);\n    runtime.host.userData.combatMotionTransitionPolicy = attackOwned\n      ? "GAMEPLAY_TICK_ATTACK_ENTRY"\n      : "RENDER_TIME_STATE_TRANSITION";\n    runtime.host.userData.combatMotionTransitionPreviousPoseWeight = weight;\n    if (weight <= 0) runtime.transitionPose.clear();\n    else for (const [name, from] of runtime.transitionPose) {\n      const bone = runtime.bones.get(name)!;\n      bone.quaternion.slerp(from.rotation, weight);\n      bone.position.lerp(from.position, weight);\n    }\n  } else {\n    runtime.host.userData.combatMotionTransitionPolicy = poseOwner === "AUTHORED_COMBAT_TIMELINE"\n      ? "GAMEPLAY_TICK_ATTACK_ENTRY"\n      : "RENDER_TIME_STATE_TRANSITION";\n    runtime.host.userData.combatMotionTransitionPreviousPoseWeight = 0;\n  }\n'''
          if old_transition not in s:
              raise SystemExit('transition blend anchor not found')
          s = s.replace(old_transition, new_transition, 1)

          old_foot = '''  const walking = fighter.state === "WALK";\n  if (!walking || fighter.hitStop > 0) {\n    if (!walking) { runtime.plantedFeet.l = null; runtime.plantedFeet.r = null; }\n    return;\n  }\n'''
          new_foot = '''  const footLockActive = shouldApplyLocomotionFootLock(fighter.state, fighter.hitStop);\n  fighter.visual.root.userData.combatMotionPoseOwner = motionPoseOwner(fighter.state);\n  fighter.visual.root.userData.combatMotionFootLockPolicy = footLockActive\n    ? "LOCOMOTION_OWNER_ONLY"\n    : "DISABLED_FOR_CURRENT_POSE_OWNER";\n  if (!footLockActive) {\n    if (fighter.state !== "WALK") { runtime.plantedFeet.l = null; runtime.plantedFeet.r = null; }\n    return;\n  }\n'''
          if old_foot not in s:
              raise SystemExit('foot lock anchor not found')
          s = s.replace(old_foot, new_foot, 1)
          runtime.write_text(s)

          package = Path('package.json')
          p = package.read_text()
          anchor = 'tests/combat-motion-timeline.test.ts '
          replacement = 'tests/combat-motion-timeline.test.ts tests/motion-pose-policy.test.ts '
          if p.count(anchor) < 2:
              raise SystemExit(f'expected test script anchor twice, got {p.count(anchor)}')
          p = p.replace(anchor, replacement)
          package.write_text(p)

          test = Path('tests/motion-pose-policy.test.ts')
          t = test.read_text()
          if 'readFile' not in t:
              t = t.replace('import test from "node:test";\n', 'import test from "node:test";\nimport { readFile } from "node:fs/promises";\n', 1)
          wiring = '''\n\ntest("production runtime delegates attack blending and foot lock to pose policy", async () => {\n  const source = await readFile(new URL("../src/game/visual-quaternius-runtime.ts", import.meta.url), "utf8");\n  assert.match(source, /attackEntryPreviousPoseWeight\\(move, fighter\\.moveTick\\)/);\n  assert.match(source, /shouldApplyLocomotionFootLock\\(fighter\\.state, fighter\\.hitStop\\)/);\n  assert.match(source, /combatMotionPoseOwner/);\n  assert.doesNotMatch(source, /const walking = fighter\\.state === "WALK"/);\n});\n'''
          if 'production runtime delegates attack blending and foot lock to pose policy' not in t:
              t += wiring
          test.write_text(t)
          PY
      - name: Validate deterministic pose ownership contracts
        run: |
          node --import tsx --test tests/motion-pose-policy.test.ts tests/combat-motion-timeline.test.ts tests/combat-motion.test.ts tests/kick-ankle.test.ts
          npm run test:ci:tps
          npm run lint
      - name: Build production runtime
        run: npm run build
      - name: Commit verified integration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/visual-quaternius-runtime.ts tests/motion-pose-policy.test.ts package.json
          git rm .github/workflows/motion-pose-ownership-v2-once.yml
          git commit -m "Make attack pose transitions gameplay-tick deterministic"
          git push origin HEAD:motion-pose-ownership-v2
