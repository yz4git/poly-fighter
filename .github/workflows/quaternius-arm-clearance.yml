name: Quaternius arm clearance fix

on:
  push:
    branches: [main]
    paths:
      - scripts/fix-quaternius-arm-clearance.mjs
      - .github/workflows/quaternius-arm-clearance.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quaternius-arm-clearance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply UBC arm clearance fix
        run: node scripts/fix-quaternius-arm-clearance.mjs
      - name: Shoulder and arm regression
        run: npm run test:shoulder
      - name: TPS combat regressions
        run: npm run test:ci:tps
      - name: Static regressions
        run: npm run test:ci:static
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Publish validated arm clearance fix
        run: |
          if [ -z "$(git status --porcelain src/game/visual-quaternius-runtime.ts tests/quaternius-shoulder.test.ts)" ]; then
            echo "Arm clearance fix already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/visual-quaternius-runtime.ts tests/quaternius-shoulder.test.ts
          git commit -m "Keep imported fighter arms clear of torso"
          git push origin HEAD:main
