name: POLY FIGHTER CMU mocap source probe

on:
  pull_request:
    paths:
      - 'src/game/cmu-mocap-pilot.ts'
      - 'scripts/check-cmu-mocap.mjs'
      - '.github/workflows/cmu-mocap-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe upstream skeleton-only GLB files
        run: node scripts/check-cmu-mocap.mjs
        continue-on-error: true
