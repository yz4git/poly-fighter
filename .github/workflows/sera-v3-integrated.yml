name: SERA V3 integrated sculpt & real GLB build

on:
  push:
    branches:
      - chatgpt/sera-v3-integrated
    paths:
      - tools/blender/author-sera-v3.py
      - tools/blender/render-sera-v3-review.py
      - scripts/validate-sera-v3.mjs
      - .github/workflows/sera-v3-integrated.yml
      - character-authoring/sera-hero.params.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sera-v3-integrated-character
  cancel-in-progress: true

jobs:
  create-character:
    if: github.ref == 'refs/heads/chatgpt/sera-v3-integrated'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild licensed skinned human source from pinned Ara
        run: |
          set -euxo pipefail
          git clone https://github.com/olatunde85/3d-gen.git .external/ara
          git -C .external/ara checkout --detach de8a4a0c36229fb7235a04d001ff928318ac43ea
          test "$(git -C .external/ara rev-parse HEAD)" = de8a4a0c36229fb7235a04d001ff928318ac43ea
          cd .external/ara
          npm ci --ignore-scripts --no-audit --no-fund
          npm run setup-assets
          mkdir -p "$GITHUB_WORKSPACE/artifacts/sera-v3/base"
          npm run export -- --params "$GITHUB_WORKSPACE/character-authoring/sera-hero.params.json" \
            --formats glb --detail medium --out "$GITHUB_WORKSPACE/artifacts/sera-v3/base"
          test -s "$GITHUB_WORKSPACE/artifacts/sera-v3/base/sera_hero.glb"
      - name: Install Blender and headless rendering libraries
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri xvfb
      - name: Sculpt actual SERA V3 character from anatomy and fit clothes
        run: |
          set -euxo pipefail
          mkdir -p public/models/hero artifacts/sera-v3/source
          xvfb-run -a blender --background --factory-startup \
            --python tools/blender/author-sera-v3.py -- \
            artifacts/sera-v3/base/sera_hero.glb public/models/hero/sera-hero-v3.glb \
            artifacts/sera-v3/source/sera-hero-v3.blend
          node scripts/validate-sera-hero-glb.mjs public/models/hero/sera-hero-v3.glb
          node scripts/validate-sera-v3.mjs public/models/hero/sera-hero-v3.glb \
            artifacts/sera-v3/quality.json
      - name: Render six actual GLB views including face closeup
        run: |
          set -euxo pipefail
          xvfb-run -a blender --background --factory-startup \
            --python tools/blender/render-sera-v3-review.py -- \
            public/models/hero/sera-hero-v3.glb artifacts/sera-v3/views
          test "$(find artifacts/sera-v3/views -name '*.png' | wc -l)" -eq 6
      - name: Upload editable Blender, GLB, real photos and quality report
        uses: actions/upload-artifact@v4
        with:
          name: sera-v3-integrated-real-asset
          path: |
            public/models/hero/sera-hero-v3.glb
            artifacts/sera-v3/source/sera-hero-v3.blend
            artifacts/sera-v3/quality.json
            artifacts/sera-v3/views/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Commit standalone V3 asset and visual evidence to V3 branch only
        run: |
          set -euxo pipefail
          mkdir -p docs/hero-v3-review
          cp artifacts/sera-v3/views/sera-v3-*.png docs/hero-v3-review/
          cp artifacts/sera-v3/quality.json docs/hero-v3-review/quality.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models/hero/sera-hero-v3.glb docs/hero-v3-review/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Create original integrated SERA V3 sculpt and evidence [skip ci]'
          git fetch origin chatgpt/sera-v3-integrated
          git rebase origin/chatgpt/sera-v3-integrated
          git push origin HEAD:chatgpt/sera-v3-integrated
