name: One-shot TPS close readability pass

on:
  push:
    branches: [motion-onoff-review]
    paths:
      - .github/workflows/tps-close-readability-pass.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-onoff-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Implement close-range readability pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f"expected exactly one match in {path}: {old[:80]!r}, got {s.count(old)}")
              p.write_text(s.replace(old, new, 1))

          path = 'src/game/tps-game-base.ts'
          replace_once(path,
            'const TPS_CAMERA_CLOSE_SHOULDER_BONUS = 2.55;\nconst TPS_CAMERA_CLOSE_BACK_DELTA = -0.58;\nconst TPS_CAMERA_CLOSE_TARGET_SIDE_SHIFT = 0.30;\nconst TPS_CAMERA_CLOSE_TARGET_LIFT = 0.14;',
            'const TPS_CAMERA_CLOSE_SHOULDER_BONUS = 3.50;\nconst TPS_CAMERA_CLOSE_BACK_DELTA = -1.05;\nconst TPS_CAMERA_CLOSE_ANCHOR_BLEND = 0.88;\nconst TPS_CAMERA_CLOSE_TARGET_MIDPOINT_BLEND = 0.42;\nconst TPS_CAMERA_CLOSE_TARGET_SIDE_SHIFT = 0.42;\nconst TPS_CAMERA_CLOSE_TARGET_LIFT = 0.14;')

          replace_once(path,
            '  private readonly cameraTarget = new THREE.Vector3();\n  private readonly cameraDesired = new THREE.Vector3();',
            '  private readonly cameraTarget = new THREE.Vector3();\n  private readonly cameraDesired = new THREE.Vector3();\n  private readonly cameraPairMidpoint = new THREE.Vector3();\n  private readonly cameraAnchor = new THREE.Vector3();\n  private readonly cameraFocus = new THREE.Vector3();')

          old = '''    const targetHeight = 1.22 + closeFactor * TPS_CAMERA_CLOSE_TARGET_LIFT;\n    this.cameraTarget.copy(this.p2.position)\n      .addScaledVector(right, TPS_CAMERA_CLOSE_TARGET_SIDE_SHIFT * closeFactor - flankLaneShift + impactReadabilityFactor * 0.080)\n      .add(new THREE.Vector3(0, targetHeight, 0));\n    this.camera.userData.tpsCloseReadabilityFactor = closeFactor;\n    this.camera.userData.tpsImpactReadabilityFactor = impactReadabilityFactor;\n    this.camera.userData.tpsShoulderOffset = shoulderOffset;\n    this.camera.userData.tpsTargetHeight = targetHeight;\n    this.cameraDesired.copy(this.p1.position)\n      .addScaledVector(forward, -backDistance)\n      .addScaledVector(right, shoulderOffset + flankLaneShift * 0.36)\n      .add(new THREE.Vector3(0, cameraHeight, 0));'''
          new = '''    const targetHeight = 1.22 + closeFactor * TPS_CAMERA_CLOSE_TARGET_LIFT;\n    // At melee range, orbit around the pair instead of keeping the camera rooted\n    // directly behind the foreground player. This reduces foreground occlusion\n    // without changing simulation positions, hitboxes, reach, or authored clips.\n    this.cameraPairMidpoint.copy(this.p1.position).lerp(this.p2.position, 0.5);\n    const closeAnchorBlend = closeFactor * TPS_CAMERA_CLOSE_ANCHOR_BLEND;\n    const closeTargetBlend = closeFactor * TPS_CAMERA_CLOSE_TARGET_MIDPOINT_BLEND;\n    this.cameraAnchor.copy(this.p1.position).lerp(this.cameraPairMidpoint, closeAnchorBlend);\n    this.cameraFocus.copy(this.p2.position).lerp(this.cameraPairMidpoint, closeTargetBlend);\n    this.cameraTarget.copy(this.cameraFocus)\n      .addScaledVector(right, TPS_CAMERA_CLOSE_TARGET_SIDE_SHIFT * closeFactor - flankLaneShift + impactReadabilityFactor * 0.080)\n      .add(new THREE.Vector3(0, targetHeight, 0));\n    this.camera.userData.tpsCloseReadabilityFactor = closeFactor;\n    this.camera.userData.tpsCloseAnchorBlend = closeAnchorBlend;\n    this.camera.userData.tpsCloseTargetBlend = closeTargetBlend;\n    this.camera.userData.tpsImpactReadabilityFactor = impactReadabilityFactor;\n    this.camera.userData.tpsShoulderOffset = shoulderOffset;\n    this.camera.userData.tpsBackDistance = backDistance;\n    this.camera.userData.tpsTargetHeight = targetHeight;\n    this.cameraDesired.copy(this.cameraAnchor)\n      .addScaledVector(forward, -backDistance)\n      .addScaledVector(right, shoulderOffset + flankLaneShift * 0.36)\n      .add(new THREE.Vector3(0, cameraHeight, 0));'''
          replace_once(path, old, new)

          replace_once(path,
            '    const lockGeometry = new THREE.TorusGeometry(0.46, 0.022, 8, 48);\n    const lockMaterial = new THREE.MeshBasicMaterial({ color: 0x7ce8ff, transparent: true, opacity: 0.96, depthTest: true, depthWrite: false });',
            '    const lockGeometry = new THREE.TorusGeometry(0.38, 0.018, 8, 48);\n    const lockMaterial = new THREE.MeshBasicMaterial({ color: 0x7ce8ff, transparent: true, opacity: 0.82, depthTest: true, depthWrite: false });')

          old = '''    this.p2.visual.root.updateMatrixWorld(true);\n    const target = this.p2.visual.root.localToWorld(new THREE.Vector3(0, this.p2.visual.layout.ribY + 0.04, 0));\n    const distance = Math.hypot(this.p2.position.x - this.p1.position.x, this.p2.position.z - this.p1.position.z);\n    const threat = this.p2.state === "ATTACK";\n    const inStrikeRange = distance < TPS_STRIKE_RANGE;'''
          new = '''    this.p2.visual.root.updateMatrixWorld(true);\n    const distance = Math.hypot(this.p2.position.x - this.p1.position.x, this.p2.position.z - this.p1.position.z);\n    const threat = this.p2.state === "ATTACK";\n    const inStrikeRange = distance < TPS_STRIKE_RANGE;\n    // Keep the lock cue above the torso at melee range so authored arms, chest\n    // rotation, and hit reactions remain visible instead of sitting under a ring.\n    const lockLift = inStrikeRange ? 0.62 : 0.46;\n    const target = this.p2.visual.root.localToWorld(new THREE.Vector3(0, this.p2.visual.layout.ribY + lockLift, 0));'''
          replace_once(path, old, new)

          replace_once(path,
            '    const pulse = (threat ? 1.04 : inStrikeRange ? 0.96 : 0.9) + Math.sin(this.renderTime * pulseRate) * 0.055;',
            '    const pulse = (threat ? 0.94 : inStrikeRange ? 0.88 : 0.86) + Math.sin(this.renderTime * pulseRate) * 0.045;')
          replace_once(path,
            '    this.targetGroundRing.material.opacity = threat ? 0.58 : inStrikeRange ? 0.46 : 0.28;',
            '    this.targetGroundRing.material.opacity = threat ? 0.48 : inStrikeRange ? 0.34 : 0.22;')

          path = 'src/game/tps-graphics.ts'
          old = '''    const contactPoint = new THREE.Vector3(event.position.x, event.position.y, event.position.z);\n    const facing = camera.position.clone().sub(contactPoint).normalize();\n    const visualPoint = contactPoint.clone().addScaledVector(facing, -0.055);'''
          new = '''    const contactPoint = new THREE.Vector3(event.position.x, event.position.y, event.position.z);\n    const facing = camera.position.clone().sub(contactPoint).normalize();\n    const cameraRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion).normalize();\n    const contactSide = event.move.visualContact === "LEFT_FIST" || event.move.visualContact === "LEFT_FOOT"\n      ? -1\n      : event.move.visualContact === "RIGHT_FIST" || event.move.visualContact === "RIGHT_FOOT"\n        ? 1\n        : event.attacker === "p1" ? -1 : 1;\n    // Float the ring slightly toward the camera and toward the striking limb.\n    // This keeps impact feedback strong without painting an opaque target over\n    // the two overlapping torsos at close range.\n    const visualPoint = contactPoint.clone()\n      .addScaledVector(facing, 0.12)\n      .addScaledVector(cameraRight, contactSide * 0.12);'''
          replace_once(path, old, new)
          replace_once(path,
            '      wave.mesh.scale.setScalar(0.60 + strength * 0.14 + index * 0.12);',
            '      wave.mesh.scale.setScalar(0.54 + strength * 0.12 + index * 0.10);')
          replace_once(path,
            '''          ? Math.max(0.34, 0.50 - index * 0.10)\n          : visualTier === 2\n            ? 0.38\n            : 0.30;''',
            '''          ? Math.max(0.30, 0.44 - index * 0.09)\n          : visualTier === 2\n            ? 0.34\n            : 0.27;''')
          # Audit-readable breadcrumbs for the screen-space declutter policy.
          replace_once(path,
            '    this.group.userData.lastImpactWaveCount = waveCount;',
            '    this.group.userData.lastImpactWaveCount = waveCount;\n    this.group.userData.lastImpactVisualSideOffset = contactSide * 0.12;\n    this.group.userData.lastImpactVisualDepthOffset = 0.12;')

          path = 'tests/tps-mode.test.ts'
          replace_once(path, '  assert.match(source, /cameraTarget\\.copy\\(this\\.p2\\.position\\)/);', '  assert.match(source, /cameraTarget\\.copy\\(this\\.cameraFocus\\)/);')
          replace_once(path, '  assert.match(source, /TPS_CAMERA_CLOSE_SHOULDER_BONUS = 2\\.55/);', '  assert.match(source, /TPS_CAMERA_CLOSE_SHOULDER_BONUS = 3\\.50/);')
          replace_once(path, '  assert.match(source, /TPS_CAMERA_CLOSE_BACK_DELTA = -0\\.58/);', '  assert.match(source, /TPS_CAMERA_CLOSE_BACK_DELTA = -1\\.05/);\n  assert.match(source, /TPS_CAMERA_CLOSE_ANCHOR_BLEND = 0\\.88/);\n  assert.match(source, /TPS_CAMERA_CLOSE_TARGET_MIDPOINT_BLEND = 0\\.42/);')
          replace_once(path, '  assert.match(source, /TPS_CAMERA_CLOSE_TARGET_SIDE_SHIFT = 0\\.30/);', '  assert.match(source, /TPS_CAMERA_CLOSE_TARGET_SIDE_SHIFT = 0\\.42/);')
          replace_once(path, '  assert.match(source, /tpsCloseReadabilityFactor/);', '  assert.match(source, /tpsCloseReadabilityFactor/);\n  assert.match(source, /tpsCloseAnchorBlend/);\n  assert.match(source, /cameraAnchor\\.copy\\(this\\.p1\\.position\\)\\.lerp\\(this\\.cameraPairMidpoint/);\n  assert.match(source, /lockLift = inStrikeRange \\? 0\\.62 : 0\\.46/);')

          path = 'tests/tps-graphics.test.ts'
          p = Path(path)
          s = p.read_text()
          if 'TPS impact visuals stay offset from the torso collision stack' not in s:
              s += '''\n\ntest("TPS impact visuals stay offset from the torso collision stack", async () => {\n  const source = await readFile(new URL("../src/game/tps-graphics.ts", import.meta.url), "utf8");\n  assert.match(source, /addScaledVector\\(facing, 0\\.12\\)/);\n  assert.match(source, /addScaledVector\\(cameraRight, contactSide \\* 0\\.12\\)/);\n  assert.match(source, /lastImpactVisualSideOffset/);\n  assert.match(source, /wave\\.mesh\\.scale\\.setScalar\\(0\\.54 \\+ strength \\* 0\\.12/);\n});\n'''
              s = s.replace('import { readFile } from "node:fs/promises";\n', '') if False else s
              # Add the file reader import only once.
              s = s.replace('import assert from "node:assert/strict";\n', 'import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n', 1)
              p.write_text(s)
          PY
      - name: Validate readability pass
        run: |
          npm ci --no-audit --no-fund
          npm run test:ci:tps
          npm run lint
          npm run build
      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tps-close-readability-pass.yml
          git add src/game/tps-game-base.ts src/game/tps-graphics.ts tests/tps-mode.test.ts tests/tps-graphics.test.ts
          git commit -m "Improve TPS close-range combat readability"
          git push origin HEAD:motion-onoff-review
