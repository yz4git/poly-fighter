name: Tune TPS close camera back distance

on:
  push:
    branches: [tps-continuous-play-polish-v1]
    paths:
      - .github/workflows/tps-camera-back-tune.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Tune close camera and validate TPS rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/game/tps-game-base.ts')
          s = p.read_text()
          old = 'const TPS_CAMERA_CLOSE_BACK_DELTA = 0.35;'
          new = 'const TPS_CAMERA_CLOSE_BACK_DELTA = 0.15;'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          p = Path('tests/tps-mode.test.ts')
          s = p.read_text()
          old = r'/TPS_CAMERA_CLOSE_BACK_DELTA = 0\.35/'
          new = r'/TPS_CAMERA_CLOSE_BACK_DELTA = 0\.15/'
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          npm ci --no-audit --no-fund
          npm run test:ci:tps
          npm run lint
          git diff --check
      - name: Push camera tune
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/game/tps-game-base.ts tests/tps-mode.test.ts
          git commit -m "Tune TPS close camera framing"
          git push
