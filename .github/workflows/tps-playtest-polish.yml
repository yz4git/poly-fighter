name: Apply TPS playtest polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tps-playtest-polish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tps-playtest-polish
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply TPS gameplay and presentation pass
        shell: bash
        run: |
          set +e
          output="$(node scripts/apply-tps-playtest-polish.mjs 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output" | grep -q "Missing patch target in scripts/capture-tps-visual-audit.mjs" || exit "$status"
            node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          function replaceOnce(path, before, after) {
            const source = readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Missing fallback target in ${path}`);
            writeFileSync(path, source.replace(before, after));
          }
          const audit = 'scripts/capture-tps-visual-audit.mjs';
          replaceOnce(audit,
          `    cancelAnimationFrame(game.raf);
              game.running = false;
              game.finished = false;
              game.input.clear();
              game.updateEnemy = () => { game.p2.velocity.set(0, 0, 0); game.p2.state = 'IDLE'; };
          `,
          `    cancelAnimationFrame(game.raf);
              game.running = false;
              game.finished = false;
              game.input.clear();
              game.effects.update(2);
              game.updateEnemy = () => { game.p2.velocity.set(0, 0, 0); game.p2.state = 'IDLE'; };
          `);
          replaceOnce(audit,
          `  await screenshot(sessionId, \`${'${outputDir}'}/tps-punch-settled.png\`);

            await execute(sessionId, \`${'${gameLookup}'}
          `,
          `  await screenshot(sessionId, \`${'${outputDir}'}/tps-punch-settled.png\`);

            const throwProbe = await execute(sessionId, \`${'${gameLookup}'}
              const game = findGame();
              game.finished = false;
              game.input.clear();
              game.effects.update(2);
              for (const fighter of [game.p1, game.p2]) {
                fighter.currentMove = null;
                fighter.moveTick = 0;
                fighter.velocity.set(0, 0, 0);
                fighter.hitTargets.clear();
                fighter.health = 100;
                fighter.state = 'IDLE';
                const neutral = { left: false, right: false, up: false, down: false, punch: false, kick: false, guard: false };
                fighter.input = { ...neutral };
                fighter.previousInput = { ...neutral };
              }
              game.p1.position.set(0, 0, 0.48);
              game.p2.position.set(0, 0, -0.48);
              game.updateEnemy = () => { game.p2.velocity.set(0, 0, 0); if (game.p2.state !== 'HIT' && game.p2.state !== 'KNOCKDOWN') game.p2.state = 'IDLE'; };
              game.press('guard', 'tps-audit-throw-g');
              game.step();
              game.press('kick', 'tps-audit-throw-k');
              game.step();
              const moveId = game.p1.currentMove?.id ?? null;
              game.release('guard', 'tps-audit-throw-g');
              game.release('kick', 'tps-audit-throw-k');
              let steps = 2;
              while (steps < 45 && game.p2.health === 100) { game.step(); steps += 1; }
              game.updateCamera(1 / 60);
              game.updateLockOn();
              game.renderer.render(game.scene, game.camera);
              return { moveId, steps, p2Health: game.p2.health, p2State: game.p2.state };
            \`);
            if (throwProbe.moveId !== 'throw' || !(throwProbe.p2Health < 100)) throw new Error(\`TPS G+K throw failed: \${JSON.stringify(throwProbe)}\`);
            await screenshot(sessionId, \`${'${outputDir}'}/tps-throw.png\`);

            await execute(sessionId, \`${'${gameLookup}'}
          `);
          replaceOnce(audit,
          `  const report = { initial, iphone, afterStrafe, lateralTravel, beforeForwardDistance, afterForward, afterForwardDistance, quickstepProbe, quickstepTravel, punchProbe, afterPunch, afterBoundary, radial };
          `,
          `  const report = { initial, iphone, afterStrafe, lateralTravel, beforeForwardDistance, afterForward, afterForwardDistance, quickstepProbe, quickstepTravel, punchProbe, afterPunch, throwProbe, afterBoundary, radial };
          `);
          const workflow = '.github/workflows/tps-visual-audit.yml';
          replaceOnce(workflow,
          `          for image in tps-idle tps-iphone-idle tps-quickstep tps-punch tps-punch-settled; do
          `,
          `          for image in tps-idle tps-iphone-idle tps-quickstep tps-punch tps-punch-settled tps-throw; do
          `);
          console.log('Applied audit fallback patches.');
          NODE
          fi
      - run: npm ci --no-audit --no-fund
      - name: TPS regression suite
        run: npm run test:ci:tps
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify patch
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
      - name: Commit TPS playtest pass
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/game/tps-game.ts app/page.tsx app/globals.css tests/tps-mode.test.ts scripts/capture-tps-visual-audit.mjs .github/workflows/tps-visual-audit.yml
          git commit -m "Polish TPS playtest combat and presentation"
          git push
