name: One-shot authored sampling policy fix

on:
  push:
    branches: [motion-onoff-review]
    paths:
      - .github/workflows/authored-sampling-policy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-onoff-review
          fetch-depth: 0

      - name: Use contact-appropriate authored sampling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/capture-motion-readability-audit.mjs')
          s = p.read_text()
          old = '''        const authoredContactTick = move.startup + move.active - 1;\n        const authoredContactReady = game.p1.isActive() && game.p1.moveTick >= authoredContactTick;\n        if (game.p1.state === 'ATTACK' && (policy === 'AUTHORED_ATTACK_PRESERVE' ? authoredContactReady : phase === 'ACTIVE')) {\n'''
          new = '''        const authoredContactTick = move.startup + move.active - 1;\n        const footContact = move.visualContact === 'LEFT_FOOT' || move.visualContact === 'RIGHT_FOOT';\n        const authoredContactReady = game.p1.isActive() && (!footContact || game.p1.moveTick >= authoredContactTick);\n        if (game.p1.state === 'ATTACK' && (policy === 'AUTHORED_ATTACK_PRESERVE' ? authoredContactReady : phase === 'ACTIVE')) {\n'''
          if old not in s:
              raise SystemExit('authored sampling anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check scripts/capture-motion-readability-audit.mjs

      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/authored-sampling-policy-fix.yml
          git add scripts/capture-motion-readability-audit.mjs
          git commit -m "Sample authored strikes by contact type"
          git push origin HEAD:motion-onoff-review
