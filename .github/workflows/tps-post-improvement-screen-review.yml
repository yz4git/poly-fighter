name: One-shot post-improvement TPS screen review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tps-post-improvement-screen-review.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start production preview
        run: |
          PORT=3000 npm start >/tmp/pf-post-review.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/pf-post-review.log; exit 1
      - name: Capture full TPS visual audit
        run: |
          DRIVER="$(command -v chromedriver || true)"; if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL=http://127.0.0.1:3000/ TPS_AUDIT_DIR=artifacts/tps-post node scripts/capture-tps-visual-audit.mjs
      - name: Capture clean result panel
        shell: bash
        run: |
          mkdir -p artifacts/tps-result
          cat >/tmp/result-review.mjs <<'EOF'
          import { spawn } from 'node:child_process';import { writeFile } from 'node:fs/promises';
          const d=process.env.WEBDRIVER_BIN,p=9541,sleep=ms=>new Promise(r=>setTimeout(r,ms));const cp=spawn(d,[`--port=${p}`,'--allowed-ips='],{stdio:'ignore'});
          async function c(path,m='GET',b){const r=await fetch(`http://127.0.0.1:${p}${path}`,{method:m,headers:b===undefined?undefined:{'content-type':'application/json'},body:b===undefined?undefined:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok||j?.value?.error)throw new Error(JSON.stringify(j));return j.value}
          async function x(id,script,args=[]){return c(`/session/${id}/execute/sync`,'POST',{script,args})}async function shot(id,n){const b=await c(`/session/${id}/screenshot`);await writeFile(`artifacts/tps-result/${n}.png`,Buffer.from(b,'base64'))}
          const lookup=`function fg(){const h=document.querySelector('main.poly-app');if(!h)return null;const k=Object.keys(h).find(k=>k.startsWith('__reactFiber$'));let f=k?h[k]:null,s=new Set;while(f&&!s.has(f)){s.add(f);let q=f.memoizedState;while(q){const v=q.memoizedState,c=v&&typeof v==='object'&&'current'in v?v.current:null;if(c&&c.p1&&c.p2&&c.renderer&&c.camera)return c;q=q.next}f=f.return}return null}`;
          for(let i=0;i<100;i++){try{if((await fetch(`http://127.0.0.1:${p}/status`)).ok)break}catch{}await sleep(100)}let id;
          try{const se=await c('/session','POST',{capabilities:{alwaysMatch:{browserName:'chrome','goog:chromeOptions':{args:['--headless=new','--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--use-angle=swiftshader','--window-size=932,430','--hide-scrollbars']}}}});id=se.sessionId;await c(`/session/${id}/url`,'POST',{url:'http://127.0.0.1:3000/'});await sleep(700);
          const click=async t=>x(id,`const b=[...document.querySelectorAll('button')].find(e=>e.textContent?.includes(arguments[0]));if(!b)return false;b.click();return true`,[t]);if(!await click('TPS LOCK-ON BATTLE'))throw new Error('title');await sleep(150);if(!await click('ENGAGE TPS'))throw new Error('engage');
          for(let i=0;i<80;i++){if(await x(id,`${lookup}return !!fg()`))break;await sleep(100)}await sleep(400);
          await x(id,`${lookup}const g=fg();g.enemyOpeningGraceTicks=9999;g.p2.health=1;g.p2.receiveDamage(20,18,0.7,1,true,4);g.checkFinish();return true`);await sleep(220);await shot(id,'01-ko-safe');
          for(let i=0;i<30;i++){const result=await x(id,`return !!document.querySelector('.result-panel')`);if(result)break;await sleep(120)}await shot(id,'02-result-clean');
          const info=await x(id,`const r=document.querySelector('.result-panel'),hud=document.querySelector('.fight-hud'),controls=document.querySelector('.touch-controls'),badge=document.querySelector('.match-badge');return {result:!!r,hud:!!hud,controls:!!controls,badge:!!badge,body:document.body.innerText.slice(0,500)}`);await writeFile('artifacts/tps-result/result.json',JSON.stringify(info,null,2));console.log(info);
          }finally{if(id)await c(`/session/${id}`,'DELETE').catch(()=>{});cp.kill('SIGTERM')}
          EOF
          DRIVER="$(command -v chromedriver || true)"; if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          WEBDRIVER_BIN="$DRIVER" node /tmp/result-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tps-post-improvement-screen-review
          path: artifacts
          retention-days: 14
      - name: Remove one-shot workflow
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tps-post-improvement-screen-review.yml
          git commit -m 'Remove post-improvement TPS screen review'
          git push
