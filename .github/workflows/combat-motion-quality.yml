name: POLY FIGHTER Combat Motion Quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/game/combat-motion-*.ts
      - src/game/visual-quaternius-runtime.ts
      - src/game/presentation-animation.ts
      - tests/combat-motion.test.ts
      - tests/kick-ankle.test.ts
      - .github/workflows/combat-motion-quality.yml
  pull_request:
    branches: [main]
    paths:
      - src/game/combat-motion-*.ts
      - src/game/visual-quaternius-runtime.ts
      - src/game/presentation-animation.ts
      - tests/combat-motion.test.ts
      - tests/kick-ankle.test.ts
      - .github/workflows/combat-motion-quality.yml

permissions:
  contents: read

concurrency:
  group: combat-motion-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate real skeletons, move clocks, and kick ankle continuity
        run: node --import tsx --test tests/combat-motion.test.ts tests/kick-ankle.test.ts
