name: Repair committed attack follow-through

on:
  push:
    branches: [just-step-break-counter-v1]
    paths: [.github/workflows/just-step-frame-debug.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: just-step-break-counter-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Preserve telegraphed attack commitment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/game/tps-game.ts')
          t = p.read_text()
          old = "\n".join([
            "  enemyCooldown: number;",
            '  enemyTactic: "PRESSURE" | "ORBIT" | "BAIT";',
          ])
          new = "\n".join([
            "  enemyCooldown: number;",
            "  enemyDirectorPendingMove: string | null;",
            "  enemyDirectorTelegraphTicks: number;",
            '  enemyTactic: "PRESSURE" | "ORBIT" | "BAIT";',
          ])
          if old not in t: raise SystemExit('runtime type anchor missing')
          t = t.replace(old, new, 1)
          old = "\n".join([
            "  const enemyFacingAlignment = THREE.MathUtils.clamp(facing.dot(towardPlayer), -1, 1);",
            "",
            "  coreUpdateEnemy.call(this);",
            "",
            "  // Do not allow a newly selected strike to fire while the visible body is",
            "  // still catching up to a side STEP. Existing attacks continue normally.",
            '  const startedAttack = beforeState !== "ATTACK" && game.p2.state === "ATTACK";',
            "  if (startedAttack && enemyFacingAlignment < ENEMY_ATTACK_ALIGNMENT) {",
          ])
          new = "\n".join([
            "  const enemyFacingAlignment = THREE.MathUtils.clamp(facing.dot(towardPlayer), -1, 1);",
            "  // Once the CPU has shown a telegraph all the way to zero, the strike is a",
            "  // commitment. A late side STEP must make that committed strike whiff rather",
            "  // than causing the AI to cancel it after the player already read the cue.",
            "  const committedDirectorMove = game.enemyDirectorPendingMove && game.enemyDirectorTelegraphTicks <= 0",
            "    ? game.enemyDirectorPendingMove",
            "    : null;",
            "",
            "  coreUpdateEnemy.call(this);",
            "",
            "  // Uncommitted strikes may still wait for the visible body to reacquire the",
            "  // player. Fully telegraphed strikes always follow through so JUST STEP has a",
            "  // real attack to evade and cannot be invalidated by the tracking layer.",
            '  const startedAttack = beforeState !== "ATTACK" && game.p2.state === "ATTACK";',
            "  const committedStrikeStarted = Boolean(",
            "    committedDirectorMove && game.p2.currentMove?.id === committedDirectorMove,",
            "  );",
            "  if (startedAttack && enemyFacingAlignment < ENEMY_ATTACK_ALIGNMENT && !committedStrikeStarted) {",
          ])
          if old not in t: raise SystemExit('enemy commitment anchor missing')
          p.write_text(t.replace(old, new, 1))
          PY
      - name: TPS static regression
        run: npm run test:rules:tps
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Start production server
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-just-step-repair.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/poly-fighter-just-step-repair.log
          exit 1
      - name: Verify full TPS WebGL combat audit
        run: |
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          mkdir -p artifacts/tps-visual-audit
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-visual-audit" node scripts/capture-tps-combat-v2-audit.mjs
      - name: Commit clean repair and remove helper
        run: |
          rm .github/workflows/just-step-frame-debug.yml
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/game/tps-game.ts .github/workflows/just-step-frame-debug.yml
          git commit -m "Preserve committed attacks through JUST STEP"
          git push origin HEAD:just-step-break-counter-v1
