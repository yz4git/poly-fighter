name: Kick Reference Pose v4 Reconstruction

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-reference-pose-v4.yml'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply natural biomechanics base and five-pose reference reconstruction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Reuse the already-reviewed V3 biomechanics patch as a deterministic base.
          lines = Path('.github/workflows/kick-naturalness-v3-implementation.yml').read_text().splitlines()
          marker = "          python3 - <<'PY'"
          start = lines.index(marker) + 1
          end = next(i for i in range(start, len(lines)) if lines[i] == '          PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(code, '<kick-v3-base>', 'exec'), {})

          def replace(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{label}: missing anchor')
              p.write_text(s.replace(old, new, 1))

          path = 'tools/blender/build-fight-motion-foundry-v2-kicks.py'

          # Keep the V3 low-kick leg from hyperextending while retaining a useful pivot.
          replace(path,
            "        (0.18, 0.22, 0.20),\n        (0.40, 0.34, 0.18),\n        (0.42, 0.42, 0.17),\n        (0.02, 0.10, 0.14),",
            "        (0.18, 0.18, 0.20),\n        (0.34, 0.27, 0.18),\n        (0.36, 0.31, 0.17),\n        (0.02, 0.08, 0.14),",
            'low kick reach refinement')
          replace(path,
            "foot_yaw=(0.0, 12.0, 38.0, 72.0, 86.0, 18.0, 0.0),\n    support_yaw=(0.0, 4.0, 14.0, 30.0, 38.0, 10.0, 0.0),",
            "foot_yaw=(0.0, 10.0, 34.0, 66.0, 78.0, 16.0, 0.0),\n    support_yaw=(0.0, 3.0, 12.0, 26.0, 32.0, 8.0, 0.0),",
            'low kick pivot refinement')

          # Reference sheet: make chamber and recovery unmistakably bent-leg poses.
          replace(path,
            "        (-0.05, 0.00, 0.18),\n        (0.34, 0.00, 0.34),",
            "        (-0.06, 0.00, 0.27),\n        (0.31, 0.00, 0.36),",
            'front chamber')
          replace(path,
            "        (0.04, 0.00, 0.18),\n        (0.00, 0.00, 0.00),",
            "        (-0.02, 0.00, 0.25),\n        (0.00, 0.00, 0.00),",
            'front recovery')
          replace(path,
            "        (-0.06, 0.00, 0.19),\n        (0.32, 0.00, 0.48),",
            "        (-0.07, 0.00, 0.29),\n        (0.29, 0.00, 0.52),",
            'rising chamber')
          replace(path,
            "        (0.02, 0.00, 0.22),\n        (0.00, 0.00, 0.00),",
            "        (-0.02, 0.00, 0.30),\n        (0.00, 0.00, 0.00),",
            'rising recovery')

          p = Path(path)
          s = p.read_text()
          s = s.replace('NATURAL_KICK_V3', 'REFERENCE_POSE_V4')

          phase_anchor = '''    def strike_suffix(self) -> str:\n        return self.strike_side.lower()\n'''
          phase_insert = '''    @property\n    def reference_pose_frames(self) -> Tuple[int, int, int, int, int]:\n        # Generated reference sheets are judged at exactly five readable poses:\n        # start, chamber/load, impact/peak, recovery, back-to-guard.\n        return (self.start_frame, self.load_frame, self.impact_frame, self.recovery_frame, self.end_frame)\n\n    @property\n    def strike_suffix(self) -> str:\n        return self.strike_side.lower()\n'''
          if phase_anchor not in s:
              raise SystemExit('reference frame property anchor missing')
          s = s.replace(phase_anchor, phase_insert, 1)

          build_anchor = '\ndef build_kick_action(scene: bpy.types.Scene, armature: bpy.types.Object, spec: KickSpec, axes):\n'
          helpers = r'''
REFERENCE_POSE_LABELS = ("START", "CHAMBER", "IMPACT", "RECOVERY", "GUARD")


def _knee_extension_at(scene: bpy.types.Scene, armature: bpy.types.Object, spec: KickSpec, frame: int) -> float:
    thigh = f"thigh_{spec.strike_suffix}"
    calf = f"calf_{spec.strike_suffix}"
    foot = f"foot_{spec.strike_suffix}"
    scene.frame_set(frame); bpy.context.view_layer.update()
    hip = rig.v1.pose_head(armature, thigh)
    knee = rig.v1.pose_head(armature, calf)
    ankle = rig.v1.pose_head(armature, foot)
    upper = hip - knee
    lower = ankle - knee
    if upper.length < 1e-6 or lower.length < 1e-6:
        return 0.0
    return math.degrees(upper.angle(lower))


def reference_pose_snapshots(scene: bpy.types.Scene, armature: bpy.types.Object, spec: KickSpec, forward: Vector, up: Vector):
    strike_foot = f"foot_{spec.strike_suffix}"
    support_foot = f"foot_{spec.support_suffix}"
    scene.frame_set(spec.start_frame); bpy.context.view_layer.update()
    start_strike = rig.v1.pose_head(armature, strike_foot)
    start_pelvis = rig.v1.pose_head(armature, "pelvis")
    start_support_q = rig.pose_world_matrix(armature, support_foot).to_quaternion()
    poses = []
    for label, frame in zip(REFERENCE_POSE_LABELS, spec.reference_pose_frames):
        scene.frame_set(frame); bpy.context.view_layer.update()
        foot = rig.v1.pose_head(armature, strike_foot)
        pelvis = rig.v1.pose_head(armature, "pelvis")
        support_q = rig.pose_world_matrix(armature, support_foot).to_quaternion()
        poses.append({
            "label": label,
            "frame": frame,
            "normalizedTime": (frame - spec.start_frame) / max(1, spec.end_frame - spec.start_frame),
            "strikeFootForward": (foot - start_strike).dot(forward),
            "strikeFootRise": (foot - start_strike).dot(up),
            "strikeKneeExtensionDegrees": _knee_extension_at(scene, armature, spec, frame),
            "pelvisForward": (pelvis - start_pelvis).dot(forward),
            "pelvisRise": (pelvis - start_pelvis).dot(up),
            "supportFootPivotDegrees": math.degrees(start_support_q.rotation_difference(support_q).angle),
        })
    return poses
'''
          if build_anchor not in s:
              raise SystemExit('reference snapshot insertion anchor missing')
          s = s.replace(build_anchor, '\n' + helpers + build_anchor, 1)

          bake_anchor = '''    final_action = rig.v1.bake_visual_action(scene, armature, constrained)\n    final_action.use_fake_user = True\n    rig.v1.remove_controls([*controls, *guards, *masters])\n    metrics = {\n'''
          bake_insert = '''    final_action = rig.v1.bake_visual_action(scene, armature, constrained)\n    final_action.use_fake_user = True\n    armature.animation_data.action = final_action\n    reference_poses = reference_pose_snapshots(scene, armature, spec, axes[0], axes[2])\n    rig.v1.remove_controls([*controls, *guards, *masters])\n    metrics = {\n'''
          if bake_anchor not in s:
              raise SystemExit('reference snapshot bake anchor missing')
          s = s.replace(bake_anchor, bake_insert, 1)

          metric_anchor = '''        "naturalnessPass": "REFERENCE_POSE_V4",\n        "pipeline": [\n'''
          metric_insert = '''        "naturalnessPass": "REFERENCE_POSE_V4",\n        "referencePoseMethod": "FIVE_KEY_REFERENCE_V4",\n        "referencePoses": reference_poses,\n        "pipeline": [\n'''
          if metric_anchor not in s:
              raise SystemExit('reference metrics anchor missing')
          s = s.replace(metric_anchor, metric_insert, 1)
          s = s.replace('            "shared COG/pelvis and staged torso masters",', '            "five-pose visual reference: START / CHAMBER / IMPACT / RECOVERY / GUARD",\n            "shared COG/pelvis and staged torso masters",', 1)
          summary_anchor = '''        "naturalnessPass": "REFERENCE_POSE_V4",\n        "fps": rig.FPS,\n'''
          summary_insert = '''        "naturalnessPass": "REFERENCE_POSE_V4",\n        "referencePoseMethod": "FIVE_KEY_REFERENCE_V4",\n        "fps": rig.FPS,\n'''
          if summary_anchor not in s:
              raise SystemExit('summary reference method anchor missing')
          s = s.replace(summary_anchor, summary_insert, 1)
          p.write_text(s)

          # Make the permanent kick workflow understand controlled pivot instead of old rotation lock.
          wf = Path('.github/workflows/blender-motion-foundry-v2-kicks.yml')
          ws = wf.read_text().replace('supportFootLockMaxAngularDriftDegrees', 'supportFootPivotMaxDegrees')
          wf.write_text(ws)

          # Strengthen tests around the five visual reference poses.
          t = Path('tests/blender-motion-foundry-v2-kicks.test.mjs')
          ts = t.read_text().replace('NATURAL_KICK_V3', 'REFERENCE_POSE_V4')
          ts = ts.replace('supportFootLockMaxAngularDriftDegrees', 'supportFootPivotMaxDegrees')
          extra = r'''

test("reference-pose v4 keeps all five kick checkpoints readable and physically staged", () => {
  assert.equal(metrics.naturalnessPass, "REFERENCE_POSE_V4");
  assert.equal(metrics.referencePoseMethod, "FIVE_KEY_REFERENCE_V4");
  for (const move of metrics.moves) {
    assert.equal(move.referencePoseMethod, "FIVE_KEY_REFERENCE_V4");
    assert.deepEqual(move.referencePoses.map((pose) => pose.label), ["START", "CHAMBER", "IMPACT", "RECOVERY", "GUARD"]);
    const [start, chamber, impact, recovery, guard] = move.referencePoses;
    assert.ok(chamber.strikeFootRise > 0.10, `${move.action} chamber rise ${chamber.strikeFootRise}`);
    assert.ok(impact.strikeKneeExtensionDegrees > chamber.strikeKneeExtensionDegrees + 8, `${move.action} chamber->impact knee`);
    assert.ok(recovery.strikeKneeExtensionDegrees < impact.strikeKneeExtensionDegrees - 8, `${move.action} impact->recovery knee`);
    assert.ok(Math.abs(guard.strikeFootForward) < 0.09, `${move.action} guard forward ${guard.strikeFootForward}`);
    assert.ok(Math.abs(guard.strikeFootRise) < 0.09, `${move.action} guard rise ${guard.strikeFootRise}`);
    assert.ok(guard.supportFootPivotDegrees < 4.0, `${move.action} guard pivot ${guard.supportFootPivotDegrees}`);
    assert.ok(start.supportFootPivotDegrees < 0.5, `${move.action} start pivot ${start.supportFootPivotDegrees}`);
  }
  const byAction = new Map(metrics.moves.map((move) => [move.action, move]));
  const front = byAction.get("BF_FrontKick_R");
  const low = byAction.get("BF_LowKick_L");
  const rising = byAction.get("BF_RisingKick_R");
  assert.ok(front.referencePoses[2].supportFootPivotDegrees > 8 && front.referencePoses[2].supportFootPivotDegrees < 20);
  assert.ok(low.referencePoses[2].supportFootPivotDegrees > 18 && low.referencePoses[2].supportFootPivotDegrees < 38);
  assert.ok(rising.referencePoses[2].supportFootPivotDegrees > 10 && rising.referencePoses[2].supportFootPivotDegrees < 28);
  assert.ok(rising.referencePoses[2].strikeFootRise > front.referencePoses[2].strikeFootRise + 0.16);
});
'''
          if 'reference-pose v4 keeps all five kick checkpoints readable' not in ts:
              ts += extra
          t.write_text(ts)

          # Capture the five reference checkpoints in Model View so the artifact can be visually reviewed.
          a = Path('scripts/capture-model-view-audit.mjs')
          av = a.read_text()
          anchor = '''  const proceduralDashKick = await poseMotionViewer(sessionId, "PF_DashKick_R", 0.52);\n'''
          block = '''  const referenceKickPoses = [\n    ["start", 0.02], ["chamber", 0.18], ["impact", 0.56], ["recovery", 0.82], ["guard", 0.98],\n  ];\n  for (const [clip, slug] of [["BF_FrontKick_R", "front"], ["BF_LowKick_L", "low"], ["BF_RisingKick_R", "rising"]]) {\n    for (const [phase, normalized] of referenceKickPoses) {\n      await poseMotionViewer(sessionId, clip, normalized);\n      await screenshot(sessionId, `${outputDir}/reference-v4-${slug}-${phase}.png`);\n    }\n  }\n\n  const proceduralDashKick = await poseMotionViewer(sessionId, "PF_DashKick_R", 0.52);\n'''
          if anchor not in av:
              raise SystemExit('model viewer reference capture anchor missing')
          a.write_text(av.replace(anchor, block, 1))

          docs = Path('docs/KICK_REFERENCE_POSE_V4.md')
          docs.write_text('''# Kick Reference Pose V4\n\nThe authored grounded kicks are reconstructed from five visual checkpoints generated for this pass.\n\n1. **START** — balanced guard, weight available to the support leg.\n2. **CHAMBER / LOAD** — knee clearly folded; support foot begins its pivot; pelvis starts to travel.\n3. **IMPACT / PEAK** — pelvis commits behind the strike; support foot has pivoted; torso and arms counterbalance rather than remaining rigid.\n4. **RECOVERY** — the strike leg folds again before landing; torso and pelvis begin returning independently.\n5. **GUARD** — both feet and the upper body resolve cleanly back into the ready stance.\n\nThe Blender generator keeps intermediate pre-contact and overtravel controls for interpolation, but the five poses above are explicit quality gates and are exported to `blender-kicks-core.metrics.json` as `referencePoses`.\n''')
          PY

      - name: Fetch pinned UAL source
        run: |
          mkdir -p .tmp-quaternius
          BASE_PIN=aa02a4e6d8337a0604d2da131bcbbeb1f01badf0
          BASE_URL=https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/$BASE_PIN/public/assets/vendor/quaternius
          curl -L --fail --retry 3 "$BASE_URL/universal-animation-library.glb" -o .tmp-quaternius/ual1-full.glb
          echo '4c748767741a3e495d89667b9a218b690ba9810b9517a12e960780e3ca72c4e9  .tmp-quaternius/ual1-full.glb' | sha256sum -c -

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri xvfb

      - name: Regenerate reference-pose kick pack
        run: |
          set -euo pipefail
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          mkdir -p artifacts/kick-reference-v4-build
          xvfb-run -a blender --background --python-use-system-env --python-exit-code 1 --python tools/blender/build-fight-motion-foundry-v2-kicks.py -- --source .tmp-quaternius/ual1-full.glb --output-dir artifacts/kick-reference-v4-build
          cp artifacts/kick-reference-v4-build/blender-kicks-core.glb public/models/quaternius/blender-kicks-core.glb
          cp artifacts/kick-reference-v4-build/blender-kicks-core.metrics.json public/models/quaternius/blender-kicks-core.metrics.json
          kick_hash="$(cat tools/blender/build-fight-motion-foundry-v1.py tools/blender/motion_foundry_v2_rig.py tools/blender/build-fight-motion-foundry-v2-kicks.py | sha256sum | awk '{print $1}')"
          printf '%s\n' "$kick_hash" > public/models/quaternius/blender-kicks-core.generator.sha256
          cat public/models/quaternius/blender-kicks-core.metrics.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Validate five-pose kick reconstruction
        run: |
          node --test tests/blender-motion-foundry-v2-kicks.test.mjs
          npm run test:ci:tps
          npm run lint
          npm run build

      - name: Start preview
        run: |
          PORT=3000 npm start > /tmp/kick-reference-v4-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kick-reference-v4-server.log
          exit 1

      - name: Capture five-pose and gameplay screens
        run: |
          mkdir -p artifacts/kick-reference-v4-screen/model-view artifacts/kick-reference-v4-screen/tps
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" MODEL_VIEW_AUDIT_DIR="artifacts/kick-reference-v4-screen/model-view" node scripts/capture-model-view-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/kick-reference-v4-screen/tps" node scripts/capture-motion-readability-audit.mjs
          cp public/models/quaternius/blender-kicks-core.metrics.json artifacts/kick-reference-v4-screen/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kick-reference-pose-v4
          path: |
            artifacts/kick-reference-v4-build
            artifacts/kick-reference-v4-screen
          if-no-files-found: error
          retention-days: 14

      - name: Commit reconstructed kick motions and clean one-shot workflows
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/kick-naturalness-v3-implementation.yml .github/workflows/kick-naturalness-v3-retry.yml .github/workflows/kick-naturalness-v3-retry2.yml .github/workflows/kick-reference-pose-v4.yml
          git add tools/blender/build-fight-motion-foundry-v2-kicks.py tests/blender-motion-foundry-v2-kicks.test.mjs scripts/capture-model-view-audit.mjs .github/workflows/blender-motion-foundry-v2-kicks.yml docs/KICK_REFERENCE_POSE_V4.md public/models/quaternius/blender-kicks-core.glb public/models/quaternius/blender-kicks-core.metrics.json public/models/quaternius/blender-kicks-core.generator.sha256
          git commit -m 'Reconstruct kicks from five-pose motion references'
          git push
