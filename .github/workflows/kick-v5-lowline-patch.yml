name: One-shot kick v5 low-line correction

on:
  push:
    branches: [kick-visual-reconstruction-v5]
    paths:
      - '.github/workflows/kick-v5-lowline-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kick-visual-reconstruction-v5
          fetch-depth: 0
      - name: Correct low-kick strike line and visual contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          g = Path('tools/blender/build-fight-motion-foundry-v2-kicks.py')
          s = g.read_text()
          old = '''        (0.80, 0.46, 0.18),
        (0.83, 0.53, 0.15),
        (0.82, 0.56, 0.12),'''
          new = '''        (0.70, 0.45, -0.55),
        (0.72, 0.52, -0.45),
        (0.70, 0.58, -0.42),'''
          if old not in s:
              raise SystemExit('low-kick direction anchor missing')
          g.write_text(s.replace(old, new, 1))

          t = Path('tests/blender-motion-foundry-v2-kicks.test.mjs')
          s = t.read_text()
          old = '  assert.ok(low.strikeFootVerticalRise > 0.18, low.strikeFootVerticalRise);'
          new = '  assert.ok(low.strikeFootVerticalRise > 0.22 && low.strikeFootVerticalRise < 0.58, low.strikeFootVerticalRise);'
          if old not in s:
              raise SystemExit('low vertical gate anchor missing')
          s = s.replace(old, new, 1)
          old = '  assert.ok(low.torsoTwistDegrees > front.torsoTwistDegrees, `${low.torsoTwistDegrees} !> ${front.torsoTwistDegrees}`);'
          new = '  assert.ok(low.supportFootPivotMaxDegrees > front.supportFootPivotMaxDegrees + 10, `${low.supportFootPivotMaxDegrees} !> ${front.supportFootPivotMaxDegrees} + 10`);'
          if old not in s:
              raise SystemExit('low twist relation anchor missing')
          t.write_text(s.replace(old, new, 1))
          PY
      - name: Commit corrected source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/blender/build-fight-motion-foundry-v2-kicks.py tests/blender-motion-foundry-v2-kicks.test.mjs
          git commit -m 'Keep low kick on a true low roundhouse line'
          git push origin HEAD:kick-visual-reconstruction-v5
