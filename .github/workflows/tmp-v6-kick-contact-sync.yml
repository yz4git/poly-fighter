name: Temporary V6 kick contact phase sync

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-v6-kick-contact-sync.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-foundry-v6-reference-driven
          fetch-depth: 0
      - name: Apply V6 kick contact timing patch
        run: |
          git fetch origin main
          git show origin/main:.github/tmp/v6-kick-contact-sync.py > /tmp/v6-kick-contact-sync.py
          python3 /tmp/v6-kick-contact-sync.py
          git diff --check
          grep -q 'V6_ACTIVE_CONTACT_SYNC' src/game/visual-quaternius-runtime.ts
          grep -q 'BF_LowKick_L: 0.5333333333333333' src/game/visual-quaternius-runtime.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run kick contract and runtime tests
        run: |
          node --test tests/blender-motion-foundry-v2-kicks.test.mjs
          npm run test:ci:tps
      - name: Commit phase sync to PR branch
        run: |
          git config user.name yz4git
          git config user.email 65384484+yz4git@users.noreply.github.com
          git add src/game/visual-quaternius-runtime.ts
          git commit -m 'Sync V6 kick contact phase to gameplay active frames'
          git push origin HEAD:motion-foundry-v6-reference-driven
