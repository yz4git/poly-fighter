name: Reactable Tracker Fix Helper

on:
  push:
    branches: [reactable-enemy-attacks-v1]
    paths:
      - .github/workflows/reactable-tracker-fix-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reactable-enemy-attacks-v1
      - name: Patch tracker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/game/tps-game-base.ts')
          s = p.read_text()
          pairs = [
            ('  private playerStepThreatTicks = 0;\n  private playerInterceptTicks = 0;', '  private playerStepThreatTicks = 0;\n  private playerStepThreatMoveId: string | null = null;\n  private playerInterceptTicks = 0;'),
            ('      this.playerStepThreatTicks = reactiveSideStep ? Math.max(TPS_STEP_TICKS, incomingFrames + 2) : 0;', '      this.playerStepThreatTicks = reactiveSideStep ? Math.max(TPS_STEP_TICKS + 2, incomingFrames + TPS_STEP_TICKS + 2) : 0;\n      this.playerStepThreatMoveId = reactiveSideStep ? incomingMove?.id ?? null : null;'),
            ('      && this.playerStepThreatTicks > 0\n      && this.playerStepSideWeight > 0.45', '      && this.playerStepThreatTicks > 0\n      && this.playerStepThreatMoveId === move.id\n      && this.playerStepSideWeight > 0.45'),
            ('      attacker.hitTargets.add(defender.id);\n      this.playerStepThreatTicks = 0;\n      this.playerFlankWindowTicks', '      attacker.hitTargets.add(defender.id);\n      this.playerStepThreatTicks = 0;\n      this.playerStepThreatMoveId = null;\n      this.playerFlankWindowTicks'),
            ('    this.playerPerfectEvadeTicks = 0;\n    this.playerStepThreatTicks = 0;\n    this.playerInterceptTicks = 0;', '    this.playerPerfectEvadeTicks = 0;\n    this.playerStepThreatTicks = 0;\n    this.playerStepThreatMoveId = null;\n    this.playerInterceptTicks = 0;'),
          ]
          for old, new in pairs:
            if old not in s:
              raise SystemExit('anchor not found: ' + old[:60])
            s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('tests/tps-mode.test.ts')
          q = t.read_text()
          a = '  assert.match(source, /playerStepThreatTicks/);\n'
          b = a + '  assert.match(source, /playerStepThreatMoveId/);\n  assert.match(source, /this\\.playerStepThreatMoveId === move\\.id/);\n'
          if a not in q:
            raise SystemExit('test anchor not found')
          t.write_text(q.replace(a, b, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/tps-game-base.ts tests/tps-mode.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Keep reactive STEP tied to the committed attack"
          git push origin HEAD:reactable-enemy-attacks-v1
