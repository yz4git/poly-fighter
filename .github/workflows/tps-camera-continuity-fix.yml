name: Apply TPS camera continuity fix

on:
  push:
    branches: [tps-continuous-play-polish-v1]
    paths:
      - .github/workflows/tps-camera-continuity-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Smooth close-range camera travel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/game/tps-game-base.ts')
          s = p.read_text()
          old = '    ease(this.camera.position, this.cameraDesired, 11.6, delta);'
          new = '''    // Keep distant navigation responsive, but add inertia as the fight closes.\n    // This prevents a one-frame shoulder-camera surge when approach becomes orbit.\n    const cameraPositionRate = THREE.MathUtils.lerp(10.2, 8.0, closeFactor);\n    ease(this.camera.position, this.cameraDesired, cameraPositionRate, delta);'''
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/game/tps-game-base.ts
          git rm .github/workflows/tps-camera-continuity-fix.yml
          git commit -m "Smooth TPS close-range camera travel"
          git push
