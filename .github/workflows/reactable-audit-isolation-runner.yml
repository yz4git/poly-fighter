name: Reactable Audit Isolation Runner

on:
  push:
    branches: [reactable-enemy-attacks-v1]
    paths:
      - .github/workflows/reactable-audit-isolation-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reactable-enemy-attacks-v1
      - name: Patch deterministic audit isolation
        run: python3 scripts/reactable-audit-isolation-patch.py
      - name: Commit audit isolation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/capture-tps-visual-audit.mjs
          git commit -m "Isolate TPS STEP audit state"
          git push origin HEAD:reactable-enemy-attacks-v1
