name: POLY FIGHTER Motion Absolute Sampling Once

on:
  push:
    branches: [motion-pose-ownership-v2]
    paths:
      - .github/workflows/motion-framerate-audit-once.yml

permissions:
  contents: write

concurrency:
  group: motion-absolute-sampling-once
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-pose-ownership-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Make combat timeline the only attack pose clock
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/game/visual-quaternius-runtime.ts')
          s = p.read_text()

          old_import = 'import { attackEntryPreviousPoseWeight, motionPoseOwner, shouldApplyLocomotionFootLock } from "./motion-pose-policy";'
          new_import = 'import { attackEntryPreviousPoseWeight, motionPoseOwner, shouldAdvanceMixerFromRenderTime, shouldApplyLocomotionFootLock, shouldResamplePose } from "./motion-pose-policy";'
          if old_import not in s:
              raise SystemExit('pose policy import anchor not found')
          s = s.replace(old_import, new_import, 1)

          old_advance = '''function advance(runtime: QuaterniusRuntime, timeSeconds: number, frozen = false): number {\n  const delta = runtime.lastTime > 0 ? THREE.MathUtils.clamp(timeSeconds - runtime.lastTime, 0, .05) : 0;\n  runtime.lastTime = timeSeconds;\n  if (!frozen) {\n    runtime.clock += delta;\n    runtime.transitionAge += delta;\n    runtime.mixer.update(delta);\n  }\n  return frozen ? 0 : delta;\n}\n'''
          new_advance = '''function advance(runtime: QuaterniusRuntime, timeSeconds: number, frozen = false, advanceMixer = true): number {\n  const delta = runtime.lastTime > 0 ? THREE.MathUtils.clamp(timeSeconds - runtime.lastTime, 0, .05) : 0;\n  runtime.lastTime = timeSeconds;\n  if (!frozen) {\n    runtime.clock += delta;\n    runtime.transitionAge += delta;\n    if (advanceMixer) runtime.mixer.update(delta);\n  }\n  return frozen ? 0 : delta;\n}\n'''
          if old_advance not in s:
              raise SystemExit('advance function anchor not found')
          s = s.replace(old_advance, new_advance, 1)

          old_state = '''  const stateChanged = runtime.lastState !== fighter.state;\n  const restartedState = fighter.stateMachine.stateTicks < runtime.lastStateTicks;\n  const restartingAttack = fighter.state === "ATTACK" && (stateChanged || fighter.moveTick < runtime.lastMoveTick);\n  const restartingReaction = fighter.state === "HIT" && fighter.reactionSerial !== runtime.lastReactionSerial;\n'''
          new_state = '''  const previousState = runtime.lastState;\n  const previousStateTicks = runtime.lastStateTicks;\n  const previousMoveTick = runtime.lastMoveTick;\n  const previousReactionSerial = runtime.lastReactionSerial;\n  const stateChanged = previousState !== fighter.state;\n  const restartedState = fighter.stateMachine.stateTicks < previousStateTicks;\n  const restartingAttack = fighter.state === "ATTACK" && (stateChanged || fighter.moveTick < previousMoveTick);\n  const restartingReaction = fighter.state === "HIT" && fighter.reactionSerial !== previousReactionSerial;\n  const poseSampleChanged =\n    stateChanged\n    || fighter.stateMachine.stateTicks !== previousStateTicks\n    || fighter.moveTick !== previousMoveTick\n    || fighter.reactionSerial !== previousReactionSerial;\n'''
          if old_state not in s:
              raise SystemExit('state sampling anchor not found')
          s = s.replace(old_state, new_state, 1)

          old_play = '''  const desired = desiredClip(fighter, runtime);\n  playClip(runtime, desired.name, desired.loop, desired.speed, restartingAttack || restartingReaction || (restartedState && !desired.loop));\n  advance(runtime, timeSeconds, fighter.hitStop > 0);\n  synchronizeMotion(runtime, fighter);\n'''
          new_play = '''  const desired = desiredClip(fighter, runtime);\n  const resamplePose = shouldResamplePose(fighter.hitStop, poseSampleChanged);\n  const advanceMixerFromRenderTime = shouldAdvanceMixerFromRenderTime(fighter.state);\n  runtime.host.userData.combatMotionHitStopPoseFrozen = !resamplePose;\n  runtime.host.userData.combatMotionRenderTimeMixerAdvance = advanceMixerFromRenderTime;\n  fighter.visual.root.userData.combatMotionHitStopPoseFrozen = !resamplePose;\n  fighter.visual.root.userData.combatMotionRenderTimeMixerAdvance = advanceMixerFromRenderTime;\n  if (!resamplePose) {\n    // Keep the render clock current without touching the authored skeleton.\n    advance(runtime, timeSeconds, true, false);\n    fighter.visual.root.userData.combatMotionCurrentClip = runtime.currentClip;\n    fighter.visual.root.userData.combatMotionSingleMixer = true;\n    fighter.visual.root.userData.combatMotionTimelineVersion = "GAMEPLAY_TICK_AUTHORED_EVENT_V1";\n    runtime.model.updateMatrixWorld(true);\n    return;\n  }\n  playClip(runtime, desired.name, desired.loop, desired.speed, restartingAttack || restartingReaction || (restartedState && !desired.loop));\n  advance(runtime, timeSeconds, fighter.hitStop > 0, advanceMixerFromRenderTime);\n  synchronizeMotion(runtime, fighter);\n'''
          if old_play not in s:
              raise SystemExit('play/synchronize anchor not found')
          s = s.replace(old_play, new_play, 1)
          p.write_text(s)
          PY
      - name: Prepare focused WebGL determinism audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/capture-motion-framerate-audit.mjs')
          s = p.read_text()
          old_q = '''    const dot = Math.min(1, Math.abs(qa[0] * qb[0] + qa[1] * qb[1] + qa[2] * qb[2] + qa[3] * qb[3]));\n    const angle = 2 * Math.acos(dot);\n'''
          new_q = '''    const normA = Math.hypot(qa[0], qa[1], qa[2], qa[3]);\n    const normB = Math.hypot(qb[0], qb[1], qb[2], qb[3]);\n    const rawDot = qa[0] * qb[0] + qa[1] * qb[1] + qa[2] * qb[2] + qa[3] * qb[3];\n    const dot = Math.min(1, Math.abs(rawDot / Math.max(1e-12, normA * normB)));\n    const angle = 2 * Math.acos(dot);\n'''
          if old_q not in s:
              raise SystemExit('quaternion audit anchor not found')
          s = s.replace(old_q, new_q, 1)
          old_moves = '  const moves = ["jab", "straight", "bodyBlow", "backfist", "power", "kick", "lowKick", "risingKick", "dashKick", "counter", "throw"];'
          new_moves = '  const moves = ["risingKick", "counter", "throw"];'
          if old_moves not in s:
              raise SystemExit('move list anchor not found')
          s = s.replace(old_moves, new_moves, 1)
          old_freeze = '''    const freezeDelta = poseDelta(freeze.before.pose, freeze.after.pose);\n    assert.ok(freezeDelta.maxPosition < 1e-8, `${actorName}: startup hitstop position drift ${JSON.stringify(freezeDelta)}`);\n    assert.ok(freezeDelta.maxAngle < 1e-8, `${actorName}: startup hitstop rotation drift ${JSON.stringify(freezeDelta)}`);\n    assert.equal(freeze.before.meta.previousPoseWeight, freeze.after.meta.previousPoseWeight, `${actorName}: hitstop changed entry blend weight`);\n    report.hitstop[actorName] = freezeDelta;\n'''
          new_freeze = '''    const freezeDelta = poseDelta(freeze.before.pose, freeze.after.pose);\n    assert.deepEqual(freeze.after.pose, freeze.before.pose, `${actorName}: startup hitstop changed raw local bone pose`);\n    assert.equal(freeze.before.meta.previousPoseWeight, freeze.after.meta.previousPoseWeight, `${actorName}: hitstop changed entry blend weight`);\n    report.hitstop[actorName] = freezeDelta;\n'''
          if old_freeze not in s:
              raise SystemExit('hitstop assertion anchor not found')
          s = s.replace(old_freeze, new_freeze, 1)
          p.write_text(s)
          PY
      - name: Validate deterministic motion contracts
        run: |
          node --import tsx --test tests/motion-pose-policy.test.ts tests/combat-motion-timeline.test.ts
          npm run test:ci:tps
          npm run lint
          npm run build
      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-absolute-sampling.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/poly-fighter-absolute-sampling.log
          exit 1
      - name: Verify Rising Counter Throw across 30 60 120 fps
        run: |
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          mkdir -p artifacts/motion-absolute-sampling
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" MOTION_FRAMERATE_AUDIT_DIR="artifacts/motion-absolute-sampling" node scripts/capture-motion-framerate-audit.mjs
      - name: Preserve server log
        if: always()
        run: cp /tmp/poly-fighter-absolute-sampling.log artifacts/motion-absolute-sampling/server.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-motion-absolute-sampling
          path: artifacts/motion-absolute-sampling
          if-no-files-found: warn
          retention-days: 7
      - name: Commit verified runtime and remove one-shot workflow
        run: |
          git checkout -- scripts/capture-motion-framerate-audit.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/visual-quaternius-runtime.ts
          git rm .github/workflows/motion-framerate-audit-once.yml
          git commit -m "Make combat pose sampling fully gameplay-tick deterministic"
          git push origin HEAD:motion-pose-ownership-v2
