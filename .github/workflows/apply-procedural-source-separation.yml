name: Apply Procedural source separation fix

on:
  push:
    paths:
      - '.github/workflows/apply-procedural-source-separation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arm-fist-playtest-20260901
          fetch-depth: 0
      - name: Separate UAL and PF v2 retarget sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/game/visual-quaternius-runtime.ts')
          s = p.read_text()

          old = '''type MotionResources = {\n  source: THREE.Group;\n  clips: THREE.AnimationClip[];\n};\n'''
          new = '''type MotionClipSource = {\n  source: THREE.Group;\n  clips: THREE.AnimationClip[];\n};\n\ntype MotionResources = {\n  base: MotionClipSource;\n  procedural: MotionClipSource;\n};\n'''
          if old not in s:
            raise SystemExit('MotionResources anchor missing')
          s = s.replace(old, new, 1)

          old = '''function loadMotion(): Promise<MotionResources> {\n  if (motionPromise) return motionPromise;\n  const loader = new GLTFLoader();\n  motionPromise = Promise.all([\n    loader.loadAsync(QUATERNIUS_UAL_CORE_URL),\n    loader.loadAsync(QUATERNIUS_PROCEDURAL_CORE_URL),\n  ]).then(([base, procedural]) => ({\n    // Keep canonical UAL locomotion/state clips and layer Procedural Fight v2\n    // combat clips into the same visible fighter runtime.\n    source: base.scene,\n    clips: [...base.animations, ...procedural.animations],\n  })).catch((error) => {\n    motionPromise = null;\n    throw error;\n  });\n  return motionPromise;\n}\n'''
          new = '''function loadMotion(): Promise<MotionResources> {\n  if (motionPromise) return motionPromise;\n  const loader = new GLTFLoader();\n  motionPromise = Promise.all([\n    loader.loadAsync(QUATERNIUS_UAL_CORE_URL),\n    loader.loadAsync(QUATERNIUS_PROCEDURAL_CORE_URL),\n  ]).then(([base, procedural]) => ({\n    // Retarget each pack against the hierarchy it was authored from. PF v2 is\n    // generated from UAL, but keeping its own loaded scene here avoids losing\n    // animation bindings when the two GLBs differ in node identity/layout.\n    base: { source: base.scene, clips: base.animations },\n    procedural: { source: procedural.scene, clips: procedural.animations },\n  })).catch((error) => {\n    motionPromise = null;\n    throw error;\n  });\n  return motionPromise;\n}\n'''
          if old not in s:
            raise SystemExit('loadMotion anchor missing')
          s = s.replace(old, new, 1)

          old = '''    const styled = cloneAndStyleModel(resources.model, visual, definition, bodyType);\n    const retargetedClips = retargetMotionClips(resources.motion.source, styled.model, resources.motion.clips);\n    const runtime: QuaterniusRuntime = {\n'''
          new = '''    const styled = cloneAndStyleModel(resources.model, visual, definition, bodyType);\n    const baseClips = retargetMotionClips(resources.motion.base.source, styled.model, resources.motion.base.clips);\n    const proceduralClips = retargetMotionClips(\n      resources.motion.procedural.source,\n      styled.model,\n      resources.motion.procedural.clips,\n    );\n    if (!proceduralClips.has("PF_Jab_L") || !proceduralClips.has("PF_Power_R")) {\n      throw new Error(`Procedural Fight v2 clips missing after retarget: ${[...proceduralClips.keys()].join(",")}`);\n    }\n    const retargetedClips = new Map<string, THREE.AnimationClip>([...baseClips, ...proceduralClips]);\n    const runtime: QuaterniusRuntime = {\n'''
          if old not in s:
            raise SystemExit('install retarget anchor missing')
          s = s.replace(old, new, 1)

          old = '''    visual.root.userData.quaterniusAnimationRigCoverage = 1;\n    visual.root.userData.quaterniusRetargetMode = "rest-delta";\n'''
          new = '''    visual.root.userData.quaterniusAnimationRigCoverage = 1;\n    visual.root.userData.quaterniusRetargetMode = "rest-delta-separated-sources";\n    visual.root.userData.quaterniusProceduralClipCount = proceduralClips.size;\n'''
          if old not in s:
            raise SystemExit('diagnostic anchor missing')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/visual-quaternius-runtime.ts
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "Retarget Procedural Fight v2 from its own source hierarchy"
          git push origin HEAD:fix/arm-fist-playtest-20260901
