name: Apply V3 impact pair fix

on:
  push:
    branches: [feat/procedural-fight-v3-20260902]
    paths:
      - scripts/fix-v3-impact-pair.py
      - .github/workflows/apply-v3-impact-pair-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/procedural-fight-v3-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Fix strong-hit Impact Pair states
        run: python3 scripts/fix-v3-impact-pair.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate fix
        run: |
          npm run test:rules:tps
          npm run lint
          npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/motion-expansion-runtime.ts scripts/capture-motion-readability-audit.mjs tests/motion-expansion.test.ts
          git commit -m "Fix V3 impact pairs for strong reactions"
          git pull --rebase origin feat/procedural-fight-v3-20260902
          git push origin HEAD:feat/procedural-fight-v3-20260902
