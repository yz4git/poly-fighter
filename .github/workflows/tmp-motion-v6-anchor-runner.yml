name: Temporary V6 support-anchor branch runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-motion-v6-anchor-runner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-foundry-v6-reference-driven
          fetch-depth: 0
      - name: Apply support-foot root compensation
        run: |
          set -euo pipefail
          python3 scripts/patch-v6-support-anchor.py
          python3 -m py_compile tools/blender/motion_foundry_v6_mocap.py
          git diff --check
      - name: Commit V6 stabilizer to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blender/motion_foundry_v6_mocap.py
          git commit -m "Stabilize measured V6 kicks with planted-foot root compensation"
          git push origin HEAD:motion-foundry-v6-reference-driven
