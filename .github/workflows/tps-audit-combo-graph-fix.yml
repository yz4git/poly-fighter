name: Repair TPS combo graph audit

on:
  push:
    branches:
      - chatgpt/tps-audit-combo-graph-fix
    paths:
      - .github/workflows/tps-audit-combo-graph-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/tps-audit-combo-graph-fix
      - name: Align browser audit with current combo graph
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/capture-tps-visual-audit.mjs')
          text = path.read_text()
          old = "  if (comboProbe.moves.join(',') !== 'jab,straight,power') throw new Error(`TPS ATTACK combo sequence failed: ${JSON.stringify(comboProbe)}`);"
          new = "  const comboSequence = comboProbe.moves.join(',');\n  const validCloseCombos = new Set(['jab,straight,power', 'jab,backfist,power']);\n  if (!validCloseCombos.has(comboSequence)) throw new Error(`TPS ATTACK combo sequence failed: ${JSON.stringify(comboProbe)}`);"
          if old not in text:
              raise SystemExit('expected legacy combo assertion not found')
          path.write_text(text.replace(old, new))
          PY
      - name: Commit audit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-tps-visual-audit.mjs
          git commit -m "Align TPS audit with close combo graph"
          git push origin HEAD:chatgpt/tps-audit-combo-graph-fix
