name: Apply motion intent improvement pass

on:
  push:
    paths:
      - .github/workflows/apply-motion-intent-pass.yml
      - scripts/apply-motion-intent-pass.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply motion intent fixes
        run: python3 scripts/apply-motion-intent-pass.py

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --ignore-scripts @gltf-transform/core@4.4.1

      - name: Regenerate procedural motion pack
        run: |
          node scripts/generate-procedural-fight-motions-v2.mjs \
            public/models/quaternius/ual-fight-core.glb \
            public/models/quaternius/procedural-fight-core.glb \
            public/models/quaternius/procedural-fight-core.metrics.json

      - name: Validate implementation
        run: |
          npm run test:ci:tps
          npm run lint
          npm run build
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const m = JSON.parse(await readFile('public/models/quaternius/procedural-fight-core.metrics.json', 'utf8'));
          if (m.generatedClipCount !== 23) throw new Error(`expected 23 clips, got ${m.generatedClipCount}`);
          for (const name of ['PF_Backfist_L','PF_BodyBlow_R','PF_Counter_L']) {
            if (!m.clips.includes(name)) throw new Error(`missing ${name}`);
          }
          NODE

      - name: Commit motion intent pass
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/generate-procedural-fight-motions-v2.mjs \
            scripts/capture-motion-readability-audit.mjs \
            scripts/capture-motion-intent-audit.mjs \
            src/game/motion-profile.ts \
            src/game/motion-expansion-runtime.ts \
            tests/motion-expansion.test.ts \
            .github/workflows/procedural-fight-motion-generator.yml \
            .github/workflows/tps-visual-audit.yml \
            public/models/quaternius/procedural-fight-core.glb \
            public/models/quaternius/procedural-fight-core.metrics.json
          if git diff --cached --quiet; then
            echo "No motion intent changes"
            exit 0
          fi
          git commit -m "Improve motion intent and handedness"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
