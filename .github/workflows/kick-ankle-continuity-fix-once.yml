name: Finalize verified kick ankle fix once

on:
  push:
    branches: [kick-ankle-anatomy-v8]
    paths:
      - .github/workflows/kick-ankle-continuity-fix-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kick-ankle-anatomy-v8
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply verified ankle implementation exactly once
        run: python tools/patch-kick-ankle.py
      - name: Reconfirm real-skeleton ankle contract
        run: node --import tsx --test tests/combat-motion.test.ts tests/kick-ankle.test.ts
      - name: Reconfirm TPS regressions
        run: npm run test:ci:tps
      - name: Commit verified implementation and remove staging helpers
        env:
          HEAD_REF: kick-ankle-anatomy-v8
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/combat-motion-quality.yml
          git rm -f .github/workflows/kick-ankle-continuity-fix-once.yml tools/patch-kick-ankle.py
          git add src/game/combat-motion-authoring.ts tests/kick-ankle.test.ts .github/workflows/combat-motion-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix kick ankle twist continuity"
          git push origin HEAD:"$HEAD_REF"
