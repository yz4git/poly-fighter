name: Apply v6.1 punch-only foundation

on:
  push:
    branches:
      - improve/procedural-v6-source-foundation-20260902
    paths:
      - .github/workflows/v61-punch-foundation-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/procedural-v6-source-foundation-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock @gltf-transform/core@4.3.0
      - name: Remove rejected kick foundations
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/apply-motion-foundation-v4.mjs')
          s = p.read_text()
          s = s.replace('const VERSION = "SOURCE_FOUNDATION_V1";', 'const VERSION = "SOURCE_FOUNDATION_V1_PUNCH_ONLY";')
          for target in ['PF_FrontKick_R', 'PF_LowKick_L', 'PF_RisingKick_R']:
              marker = f'    target: "{target}",'
              pos = s.index(marker)
              start = s.rfind('  {\n', 0, pos)
              end = s.index('  },\n', pos) + len('  },\n')
              s = s[:start] + s[end:]
          p.write_text(s)
      - name: Rebuild punch-foundation motion
        run: |
          node scripts/generate-procedural-fight-motions-v3.mjs \
            public/models/quaternius/ual-fight-core.glb \
            /tmp/procedural-v3.glb \
            /tmp/procedural-v3.metrics.json
          node scripts/apply-motion-foundation-v4.mjs \
            /tmp/procedural-v3.glb \
            public/models/quaternius/ual-fight-core.glb \
            /tmp/procedural-v61.glb \
            public/models/quaternius/procedural-fight-foundation.metrics.json
          cp /tmp/procedural-v61.glb public/models/quaternius/procedural-fight-core.glb
      - name: Validate punch-only foundation
        run: |
          node -e "const m=require('./public/models/quaternius/procedural-fight-foundation.metrics.json'); if(m.version!=='SOURCE_FOUNDATION_V1_PUNCH_ONLY'||m.foundations.length!==3) process.exit(1); if(m.foundations.some(f=>f.target.includes('Kick'))) process.exit(1)"
          npm run test:ci:tps
          npm run lint
          npm run build
      - name: Commit v6.1 motion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apply-motion-foundation-v4.mjs \
            public/models/quaternius/procedural-fight-core.glb \
            public/models/quaternius/procedural-fight-foundation.metrics.json
          git commit -m "Keep source foundation motion on punches only"
          git push origin HEAD:improve/procedural-v6-source-foundation-20260902
