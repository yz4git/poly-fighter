name: Apply motion policy audit fix

on:
  push:
    branches: [motion-onoff-review]
    paths:
      - .github/workflows/apply-motion-policy-audit-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-onoff-review
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Make TPS audit correction-policy aware
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/capture-tps-visual-audit.mjs')
          text = p.read_text()
          old_return = '''      appliedBlend: data.motionExpansionComboBlendSeconds ?? 0,\n      motionMove: data.motionExpansionCurrentMove ?? null,\n      motionPhase: data.motionExpansionPhase ?? null,\n'''
          new_return = '''      appliedBlend: data.motionExpansionComboBlendSeconds ?? 0,\n      motionMove: data.motionExpansionCurrentMove ?? null,\n      motionPhase: data.motionExpansionPhase ?? null,\n      correctionPolicy: data.motionCorrectionPolicy ?? null,\n'''
          if new_return not in text:
              if old_return not in text:
                  raise SystemExit('combo probe return anchor missing')
              text = text.replace(old_return, new_return, 1)

          old_check = '''    || Math.abs(comboLinkProbe.requestedBlend - 0.075) > 0.0001\n    || Math.abs(comboLinkProbe.appliedBlend - 0.075) > 0.0001\n    || comboLinkProbe.motionMove !== 'backfist') {\n'''
          new_check = '''    || Math.abs(comboLinkProbe.requestedBlend - 0.075) > 0.0001\n    || !([\"RAW_CLIP_PLAYBACK\", \"AUTHORED_ATTACK_PRESERVE\"].includes(comboLinkProbe.correctionPolicy)\n      ? Math.abs(comboLinkProbe.appliedBlend) <= 0.0001 && comboLinkProbe.motionMove === null\n      : Math.abs(comboLinkProbe.appliedBlend - 0.075) <= 0.0001 && comboLinkProbe.motionMove === 'backfist')) {\n'''
          if new_check not in text:
              if old_check not in text:
                  raise SystemExit('combo validation anchor missing')
              text = text.replace(old_check, new_check, 1)
          p.write_text(text)

          test = Path('tests/tps-audit-motion-policy.test.mjs')
          test.write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\ntest("TPS visual audit accepts raw and authored-preserve combo playback without Motion Expansion metadata", async () => {\n  const source = await readFile(new URL("../scripts/capture-tps-visual-audit.mjs", import.meta.url), "utf8");\n  assert.match(source, /correctionPolicy: data\\.motionCorrectionPolicy/);\n  assert.match(source, /RAW_CLIP_PLAYBACK/);\n  assert.match(source, /AUTHORED_ATTACK_PRESERVE/);\n  assert.match(source, /comboLinkProbe\\.motionMove === null/);\n  assert.match(source, /comboLinkProbe\\.motionMove === 'backfist'/);\n});\n''')
          PY

      - name: Validate audit policy fix
        run: |
          npm ci --no-audit --no-fund
          node --test tests/tps-audit-motion-policy.test.mjs
          npm run lint

      - name: Commit audit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-tps-visual-audit.mjs tests/tps-audit-motion-policy.test.mjs
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "Make TPS audit motion-policy aware"
          git push origin HEAD:motion-onoff-review
