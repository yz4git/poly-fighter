name: POLY FIGHTER Blender Motion Foundry v2 Reactions

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/blender/build-fight-motion-foundry-v1.py
      - tools/blender/motion_foundry_v2_rig.py
      - tools/blender/build-fight-motion-foundry-v2-reactions.py
      - scripts/apply-blender-motion-foundry-v2-reactions.mjs
      - src/game/visual-quaternius-runtime.ts
      - src/game/model-viewer-motion.ts
      - scripts/capture-model-view-audit.mjs
      - public/models/quaternius/blender-reactions-core.glb
      - public/models/quaternius/blender-reactions-core.metrics.json
      - public/models/quaternius/blender-reactions-core.generator.sha256
      - tests/blender-motion-foundry-v2-reactions.test.mjs
      - .github/workflows/blender-motion-foundry-v2-reactions.yml
  workflow_dispatch:

jobs:
  build-reactions:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Check whether Blender reaction artifact is current
        id: foundry
        shell: bash
        run: |
          set -euo pipefail
          reaction_hash="$(cat tools/blender/build-fight-motion-foundry-v1.py tools/blender/motion_foundry_v2_rig.py tools/blender/build-fight-motion-foundry-v2-reactions.py | sha256sum | awk '{print $1}')"
          echo "reaction_hash=$reaction_hash" >> "$GITHUB_OUTPUT"
          if [ -s public/models/quaternius/blender-reactions-core.glb ] \
            && [ -s public/models/quaternius/blender-reactions-core.metrics.json ] \
            && [ -s public/models/quaternius/blender-reactions-core.generator.sha256 ] \
            && grep -qx "$reaction_hash" public/models/quaternius/blender-reactions-core.generator.sha256; then
            echo "needs_generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch pinned full UAL authoring source
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          set -euxo pipefail
          mkdir -p .tmp-quaternius
          BASE_PIN=aa02a4e6d8337a0604d2da131bcbbeb1f01badf0
          BASE_URL=https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/$BASE_PIN/public/assets/vendor/quaternius
          curl -L --fail --retry 3 "$BASE_URL/universal-animation-library.glb" -o .tmp-quaternius/ual1-full.glb
          echo '4c748767741a3e495d89667b9a218b690ba9810b9517a12e960780e3ca72c4e9  .tmp-quaternius/ual1-full.glb' | sha256sum -c -

      - name: Install Blender
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri xvfb
          blender --version | head -n 2
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          blender --background --python-use-system-env --python-expr "import numpy; print('BLENDER_NUMPY', numpy.__version__)"

      - name: Generate Blender reaction pack
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          set -euo pipefail
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          out="artifacts/blender-motion-foundry-v2-reactions"
          mkdir -p "$out"
          xvfb-run -a blender --background \
            --python-use-system-env \
            --python-exit-code 1 \
            --python tools/blender/build-fight-motion-foundry-v2-reactions.py \
            -- \
            --source .tmp-quaternius/ual1-full.glb \
            --output-dir "$out"
          test -s "$out/blender-reactions-core.glb"
          test -s "$out/blender-reactions-core.metrics.json"
          test -s "$out/blender-reactions-core-v2.blend"
          cat "$out/blender-reactions-core.metrics.json"

      - name: Validate reaction metrics and GLB actions
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          root = Path('artifacts/blender-motion-foundry-v2-reactions')
          m = json.loads((root / 'blender-reactions-core.metrics.json').read_text())
          expected = {'BF_HitHeavy', 'BF_GuardBreak'}
          assert m['version'] == 'BLENDER_MOTION_FOUNDRY_V2_REACTIONS', m
          assert m['sharedRig'] == 'MOTION_FOUNDRY_V2_REACTION_RIG', m
          assert set(m['actions']) == expected, m
          assert len(m['moves']) == 2, m
          by_action = {move['action']: move for move in m['moves']}
          for name, move in by_action.items():
              assert name in expected, move
              assert move['durationSeconds'] < 0.65, move
              assert move['torsoExcursionDegrees'] > 10, move
              assert move['headExcursionDegrees'] > 7, move
              assert move['leftFootDriftMax'] < 0.015, move
              assert move['rightFootDriftMax'] < 0.015, move
              assert move['settleTorsoResidualDegrees'] < 20, move
              assert move['boneCount'] >= 40, move
          assert by_action['BF_HitHeavy']['torsoExcursionDegrees'] > 20, by_action['BF_HitHeavy']
          assert by_action['BF_HitHeavy']['headExcursionDegrees'] > 12, by_action['BF_HitHeavy']
          assert by_action['BF_GuardBreak']['handSeparationIncrease'] > 0.10, by_action['BF_GuardBreak']
          raw = (root / 'blender-reactions-core.glb').read_bytes()
          assert raw[:4] == b'glTF' and len(raw) > 20
          json_len, json_type = struct.unpack_from('<II', raw, 12)
          assert json_type == 0x4E4F534A
          doc = json.loads(raw[20:20 + json_len].decode('utf-8').rstrip('\x00 '))
          names = {a.get('name') for a in doc.get('animations', [])}
          assert expected.issubset(names), {'expected': sorted(expected), 'animations': sorted(n for n in names if n)}
          print('BLENDER_MOTION_FOUNDRY_V2_REACTIONS_OK', by_action)
          PY

      - name: Stage generated reaction library
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          set -euo pipefail
          cp artifacts/blender-motion-foundry-v2-reactions/blender-reactions-core.glb public/models/quaternius/blender-reactions-core.glb
          cp artifacts/blender-motion-foundry-v2-reactions/blender-reactions-core.metrics.json public/models/quaternius/blender-reactions-core.metrics.json
          printf '%s\n' '${{ steps.foundry.outputs.reaction_hash }}' > public/models/quaternius/blender-reactions-core.generator.sha256

      - name: Apply reaction runtime integration
        run: node scripts/apply-blender-motion-foundry-v2-reactions.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate reaction contract
        run: node --test tests/blender-motion-foundry-v2-reactions.test.mjs

      - name: Build, rules and lint integrated game
        run: |
          npm run build
          npm run test:rules
          npm run test:pwa
          npm run lint

      - name: Publish generated reactions and integration to PR branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code && [ -z "$(git status --porcelain)" ]; then
            echo "Blender reaction branch is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/models/quaternius/blender-reactions-core.glb \
            public/models/quaternius/blender-reactions-core.metrics.json \
            public/models/quaternius/blender-reactions-core.generator.sha256 \
            src/game/visual-quaternius-runtime.ts \
            src/game/model-viewer-motion.ts \
            scripts/capture-model-view-audit.mjs
          git commit -m "Generate Blender v2 reaction actions"
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-blender-motion-foundry-v2-reactions
          path: |
            artifacts/blender-motion-foundry-v2-reactions
            public/models/quaternius/blender-reactions-core.metrics.json
          if-no-files-found: ignore
          retention-days: 14
