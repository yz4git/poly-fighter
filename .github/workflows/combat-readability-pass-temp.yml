name: Combat readability pass temp

on:
  push:
    branches: [chatgpt/combat-readability-pass-v1]
    paths:
      - .github/workflows/combat-readability-pass-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/combat-readability-pass-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply close-combat readability fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, before, after):
              p = Path(path)
              text = p.read_text()
              if before not in text:
                  raise SystemExit(f"missing patch target in {path}: {before[:90]!r}")
              p.write_text(text.replace(before, after, 1))

          game = 'src/game/tps-game.ts'
          replace_once(game,
              'this.camera.fov = width > height && aspect < 2.4 ? 52 : 47;',
              'this.camera.fov = width > height && aspect < 2.4 ? 54 : 47;')
          replace_once(game,
          '''  private separateFighters(): void {
              const delta = new THREE.Vector3(this.p2.position.x - this.p1.position.x, 0, this.p2.position.z - this.p1.position.z);
              const distance = delta.length();
              const minimum = 0.92;
              if (distance >= minimum || distance < 1e-5) return;
              const correction = delta.normalize().multiplyScalar((minimum - distance) * 0.5);
              this.p1.position.addScaledVector(correction, -1);
              this.p2.position.add(correction);
            }
          ''',
          '''  private separateFighters(): void {
              const delta = new THREE.Vector3(this.p2.position.x - this.p1.position.x, 0, this.p2.position.z - this.p1.position.z);
              const distance = delta.length();
              const p1Throwing = this.p1.currentMove?.hitLevel === "THROW" && ["ATTACK", "THROW"].includes(this.p1.state);
              const p2Throwing = this.p2.currentMove?.hitLevel === "THROW" && ["ATTACK", "THROW"].includes(this.p2.state);
              // Preserve throw contact, but keep normal strikes from collapsing both silhouettes
              // into the same screen-space column on iPhone landscape.
              const minimum = p1Throwing || p2Throwing ? 0.98 : 1.12;
              if (distance >= minimum || distance < 1e-5) return;
              const correction = delta.normalize().multiplyScalar((minimum - distance) * 0.5);
              this.p1.position.addScaledVector(correction, -1);
              this.p2.position.add(correction);
            }
          ''')
          replace_once(game,
          '''    const backDistance = 4.85 - closeFactor * 0.45 + compactLandscapeFactor * 0.30;
              const shoulderOffset = 2.2 + closeFactor * 1.25 + compactLandscapeFactor * (0.55 + closeFactor * 0.55);
              const cameraHeight = 2.28 + closeFactor * 0.17 + compactLandscapeFactor * 0.04;
              this.cameraTarget.copy(this.p2.position)
                .addScaledVector(right, -0.28 * closeFactor)
                .add(new THREE.Vector3(0, 1.16 + closeFactor * 0.04, 0));
              this.cameraDesired.copy(this.p1.position)
                .addScaledVector(forward, -backDistance)
                .addScaledVector(right, shoulderOffset)
                .add(new THREE.Vector3(0, cameraHeight, 0));
              ease(this.camera.position, this.cameraDesired, 12.2, delta);
          ''',
          '''    // Pull back as the fighters close instead of moving the shoulder camera inward.
              // This preserves both silhouettes during punch/throw scrambles and gives iPhone
              // landscape enough vertical room for the HUD and touch controls.
              const backDistance = 5.05 + closeFactor * 0.72 + compactLandscapeFactor * 0.34;
              const shoulderOffset = 2.08 + closeFactor * 1.08 + compactLandscapeFactor * (0.46 + closeFactor * 0.38);
              const cameraHeight = 2.30 + closeFactor * 0.22 + compactLandscapeFactor * 0.05;
              this.cameraTarget.copy(this.p2.position)
                .lerp(this.p1.position, closeFactor * 0.16)
                .addScaledVector(right, -0.20 * closeFactor)
                .add(new THREE.Vector3(0, 1.18 + closeFactor * 0.05, 0));
              this.cameraDesired.copy(this.p1.position)
                .addScaledVector(forward, -backDistance)
                .addScaledVector(right, shoulderOffset)
                .add(new THREE.Vector3(0, cameraHeight, 0));
              ease(this.camera.position, this.cameraDesired, 10.8, delta);
          ''')
          replace_once(game,
          '''    this.camera.position.copy(this.p1.position)
                .addScaledVector(forward, -4.85)
                .addScaledVector(right, 2.2)
                .add(new THREE.Vector3(0, 2.28, 0));
          ''',
          '''    this.camera.position.copy(this.p1.position)
                .addScaledVector(forward, -5.05)
                .addScaledVector(right, 2.08)
                .add(new THREE.Vector3(0, 2.30, 0));
          ''')

          graphics = 'src/game/tps-graphics.ts'
          replace_once(graphics,
              'private readonly p1Rim = new THREE.PointLight(0xff9aad, 0.52, 5.4, 2);\n  private readonly p2Rim = new THREE.PointLight(0xa6e4ff, 0.52, 5.4, 2);',
              'private readonly p1Rim = new THREE.PointLight(0xff8ca3, 0.68, 5.8, 2);\n  private readonly p2Rim = new THREE.PointLight(0x8edfff, 0.68, 5.8, 2);')
          replace_once(graphics,
              'this.p1Rim.intensity = low ? 0.24 : 0.52;\n    this.p2Rim.intensity = low ? 0.24 : 0.52;',
              'this.p1Rim.intensity = low ? 0.32 : 0.68;\n    this.p2Rim.intensity = low ? 0.32 : 0.68;')
          replace_once(graphics,
          '''    this.p1Rim.position.copy(p1.position).addScaledVector(fighterForward, -1.3).addScaledVector(fighterRight, 0.72);
              this.p1Rim.position.y = 1.72;
              this.p2Rim.position.copy(p2.position).addScaledVector(fighterForward, 1.3).addScaledVector(fighterRight, -0.72);
              this.p2Rim.position.y = 1.72;
              const rimPulse = 0.9 + Math.sin(time * 4.4) * 0.06;
              if (this.quality !== "LOW") {
                this.p1Rim.intensity = (p1.state === "ATTACK" ? 0.78 : 0.48) * rimPulse;
                this.p2Rim.intensity = (p2.state === "ATTACK" ? 0.78 : 0.48) * rimPulse;
              }
          ''',
          '''    this.p1Rim.position.copy(p1.position).addScaledVector(fighterForward, -1.18).addScaledVector(fighterRight, 0.92);
              this.p1Rim.position.y = 1.58;
              this.p2Rim.position.copy(p2.position).addScaledVector(fighterForward, 1.18).addScaledVector(fighterRight, -0.92);
              this.p2Rim.position.y = 1.58;
              const rimPulse = 0.92 + Math.sin(time * 4.4) * 0.055;
              if (this.quality !== "LOW") {
                this.p1Rim.intensity = (p1.state === "ATTACK" ? 1.08 : 0.68) * rimPulse;
                this.p2Rim.intensity = (p2.state === "ATTACK" ? 1.08 : 0.68) * rimPulse;
              }
          ''')
          replace_once(graphics,
              'material.opacity = airborne ? 0.11 : 0.25 + Math.sin(time * 3.7) * 0.018;',
              'material.opacity = airborne ? 0.13 : 0.32 + Math.sin(time * 3.7) * 0.020;')

          css = Path('app/playtest-polish.css')
          marker = '/* Combat readability pass v1 */'
          text = css.read_text()
          if marker not in text:
              text += '''\n\n/* Combat readability pass v1 */\n@media (orientation: landscape) and (max-height: 560px) {\n  .fight-hud {\n    grid-template-columns: minmax(0, 1fr) 104px minmax(0, 1fr);\n    gap: clamp(8px, 1.6vw, 15px);\n  }\n  .hud-name strong {\n    font-size: clamp(17px, 4.8vh, 22px);\n    text-shadow: 0 2px 10px rgba(0,0,0,.7), 2px 2px 0 rgba(10,30,59,.72);\n  }\n  .health-track { height: 13px; background: rgba(2,8,18,.88); }\n  .round-readout { padding: 4px 7px 7px; background: rgba(3,11,24,.88); }\n  .round-readout span { font-size: 7px; }\n  .round-readout b { font-size: 28px; }\n  .round-readout small { min-height: 9px; font-size: 7px; }\n  .tps-badge {\n    display: block;\n    top: max(62px, calc(env(safe-area-inset-top) + 54px));\n    padding: 5px 10px;\n    border: 1px solid rgba(124,232,255,.24);\n    background: rgba(3,12,25,.72);\n    box-shadow: 0 6px 18px rgba(0,0,0,.24);\n    color: rgba(220,242,255,.88);\n    font-size: 9px;\n    letter-spacing: .16em;\n  }\n  .tps-input-hint {\n    padding: 3px 8px;\n    border-radius: 2px;\n    background: rgba(3,10,21,.52);\n    font-size: 9px;\n    letter-spacing: .10em;\n  }\n  .virtual-pad { opacity: .82; }\n}\n@media (orientation: landscape) and (max-height: 430px) {\n  .fight-hud { grid-template-columns: minmax(0, 1fr) 94px minmax(0, 1fr); }\n  .hud-name strong { font-size: 16px; }\n  .round-readout b { font-size: 24px; }\n  .tps-badge { top: max(59px, calc(env(safe-area-inset-top) + 51px)); font-size: 8px; }\n  .tps-input-hint { font-size: 8px; }\n}\n'''
              # Remove the older rule that deliberately hid TPS status on compact landscape.
              text = text.replace('@media (orientation: landscape) and (max-height: 560px) {\n  .tps-badge { display: none; }\n}\n', '')
              css.write_text(text)

          tests = 'tests/tps-mode.test.ts'
          replace_once(tests, 'assert.match(source, /aspect < 2\\.4 \\? 52 : 47/);', 'assert.match(source, /aspect < 2\\.4 \\? 54 : 47/);')
          replace_once(tests, 'assert.match(source, /backDistance = 4\\.85 - closeFactor \\* 0\\.45/);', 'assert.match(source, /backDistance = 5\\.05 \\+ closeFactor \\* 0\\.72/);')
          replace_once(tests, 'assert.match(source, /shoulderOffset = 2\\.2 \\+ closeFactor \\* 1\\.25/);', 'assert.match(source, /shoulderOffset = 2\\.08 \\+ closeFactor \\* 1\\.08/);')
          replace_once(tests,
              'assert.match(source, /enemyOpeningGraceTicks = 132/);',
              'assert.match(source, /enemyOpeningGraceTicks = 132/);\n  assert.match(source, /const minimum = p1Throwing \\|\\| p2Throwing \\? 0\\.98 : 1\\.12/);\n  assert.match(source, /lerp\\(this\\.p1\\.position, closeFactor \\* 0\\.16\\)/);')

      - run: npm ci --no-audit --no-fund
      - name: Validate pass
        run: |
          npm run test:ci:tps
          npm run lint
          npm run build
          git diff --check
      - name: Commit readability pass
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/game/tps-game.ts src/game/tps-graphics.ts app/playtest-polish.css tests/tps-mode.test.ts
          git commit -m "Improve close-combat readability and iPhone HUD"
          git push origin HEAD:chatgpt/combat-readability-pass-v1
