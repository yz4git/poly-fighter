name: Temporary V6 guard settle branch runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-motion-v6-guard-settle-runner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-foundry-v6-reference-driven
          fetch-depth: 0
      - name: Apply V6 guard settle and chamber shaping
        run: |
          set -euo pipefail
          python3 scripts/patch-v6-guard-settle.py
          python3 -m py_compile tools/blender/motion_foundry_v6_mocap.py tools/blender/build-fight-motion-foundry-v2-kicks.py
          git diff --check
      - name: Commit V6 guard settle to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blender/motion_foundry_v6_mocap.py tools/blender/build-fight-motion-foundry-v2-kicks.py
          if git diff --cached --quiet; then
            echo "No V6 changes to commit."
            exit 0
          fi
          git commit -m "Settle measured kicks back to combat guard"
          git push origin HEAD:motion-foundry-v6-reference-driven
