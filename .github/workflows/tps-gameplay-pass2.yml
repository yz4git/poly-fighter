name: TPS Gameplay Quality Pass 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tps-gameplay-pass2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply TPS gameplay/readability improvements
        run: |
          python - <<'PY'
          from pathlib import Path

          game = Path('src/game/tps-game.ts')
          s = game.read_text()

          old = '''  private readonly cameraTarget = new THREE.Vector3();\n  private readonly cameraDesired = new THREE.Vector3();'''
          new = '''  private readonly cameraTarget = new THREE.Vector3();\n  private readonly cameraDesired = new THREE.Vector3();\n  private playerEvadeTicks = 0;\n  private playerEvadeCooldown = 0;\n  private playerEvadeSign = 0;'''
          if old not in s: raise SystemExit('camera field anchor not found')
          s = s.replace(old, new, 1)

          old = '''    const moveSpeed = this.p1.definition.archetype === "SPEED" ? 4.0 : 3.35;\n    if (input.guard) {'''
          new = '''    const moveSpeed = this.p1.definition.archetype === "SPEED" ? 4.0 : 3.35;\n    if (this.playerEvadeCooldown > 0) this.playerEvadeCooldown -= 1;\n    const evadePressed = input.guard && sideAxis !== 0 && (\n      this.p1.justPressed("guard") || this.p1.justPressed("left") || this.p1.justPressed("right")\n    );\n    if (evadePressed && this.playerEvadeCooldown <= 0) {\n      this.playerEvadeTicks = 9;\n      this.playerEvadeCooldown = 32;\n      this.playerEvadeSign = sideAxis > 0 ? 1 : -1;\n    }\n    if (this.playerEvadeTicks > 0) {\n      this.playerEvadeTicks -= 1;\n      this.p1.position.addScaledVector(right, FIXED_STEP * moveSpeed * 2.35 * this.playerEvadeSign);\n      this.p1.state = "SIDESTEP";\n      this.p1.updatePhysics(FIXED_STEP);\n      return;\n    }\n    if (input.guard) {'''
          if old not in s: raise SystemExit('player movement anchor not found')
          s = s.replace(old, new, 1)

          old = '''    const move = attacker.currentMove;\n    if (attacker.state !== "ATTACK" || !move || !attacker.isActive() || attacker.hitTargets.has(defender.id)) return;\n    const distance = Math.hypot(defender.position.x - attacker.position.x, defender.position.z - attacker.position.z);'''
          new = '''    const move = attacker.currentMove;\n    if (attacker.state !== "ATTACK" || !move || !attacker.isActive() || attacker.hitTargets.has(defender.id)) return;\n    // The opening frames of a guard-side quickstep evade strikes, while throws\n    // still catch the movement. This gives TPS lateral movement a real timing\n    // purpose without changing the shared deterministic move definitions.\n    if (defender === this.p1 && this.playerEvadeTicks > 3 && move.hitLevel !== "THROW") return;\n    const distance = Math.hypot(defender.position.x - attacker.position.x, defender.position.z - attacker.position.z);'''
          if old not in s: raise SystemExit('resolveAttack anchor not found')
          s = s.replace(old, new, 1)

          old = '''  private updateLockOn(): void {\n    const target = this.p2.position.clone().add(new THREE.Vector3(0, 1.56, 0));\n    this.lockRing.position.copy(target);\n    this.lockRing.lookAt(this.camera.position);\n    const pulse = 1 + Math.sin(this.renderTime * 5.5) * 0.04;\n    this.lockRing.scale.setScalar(pulse);\n    this.lockStem.position.copy(target).add(new THREE.Vector3(0, -0.46, 0));\n    this.lockStem.lookAt(this.camera.position);\n  }'''
          new = '''  private updateLockOn(): void {\n    // Anchor the reticle to the actual rendered chest instead of a hard-coded\n    // world height so both body types keep the marker off the waist/legs.\n    this.p2.visual.root.updateMatrixWorld(true);\n    const target = this.p2.visual.root.localToWorld(new THREE.Vector3(0, this.p2.visual.layout.ribY + 0.025, 0));\n    const distance = Math.hypot(this.p2.position.x - this.p1.position.x, this.p2.position.z - this.p1.position.z);\n    const threat = this.p2.state === "ATTACK";\n    const inStrikeRange = distance < 2.12;\n    const lockColor = threat ? 0xff667f : inStrikeRange ? 0xffd45c : 0x7ce8ff;\n    this.lockRing.material.color.setHex(lockColor);\n    this.lockStem.material.color.setHex(lockColor);\n    this.lockRing.position.copy(target);\n    this.lockRing.lookAt(this.camera.position);\n    const pulseRate = threat ? 10.5 : 5.5;\n    const pulse = (threat ? 0.78 : 0.72) + Math.sin(this.renderTime * pulseRate) * 0.035;\n    this.lockRing.scale.setScalar(pulse);\n    this.lockStem.position.copy(target).add(new THREE.Vector3(0, -0.32, 0));\n    this.lockStem.lookAt(this.camera.position);\n  }'''
          if old not in s: raise SystemExit('lock-on anchor not found')
          s = s.replace(old, new, 1)

          old = '''    this.enemyCooldown = 52;\n    this.timerTicks = ROUND_TICKS;\n    this.resultWinner = null;'''
          new = '''    this.enemyCooldown = 52;\n    this.playerEvadeTicks = 0;\n    this.playerEvadeCooldown = 0;\n    this.playerEvadeSign = 0;\n    this.timerTicks = ROUND_TICKS;\n    this.resultWinner = null;'''
          if old not in s: raise SystemExit('reset anchor not found')
          s = s.replace(old, new, 1)
          game.write_text(s)

          test = Path('tests/tps-mode.test.ts')
          t = test.read_text()
          anchor = '''  assert.match(source, /fighter\\.visual\\.aura\\.visible = false/);\n});'''
          replacement = '''  assert.match(source, /fighter\\.visual\\.aura\\.visible = false/);\n  assert.match(source, /playerEvadeTicks = 9/);\n  assert.match(source, /playerEvadeCooldown = 32/);\n  assert.match(source, /defender === this\\.p1 && this\\.playerEvadeTicks > 3/);\n  assert.match(source, /move\\.hitLevel !== "THROW"/);\n  assert.match(source, /visual\\.layout\\.ribY/);\n  assert.match(source, /threat \\? 0xff667f : inStrikeRange \\? 0xffd45c/);\n});'''
          if anchor not in t: raise SystemExit('TPS test anchor not found')
          test.write_text(t.replace(anchor, replacement, 1))

          page = Path('app/page.tsx')
          p = page.read_text()
          p = p.replace('HOLD G + MOVE GUARD STEP', 'HOLD G + MOVE GUARD STEP / G + SIDE QUICKSTEP')
          page.write_text(p)

          audit = Path('scripts/capture-tps-visual-audit.mjs')
          a = audit.read_text()
          anchor = '''    game.p1.position.set(0, 0, 0.72);\n    game.p2.position.set(0, 0, -0.42);\n    game.press('punch', 'tps-audit-punch');'''
          replacement = '''    game.p1.position.set(0, 0, 0.72);\n    game.p2.position.set(0, 0, -0.42);\n    game.playerEvadeTicks = 0;\n    game.playerEvadeCooldown = 0;\n    game.playerEvadeSign = 0;\n    // Settle the shoulder camera after the deterministic close-range teleport.\n    // This makes the captured framing representative of actual continuous play.\n    for (let index = 0; index < 24; index += 1) game.updateCamera(1 / 60);\n    game.updateLockOn();\n    game.renderer.render(game.scene, game.camera);\n    game.press('punch', 'tps-audit-punch');'''
          if anchor not in a: raise SystemExit('punch camera-settle anchor not found')
          a = a.replace(anchor, replacement, 1)

          anchor = '''  const punchProbe = await execute(sessionId, `${gameLookup}\n    const game = findGame();'''
          replacement = '''  const quickstepProbe = await execute(sessionId, `${gameLookup}\n    const game = findGame();\n    cancelAnimationFrame(game.raf);\n    game.running = false;\n    game.finished = false;\n    game.input.clear();\n    game.updateEnemy = () => { game.p2.velocity.set(0, 0, 0); game.p2.state = 'IDLE'; };\n    game.p1.currentMove = null;\n    game.p1.moveTick = 0;\n    game.p1.velocity.set(0, 0, 0);\n    game.p1.state = 'IDLE';\n    game.playerEvadeTicks = 0;\n    game.playerEvadeCooldown = 0;\n    game.playerEvadeSign = 0;\n    game.p1.position.set(0, 0, 1.4);\n    game.p2.position.set(0, 0, -0.3);\n    const start = { x: game.p1.position.x, z: game.p1.position.z };\n    game.press('guard', 'tps-audit-evade-g');\n    game.press('right', 'tps-audit-evade-side');\n    for (let index = 0; index < 6; index += 1) game.step();\n    game.release('guard', 'tps-audit-evade-g');\n    game.release('right', 'tps-audit-evade-side');\n    for (let index = 0; index < 18; index += 1) game.updateCamera(1 / 60);\n    game.updateLockOn();\n    game.renderer.render(game.scene, game.camera);\n    return { start, end: { x: game.p1.position.x, z: game.p1.position.z }, state: game.p1.state };\n  `);\n  const quickstepTravel = Math.hypot(quickstepProbe.end.x - quickstepProbe.start.x, quickstepProbe.end.z - quickstepProbe.start.z);\n  if (quickstepTravel < 0.45) throw new Error(`TPS quickstep travel too small: ${JSON.stringify({ quickstepProbe, quickstepTravel })}`);\n  await screenshot(sessionId, `${outputDir}/tps-quickstep.png`);\n\n  const punchProbe = await execute(sessionId, `${gameLookup}\n    const game = findGame();'''
          if anchor not in a: raise SystemExit('quickstep insertion anchor not found')
          a = a.replace(anchor, replacement, 1)
          a = a.replace(
            'const report = { initial, iphone, afterStrafe, lateralTravel, beforeForwardDistance, afterForward, afterForwardDistance, punchProbe, afterPunch, afterBoundary, radial };',
            'const report = { initial, iphone, afterStrafe, lateralTravel, beforeForwardDistance, afterForward, afterForwardDistance, quickstepProbe, quickstepTravel, punchProbe, afterPunch, afterBoundary, radial };',
          )
          audit.write_text(a)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run test:rules
      - run: npm run build
      - run: npm run lint
      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-tps-quality.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/poly-fighter-tps-quality.log
          exit 1
      - name: Exercise improved TPS battle
        run: |
          mkdir -p artifacts/tps-gameplay-pass2
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-gameplay-pass2" node scripts/capture-tps-visual-audit.mjs
          test -s artifacts/tps-gameplay-pass2/tps-quickstep.png
          cp /tmp/poly-fighter-tps-quality.log artifacts/tps-gameplay-pass2/server.log
      - uses: actions/upload-artifact@v4
        with:
          name: poly-fighter-tps-gameplay-pass2
          path: artifacts/tps-gameplay-pass2
          if-no-files-found: error
      - name: Commit gameplay pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/tps-game.ts tests/tps-mode.test.ts app/page.tsx scripts/capture-tps-visual-audit.mjs
          git commit -m "Add TPS quickstep and threat reticle"
          git push
