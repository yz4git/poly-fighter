name: Apply Procedural Fight v3

on:
  push:
    branches: [feat/procedural-fight-v3-20260902]
    paths:
      - scripts/refine-procedural-fight-v3.py
      - .github/workflows/apply-procedural-fight-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/procedural-fight-v3-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Refine V3 contracts
        run: python3 scripts/refine-procedural-fight-v3.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate refined V3
        run: |
          npm run test:rules:tps
          npm run lint
          npm run build
      - name: Commit V3 refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/game/motion-profile.ts \
            tests/motion-expansion.test.ts \
            scripts/capture-motion-readability-audit.mjs
          git commit -m "Refine Procedural Fight v3 runtime contracts"
          git pull --rebase origin feat/procedural-fight-v3-20260902
          git push origin HEAD:feat/procedural-fight-v3-20260902
