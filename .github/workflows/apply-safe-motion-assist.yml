name: Apply safe motion assist

on:
  push:
    branches: [motion-onoff-review]
    paths:
      - .github/workflows/apply-safe-motion-assist.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-onoff-review
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Tighten ready-pose assistance
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          path = 'src/game/visual-quaternius-runtime.ts'
          replace(path, 'const IMPORTED_NEUTRAL_FORWARD_CLEARANCE = 0.82;', 'const IMPORTED_NEUTRAL_FORWARD_CLEARANCE = 0.58;')
          replace(path, 'const IMPORTED_GUARD_FORWARD_CLEARANCE = 1.16;', 'const IMPORTED_GUARD_FORWARD_CLEARANCE = 0.88;')
          replace(path, 'const IMPORTED_NEUTRAL_HAND_LIFT = -0.055;', 'const IMPORTED_NEUTRAL_HAND_LIFT = -0.085;')
          replace(path, 'const IMPORTED_GUARD_HAND_LIFT = 0.012;', 'const IMPORTED_GUARD_HAND_LIFT = -0.015;')
          replace(path, 'pose.target, pose.pole, 0.08);', 'pose.target, pose.pole, 0.05);')
          replace(path, 'pose.target, pose.pole, 0.12);', 'pose.target, pose.pole, 0.08);')

          test = Path('tests/motion-correction-safe-assist.test.mjs')
          text = test.read_text()
          text = text.replace('IMPORTED_NEUTRAL_FORWARD_CLEARANCE = 0\\.82', 'IMPORTED_NEUTRAL_FORWARD_CLEARANCE = 0\\.58')
          text = text.replace('IMPORTED_GUARD_FORWARD_CLEARANCE = 1\\.16', 'IMPORTED_GUARD_FORWARD_CLEARANCE = 0\\.88')
          text = text.replace('IMPORTED_NEUTRAL_HAND_LIFT = -0\\.055', 'IMPORTED_NEUTRAL_HAND_LIFT = -0\\.085')
          text = text.replace('pose\\.target, pose\\.pole, 0\\.08', 'pose\\.target, pose\\.pole, 0\\.05', 1)
          text = text.replace('pose\\.target, pose\\.pole, 0\\.12', 'pose\\.target, pose\\.pole, 0\\.08', 1)
          test.write_text(text)
          PY

      - name: Validate compact assist
        run: |
          npm ci --no-audit --no-fund
          node --test tests/motion-correction-safe-assist.test.mjs
          npm run build
          npm run lint

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/visual-quaternius-runtime.ts tests/motion-correction-safe-assist.test.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes"
            exit 0
          fi
          git commit -m "Compact corrected ready pose"
          git push origin HEAD:motion-onoff-review
