name: Implement JUST STEP and BREAK COUNTER

on:
  push:
    branches:
      - just-step-break-counter-v1
    paths:
      - .github/workflows/just-step-break-counter-impl.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: just-step-break-counter-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply timing and counter pass
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"anchor not unique in {path}: {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          path = "src/game/tps-game-base.ts"
          replace_once(path,
          '''const TPS_INTERCEPT_TICKS = 26;
          const TPS_REVERSAL_TICKS = 24;
          // Human-readable CPU commitment windows for iPhone touch play.''',
          '''const TPS_INTERCEPT_TICKS = 26;
          const TPS_REVERSAL_TICKS = 24;
          const TPS_JUST_STEP_WINDOW_TICKS: Readonly<Record<CpuDifficulty, number>> = Object.freeze({
            EASY: 8,
            NORMAL: 6,
            HARD: 5,
          });
          const TPS_JUST_STEP_REWARD_TICKS = 24;
          const TPS_BREAK_COUNTER_TICKS = 30;
          const TPS_BREAK_COUNTER_ATTACK_TICKS = 32;
          // Human-readable CPU commitment windows for iPhone touch play.''')

          replace_once(path,
          '''type MatchDramaPhase = "OPENING" | "NEUTRAL" | "PRESSURE" | "COMEBACK" | "CLUTCH" | "FINISH";''',
          '''type MatchDramaPhase = "OPENING" | "NEUTRAL" | "PRESSURE" | "COMEBACK" | "CLUTCH" | "FINISH";
          type TpsThreatTiming = "NONE" | "READ" | "WATCH" | "SLIP";''')

          replace_once(path,
          '''  private playerInterceptTicks = 0;
            private playerReversalTicks = 0;
            private combatBeatLabel: string | null = null;''',
          '''  private playerInterceptTicks = 0;
            private playerReversalTicks = 0;
            private playerStepThreatWasJust = false;
            private playerJustStepTicks = 0;
            private playerBreakCounterTicks = 0;
            private playerBreakCounterAttackTicks = 0;
            private combatBeatLabel: string | null = null;''')

          replace_once(path,
          '''    if (this.playerStepThreatTicks > 0) this.playerStepThreatTicks -= 1;
              if (this.playerInterceptTicks > 0) this.playerInterceptTicks -= 1;
              if (this.playerReversalTicks > 0) this.playerReversalTicks -= 1;''',
          '''    if (this.playerStepThreatTicks > 0) this.playerStepThreatTicks -= 1;
              if (this.playerInterceptTicks > 0) this.playerInterceptTicks -= 1;
              if (this.playerReversalTicks > 0) this.playerReversalTicks -= 1;
              if (this.playerJustStepTicks > 0) this.playerJustStepTicks -= 1;
              if (this.playerBreakCounterTicks > 0) this.playerBreakCounterTicks -= 1;
              if (this.playerBreakCounterAttackTicks > 0) this.playerBreakCounterAttackTicks -= 1;''')

          replace_once(path,
          '''      const activeIncomingMove = this.p2.state === "ATTACK" ? this.p2.currentMove : null;
                const pendingMove = this.enemyDirectorPendingMove ? this.p2.definition.moves[this.enemyDirectorPendingMove] ?? null : null;
                const pendingReaction = Boolean(
                  pendingMove
                  && this.enemyDirectorTelegraphTicks > 0
                  && this.enemyDirectorTelegraphTicks <= this.enemyReactionWindowTicks()
                );
                const incomingMove = activeIncomingMove ?? (pendingReaction ? pendingMove : null);
                const incomingDistance = Math.hypot(this.p2.position.x - this.p1.position.x, this.p2.position.z - this.p1.position.z);
                const incomingThreatReach = incomingMove
                  ? incomingMove.reach + (this.enemyDirectorPendingMove === "dashKick" ? 1.8 : 0.9)
                  : 0;
                const incomingFrames = activeIncomingMove
                  ? activeIncomingMove.startup + activeIncomingMove.active - this.p2.moveTick
                  : pendingReaction && incomingMove
                    ? this.enemyDirectorTelegraphTicks + incomingMove.startup + incomingMove.active
                    : 0;
                const reactiveSideStep = Boolean(
                  this.playerStepSideWeight > 0.45
                  && incomingMove
                  && incomingMove.hitLevel !== "THROW"
                  && incomingFrames > 0
                  && incomingDistance <= incomingThreatReach
                );
                this.playerStepThreatTicks = reactiveSideStep ? Math.max(TPS_STEP_TICKS + 2, incomingFrames + TPS_STEP_TICKS + 2) : 0;
                this.playerStepThreatMoveId = reactiveSideStep ? incomingMove?.id ?? null : null;''',
          '''      const activeIncomingMove = this.p2.state === "ATTACK" ? this.p2.currentMove : null;
                const pendingMove = this.enemyDirectorPendingMove ? this.p2.definition.moves[this.enemyDirectorPendingMove] ?? null : null;
                const pendingReaction = Boolean(
                  pendingMove
                  && this.enemyDirectorTelegraphTicks > 0
                  && this.enemyDirectorTelegraphTicks <= this.enemyReactionWindowTicks()
                );
                const pendingJustStep = Boolean(
                  pendingReaction
                  && this.enemyDirectorTelegraphTicks <= this.justStepWindowTicks()
                );
                const activeJustStep = Boolean(
                  activeIncomingMove
                  && this.p2.moveTick <= activeIncomingMove.startup
                );
                const incomingMove = activeIncomingMove ?? (pendingReaction ? pendingMove : null);
                const incomingDistance = Math.hypot(this.p2.position.x - this.p1.position.x, this.p2.position.z - this.p1.position.z);
                const incomingThreatReach = incomingMove
                  ? incomingMove.reach + (this.enemyDirectorPendingMove === "dashKick" ? 1.8 : 0.9)
                  : 0;
                const incomingFrames = activeIncomingMove
                  ? activeIncomingMove.startup + activeIncomingMove.active - this.p2.moveTick
                  : pendingReaction && incomingMove
                    ? this.enemyDirectorTelegraphTicks + incomingMove.startup + incomingMove.active
                    : 0;
                const justStepSideStep = Boolean(
                  this.playerStepSideWeight > 0.45
                  && incomingMove
                  && incomingMove.hitLevel !== "THROW"
                  && incomingFrames > 0
                  && incomingDistance <= incomingThreatReach
                  && (pendingJustStep || activeJustStep)
                );
                this.playerStepThreatTicks = justStepSideStep ? Math.max(TPS_STEP_TICKS + 2, incomingFrames + TPS_STEP_TICKS + 2) : 0;
                this.playerStepThreatMoveId = justStepSideStep ? incomingMove?.id ?? null : null;
                this.playerStepThreatWasJust = justStepSideStep;''')

          replace_once(path,
          '''  private enemyReactionWindowTicks(): number {
              return TPS_REACTIVE_STEP_WINDOW_TICKS[this.difficulty];
            }

            private updateEnemy(): void {''',
          '''  private enemyReactionWindowTicks(): number {
              return TPS_REACTIVE_STEP_WINDOW_TICKS[this.difficulty];
            }

            private justStepWindowTicks(): number {
              return TPS_JUST_STEP_WINDOW_TICKS[this.difficulty];
            }

            private updateEnemy(): void {''')

          replace_once(path,
          '''    if (trackedSideEvade) {
              attacker.hitTargets.add(defender.id);
              this.playerStepThreatTicks = 0;
              this.playerStepThreatMoveId = null;
              this.playerFlankWindowTicks = Math.max(this.playerFlankWindowTicks, TPS_FLANK_WINDOW_TICKS);
              this.playerPerfectEvadeTicks = Math.max(this.playerPerfectEvadeTicks, TPS_PERFECT_EVADE_TICKS + this.p1Dna.perfectEvadeBonusTicks);
              this.playerReversalTicks = Math.max(this.playerReversalTicks, TPS_REVERSAL_TICKS);
              this.trainingProgress.perfectEvades += 1;
              this.setCombatBeat("REVERSAL");
              return;
            }''',
          '''    if (trackedSideEvade) {
              const justStepEvade = this.playerStepThreatWasJust;
              attacker.hitTargets.add(defender.id);
              this.playerStepThreatTicks = 0;
              this.playerStepThreatMoveId = null;
              this.playerStepThreatWasJust = false;
              this.playerFlankWindowTicks = Math.max(this.playerFlankWindowTicks, TPS_FLANK_WINDOW_TICKS);
              this.playerPerfectEvadeTicks = Math.max(this.playerPerfectEvadeTicks, TPS_PERFECT_EVADE_TICKS + this.p1Dna.perfectEvadeBonusTicks);
              if (justStepEvade) {
                this.playerJustStepTicks = Math.max(this.playerJustStepTicks, TPS_JUST_STEP_REWARD_TICKS);
                this.playerBreakCounterTicks = Math.max(this.playerBreakCounterTicks, TPS_BREAK_COUNTER_TICKS);
                this.setCombatBeat("JUST STEP");
              } else {
                this.playerReversalTicks = Math.max(this.playerReversalTicks, TPS_REVERSAL_TICKS);
                this.setCombatBeat("REVERSAL");
              }
              this.trainingProgress.perfectEvades += 1;
              return;
            }''')

          replace_once(path,
          '''    const stage = Math.min(2, this.playerComboStage);
              const reversalStrike = this.playerReversalTicks > 0 && this.playerStepSideWeight > 0.45;
              const flankStrike = this.playerFlankWindowTicks > 0 && this.playerStepSideWeight > 0.45;
              const interceptStrike = this.playerInterceptTicks > 0;''',
          '''    const stage = Math.min(2, this.playerComboStage);
              const breakCounterStrike = this.playerBreakCounterTicks > 0 && this.playerStepSideWeight > 0.45;
              const reversalStrike = !breakCounterStrike && this.playerReversalTicks > 0 && this.playerStepSideWeight > 0.45;
              const flankStrike = this.playerFlankWindowTicks > 0 && this.playerStepSideWeight > 0.45;
              const interceptStrike = this.playerInterceptTicks > 0;''')

          replace_once(path,
          '''      reversalOpen: reversalStrike,
                interceptOpen: interceptStrike,''',
          '''      reversalOpen: breakCounterStrike || reversalStrike,
                interceptOpen: interceptStrike,''')

          replace_once(path,
          '''    this.playerComboStage = reversalStrike ? 1 : stage + 1;''',
          '''    this.playerComboStage = breakCounterStrike || reversalStrike ? 1 : stage + 1;''')

          replace_once(path,
          '''    if (choice.beat) this.setCombatBeat(choice.beat);
              if (reversalStrike) {
                this.playerReversalSamples += 1;
                this.playerReversalTicks = 0;
              }
              if (flankStrike) {''',
          '''    if (choice.beat) this.setCombatBeat(choice.beat);
              if (breakCounterStrike) {
                this.playerBreakCounterAttackTicks = TPS_BREAK_COUNTER_ATTACK_TICKS;
                this.playerBreakCounterTicks = 0;
                this.playerJustStepTicks = 0;
                this.playerReversalSamples += 1;
                this.setCombatBeat("BREAK COUNTER");
              } else if (reversalStrike) {
                this.playerReversalSamples += 1;
                this.playerReversalTicks = 0;
              }
              if (flankStrike) {''')

          replace_once(path,
          '''    const defenderWasAttacking = defender.state === "ATTACK";
              const interceptStrike = attacker === this.p1 && defender === this.p2 && this.playerInterceptTicks > 0;
              const reversalStrike = attacker === this.p1 && this.playerFlankAttackTicks > 0 && move.hitLevel !== "THROW";
              const blocked = defenderGuarding && move.hitLevel !== "THROW" && !reversalStrike && !interceptStrike;''',
          '''    const defenderWasAttacking = defender.state === "ATTACK";
              const interceptStrike = attacker === this.p1 && defender === this.p2 && this.playerInterceptTicks > 0;
              const breakCounterStrike = attacker === this.p1 && defender === this.p2 && this.playerBreakCounterAttackTicks > 0 && move.hitLevel !== "THROW";
              const reversalStrike = !breakCounterStrike && attacker === this.p1 && this.playerFlankAttackTicks > 0 && move.hitLevel !== "THROW";
              const blocked = defenderGuarding && move.hitLevel !== "THROW" && !breakCounterStrike && !reversalStrike && !interceptStrike;''')

          replace_once(path,
          '''    const damageScale = interceptStrike
                ? 1.22 * this.p1Dna.interceptDamageScale
                : reversalStrike
                  ? 1.18 * this.p1Dna.reversalDamageScale
                  : defenderWasAttacking ? 1.12 : 1;''',
          '''    const damageScale = breakCounterStrike
                ? 1.36 * this.p1Dna.reversalDamageScale
                : interceptStrike
                  ? 1.22 * this.p1Dna.interceptDamageScale
                  : reversalStrike
                    ? 1.18 * this.p1Dna.reversalDamageScale
                    : defenderWasAttacking ? 1.12 : 1;''')

          replace_once(path,
          '''      if (interceptStrike) this.trainingProgress.intercepts += 1;
                if (reversalStrike) this.trainingProgress.punishes += 1;
              }
              const reactionStrength = blocked ? 0.72 : 1 + Math.max(0, move.power - 1) * 0.22 + (interceptStrike ? 0.24 : reversalStrike ? 0.18 : defenderWasAttacking ? 0.12 : 0);''',
          '''      if (interceptStrike) this.trainingProgress.intercepts += 1;
                if (breakCounterStrike || reversalStrike) this.trainingProgress.punishes += 1;
              }
              const reactionStrength = blocked ? 0.72 : 1 + Math.max(0, move.power - 1) * 0.22 + (breakCounterStrike ? 0.34 : interceptStrike ? 0.24 : reversalStrike ? 0.18 : defenderWasAttacking ? 0.12 : 0);''')

          replace_once(path,
          '''    if (interceptStrike) {
              this.playerInterceptTicks = 0;''',
          '''    if (breakCounterStrike) {
              this.playerBreakCounterAttackTicks = 0;
              this.setCombatBeat("BREAK COUNTER");
            } else if (interceptStrike) {
              this.playerInterceptTicks = 0;''')

          replace_once(path,
          '''    const reactionType = lethalImpact ? "FINISHER" : interceptStrike ? "INTERCEPT" : reversalStrike ? "REVERSAL" : defenderWasAttacking ? "COUNTER" : blocked ? "BLOCK" : move.power >= 1.45 ? "HEAVY" : "NORMAL";''',
          '''    const reactionType = lethalImpact ? "FINISHER" : breakCounterStrike ? "BREAK_COUNTER" : interceptStrike ? "INTERCEPT" : reversalStrike ? "REVERSAL" : defenderWasAttacking ? "COUNTER" : blocked ? "BLOCK" : move.power >= 1.45 ? "HEAVY" : "NORMAL";''')

          replace_once(path,
          '''      counter: defenderWasAttacking || interceptStrike,''',
          '''      counter: defenderWasAttacking || interceptStrike || reversalStrike || breakCounterStrike,''')

          replace_once(path,
          '''      if (lethalImpact) this.audio.combatSignature("FINAL_IMPACT", attackerDna.id);
                else if (interceptStrike) this.audio.combatSignature("INTERCEPT", attackerDna.id);
                else if (reversalStrike) this.audio.combatSignature("REVERSAL", attackerDna.id);''',
          '''      if (lethalImpact) this.audio.combatSignature("FINAL_IMPACT", attackerDna.id);
                else if (interceptStrike) this.audio.combatSignature("INTERCEPT", attackerDna.id);
                else if (breakCounterStrike || reversalStrike) this.audio.combatSignature("REVERSAL", attackerDna.id);''')

          replace_once(path,
          '''      const hapticPattern: number | number[] = lethalImpact
                ? [28, 18, 42]
                : interceptStrike
                  ? [8, 14, 16]
                  : reversalStrike
                    ? [12, 12, 22]
                    : move.power > 1.45 ? 22 : 9;''',
          '''      const hapticPattern: number | number[] = lethalImpact
                ? [28, 18, 42]
                : breakCounterStrike
                  ? [14, 10, 28]
                  : interceptStrike
                    ? [8, 14, 16]
                    : reversalStrike
                      ? [12, 12, 22]
                      : move.power > 1.45 ? 22 : 9;''')

          old_threat = '''  private enemyThreatStatus(): { windup: boolean; incoming: boolean } {
              const pending = this.enemyDirectorPendingMove !== null && this.enemyDirectorTelegraphTicks > 0;
              const pendingMove = this.enemyDirectorPendingMove ? this.p2.definition.moves[this.enemyDirectorPendingMove] ?? null : null;
              const pendingDistance = Math.hypot(
                this.p2.position.x - this.p1.position.x,
                this.p2.position.z - this.p1.position.z,
              );
              const pendingThreatReach = pendingMove
                ? pendingMove.reach + (pendingMove.id === "dashKick" ? 1.8 : 0.9)
                : 0;
              const lateWindup = Boolean(
                pending
                && pendingMove
                && this.enemyDirectorTelegraphTicks <= this.enemyReactionWindowTicks()
                && pendingDistance <= pendingThreatReach
              );
              const windup = pending && !lateWindup;
              const move = this.p2.currentMove;
              if (this.p2.state !== "ATTACK" || !move) return { windup, incoming: lateWindup };
              const distance = Math.hypot(
                this.p2.position.x - this.p1.position.x,
                this.p2.position.z - this.p1.position.z,
              );
              const canStillHit = this.p2.moveTick < move.startup + Math.max(1, move.active);
              const inThreatReach = distance <= move.reach + 0.9;
              return { windup, incoming: canStillHit && inThreatReach };
            }'''
          new_threat = '''  private enemyThreatStatus(): { windup: boolean; incoming: boolean; timing: TpsThreatTiming } {
              const pending = this.enemyDirectorPendingMove !== null && this.enemyDirectorTelegraphTicks > 0;
              const pendingMove = this.enemyDirectorPendingMove ? this.p2.definition.moves[this.enemyDirectorPendingMove] ?? null : null;
              const pendingDistance = Math.hypot(
                this.p2.position.x - this.p1.position.x,
                this.p2.position.z - this.p1.position.z,
              );
              const pendingThreatReach = pendingMove
                ? pendingMove.reach + (pendingMove.id === "dashKick" ? 1.8 : 0.9)
                : 0;
              const pendingInReach = Boolean(pendingMove && pendingDistance <= pendingThreatReach);
              const inReactionWindow = Boolean(
                pending
                && pendingMove
                && pendingInReach
                && this.enemyDirectorTelegraphTicks <= this.enemyReactionWindowTicks()
              );
              const inJustStepWindow = Boolean(
                inReactionWindow
                && this.enemyDirectorTelegraphTicks <= this.justStepWindowTicks()
              );
              const pendingTiming: TpsThreatTiming = !pending
                ? "NONE"
                : inJustStepWindow
                  ? "SLIP"
                  : inReactionWindow
                    ? "WATCH"
                    : "READ";
              const windup = pending && !inReactionWindow;
              const move = this.p2.currentMove;
              if (this.p2.state !== "ATTACK" || !move) return { windup, incoming: inReactionWindow, timing: pendingTiming };
              const distance = Math.hypot(
                this.p2.position.x - this.p1.position.x,
                this.p2.position.z - this.p1.position.z,
              );
              const canStillHit = this.p2.moveTick < move.startup + Math.max(1, move.active);
              const inThreatReach = distance <= move.reach + 0.9;
              const activeIncoming = canStillHit && inThreatReach;
              const activeTiming: TpsThreatTiming = activeIncoming
                ? this.p2.moveTick <= move.startup ? "SLIP" : "WATCH"
                : pendingTiming;
              return { windup, incoming: activeIncoming || inReactionWindow, timing: activeTiming };
            }'''
          replace_once(path, old_threat, new_threat)

          replace_once(path,
          '''    this.playerStepThreatTicks = 0;
              this.playerStepThreatMoveId = null;
              this.playerInterceptTicks = 0;
              this.playerReversalTicks = 0;
              this.combatBeatLabel = null;''',
          '''    this.playerStepThreatTicks = 0;
              this.playerStepThreatMoveId = null;
              this.playerStepThreatWasJust = false;
              this.playerInterceptTicks = 0;
              this.playerReversalTicks = 0;
              this.playerJustStepTicks = 0;
              this.playerBreakCounterTicks = 0;
              this.playerBreakCounterAttackTicks = 0;
              this.combatBeatLabel = null;''')

          replace_once(path,
          '''      tpsCue: this.finishPending || this.finished ? "NONE"
                : enemyThreat.incoming ? "INCOMING"
                  : this.playerReversalTicks > 0 || this.playerPerfectEvadeTicks > 0 ? "PUNISH"
                    : enemyThreat.windup ? "WINDUP"
                      : Math.hypot(this.p2.position.x - this.p1.position.x, this.p2.position.z - this.p1.position.z) < TPS_STRIKE_RANGE ? "RANGE" : "NONE",
              round: 1,''',
          '''      tpsCue: this.finishPending || this.finished ? "NONE"
                : this.playerBreakCounterTicks > 0 || this.playerBreakCounterAttackTicks > 0 || this.playerJustStepTicks > 0 || this.playerReversalTicks > 0 || this.playerPerfectEvadeTicks > 0 ? "PUNISH"
                  : enemyThreat.incoming ? "INCOMING"
                    : enemyThreat.windup ? "WINDUP"
                      : Math.hypot(this.p2.position.x - this.p1.position.x, this.p2.position.z - this.p1.position.z) < TPS_STRIKE_RANGE ? "RANGE" : "NONE",
              tpsTimingCue: this.finishPending || this.finished ? "NONE"
                : this.playerBreakCounterTicks > 0 || this.playerBreakCounterAttackTicks > 0 ? "BREAK_COUNTER"
                  : this.playerJustStepTicks > 0 ? "JUST_STEP"
                    : enemyThreat.timing,
              round: 1,''')

          # HUD type
          replace_once("src/game/types.ts",
          '''  tpsCue?: "INCOMING" | "WINDUP" | "PUNISH" | "RANGE" | "NONE";''',
          '''  tpsCue?: "INCOMING" | "WINDUP" | "PUNISH" | "RANGE" | "NONE";
            tpsTimingCue?: "READ" | "WATCH" | "SLIP" | "JUST_STEP" | "BREAK_COUNTER" | "NONE";''')

          # UI
          page = "app/page.tsx"
          replace_once(page,
          '''  const tpsIncoming = hud?.tpsCue === "INCOMING";
            const tpsWindup = hud?.tpsCue === "WINDUP";
            const tpsPunish = hud?.tpsCue === "PUNISH";
            const tpsIntercept = hud?.tpsCue === "WINDUP";
            const tpsStrikeRange = hud?.tpsCue === "RANGE";''',
          '''  const tpsIncoming = hud?.tpsCue === "INCOMING";
            const tpsWindup = hud?.tpsCue === "WINDUP";
            const tpsPunish = hud?.tpsCue === "PUNISH";
            const tpsRead = hud?.tpsTimingCue === "READ";
            const tpsWatch = hud?.tpsTimingCue === "WATCH";
            const tpsSlip = hud?.tpsTimingCue === "SLIP";
            const tpsJustStep = hud?.tpsTimingCue === "JUST_STEP";
            const tpsBreakCounter = hud?.tpsTimingCue === "BREAK_COUNTER";
            const tpsIntercept = tpsWindup && tpsRead;
            const tpsStrikeRange = hud?.tpsCue === "RANGE";''')

          old_buttons = '''              {pressableAction(gameRef, "guard", "Step", tpsIncoming ? "STEP NOW" : tpsWindup ? "READY" : "STEP", "guard tps-step-action " + (tpsIncoming ? "tps-threat-action" : tpsWindup ? "tps-windup-action" : ""))}
                        {pressableAction(gameRef, "punch", "Attack", tpsPunish ? "PUNISH" : tpsIntercept ? "INTERCEPT" : "ATTACK", "punch tps-attack-action " + (tpsPunish ? "tps-punish-action" : tpsIntercept ? "tps-intercept-action" : tpsStrikeRange ? "tps-ready-action" : ""))}'''
          new_buttons = '''              {pressableAction(gameRef, "guard", "Step", tpsSlip ? "SLIP NOW" : tpsWatch ? "WATCH" : tpsRead ? "READ" : tpsIncoming ? "STEP NOW" : "STEP", "guard tps-step-action " + (tpsSlip ? "tps-slip-action" : tpsWatch ? "tps-watch-action" : tpsRead ? "tps-read-action" : tpsIncoming ? "tps-threat-action" : ""))}
                        {pressableAction(gameRef, "punch", "Attack", tpsBreakCounter ? "BREAK COUNTER" : tpsPunish ? "PUNISH" : tpsIntercept ? "INTERCEPT" : "ATTACK", "punch tps-attack-action " + (tpsBreakCounter ? "tps-break-counter-action" : tpsPunish ? "tps-punish-action" : tpsIntercept ? "tps-intercept-action" : tpsStrikeRange ? "tps-ready-action" : ""))}'''
          replace_once(page, old_buttons, new_buttons)

          replace_once(page,
          '''          <div className="input-hint tps-input-hint"><b>ATTACK</b> AUTO PUNCH / KICK <span>•</span> <b>WINDUP</b> STEP OR INTERCEPT <span>•</span> <b>PERFECT STEP</b> → REVERSAL <span>•</span> FORWARD STEP → ATTACK = DASH</div>''',
          '''          <div className="input-hint tps-input-hint"><b>READ</b> → WATCH → <b>SLIP NOW</b> <span>•</span> JUST STEP → <b>BREAK COUNTER</b> <span>•</span> EARLY STEP = EVADE <span>•</span> READ + ATTACK = INTERCEPT</div>''')

          # CSS appended once.
          css = Path("app/playtest-polish.css")
          css_text = css.read_text()
          marker = "/* JUST STEP / BREAK COUNTER timing pass */"
          if marker not in css_text:
              css.write_text(css_text + '''\n\n/* JUST STEP / BREAK COUNTER timing pass */
          .action-buttons .tps-read-action {
            outline: 2px solid rgba(112, 226, 255, .62);
            outline-offset: 3px;
            color: #c9f5ff;
            box-shadow: 0 0 18px rgba(76, 215, 255, .18), inset 0 0 14px rgba(112, 226, 255, .07);
          }
          .action-buttons .tps-watch-action {
            outline: 2px solid rgba(255, 196, 90, .9);
            outline-offset: 3px;
            color: #ffe7ad;
            box-shadow: 0 0 24px rgba(255, 184, 76, .32), inset 0 0 16px rgba(255, 207, 100, .09);
          }
          .action-buttons .tps-slip-action {
            outline: 3px solid rgba(255, 88, 117, .98);
            outline-offset: 3px;
            color: #fff8fb;
            box-shadow: 0 0 0 3px rgba(255, 80, 111, .13), 0 0 34px rgba(255, 60, 94, .5), inset 0 0 20px rgba(255, 112, 137, .14);
            animation: tps-slip-pulse .25s ease-in-out infinite alternate;
          }
          .action-buttons .tps-break-counter-action {
            outline: 3px solid rgba(255, 226, 104, 1);
            outline-offset: 4px;
            color: #fffbdc;
            box-shadow: 0 0 0 3px rgba(112, 226, 255, .18), 0 0 38px rgba(255, 216, 86, .52), inset 0 0 20px rgba(112, 226, 255, .13);
            animation: tps-break-counter-pulse .3s ease-in-out infinite alternate;
          }
          @keyframes tps-slip-pulse {
            from { filter: brightness(1); transform: scale(1); }
            to { filter: brightness(1.34); transform: scale(1.065); }
          }
          @keyframes tps-break-counter-pulse {
            from { filter: brightness(1); }
            to { filter: brightness(1.28); }
          }
          @media (orientation: landscape) and (max-height: 430px) {
            .action-buttons .tps-step-action.tps-slip-action { font-size: 8px; letter-spacing: 0; }
            .action-buttons .tps-attack-action.tps-break-counter-action { font-size: 7px; letter-spacing: -.01em; }
          }
          ''')

          # Static regression expectations.
          tests = "tests/tps-mode.test.ts"
          t = Path(tests).read_text()
          t = t.replace('''assert.match(page, /"guard", "Step", tpsIncoming \\? "STEP NOW" : tpsWindup \\? "READY" : "STEP"/);''', '''assert.match(page, /tpsSlip \\? "SLIP NOW"/);''')
          t = t.replace('''assert.match(page, /"punch", "Attack", tpsPunish \\? "PUNISH" : tpsIntercept \\? "INTERCEPT" : "ATTACK"/);''', '''assert.match(page, /tpsBreakCounter \\? "BREAK COUNTER"/);''')
          t = t.replace('''assert.match(page, /STEP OR INTERCEPT/);''', '''assert.match(page, /READ \\+ ATTACK = INTERCEPT/);''')
          t = t.replace('''assert.match(page, /→ REVERSAL/);''', '''assert.match(page, /BREAK COUNTER/);''')
          t = t.replace('''assert.match(page, /tpsIncoming \\? "STEP NOW" : tpsWindup \\? "READY" : "STEP"/);''', '''assert.match(page, /tpsWatch \\? "WATCH"/);\n  assert.match(page, /tpsRead \\? "READ"/);''')
          t = t.replace('''assert.match(page, /tpsPunish \\? "PUNISH" : tpsIntercept \\? "INTERCEPT" : "ATTACK"/);''', '''assert.match(page, /tpsBreakCounter \\? "BREAK COUNTER"/);''')
          extra = r'''

          test("TPS timing mastery separates WATCH from JUST STEP and upgrades the precise punish to BREAK COUNTER", async () => {
            const [source, page, css, types] = await Promise.all([
              readFile(new URL("../src/game/tps-game-base.ts", import.meta.url), "utf8"),
              readFile(new URL("../app/page.tsx", import.meta.url), "utf8"),
              readFile(new URL("../app/playtest-polish.css", import.meta.url), "utf8"),
              readFile(new URL("../src/game/types.ts", import.meta.url), "utf8"),
            ]);
            assert.match(source, /TPS_JUST_STEP_WINDOW_TICKS/);
            assert.match(source, /NORMAL: 6/);
            assert.match(source, /playerStepThreatWasJust/);
            assert.match(source, /playerBreakCounterTicks/);
            assert.match(source, /playerBreakCounterAttackTicks/);
            assert.match(source, /pendingJustStep/);
            assert.match(source, /this\.enemyDirectorTelegraphTicks <= this\.justStepWindowTicks\(\)/);
            assert.match(source, /setCombatBeat\("JUST STEP"\)/);
            assert.match(source, /setCombatBeat\("BREAK COUNTER"\)/);
            assert.match(source, /1\.36 \* this\.p1Dna\.reversalDamageScale/);
            assert.match(source, /"BREAK_COUNTER"/);
            assert.match(source, /timing: TpsThreatTiming/);
            assert.match(types, /tpsTimingCue\?: "READ" \| "WATCH" \| "SLIP" \| "JUST_STEP" \| "BREAK_COUNTER" \| "NONE"/);
            assert.match(page, /tpsSlip \? "SLIP NOW"/);
            assert.match(page, /tpsBreakCounter \? "BREAK COUNTER"/);
            assert.match(page, /EARLY STEP = EVADE/);
            assert.match(css, /tps-slip-action/);
            assert.match(css, /tps-break-counter-action/);
          });
          '''
          if 'TPS timing mastery separates WATCH from JUST STEP' not in t:
              t += extra
          Path(tests).write_text(t)

          # Reactive cue browser audit now exposes the three timing reads.
          reactive = Path("scripts/capture-tps-reactive-cues.mjs")
          r = reactive.read_text()
          r = r.replace('''? gameState.threat.windup && !gameState.threat.incoming && ui.stepText === "READY" && ui.stepClass.includes("tps-windup-action")''', '''? gameState.threat.windup && !gameState.threat.incoming && gameState.threat.timing === "READ" && ui.stepText === "READ" && ui.stepClass.includes("tps-read-action")''')
          r = r.replace('''? gameState.threat.incoming && ui.stepText === "STEP NOW" && ui.stepClass.includes("tps-threat-action")''', '''? gameState.threat.incoming && gameState.threat.timing === "SLIP" && ui.stepText === "SLIP NOW" && ui.stepClass.includes("tps-slip-action")''')
          reactive.write_text(r)

          # Upgrade the deterministic combat audit: an early WATCH STEP must not earn
          # the reward; a late SLIP STEP must earn JUST STEP and BREAK COUNTER.
          audit = Path("scripts/capture-tps-combat-v2-audit.mjs")
          a = audit.read_text()
          a = a.replace('''  game.playerReversalTicks = 0;\n  game.playerComboStage = 0;''', '''  game.playerReversalTicks = 0;\n  game.playerStepThreatWasJust = false;\n  game.playerJustStepTicks = 0;\n  game.playerBreakCounterTicks = 0;\n  game.playerBreakCounterAttackTicks = 0;\n  game.playerComboStage = 0;''')
          a = a.replace("game.enemyDirectorTelegraphTicks = 12;", "game.enemyDirectorTelegraphTicks = 6;", 1)
          a = a.replace("game.p2.visual.root.userData.tpsEnemyTelegraphProgress = 1 - 12 / 18;", "game.p2.visual.root.userData.tpsEnemyTelegraphProgress = 1 - 6 / 18;", 1)
          a = a.replace('''      reversalTicks: game.playerReversalTicks,\n      beat: game.combatBeatLabel,''', '''      reversalTicks: game.playerReversalTicks,\n      justStepTicks: game.playerJustStepTicks,\n      breakCounterTicks: game.playerBreakCounterTicks,\n      timing: game.enemyThreatStatus().timing,\n      beat: game.combatBeatLabel,''', 1)
          a = a.replace('''if (!reactableStep?.threatBefore?.incoming || reactableStep?.threatBefore?.windup || reactableStep?.trackedBeforeAttack <= 0 || reactableStep?.perfectEvades < 1 || reactableStep?.p1Health < 100)''', '''if (!reactableStep?.threatBefore?.incoming || reactableStep?.threatBefore?.timing !== 'SLIP' || reactableStep?.trackedBeforeAttack <= 0 || reactableStep?.perfectEvades < 1 || reactableStep?.breakCounterTicks <= 0 || reactableStep?.beat !== 'JUST STEP' || reactableStep?.p1Health < 100)''')
          a = a.replace("while (attackSteps < 55 && game.p2.visual.root.userData.tpsReactionType !== 'REVERSAL')", "while (attackSteps < 55 && game.p2.visual.root.userData.tpsReactionType !== 'BREAK_COUNTER')")
          a = a.replace("reversal?.reaction !== 'REVERSAL'", "reversal?.reaction !== 'BREAK_COUNTER'")
          a = a.replace('''  const report = { viewport, adaptationProbe, intercept, reversal, finalImpact, trainingProbe, practiceReset, trainingLayout, ui: {''', '''  const report = { viewport, adaptationProbe, justStep: reactableStep, intercept, breakCounter: reversal, finalImpact, trainingProbe, practiceReset, trainingLayout, ui: {''')
          audit.write_text(a)

          # Verify every intended marker before running tests.
          checks = {
              "src/game/tps-game-base.ts": ["TPS_JUST_STEP_WINDOW_TICKS", "JUST STEP", "BREAK_COUNTER", "tpsTimingCue"],
              "app/page.tsx": ["SLIP NOW", "BREAK COUNTER", "EARLY STEP = EVADE"],
              "tests/tps-mode.test.ts": ["TPS timing mastery separates WATCH from JUST STEP"],
              "scripts/capture-tps-combat-v2-audit.mjs": ["breakCounter: reversal", "justStep: reactableStep"],
          }
          for f, markers in checks.items():
              text = Path(f).read_text()
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f"missing marker {marker!r} in {f}")
          PY
      - name: TPS static regression
        run: npm run test:rules:tps
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit implementation and remove helper
        run: |
          rm .github/workflows/just-step-break-counter-impl.yml
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/game/tps-game-base.ts src/game/types.ts app/page.tsx app/playtest-polish.css tests/tps-mode.test.ts scripts/capture-tps-reactive-cues.mjs scripts/capture-tps-combat-v2-audit.mjs .github/workflows/just-step-break-counter-impl.yml
          git commit -m "Implement JUST STEP and BREAK COUNTER timing"
          git push origin HEAD:just-step-break-counter-v1
