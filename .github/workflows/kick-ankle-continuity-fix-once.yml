name: Apply kick ankle continuity fix once

on:
  push:
    branches: [kick-ankle-anatomy-v8]
    paths:
      - .github/workflows/kick-ankle-continuity-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kick-ankle-anatomy-v8
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply staged ankle patch
        run: python tools/patch-kick-ankle.py
      - name: Validate ankle anatomy on both real skeletons
        run: node --import tsx --test tests/combat-motion.test.ts tests/kick-ankle.test.ts
      - run: npm run test:ci:tps
      - run: npm run lint
      - run: npm run build
      - name: Commit verified fix and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kick-ankle-continuity-fix-once.yml tools/patch-kick-ankle.py
          git add src/game/combat-motion-authoring.ts tests/kick-ankle.test.ts
          git commit -m "Fix kick ankle twist continuity"
          git push origin HEAD:kick-ankle-anatomy-v8
