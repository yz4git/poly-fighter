name: Kick v4 Verified Artifact Commit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-reference-pose-v4.yml'

permissions:
  contents: write
  actions: read

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9934439225/zip" \
            -o /tmp/kick-product.zip
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9934577534/zip" \
            -o /tmp/kick-source.zip
          mkdir -p /tmp/kick-product /tmp/kick-source-zip /tmp/kick-source
          unzip -q /tmp/kick-product.zip -d /tmp/kick-product
          unzip -q /tmp/kick-source.zip -d /tmp/kick-source-zip
          tar -xzf /tmp/kick-source-zip/kick-v4-source-bundle.tar.gz -C /tmp/kick-source

      - name: Install exact verified product files
        run: |
          set -euo pipefail
          cp /tmp/kick-source/tools/blender/build-fight-motion-foundry-v2-kicks.py tools/blender/build-fight-motion-foundry-v2-kicks.py
          cp /tmp/kick-source/tests/blender-motion-foundry-v2-kicks.test.mjs tests/blender-motion-foundry-v2-kicks.test.mjs
          cp /tmp/kick-source/scripts/capture-model-view-audit.mjs scripts/capture-model-view-audit.mjs
          cp /tmp/kick-source/docs/KICK_REFERENCE_POSE_V4.md docs/KICK_REFERENCE_POSE_V4.md
          cp /tmp/kick-source/public/models/quaternius/blender-kicks-core.generator.sha256 public/models/quaternius/blender-kicks-core.generator.sha256
          cp /tmp/kick-product/kick-reference-v4-build/blender-kicks-core.glb public/models/quaternius/blender-kicks-core.glb
          cp /tmp/kick-product/kick-reference-v4-build/blender-kicks-core.metrics.json public/models/quaternius/blender-kicks-core.metrics.json

          test "$(sha256sum public/models/quaternius/blender-kicks-core.glb | awk '{print $1}')" = '21849625b10a2b24e19cb9623e55aacfdae49cd7b45eade1a1585a2642e692a8'
          test "$(sha256sum public/models/quaternius/blender-kicks-core.metrics.json | awk '{print $1}')" = '5ebbdd6da366e6f001554c53b521fe2fbf5b6d460e402f0e46fc6adea40788ea'
          grep -q 'REFERENCE_POSE_V4' public/models/quaternius/blender-kicks-core.metrics.json
          grep -q 'FIVE_KEY_REFERENCE_V4' public/models/quaternius/blender-kicks-core.metrics.json
          grep -q 'support_yaw' tools/blender/build-fight-motion-foundry-v2-kicks.py
          grep -q 'REFERENCE_POSE_V4' tools/blender/build-fight-motion-foundry-v2-kicks.py

      - name: Commit verified v4 to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/blender/build-fight-motion-foundry-v2-kicks.py \
            tests/blender-motion-foundry-v2-kicks.test.mjs \
            scripts/capture-model-view-audit.mjs \
            docs/KICK_REFERENCE_POSE_V4.md \
            public/models/quaternius/blender-kicks-core.glb \
            public/models/quaternius/blender-kicks-core.metrics.json \
            public/models/quaternius/blender-kicks-core.generator.sha256
          git diff --cached --quiet && { echo 'Verified v4 already present'; exit 0; }
          git commit -m 'Reconstruct kicks from five-pose motion references'
          git push origin HEAD:main
