name: POLY FIGHTER Model View WebGL audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/**
      - src/components/model-viewer-panel.tsx
      - src/game/visual-*.ts
      - src/game/model-viewer-motion.ts
      - src/game/presentation-animation.ts
      - src/game/tps-impact-followthrough.ts
      - src/game/tps-counterattack-handoff.ts
      - src/game/quaternius-character-graphics-v2.ts
      - src/game/quaternius-graphics-polish.ts
      - public/models/**
      - package-lock.json
      - scripts/capture-model-view-audit.mjs
      - .github/workflows/v10-visual-audit.yml
  pull_request:
    branches: [main]
    paths:
      - app/**
      - src/components/model-viewer-panel.tsx
      - src/game/visual-*.ts
      - src/game/model-viewer-motion.ts
      - src/game/presentation-animation.ts
      - src/game/tps-impact-followthrough.ts
      - src/game/tps-counterattack-handoff.ts
      - src/game/quaternius-character-graphics-v2.ts
      - src/game/quaternius-graphics-polish.ts
      - public/models/**
      - package-lock.json
      - scripts/capture-model-view-audit.mjs
      - .github/workflows/v10-visual-audit.yml

permissions:
  contents: read

concurrency:
  group: model-view-webgl-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build production preview
        run: npm run build
      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-server.log 2>&1 &
          echo $! > /tmp/poly-fighter-server.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/poly-fighter-server.log
          exit 1
      - name: Verify committed runtime models are served
        run: |
          curl --fail --silent http://127.0.0.1:3000/models/sera-blender-runtime.glb -o /tmp/sera-blender-runtime.glb
          test -s /tmp/sera-blender-runtime.glb
          curl --fail --silent http://127.0.0.1:3000/models/sera-v10.glb -o /tmp/sera-v10.glb
          test -s /tmp/sera-v10.glb
      - name: Capture title Model View with ChromeDriver
        run: |
          mkdir -p artifacts/visual-audit
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" MODEL_VIEW_AUDIT_DIR="artifacts/visual-audit" node scripts/capture-model-view-audit.mjs
          for fighter in sera kairo; do
            test -s "artifacts/visual-audit/model-view-${fighter}.png"
            file "artifacts/visual-audit/model-view-${fighter}.png" | grep -q "PNG image data"
          done
          test -s artifacts/visual-audit/model-view-state.json
          cp /tmp/poly-fighter-server.log artifacts/visual-audit/server.log
      - uses: actions/upload-artifact@v4
        with:
          name: poly-fighter-model-view-webgl-audit
          path: artifacts/visual-audit
          if-no-files-found: error
          retention-days: 7
