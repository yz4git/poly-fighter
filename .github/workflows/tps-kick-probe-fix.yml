name: Fix TPS kick contact probe

on:
  push:
    branches: [tps-continuous-play-polish-v1]
    paths:
      - .github/workflows/tps-kick-probe-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Make kick probe deterministic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/capture-tps-visual-audit.mjs')
          s = p.read_text()
          s = s.replace(
            "  // Force the ATTACK button into its far-range kick branch and validate the real\n  // contact frame rather than only the isolated motion-library pose.",
            "  // Exercise an explicit gameplay kick through the real combat step/resolve path.\n  // Context ATTACK selection is covered elsewhere; this probe isolates kick contact readability."
          )
          old = """    game.p1.position.set(0, 0, 0.94);\n    game.p2.position.set(0, 0, -0.72);\n    game.updateEnemy = () => {\n      game.p2.velocity.set(0, 0, 0);\n      if (game.p2.state !== 'HIT') game.p2.state = 'IDLE';\n    };\n    for (let index = 0; index < 24; index += 1) game.updateCamera(1 / 60);\n    game.press('punch', 'tps-audit-kick-contact');\n    game.step();\n    const moveId = game.p1.currentMove?.id ?? null;\n    game.release('punch', 'tps-audit-kick-contact');\n    let steps = 1;"""
          new = """    game.playerComboStage = 0;\n    game.playerComboGraceTicks = 0;\n    game.playerAttackQueued = false;\n    game.playerFlankWindowTicks = 0;\n    game.playerFlankAttackTicks = 0;\n    game.p1.position.set(0, 0, 0.94);\n    game.p2.position.set(0, 0, -0.72);\n    game.updateEnemy = () => {\n      game.p2.velocity.set(0, 0, 0);\n      if (game.p2.state !== 'HIT') game.p2.state = 'IDLE';\n    };\n    for (let index = 0; index < 24; index += 1) game.updateCamera(1 / 60);\n    if (!game.p1.beginMove('kick')) throw new Error('TPS kick probe could not start kick');\n    game.step();\n    const moveId = game.p1.currentMove?.id ?? null;\n    let steps = 1;"""
          assert old in s
          p.write_text(s.replace(old, new, 1))
          PY
          node --check scripts/capture-tps-visual-audit.mjs
          git diff --check
      - name: Push deterministic kick probe
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add scripts/capture-tps-visual-audit.mjs
          git commit -m "Make TPS kick contact audit deterministic"
          git push
