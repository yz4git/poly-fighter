name: Align TPS audit entry routes

on:
  push:
    branches: [tps-main-mode-v1]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tps-main-mode-v1
      - name: Align active audit scripts with TPS-first entry flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
            'scripts/capture-motion-readability-audit.mjs': [
              ('clickButton(sessionId, "TPS LOCK-ON BATTLE")', 'clickButton(sessionId, "START FIGHT")'),
              ('clickButton(sessionId, "ENGAGE TPS")', 'clickButton(sessionId, "ENGAGE")'),
            ],
            'scripts/capture-motion-intent-audit.mjs': [
              ('clickButton(sessionId, "TPS LOCK-ON BATTLE")', 'clickButton(sessionId, "START FIGHT")'),
              ('clickButton(sessionId, "ENGAGE TPS")', 'clickButton(sessionId, "ENGAGE")'),
            ],
            'scripts/touch-input-safety-audit.mjs': [
              ('clickButton(sessionId, "TPS LOCK-ON BATTLE")', 'clickButton(sessionId, "START FIGHT")'),
              ('clickButton(sessionId, "ENGAGE TPS")', 'clickButton(sessionId, "ENGAGE")'),
            ],
            'scripts/capture-model-view-audit.mjs': [
              ("document.body.innerText.includes('START MATCH')", "document.body.innerText.includes('START FIGHT')"),
            ],
          }
          for name, pairs in replacements.items():
            path = Path(name)
            text = path.read_text()
            for old, new in pairs:
              count = text.count(old)
              if count != 1:
                raise SystemExit(f'{name}: expected one {old!r}, got {count}')
              text = text.replace(old, new, 1)
            path.write_text(text)
          PY
          node --check scripts/capture-motion-readability-audit.mjs
          node --check scripts/capture-motion-intent-audit.mjs
          node --check scripts/touch-input-safety-audit.mjs
          node --check scripts/capture-model-view-audit.mjs
          git diff --check
      - name: Commit audit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-motion-readability-audit.mjs scripts/capture-motion-intent-audit.mjs scripts/touch-input-safety-audit.mjs scripts/capture-model-view-audit.mjs
          git commit -m "Align visual audits with TPS-first flow"
          git push origin HEAD:tps-main-mode-v1
