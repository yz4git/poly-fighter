name: Temporary V6 kick contact phase sync
# Final Rising chest alignment after last TPS residual.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-v6-kick-contact-sync.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-foundry-v6-reference-driven
          fetch-depth: 0
      - name: Apply final V6 Rising chest alignment
        run: |
          git fetch origin main
          git show origin/main:.github/tmp/v6-kick-contact-sync.py > /tmp/v6-kick-contact-sync.py
          python3 /tmp/v6-kick-contact-sync.py
          git diff --check
          grep -q 'LOW_KICK_TORSO_DELTA_RETENTION' tools/blender/motion_foundry_v6_mocap.py
          grep -q 'RISING_KICK_TORSO_DELTA_RETENTION' tools/blender/motion_foundry_v6_mocap.py
          grep -q '"spine_01": 0.17' tools/blender/motion_foundry_v6_mocap.py
          grep -q '"spine_02": 0.15' tools/blender/motion_foundry_v6_mocap.py
          grep -q '"neck_01": 0.45' tools/blender/motion_foundry_v6_mocap.py
          grep -q 'V6_ACTIVE_CONTACT_SYNC' src/game/visual-quaternius-runtime.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run kick contract and runtime tests
        run: |
          node --test tests/blender-motion-foundry-v2-kicks.test.mjs
          npm run test:ci:tps
      - name: Commit stabilization to PR branch
        run: |
          git config user.name yz4git
          git config user.email 65384484+yz4git@users.noreply.github.com
          git add tools/blender/motion_foundry_v6_mocap.py tests/blender-motion-foundry-v2-kicks.test.mjs
          git commit -m 'Finalize rising kick chest retention'
          git push origin HEAD:motion-foundry-v6-reference-driven
