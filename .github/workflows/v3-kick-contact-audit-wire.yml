name: Wire v3 kick contact audit

on:
  push:
    branches:
      - improve/procedural-v3-kick-extension-20260902
    paths:
      - .github/workflows/v3-kick-contact-audit-wire.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/procedural-v3-kick-extension-20260902
          fetch-depth: 0
      - name: Wire telemetry into motion readability audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/capture-motion-readability-audit.mjs')
          text = p.read_text()
          old = '''        comPolicy: root.userData.motionExpansionComPolicy ?? null,\n        motionDna: root.userData.motionExpansionMotionDna ?? null,\n      };'''
          new = '''        comPolicy: root.userData.motionExpansionComPolicy ?? null,\n        motionDna: root.userData.motionExpansionMotionDna ?? null,\n        visualReadabilityVersion: root.userData.motionExpansionVisualReadabilityVersion ?? null,\n        kickContactSolver: root.userData.motionExpansionKickContactSolver ?? null,\n        strikeContactError: root.userData.motionExpansionStrikeContactError ?? null,\n        strikeContactBlend: root.userData.motionExpansionStrikeContactBlend ?? null,\n      };'''
          if text.count(old) != 1:
              raise SystemExit('result telemetry anchor mismatch')
          text = text.replace(old, new)
          old = '''    if (result.motionDna !== "KAIRO_POWER") {\n      throw new Error(`KAIRO motion DNA was not active for ${moveId}: ${JSON.stringify(result)}`);\n    }'''
          new = '''    if (result.motionDna !== "KAIRO_POWER") {\n      throw new Error(`KAIRO motion DNA was not active for ${moveId}: ${JSON.stringify(result)}`);\n    }\n    if (result.visualReadabilityVersion !== "PROCEDURAL_FIGHT_V3_READABILITY_3") {\n      throw new Error(`Motion ${moveId} did not publish v3.2 readability telemetry: ${JSON.stringify(result)}`);\n    }\n    if (["kick", "lowKick", "risingKick", "dashKick"].includes(moveId)) {\n      if (result.kickContactSolver !== "KICK_CONTACT_SOLVER_V1"\n        || !Number.isFinite(result.strikeContactError)\n        || !Number.isFinite(result.strikeContactBlend)\n        || result.strikeContactBlend < 0.80) {\n        throw new Error(`Motion ${moveId} did not publish a valid v3.2 kick contact solve: ${JSON.stringify(result)}`);\n      }\n    }'''
          if text.count(old) != 1:
              raise SystemExit('validation telemetry anchor mismatch')
          p.write_text(text.replace(old, new))
          PY
      - name: Verify source and lint
        run: |
          npm ci --ignore-scripts
          node --import tsx --test tests/motion-expansion.test.ts
          npm run lint
      - name: Commit audit wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/capture-motion-readability-audit.mjs
          git diff --cached --check
          git commit -m "Audit v3 kick contact solver telemetry"
          git push origin HEAD:improve/procedural-v3-kick-extension-20260902
