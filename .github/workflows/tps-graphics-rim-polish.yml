name: TPS graphics rim polish

on:
  push:
    paths:
      - '.github/workflows/tps-graphics-rim-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Refine TPS rim and impact lighting
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/game/tps-graphics.ts')
          s = p.read_text()
          reps = [
            ('private readonly p1Rim = new THREE.PointLight(0xff476a, 0.9, 4.6, 2);', 'private readonly p1Rim = new THREE.PointLight(0xff9aad, 0.52, 5.4, 2);'),
            ('private readonly p2Rim = new THREE.PointLight(0x54caff, 0.9, 4.6, 2);', 'private readonly p2Rim = new THREE.PointLight(0xa6e4ff, 0.52, 5.4, 2);'),
            ('this.p1Rim.intensity = low ? 0.46 : 0.9;\n    this.p2Rim.intensity = low ? 0.46 : 0.9;', 'this.p1Rim.intensity = low ? 0.24 : 0.52;\n    this.p2Rim.intensity = low ? 0.24 : 0.52;'),
            ('this.impactLight.intensity = this.quality === "LOW" ? 1.1 : 3.8 + strength * 1.4;', 'this.impactLight.intensity = this.quality === "LOW" ? 0.72 : 2.25 + strength * 0.78;'),
            ('    this.p1Rim.position.set(p1.position.x - 0.15, 1.28, p1.position.z + 0.15);\n    this.p2Rim.position.set(p2.position.x + 0.15, 1.28, p2.position.z - 0.15);\n    const rimPulse = 0.88 + Math.sin(time * 4.4) * 0.08;\n    if (this.quality !== "LOW") {\n      this.p1Rim.intensity = (p1.state === "ATTACK" ? 1.35 : 0.82) * rimPulse;\n      this.p2Rim.intensity = (p2.state === "ATTACK" ? 1.35 : 0.82) * rimPulse;\n    }', '    const fighterForward = p2.position.clone().sub(p1.position).setY(0);\n    if (fighterForward.lengthSq() < 1e-8) fighterForward.set(0, 0, 1);\n    else fighterForward.normalize();\n    const fighterRight = new THREE.Vector3(-fighterForward.z, 0, fighterForward.x);\n    this.p1Rim.position.copy(p1.position).addScaledVector(fighterForward, -1.3).addScaledVector(fighterRight, 0.72);\n    this.p1Rim.position.y = 1.72;\n    this.p2Rim.position.copy(p2.position).addScaledVector(fighterForward, 1.3).addScaledVector(fighterRight, -0.72);\n    this.p2Rim.position.y = 1.72;\n    const rimPulse = 0.9 + Math.sin(time * 4.4) * 0.06;\n    if (this.quality !== "LOW") {\n      this.p1Rim.intensity = (p1.state === "ATTACK" ? 0.78 : 0.48) * rimPulse;\n      this.p2Rim.intensity = (p2.state === "ATTACK" ? 0.78 : 0.48) * rimPulse;\n    }'),
          ]
          for old, new in reps:
            if old not in s:
              raise SystemExit('missing rim polish anchor: ' + old[:100])
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - run: npm run test:ci:tps
      - run: npm run lint
      - run: npm run build
      - name: Publish validated rim polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/tps-graphics.ts
          git commit -m "Polish TPS rim and impact lighting"
          git push
