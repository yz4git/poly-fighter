name: Fix TPS defender guard wiring

on:
  push:
    paths:
      - ".github/workflows/tps-guard-fix.yml"
      - "scripts/apply-tps-guard-fix.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: node scripts/apply-tps-guard-fix.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run test:rules
      - run: npm run build
      - run: npm run lint
      - name: Publish validated guard fix
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/tps-game.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix TPS defender guard wiring"
          git push origin HEAD:main
