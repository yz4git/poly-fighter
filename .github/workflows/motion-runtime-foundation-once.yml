name: POLY FIGHTER Motion Runtime Foundation Once

on:
  push:
    branches: [motion-runtime-foundation-v1]
    paths:
      - scripts/apply-motion-runtime-foundation.mjs
      - .github/workflows/motion-runtime-foundation-once.yml

permissions:
  contents: write

concurrency:
  group: motion-runtime-foundation-once
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-runtime-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply mechanical runtime migration
        run: node scripts/apply-motion-runtime-foundation.mjs
      - name: Validate unified timeline and motion contracts
        run: node --import tsx --test tests/combat-motion-timeline.test.ts tests/combat-motion.test.ts tests/kick-ankle.test.ts
      - name: Static regression suite
        run: npm run test:ci:static
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit validated runtime foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-motion-runtime-foundation.mjs .github/workflows/motion-runtime-foundation-once.yml
          git add src/game/visual-quaternius-runtime.ts tests/blender-motion-foundry-v2-kicks.test.mjs tests/motion-expansion.test.ts tests/quaternius-model-skin.test.ts
          git commit -m "Unify combat motion runtime ownership"
          git push origin HEAD:motion-runtime-foundation-v1
