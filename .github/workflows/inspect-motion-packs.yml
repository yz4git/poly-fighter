name: Inspect bundled motion packs

on:
  push:
    branches:
      - improve/procedural-v4-kinetic-chain-20260902
    paths:
      - .github/workflows/inspect-motion-packs.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print GLB animation names
        shell: python
        run: |
          import json, struct
          from pathlib import Path

          for path in [
              Path('public/models/quaternius/ual-fight-core.glb'),
              Path('public/models/quaternius/ual2-fight-core.glb'),
              Path('public/models/quaternius/procedural-fight-core.glb'),
          ]:
              data = path.read_bytes()
              magic, version, total = struct.unpack_from('<4sII', data, 0)
              assert magic == b'glTF' and version == 2
              offset = 12
              gltf = None
              while offset < total:
                  length, chunk_type = struct.unpack_from('<II', data, offset)
                  offset += 8
                  chunk = data[offset:offset+length]
                  offset += length
                  if chunk_type == 0x4E4F534A:
                      gltf = json.loads(chunk.rstrip(b'\x00 \t\r\n'))
                      break
              assert gltf is not None
              names = [a.get('name', '<unnamed>') for a in gltf.get('animations', [])]
              print(f'=== {path.name} ({len(names)}) ===')
              for name in names:
                  print(name)
