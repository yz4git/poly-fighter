name: POLY FIGHTER Blender Motion Foundry v2 Cross

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/blender/build-fight-motion-foundry-v1.py
      - tools/blender/motion_foundry_v2_rig.py
      - tools/blender/build-fight-motion-foundry-v2-cross.py
      - tools/blender/build-fight-motion-foundry-v2-strikes.py
      - scripts/apply-blender-motion-foundry-v2.mjs
      - scripts/apply-blender-motion-foundry-v2-shared-strikes.mjs
      - tests/blender-motion-foundry-v2.test.mjs
      - tests/quaternius-model-skin.test.ts
      - tests/model-viewer.test.mjs
      - src/game/visual-quaternius-runtime.ts
      - src/game/model-viewer-motion.ts
      - scripts/capture-model-view-audit.mjs
      - public/models/quaternius/blender-cross-core.glb
      - public/models/quaternius/blender-cross-core.metrics.json
      - public/models/quaternius/blender-cross-core.generator.sha256
      - public/models/quaternius/blender-strikes-core.glb
      - public/models/quaternius/blender-strikes-core.metrics.json
      - public/models/quaternius/blender-strikes-core.generator.sha256
      - .github/workflows/blender-motion-foundry-v2.yml
  workflow_dispatch:

jobs:
  build-cross:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Check whether Blender Cross artifact is current
        id: foundry
        shell: bash
        run: |
          set -euo pipefail
          script_hash="$(cat tools/blender/build-fight-motion-foundry-v1.py tools/blender/motion_foundry_v2_rig.py tools/blender/build-fight-motion-foundry-v2-cross.py | sha256sum | awk '{print $1}')"
          echo "script_hash=$script_hash" >> "$GITHUB_OUTPUT"
          if [ -s public/models/quaternius/blender-cross-core.glb ] \
            && [ -s public/models/quaternius/blender-cross-core.generator.sha256 ] \
            && grep -qx "$script_hash" public/models/quaternius/blender-cross-core.generator.sha256; then
            echo "needs_generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch pinned full UAL authoring source
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          set -euxo pipefail
          mkdir -p .tmp-quaternius
          BASE_PIN=aa02a4e6d8337a0604d2da131bcbbeb1f01badf0
          BASE_URL=https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/$BASE_PIN/public/assets/vendor/quaternius
          curl -L --fail --retry 3 "$BASE_URL/universal-animation-library.glb" -o .tmp-quaternius/ual1-full.glb
          echo '4c748767741a3e495d89667b9a218b690ba9810b9517a12e960780e3ca72c4e9  .tmp-quaternius/ual1-full.glb' | sha256sum -c -

      - name: Install Blender
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri xvfb
          blender --version | head -n 2
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          blender --background --python-use-system-env --python-expr "import numpy; print('BLENDER_NUMPY', numpy.__version__)"

      - name: Generate BF_Cross_R in Blender
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          set -euo pipefail
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          out="artifacts/blender-motion-foundry-v2"
          mkdir -p "$out"
          xvfb-run -a blender --background \
            --python-use-system-env \
            --python-exit-code 1 \
            --python tools/blender/build-fight-motion-foundry-v2-cross.py \
            -- \
            --source .tmp-quaternius/ual1-full.glb \
            --output-dir "$out"
          test -s "$out/blender-cross-core.glb"
          test -s "$out/blender-cross-core.metrics.json"
          test -s "$out/blender-cross-core-v2.blend"
          cat "$out/blender-cross-core.metrics.json"

      - name: Validate generated Cross metrics
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('artifacts/blender-motion-foundry-v2/blender-cross-core.metrics.json').read_text())
          assert m['version'] == 'BLENDER_MOTION_FOUNDRY_V2_CROSS', m
          assert m['action'] == 'BF_Cross_R', m
          assert m['sharedRig'] == 'MOTION_FOUNDRY_V2_SHARED_STRIKE_RIG', m
          assert m['strikeHandTravel'] > 0.08, m
          assert m['supportFootLockMaxDrift'] < 0.01, m
          assert m['supportFootLockMaxAngularDriftDegrees'] < 1.0, m
          assert m['pelvisTravel'] > 0.005, m
          assert m['torsoTwistDegrees'] > 2.0, m
          assert m['boneCount'] >= 40, m
          print('BLENDER_MOTION_FOUNDRY_V2_CROSS_METRICS_OK', m)
          PY

      - name: Stage generated Cross motion library
        if: steps.foundry.outputs.needs_generate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/blender-motion-foundry-v2/blender-cross-core.glb public/models/quaternius/blender-cross-core.glb
          cp artifacts/blender-motion-foundry-v2/blender-cross-core.metrics.json public/models/quaternius/blender-cross-core.metrics.json
          printf '%s\n' '${{ steps.foundry.outputs.script_hash }}' > public/models/quaternius/blender-cross-core.generator.sha256

      - name: Apply v2 runtime integration
        run: |
          node scripts/apply-blender-motion-foundry-v2.mjs
          node scripts/apply-blender-motion-foundry-v2-shared-strikes.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate v2 Foundry contract
        run: node --test tests/blender-motion-foundry-v2.test.mjs

      - name: Build, rules and lint integrated game
        run: |
          npm run build
          npm run test:rules
          npm run test:pwa
          npm run lint

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-blender-motion-foundry-v2-cross
          path: |
            artifacts/blender-motion-foundry-v2
            public/models/quaternius/blender-cross-core.metrics.json
          if-no-files-found: ignore
          retention-days: 14
