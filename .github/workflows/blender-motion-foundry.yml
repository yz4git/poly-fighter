name: POLY FIGHTER Blender Motion Foundry

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/blender/build-fight-motion-foundry-v1.py
      - tools/blender/build-fight-motion-foundry-v2-cross.py
      - scripts/apply-blender-motion-foundry-v1.mjs
      - scripts/apply-blender-motion-foundry-v2.mjs
      - tests/blender-motion-foundry.test.mjs
      - tests/blender-motion-foundry-v2.test.mjs
      - tests/quaternius-model-skin.test.ts
      - tests/model-viewer.test.mjs
      - src/game/visual-quaternius-runtime.ts
      - src/game/model-viewer-motion.ts
      - scripts/capture-model-view-audit.mjs
      - public/models/quaternius/blender-fight-core.glb
      - public/models/quaternius/blender-fight-core.metrics.json
      - public/models/quaternius/blender-fight-core.generator.sha256
      - public/models/quaternius/blender-cross-core.glb
      - public/models/quaternius/blender-cross-core.metrics.json
      - public/models/quaternius/blender-cross-core.generator.sha256
      - .github/workflows/blender-motion-foundry.yml
  workflow_dispatch:

jobs:
  build-motion:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Check whether Blender artifacts are current
        id: foundry
        shell: bash
        run: |
          set -euo pipefail
          power_hash="$(sha256sum tools/blender/build-fight-motion-foundry-v1.py | awk '{print $1}')"
          cross_hash="$(cat tools/blender/build-fight-motion-foundry-v1.py tools/blender/build-fight-motion-foundry-v2-cross.py | sha256sum | awk '{print $1}')"
          echo "power_hash=$power_hash" >> "$GITHUB_OUTPUT"
          echo "cross_hash=$cross_hash" >> "$GITHUB_OUTPUT"
          if [ -s public/models/quaternius/blender-fight-core.glb ] \
            && [ -s public/models/quaternius/blender-fight-core.generator.sha256 ] \
            && grep -qx "$power_hash" public/models/quaternius/blender-fight-core.generator.sha256; then
            echo "needs_power=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_power=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -s public/models/quaternius/blender-cross-core.glb ] \
            && [ -s public/models/quaternius/blender-cross-core.generator.sha256 ] \
            && grep -qx "$cross_hash" public/models/quaternius/blender-cross-core.generator.sha256; then
            echo "needs_cross=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_cross=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch pinned full UAL authoring source
        if: steps.foundry.outputs.needs_power == 'true' || steps.foundry.outputs.needs_cross == 'true'
        run: |
          set -euxo pipefail
          mkdir -p .tmp-quaternius
          BASE_PIN=aa02a4e6d8337a0604d2da131bcbbeb1f01badf0
          BASE_URL=https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/$BASE_PIN/public/assets/vendor/quaternius
          curl -L --fail --retry 3 "$BASE_URL/universal-animation-library.glb" -o .tmp-quaternius/ual1-full.glb
          echo '4c748767741a3e495d89667b9a218b690ba9810b9517a12e960780e3ca72c4e9  .tmp-quaternius/ual1-full.glb' | sha256sum -c -

      - name: Install Blender
        if: steps.foundry.outputs.needs_power == 'true' || steps.foundry.outputs.needs_cross == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri xvfb
          blender --version | head -n 2
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          blender --background --python-use-system-env --python-expr "import numpy; print('BLENDER_NUMPY', numpy.__version__)"

      - name: Generate BF_Power_R in Blender
        if: steps.foundry.outputs.needs_power == 'true'
        run: |
          set -euo pipefail
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          out="artifacts/blender-motion-foundry"
          mkdir -p "$out"
          xvfb-run -a blender --background \
            --python-use-system-env \
            --python-exit-code 1 \
            --python tools/blender/build-fight-motion-foundry-v1.py \
            -- \
            --source .tmp-quaternius/ual1-full.glb \
            --output-dir "$out"
          test -s "$out/blender-fight-core.glb"
          test -s "$out/blender-fight-core.metrics.json"
          test -s "$out/blender-fight-core-v1.blend"
          cat "$out/blender-fight-core.metrics.json"

      - name: Validate generated Power metrics
        if: steps.foundry.outputs.needs_power == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/blender-motion-foundry/blender-fight-core.metrics.json')
          m = json.loads(p.read_text())
          assert m['version'] == 'BLENDER_MOTION_FOUNDRY_V1', m
          assert m['action'] == 'BF_Power_R', m
          assert m['rightHandTravel'] > 0.03, m
          assert m['leftFootLockMaxDrift'] < 0.03, m
          assert m['boneCount'] >= 40, m
          print('BLENDER_MOTION_FOUNDRY_POWER_METRICS_OK', m)
          PY

      - name: Stage generated Power motion library
        if: steps.foundry.outputs.needs_power == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/blender-motion-foundry/blender-fight-core.glb public/models/quaternius/blender-fight-core.glb
          cp artifacts/blender-motion-foundry/blender-fight-core.metrics.json public/models/quaternius/blender-fight-core.metrics.json
          printf '%s\n' '${{ steps.foundry.outputs.power_hash }}' > public/models/quaternius/blender-fight-core.generator.sha256

      - name: Generate BF_Cross_R in Blender
        if: steps.foundry.outputs.needs_cross == 'true'
        run: |
          set -euo pipefail
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          out="artifacts/blender-motion-foundry-v2"
          mkdir -p "$out"
          xvfb-run -a blender --background \
            --python-use-system-env \
            --python-exit-code 1 \
            --python tools/blender/build-fight-motion-foundry-v2-cross.py \
            -- \
            --source .tmp-quaternius/ual1-full.glb \
            --output-dir "$out"
          test -s "$out/blender-cross-core.glb"
          test -s "$out/blender-cross-core.metrics.json"
          test -s "$out/blender-cross-core-v2.blend"
          cat "$out/blender-cross-core.metrics.json"

      - name: Validate generated Cross metrics
        if: steps.foundry.outputs.needs_cross == 'true'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/blender-motion-foundry-v2/blender-cross-core.metrics.json')
          m = json.loads(p.read_text())
          assert m['version'] == 'BLENDER_MOTION_FOUNDRY_V2_CROSS', m
          assert m['action'] == 'BF_Cross_R', m
          assert m['rightHandTravel'] > 0.08, m
          assert m['leftFootLockMaxDrift'] < 0.01, m
          assert m['leftFootLockMaxAngularDriftDegrees'] < 1.0, m
          assert m['pelvisTravel'] > 0.005, m
          assert m['torsoTwistDegrees'] > 2.0, m
          assert m['boneCount'] >= 40, m
          print('BLENDER_MOTION_FOUNDRY_V2_CROSS_METRICS_OK', m)
          PY

      - name: Stage generated Cross motion library
        if: steps.foundry.outputs.needs_cross == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp artifacts/blender-motion-foundry-v2/blender-cross-core.glb public/models/quaternius/blender-cross-core.glb
          cp artifacts/blender-motion-foundry-v2/blender-cross-core.metrics.json public/models/quaternius/blender-cross-core.metrics.json
          printf '%s\n' '${{ steps.foundry.outputs.cross_hash }}' > public/models/quaternius/blender-cross-core.generator.sha256

      - name: Apply runtime integration
        run: |
          node scripts/apply-blender-motion-foundry-v1.mjs
          node scripts/apply-blender-motion-foundry-v2.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Foundry contracts
        run: |
          node --test tests/blender-motion-foundry.test.mjs
          node --test tests/blender-motion-foundry-v2.test.mjs

      - name: Build, rules and lint integrated game
        run: |
          npm run build
          npm run test:rules
          npm run test:pwa
          npm run lint

      - name: Publish generated Foundry assets and integration to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code && [ -z "$(git status --porcelain)" ]; then
            echo "Blender Motion Foundry branch is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/models/quaternius/blender-fight-core.glb \
            public/models/quaternius/blender-fight-core.metrics.json \
            public/models/quaternius/blender-fight-core.generator.sha256 \
            public/models/quaternius/blender-cross-core.glb \
            public/models/quaternius/blender-cross-core.metrics.json \
            public/models/quaternius/blender-cross-core.generator.sha256 \
            src/game/visual-quaternius-runtime.ts \
            src/game/model-viewer-motion.ts \
            scripts/capture-model-view-audit.mjs \
            tests/quaternius-model-skin.test.ts \
            tests/model-viewer.test.mjs \
            package.json
          git commit -m "Generate Blender Motion Foundry v2 Cross action"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-blender-motion-foundry
          path: |
            artifacts/blender-motion-foundry
            artifacts/blender-motion-foundry-v2
            public/models/quaternius/blender-fight-core.metrics.json
            public/models/quaternius/blender-cross-core.metrics.json
          if-no-files-found: ignore
          retention-days: 14
