name: POLY FIGHTER Motion Foundation Deep Audit Once

on:
  push:
    branches: [motion-runtime-foundation-v1]
    paths:
      - .github/workflows/motion-foundation-deep-audit-once.yml

permissions:
  contents: write

concurrency:
  group: motion-foundation-deep-audit-once
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-runtime-foundation-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Motion-specific contracts
        run: |
          node --import tsx --test tests/combat-motion-timeline.test.ts tests/combat-motion.test.ts tests/kick-ankle.test.ts
          node --test tests/blender-motion-foundry-v2-kicks.test.mjs
      - name: Build production preview once
        run: npm run build
      - name: Start production preview once
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-deep-motion-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/poly-fighter-deep-motion-server.log
          exit 1
      - name: Capture complete combat motion library
        run: |
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" node scripts/capture-combat-motion-audit.mjs
      - name: Capture every authored kick frame
        run: |
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          mkdir -p artifacts/kick-frame-audit
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" KICK_FRAME_AUDIT_DIR="artifacts/kick-frame-audit" node scripts/capture-kick-frame-audit.mjs
          test "$(find artifacts/kick-frame-audit/front -name '*.png' | wc -l)" -eq 43
          test "$(find artifacts/kick-frame-audit/low -name '*.png' | wc -l)" -eq 46
          test "$(find artifacts/kick-frame-audit/rising -name '*.png' | wc -l)" -eq 49
      - name: Preserve server log
        if: always()
        run: |
          mkdir -p artifacts/deep-motion-audit
          cp /tmp/poly-fighter-deep-motion-server.log artifacts/deep-motion-audit/server.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-motion-foundation-deep-audit
          path: artifacts
          if-no-files-found: error
          retention-days: 7
      - name: Remove one-shot workflow after successful audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/motion-foundation-deep-audit-once.yml
          git commit -m "Remove completed motion foundation deep audit"
          git push origin HEAD:motion-runtime-foundation-v1
