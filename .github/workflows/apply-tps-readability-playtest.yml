name: Apply TPS readability playtest

on:
  push:
    branches: [improve/tps-readability-playtest-20260901]
    paths:
      - scripts/apply-tps-readability-playtest.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/tps-readability-playtest-20260901
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply playtest improvements
        run: python3 scripts/apply-tps-readability-playtest.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run TPS rules
        run: npm run test:rules:tps
      - name: Run lint
        run: npm run lint
      - name: Build production
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/tps-game-base.ts src/game/tps-game.ts src/game/tps-hype.ts tests/tps-mode.test.ts tests/tps-graphics.test.ts scripts/capture-tps-visual-audit.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes"
          else
            git commit -m "Improve TPS CPU and combat readability"
            git push origin HEAD:improve/tps-readability-playtest-20260901
          fi
