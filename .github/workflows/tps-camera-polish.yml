name: Apply TPS camera polish

on:
  push:
    paths:
      - ".github/workflows/tps-camera-polish.yml"
      - "scripts/apply-tps-camera-polish.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply TPS camera/result polish
        run: node scripts/apply-tps-camera-polish.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm run test:rules
      - run: npm run test:pwa
      - run: npm run build
      - run: npm run lint
      - name: Publish validated polish
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/tps-game.ts
          if git diff --cached --quiet; then
            echo "TPS camera polish already current"
            exit 0
          fi
          git commit -m "Polish TPS over-shoulder camera"
          git push origin HEAD:main
