name: One-shot TPS combo and KO screen review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tps-combo-ko-screen-review.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ci:tps
      - run: npm run build
      - name: Start production preview
        run: |
          PORT=3000 npm start >/tmp/poly-fighter-screen-review.log 2>&1 &
          echo $! >/tmp/poly-fighter-screen-review.pid
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/poly-fighter-screen-review.log
          exit 1
      - name: Capture combo and KO presentation
        shell: bash
        run: |
          mkdir -p artifacts/tps-combo-ko-review
          cat >/tmp/tps-combo-ko-review.mjs <<'EOF'
          import { spawn } from 'node:child_process';
          import { writeFile } from 'node:fs/promises';
          const driver = process.env.WEBDRIVER_BIN;
          if (!driver) throw new Error('WEBDRIVER_BIN missing');
          const port = 9531;
          const delay = ms => new Promise(r => setTimeout(r, ms));
          const proc = spawn(driver, [`--port=${port}`, '--allowed-ips='], { stdio: ['ignore','pipe','pipe'] });
          let log=''; proc.stdout.on('data',c=>log+=c); proc.stderr.on('data',c=>log+=c);
          async function cmd(path, method='GET', body) { const r=await fetch(`http://127.0.0.1:${port}${path}`,{method,headers:body===undefined?undefined:{'content-type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)}); const p=await r.json().catch(()=>({})); if(!r.ok||p?.value?.error) throw new Error(`${method} ${path} ${r.status} ${JSON.stringify(p)}`); return p.value; }
          async function exec(id,script,args=[]){return cmd(`/session/${id}/execute/sync`,'POST',{script,args});}
          async function shot(id,name){const b64=await cmd(`/session/${id}/screenshot`);await writeFile(`artifacts/tps-combo-ko-review/${name}.png`,Buffer.from(b64,'base64'));}
          async function clickText(id,text){return exec(id,`const e=[...document.querySelectorAll('button')].find(x=>x.textContent?.includes(arguments[0]));if(!e)return false;e.click();return true;`,[text]);}
          const lookup=`function findGame(){const host=document.querySelector('main.poly-app');if(!host)return null;const key=Object.keys(host).find(k=>k.startsWith('__reactFiber$'));let f=key?host[key]:null;const seen=new Set();while(f&&!seen.has(f)){seen.add(f);let h=f.memoizedState;while(h){const v=h.memoizedState;const c=v&&typeof v==='object'&&'current'in v?v.current:null;if(c&&c.p1&&c.p2&&c.renderer&&c.camera&&c.scene)return c;h=h.next;}f=f.return;}return null;}`;
          for(let i=0;i<150;i++){try{const r=await fetch(`http://127.0.0.1:${port}/status`);if(r.ok)break;}catch{}if(i===149)throw new Error(log);await delay(100);}
          let sid=null;
          try {
            const s=await cmd('/session','POST',{capabilities:{alwaysMatch:{browserName:'chrome','goog:chromeOptions':{args:['--headless=new','--no-sandbox','--disable-dev-shm-usage','--ignore-gpu-blocklist','--enable-webgl','--use-angle=swiftshader','--window-size=932,430','--hide-scrollbars']}}}}); sid=s.sessionId;
            await cmd(`/session/${sid}/url`,'POST',{url:'http://127.0.0.1:3000/'}); await delay(900);
            if(!await clickText(sid,'TPS LOCK-ON BATTLE')) throw new Error('TPS title button missing'); await delay(180);
            if(!await clickText(sid,'ENGAGE TPS')) throw new Error('TPS engage button missing'); await delay(1400);
            let ready=false; for(let i=0;i<80;i++){ready=await exec(sid,`${lookup}return !!findGame();`);if(ready)break;await delay(100);} if(!ready)throw new Error('TPS game not found');
            await exec(sid,`${lookup}const g=findGame();cancelAnimationFrame(g.raf);g.running=false;g.enemyOpeningGraceTicks=9999;return true;`);

            await exec(sid,`${lookup}const g=findGame();g.playerComboStage=3;g.p1.state='ATTACK';g.publishHud(true);g.updateCamera(1);g.updateLockOn();g.renderer.render(g.scene,g.camera);return true;`); await delay(100);
            const combo=await exec(sid,`const b=document.querySelector('.tps-combo-badge');const c=document.querySelector('canvas');return {innerWidth,innerHeight,badge:b?{x:b.getBoundingClientRect().x,y:b.getBoundingClientRect().y,w:b.getBoundingClientRect().width,h:b.getBoundingClientRect().height,text:b.textContent}:null,canvas:c?c.getBoundingClientRect().toJSON():null,body:document.body.innerText.slice(0,1000)};`);
            if(!combo.badge||combo.badge.x>combo.innerWidth*0.32) throw new Error('COMBO badge is not in face-safe left lane: '+JSON.stringify(combo));
            await shot(sid,'01-combo-face-safe');

            const airborne=await exec(sid,`${lookup}const g=findGame();g.playerComboStage=0;g.p1.state='IDLE';g.p1.health=100;g.p2.health=1;g.p1.position.set(0,0,1.1);g.p2.position.set(0,0,-0.4);g.p2.receiveDamage(20,18,0.7,1,true,4);g.checkFinish();for(let i=0;i<10;i++)g.step();g.updateCamera(1);g.updateLockOn();g.renderer.render(g.scene,g.camera);return {finishPending:g.finishPending,finished:g.finished,winner:g.resultWinner,p2State:g.p2.state,p2Y:g.p2.position.y,p2Grounded:g.p2.grounded,settledTicks:g.finishSettledTicks};`); await delay(80);
            if(!airborne.finishPending||airborne.finished) throw new Error('KO did not enter pending presentation: '+JSON.stringify(airborne));
            await shot(sid,'02-ko-airborne');

            const grounded=await exec(sid,`${lookup}const g=findGame();let n=0;while(!g.p2.grounded&&n++<120)g.step();g.updateCamera(1);g.updateLockOn();g.renderer.render(g.scene,g.camera);return {steps:n,finishPending:g.finishPending,finished:g.finished,p2State:g.p2.state,p2Y:g.p2.position.y,p2Grounded:g.p2.grounded,settledTicks:g.finishSettledTicks};`); await delay(80);
            if(!grounded.p2Grounded||!grounded.finishPending||grounded.finished) throw new Error('Result appeared before grounded hold: '+JSON.stringify(grounded));
            await shot(sid,'03-ko-grounded-hold');

            const finalState=await exec(sid,`${lookup}const g=findGame();let n=0;while(!g.finished&&n++<100)g.step();return {steps:n,finished:g.finished,finishPending:g.finishPending,winner:g.resultWinner,p2Grounded:g.p2.grounded,settledTicks:g.finishSettledTicks};`); await delay(220);
            await shot(sid,'04-result-after-grounded');
            const finalDom=await exec(sid,`return {body:document.body.innerText.slice(0,1800),hasResult:[...document.querySelectorAll('button')].some(b=>/REMATCH|TITLE/i.test(b.textContent||''))};`);
            if(!finalState.finished||!finalState.p2Grounded||!finalDom.hasResult) throw new Error('Result did not follow grounded KO: '+JSON.stringify({finalState,finalDom}));
            await writeFile('artifacts/tps-combo-ko-review/review.json',JSON.stringify({combo,airborne,grounded,finalState,finalDom},null,2));
            console.log(JSON.stringify({combo,airborne,grounded,finalState},null,2));
          } finally { if(sid)await cmd(`/session/${sid}`,'DELETE').catch(()=>{}); proc.kill('SIGTERM'); }
          EOF
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          WEBDRIVER_BIN="$DRIVER" node /tmp/tps-combo-ko-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tps-combo-ko-screen-review
          path: artifacts/tps-combo-ko-review
          retention-days: 14
      - name: Remove one-shot workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tps-combo-ko-screen-review.yml
          git commit -m "Remove one-shot TPS combo KO screen review"
          git push
