name: Apply v3 contact readability fix

on:
  push:
    branches:
      - improve/procedural-v3-visual-readability-20260902
    paths:
      - .github/workflows/v3-contact-readability-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/procedural-v3-visual-readability-20260902
          fetch-depth: 0

      - name: Apply targeted contact readability pass
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          game = "src/game/tps-game-base.ts"
          replace_exact(
              game,
              'const TPS_CAMERA_IMPACT_BACK_DELTA = -0.16;\nconst TPS_CAMERA_IMPACT_SHOULDER = 0.20;',
              'const TPS_CAMERA_IMPACT_BACK_DELTA = 0.24;\nconst TPS_CAMERA_IMPACT_SHOULDER = 0.38;\nconst TPS_IMPACT_CONTACT_MINIMUM = 1.28;',
          )
          replace_exact(
              game,
              '''    // Preserve throw contact, but keep normal strikes from collapsing both silhouettes\n    // into the same screen-space column on iPhone landscape.\n    const minimum = p1Throwing || p2Throwing ? 0.98 : 1.12;\n    if (distance >= minimum || distance < 1e-5) return;''',
              '''    // Preserve throw contact. For resolved normal strikes, open a slightly wider\n    // contact lane only while hit-stop freezes the pair. Hit detection has already\n    // completed before this runs, so gameplay reach stays unchanged; the following\n    // visual pass can solve the striking limb back onto the opponent from a clearer\n    // full-body silhouette.\n    const impactFrozen = Math.max(this.p1.hitStop, this.p2.hitStop) > 0;\n    const p1Impacting = this.p1.state === "ATTACK"\n      && ["HIT", "BLOCK_STUN", "KNOCKDOWN", "THROW", "KO", "RING_OUT"].includes(this.p2.state);\n    const p2Impacting = this.p2.state === "ATTACK"\n      && ["HIT", "BLOCK_STUN", "KNOCKDOWN", "THROW", "KO", "RING_OUT"].includes(this.p1.state);\n    const impactPair = impactFrozen && (p1Impacting || p2Impacting);\n    const throwContact = p1Throwing || p2Throwing;\n    const minimum = throwContact ? 0.98 : impactPair ? TPS_IMPACT_CONTACT_MINIMUM : 1.12;\n    const spacingMode = throwContact ? "THROW" : impactPair ? "IMPACT_PAIR" : "NEUTRAL";\n    this.p1.visual.root.userData.tpsContactSpacingMode = spacingMode;\n    this.p2.visual.root.userData.tpsContactSpacingMode = spacingMode;\n    this.p1.visual.root.userData.tpsContactSpacingMinimum = minimum;\n    this.p2.visual.root.userData.tpsContactSpacingMinimum = minimum;\n    if (distance >= minimum || distance < 1e-5) return;''',
          )
          replace_exact(
              game,
              '.addScaledVector(right, TPS_CAMERA_CLOSE_TARGET_SIDE_SHIFT * closeFactor - flankLaneShift + impactReadabilityFactor * 0.035)',
              '.addScaledVector(right, TPS_CAMERA_CLOSE_TARGET_SIDE_SHIFT * closeFactor - flankLaneShift + impactReadabilityFactor * 0.080)',
          )

          motion = "src/game/motion-expansion-runtime.ts"
          replace_exact(
              motion,
              '''    case "JAB":\n    case "CROSS":\n    case "HOOK":\n    case "COUNTER":\n      return head.addScaledVector(lateral, side * 0.035);\n    case "BODY_BLOW":\n      return body.lerp(hips, 0.22).addScaledVector(lateral, side * 0.025);\n    case "HEAVY":\n      return body.addScaledVector(lateral, side * 0.05);\n    case "LOW_KICK":\n      return legs.addScaledVector(lateral, side * 0.12);\n    case "RISING_KICK":\n      return body.lerp(head, 0.72).addScaledVector(lateral, side * 0.04);\n    case "DASH_KICK":\n      return body.lerp(chest, 0.42).addScaledVector(lateral, side * 0.06);\n    case "FRONT_KICK":\n      return body.lerp(chest, 0.28);''',
              '''    case "JAB":\n    case "CROSS":\n      return head.addScaledVector(lateral, side * 0.070);\n    case "HOOK":\n      return head.addScaledVector(lateral, side * 0.105);\n    case "COUNTER":\n      return head.addScaledVector(lateral, side * 0.085);\n    case "BODY_BLOW":\n      return body.lerp(hips, 0.22).addScaledVector(lateral, side * 0.055);\n    case "HEAVY":\n      return body.addScaledVector(lateral, side * 0.080);\n    case "LOW_KICK":\n      return legs.addScaledVector(lateral, side * 0.140);\n    case "RISING_KICK":\n      return body.lerp(head, 0.72).addScaledVector(lateral, side * 0.075);\n    case "DASH_KICK":\n      return body.lerp(chest, 0.42).addScaledVector(lateral, side * 0.090);\n    case "FRONT_KICK":\n      return body.lerp(chest, 0.28).addScaledVector(lateral, side * 0.055);''',
          )
          replace_exact(
              motion,
              'const V3_VISUAL_READABILITY_VERSION = "PROCEDURAL_FIGHT_V3_READABILITY_1";',
              'const V3_VISUAL_READABILITY_VERSION = "PROCEDURAL_FIGHT_V3_READABILITY_2";\nconst V3_CONTACT_LANE_POLICY = "OUTER_EDGE_TARGET_V2";',
          )
          replace_exact(
              motion,
              '  fighter.visual.root.userData.motionExpansionVisualReadabilityVersion = V3_VISUAL_READABILITY_VERSION;\n  fighter.visual.root.userData.motionExpansionPoseGraph = "9_POSE_GRAPH";',
              '  fighter.visual.root.userData.motionExpansionVisualReadabilityVersion = V3_VISUAL_READABILITY_VERSION;\n  fighter.visual.root.userData.motionExpansionContactLanePolicy = V3_CONTACT_LANE_POLICY;\n  fighter.visual.root.userData.motionExpansionPoseGraph = "9_POSE_GRAPH";',
          )

          test_motion = Path("tests/motion-expansion.test.ts")
          text = test_motion.read_text()
          if text.count("PROCEDURAL_FIGHT_V3_READABILITY_1") != 1:
              raise SystemExit("motion-expansion test readability version anchor mismatch")
          text = text.replace("PROCEDURAL_FIGHT_V3_READABILITY_1", "PROCEDURAL_FIGHT_V3_READABILITY_2")
          anchor = '  assert.match(source, /motionExpansionVisualReadabilityVersion/);'
          if text.count(anchor) != 1:
              raise SystemExit("motion-expansion test telemetry anchor mismatch")
          text = text.replace(anchor, anchor + '\n  assert.match(source, /V3_CONTACT_LANE_POLICY = "OUTER_EDGE_TARGET_V2"/);\n  assert.match(source, /motionExpansionContactLanePolicy/);')
          test_motion.write_text(text)

          test_tps = Path("tests/tps-mode.test.ts")
          text = test_tps.read_text()
          for old, new in [
              (r"TPS_CAMERA_IMPACT_BACK_DELTA = -0\.16", r"TPS_CAMERA_IMPACT_BACK_DELTA = 0\.24"),
              (r"TPS_CAMERA_IMPACT_SHOULDER = 0\.20", r"TPS_CAMERA_IMPACT_SHOULDER = 0\.38"),
          ]:
              if text.count(old) != 1:
                  raise SystemExit(f"tps-mode test anchor mismatch: {old}")
              text = text.replace(old, new)
          anchor = r'  assert.match(source, /TPS_CAMERA_IMPACT_SHOULDER = 0\.38/);'
          if text.count(anchor) != 1:
              raise SystemExit("tps-mode impact shoulder anchor mismatch")
          text = text.replace(anchor, anchor + '\n  assert.match(source, /TPS_IMPACT_CONTACT_MINIMUM = 1\\.28/);\n  assert.match(source, /tpsContactSpacingMode/);')
          test_tps.write_text(text)

          audit = "scripts/capture-tps-visual-audit.mjs"
          replace_exact(
              audit,
              '''    game.updateCamera(1 / 60);\n    game.updateLockOn();\n    game.renderer.render(game.scene, game.camera);\n    return { steps, p1Health: game.p1.health, p2Health: game.p2.health, p1State: game.p1.state, p2State: game.p2.state, screenSeparation, targetGroundRing };''',
              '''    game.updateCamera(1 / 60);\n    game.updateLockOn();\n    game.renderer.render(game.scene, game.camera);\n    const impactPlayerScreen = game.p1.position.clone();\n    const impactEnemyScreen = game.p2.position.clone();\n    impactPlayerScreen.y = 1.2;\n    impactEnemyScreen.y = 1.2;\n    impactPlayerScreen.project(game.camera);\n    impactEnemyScreen.project(game.camera);\n    const impactScreenSeparation = Math.abs(impactEnemyScreen.x - impactPlayerScreen.x) * canvas.width * 0.5;\n    const impactWorldSeparation = Math.hypot(game.p2.position.x - game.p1.position.x, game.p2.position.z - game.p1.position.z);\n    const spacingMode = game.p1.visual.root.userData.tpsContactSpacingMode ?? null;\n    const spacingMinimum = game.p1.visual.root.userData.tpsContactSpacingMinimum ?? 0;\n    return { steps, p1Health: game.p1.health, p2Health: game.p2.health, p1State: game.p1.state, p2State: game.p2.state, screenSeparation, impactScreenSeparation, impactWorldSeparation, spacingMode, spacingMinimum, targetGroundRing };''',
          )
          replace_exact(
              audit,
              '  if (!(punchProbe?.screenSeparation >= 72)) throw new Error(`TPS close-range camera still overlaps fighter centers too heavily: ${JSON.stringify(punchProbe)}`);',
              '  if (!(punchProbe?.screenSeparation >= 72)) throw new Error(`TPS close-range camera still overlaps fighter centers too heavily: ${JSON.stringify(punchProbe)}`);\n  if (punchProbe?.spacingMode !== "IMPACT_PAIR" || !(punchProbe?.spacingMinimum >= 1.28) || !(punchProbe?.impactWorldSeparation >= 1.27)) throw new Error(`TPS resolved impact did not open the v3 contact lane: ${JSON.stringify(punchProbe)}`);',
          )
          PY

      - name: Verify targeted tests
        run: |
          npm ci --ignore-scripts
          node --import tsx --test tests/motion-expansion.test.ts tests/tps-mode.test.ts

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/motion-expansion-runtime.ts src/game/tps-game-base.ts tests/motion-expansion.test.ts tests/tps-mode.test.ts scripts/capture-tps-visual-audit.mjs
          git diff --cached --check
          git commit -m "Improve v3 contact spacing readability"
          git push origin HEAD:improve/procedural-v3-visual-readability-20260902
