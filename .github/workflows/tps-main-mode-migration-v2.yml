name: Apply TPS main mode migration v2

on:
  push:
    branches: [tps-main-mode-v1]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tps-main-mode-v1
      - name: Make TPS the only playable main mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          p = Path('app/page.tsx')
          s = p.read_text()
          replacements = [
            ('import { PolyFightGame } from "@/src/game/game";\n', '', 'legacy duel import'),
            ('type Screen = "TITLE" | "SELECT" | "MODEL_VIEW" | "MATCH" | "TPS_MATCH" | "RESULT";\ntype BattleMode = "DUEL" | "TPS";\ntype GameRuntime = PolyFightGame | TpsFightGame;', 'type Screen = "TITLE" | "SELECT" | "MODEL_VIEW" | "TPS_MATCH" | "RESULT";\ntype GameRuntime = TpsFightGame;', 'runtime types'),
            ('  const [battleMode, setBattleMode] = useState<BattleMode>("DUEL");\n', '', 'battle mode state'),
            ('    if ((screen !== "MATCH" && screen !== "TPS_MATCH") || !mountRef.current) return undefined;', '    if (screen !== "TPS_MATCH" || !mountRef.current) return undefined;', 'surface gate'),
            ('      game = new (screen === "TPS_MATCH" ? TpsFightGame : PolyFightGame)(mountRef.current, {', '      game = new TpsFightGame(mountRef.current, {', 'runtime constructor'),
            ('''  const startMatch = () => {\n    requestLandscape();\n    setBattleMode("DUEL");\n    setHud(null);\n    setScreen("MATCH");\n  };\n\n  const startTpsMatch = () => {\n    requestLandscape();\n    setBattleMode("TPS");\n    setHud(null);\n    setPaused(false);\n    setScreen("TPS_MATCH");\n  };''', '''  const startMatch = () => {\n    requestLandscape();\n    setHud(null);\n    setPaused(false);\n    setScreen("TPS_MATCH");\n  };''', 'launcher'),
            ('  const isGameSurface = screen === "MATCH" || screen === "TPS_MATCH";', '  const isGameSurface = screen === "TPS_MATCH";', 'surface flag'),
            ('  const tpsIncoming = battleMode === "TPS" && hud?.message === "INCOMING";', '  const tpsIncoming = hud?.message === "INCOMING";', 'incoming'),
            ('  const tpsStrikeRange = battleMode === "TPS" && ["STRIKE RANGE", "PERFECT STEP", "FLANK OPEN"].includes(hud?.message ?? "");', '  const tpsStrikeRange = ["STRIKE RANGE", "PERFECT STEP", "FLANK OPEN"].includes(hud?.message ?? "");', 'range'),
            ('  const tpsComboMessage = battleMode === "TPS" && (hud?.message ?? "").startsWith("COMBO ");', '  const tpsComboMessage = (hud?.message ?? "").startsWith("COMBO ");', 'combo'),
            ('  const tpsKoMessage = battleMode === "TPS" && hud?.message === "KO";', '  const tpsKoMessage = hud?.message === "KO";', 'ko'),
            ('  const tpsFaceSafeMessage = battleMode === "TPS" && Boolean(hud?.message);', '  const tpsFaceSafeMessage = Boolean(hud?.message);', 'face safe'),
            ('          <p className="title-copy">A textureless 3D duel built from light, color, and sharp geometry.</p>', '          <p className="title-copy">A close-range 3D lock-on fighter built for direct movement, readable impact, and fast rematches.</p>', 'title copy'),
            ('          <button type="button" className="primary-button" onClick={() => { setBattleMode("DUEL"); setScreen("SELECT"); requestLandscape(); }}>\n            <span>START MATCH</span><small>PRESS TO ENTER THE RING</small>\n          </button>', '          <button type="button" className="primary-button" onClick={() => { setScreen("SELECT"); requestLandscape(); }}>\n            <span>START FIGHT</span><small>TPS LOCK-ON / LOADOUT SELECT</small>\n          </button>', 'title CTA'),
            ('          <button type="button" className="ghost-button tps-mode-button" onClick={() => { setBattleMode("TPS"); setScreen("SELECT"); requestLandscape(); }}><span>TPS LOCK-ON BATTLE</span><small>360° CIRCULAR ARENA / LOADOUT SELECT</small></button>\n', '', 'secondary mode CTA'),
            ('          <div className="title-footer"><span>iPHONE SAFARI / LANDSCAPE</span><span>BUILD 0.1 // LOCAL DUEL</span></div>', '          <div className="title-footer"><span>iPHONE SAFARI / LANDSCAPE</span><span>BUILD 0.1 // TPS LOCK-ON</span></div>', 'footer'),
            ('          <div className="screen-heading"><span>{battleMode === "TPS" ? "TPS LOADOUT" : "CHARACTER SELECT"}</span><i>{battleMode === "TPS" ? "LOCK-ON FIGHTER / CPU / DIFFICULTY" : "CHOOSE YOUR VECTOR"}</i></div>', '          <div className="screen-heading"><span>TPS LOADOUT</span><i>LOCK-ON FIGHTER / CPU / DIFFICULTY</i></div>', 'loadout heading'),
            ('            <button type="button" className="primary-button compact" onClick={battleMode === "TPS" ? startTpsMatch : startMatch}><span>{battleMode === "TPS" ? "ENGAGE TPS" : "ENTER RING"}</span><small>{p1.name} / {p2.name} / {difficulty}</small></button>', '            <button type="button" className="primary-button compact" onClick={startMatch}><span>ENGAGE</span><small>{p1.name} / {p2.name} / {difficulty}</small></button>', 'engage CTA'),
            ('          <div className={`match-badge ${battleMode === "TPS" ? "tps-badge" : ""} ${tpsFaceSafeMessage ? "tps-face-safe-badge" : ""} ${tpsComboMessage ? "tps-combo-badge" : ""} ${tpsKoMessage ? "tps-ko-badge" : ""}`}>{battleMode === "TPS" ? (tpsFaceSafeMessage ? <strong>{hud?.message}</strong> : <><strong>{hud?.message ?? "TARGET LOCKED"}</strong><span>•</span><b>{hud?.p2Name ?? p2.name}</b></>) : <>HIGH-POLY FLAT SHADING <span>•</span> RING OUT ACTIVE</>}</div>', '          <div className={`match-badge tps-badge ${tpsFaceSafeMessage ? "tps-face-safe-badge" : ""} ${tpsComboMessage ? "tps-combo-badge" : ""} ${tpsKoMessage ? "tps-ko-badge" : ""}`}>{tpsFaceSafeMessage ? <strong>{hud?.message}</strong> : <><strong>{hud?.message ?? "TARGET LOCKED"}</strong><span>•</span><b>{hud?.p2Name ?? p2.name}</b></>}</div>', 'match badge'),
            ('          <button type="button" className={`pause-button ${battleMode === "TPS" ? "tps-pause-button" : ""}`} aria-label={paused ? "Resume" : "Pause"}', '          <button type="button" className="pause-button tps-pause-button" aria-label={paused ? "Resume" : "Pause"}', 'pause class'),
            ('''            <div className={`action-buttons ${battleMode === "TPS" ? "tps-two-button-actions" : ""}`}>\n              {battleMode === "TPS" ? (\n                <>\n                  {pressableAction(gameRef, "guard", "Step", "STEP", "guard tps-step-action " + (tpsIncoming ? "tps-threat-action" : ""))}\n                  {pressableAction(gameRef, "punch", "Attack", "ATTACK", "punch tps-attack-action " + (tpsStrikeRange ? "tps-ready-action" : ""))}\n                </>\n              ) : (\n                <>\n                  {pressableAction(gameRef, "guard", "Guard", "G", "guard")}\n                  {pressableAction(gameRef, "punch", "Punch", "P", "punch")}\n                  {pressableAction(gameRef, "kick", "Kick", "K", "kick")}\n                </>\n              )}\n            </div>''', '''            <div className="action-buttons tps-two-button-actions">\n              {pressableAction(gameRef, "guard", "Step", "STEP", "guard tps-step-action " + (tpsIncoming ? "tps-threat-action" : ""))}\n              {pressableAction(gameRef, "punch", "Attack", "ATTACK", "punch tps-attack-action " + (tpsStrikeRange ? "tps-ready-action" : ""))}\n            </div>''', 'action buttons'),
            ('          <div className={`input-hint ${battleMode === "TPS" ? "tps-input-hint" : ""}`}>{battleMode === "TPS" ? <><b>ATTACK</b> AUTO PUNCH / KICK <span>•</span> TAP COMBO <span>•</span> <b>SIDE STEP</b> ENEMY STRIKE → FLANK <span>•</span> BACK STEP = SPACE <span>•</span> FORWARD STEP → ATTACK = DASH</> : <>PUNCH <b>P</b> / KICK <b>K</b> / GUARD <b>G</b> <span>•</span> HOLD G + 8-WAY TO SIDESTEP</>}</div>', '          <div className="input-hint tps-input-hint"><b>ATTACK</b> AUTO PUNCH / KICK <span>•</span> TAP COMBO <span>•</span> <b>SIDE STEP</b> ENEMY STRIKE → FLANK <span>•</span> BACK STEP = SPACE <span>•</span> FORWARD STEP → ATTACK = DASH</div>', 'input hint'),
            ('          <button type="button" className="primary-button compact" onClick={() => setScreen(battleMode === "TPS" ? "TPS_MATCH" : "MATCH")}><span>REMATCH</span><small>{battleMode === "TPS" ? "RE-ENGAGE TARGET" : "RUN IT BACK"}</small></button>', '          <button type="button" className="primary-button compact" onClick={() => setScreen("TPS_MATCH")}><span>REMATCH</span><small>RE-ENGAGE TARGET</small></button>', 'rematch'),
          ]
          for old, new, label in replacements:
              s = once(s, old, new, label)
          if 'battleMode' in s or 'PolyFightGame' in s or 'setScreen("MATCH")' in s or '>START MATCH<' in s:
              raise SystemExit('legacy duel route remains')
          p.write_text(s)

          p = Path('scripts/capture-tps-visual-audit.mjs')
          s = p.read_text()
          old = '''  await command(`/session/${sessionId}/url`, "POST", { url });\n  await delay(650);\n  const click = await clickButton(sessionId, "TPS LOCK-ON BATTLE");\n  if (!click?.clicked) throw new Error(`TPS title button not found: ${JSON.stringify(click)}`);\n  await delay(120);\n  const engage = await clickButton(sessionId, "ENGAGE TPS");\n  if (!engage?.clicked) throw new Error(`TPS loadout engage button not found: ${JSON.stringify(engage)}`);'''
          new = '''  await command(`/session/${sessionId}/url`, "POST", { url });\n  await delay(650);\n  await mkdir(outputDir, { recursive: true });\n  const titleProbe = await execute(sessionId, `\n    const labels = [...document.querySelectorAll('button')].map((entry) => entry.textContent ?? '');\n    return {\n      startFight: labels.some((label) => label.includes('START FIGHT')),\n      legacyStartMatch: labels.some((label) => label.includes('START MATCH')),\n      legacyTpsModeButton: labels.some((label) => label.includes('TPS LOCK-ON BATTLE')),\n      modelView: labels.some((label) => label.includes('MODEL VIEW')),\n    };\n  `);\n  if (!titleProbe.startFight || titleProbe.legacyStartMatch || titleProbe.legacyTpsModeButton || !titleProbe.modelView) throw new Error(`TPS-first title route mismatch: ${JSON.stringify(titleProbe)}`);\n  await screenshot(sessionId, `${outputDir}/tps-title.png`);\n  const click = await clickButton(sessionId, "START FIGHT");\n  if (!click?.clicked) throw new Error(`TPS main title button not found: ${JSON.stringify(click)}`);\n  await delay(140);\n  const loadoutProbe = await execute(sessionId, `return {\n    tpsLoadout: document.body.innerText.includes('TPS LOADOUT'),\n    legacyCharacterSelect: document.body.innerText.includes('CHARACTER SELECT'),\n    engage: [...document.querySelectorAll('button')].some((entry) => entry.textContent?.includes('ENGAGE')),\n  };`);\n  if (!loadoutProbe.tpsLoadout || loadoutProbe.legacyCharacterSelect || !loadoutProbe.engage) throw new Error(`TPS-first loadout route mismatch: ${JSON.stringify(loadoutProbe)}`);\n  await screenshot(sessionId, `${outputDir}/tps-loadout.png`);\n  const engage = await clickButton(sessionId, "ENGAGE");\n  if (!engage?.clicked) throw new Error(`TPS loadout engage button not found: ${JSON.stringify(engage)}`);'''
          p.write_text(once(s, old, new, 'audit entry'))

          Path('tests/tps-main-mode.test.mjs').write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\ntest("TPS lock-on is the only playable main match route", async () => {\n  const source = await readFile(new URL("../app/page.tsx", import.meta.url), "utf8");\n  assert.doesNotMatch(source, /PolyFightGame/);\n  assert.doesNotMatch(source, /type BattleMode/);\n  assert.doesNotMatch(source, /setScreen\\(\\"MATCH\\"\\)/);\n  assert.doesNotMatch(source, />START MATCH</);\n  assert.match(source, />START FIGHT</);\n  assert.match(source, /TPS LOADOUT/);\n  assert.match(source, /new TpsFightGame/);\n  assert.match(source, /setScreen\\(\\"TPS_MATCH\\"\\)/);\n  assert.match(source, /tps-two-button-actions/);\n});\n''')

          p = Path('package.json')
          data = json.loads(p.read_text())
          target = 'tests/tps-main-mode.test.mjs'
          if target not in data['scripts']['test:pwa']:
              data['scripts']['test:pwa'] += ' ' + target
          p.write_text(json.dumps(data, indent=2) + '\n')

          p = Path('README.md')
          s = p.read_text()
          old = '''- Open the published Site in Safari in landscape orientation.\n- Choose a fighter and CPU difficulty.\n- Use the left direction pad for movement, crouch, jump, and sidestep.\n- Use `P` for punch, `K` for kick, and `G` for guard.\n- Direction + button commands include low attacks, rising attacks, dash kicks,\n  counters, power attacks, and throws.'''
          new = '''- Open the published Site in Safari in landscape orientation.\n- `START FIGHT` opens the TPS loadout; the legacy side-view match is no longer a player-facing mode.\n- Choose a fighter, opponent, visual model, and CPU difficulty.\n- Use the left 8-way pad for approach, retreat, and circular movement.\n- Use `ATTACK` for context-sensitive punch/kick strings and `STEP` for evasive movement.\n- Side-step incoming strikes to open flanks; forward step into ATTACK for dash pressure.'''
          p.write_text(once(s, old, new, 'README controls'))
          PY
      - name: Validate migration diff
        run: |
          node --test tests/tps-main-mode.test.mjs
          node --check scripts/capture-tps-visual-audit.mjs
          git diff --check
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx scripts/capture-tps-visual-audit.mjs tests/tps-main-mode.test.mjs package.json README.md
          git commit -m "Make TPS lock-on the main game mode"
          git push origin HEAD:tps-main-mode-v1
