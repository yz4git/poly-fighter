name: TEMP V6.7 Final Visual Audit

on:
  push:
    paths:
      - '.github/tmp/v6-7-final-audit-trigger.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-foundry-v6-leg-anatomy-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Strict V6.7 and TPS contracts
        run: |
          node --test tests/blender-motion-foundry-v2-kicks.test.mjs
          npm run test:ci:tps
      - name: Build production preview
        run: npm run build
      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-v67-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/poly-fighter-v67-server.log
          exit 1
      - name: Capture kick readability and Model View
        run: |
          set -euo pipefail
          mkdir -p artifacts/v6-7-final-audit
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            DRIVER="$CHROMEWEBDRIVER/chromedriver"
          fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" \
            AUDIT_URL="http://127.0.0.1:3000/" \
            TPS_AUDIT_DIR="artifacts/v6-7-final-audit" \
            node scripts/capture-motion-readability-audit.mjs
          WEBDRIVER_BIN="$DRIVER" \
            AUDIT_URL="http://127.0.0.1:3000/" \
            MODEL_VIEW_AUDIT_DIR="artifacts/v6-7-final-audit" \
            node scripts/capture-model-view-audit.mjs
          for image in tps-motion-kick tps-motion-lowkick tps-motion-risingkick tps-motion-dashkick; do
            test -s "artifacts/v6-7-final-audit/${image}.png"
          done
          test -s artifacts/v6-7-final-audit/motion-readability.json
          test -s artifacts/v6-7-final-audit/model-view-state.json
          cp /tmp/poly-fighter-v67-server.log artifacts/v6-7-final-audit/server.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-v6-7-final-visual-audit
          path: artifacts/v6-7-final-audit
          if-no-files-found: ignore
          retention-days: 14
