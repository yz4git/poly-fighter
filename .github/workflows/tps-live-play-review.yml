name: One-shot TPS live play review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tps-live-play-review.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ci:tps
      - run: npm run build
      - name: Start production preview
        shell: bash
        run: |
          PORT=3000 npm start >/tmp/pf-live-review.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pf-live-review.log
          exit 1
      - name: Existing TPS gameplay visual audit
        shell: bash
        run: |
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL=http://127.0.0.1:3000/ TPS_AUDIT_DIR=artifacts/tps-full node scripts/capture-tps-visual-audit.mjs
      - name: Capture real-time iPhone KO and controls timeline
        shell: bash
        run: |
          mkdir -p artifacts/tps-live
          cat >/tmp/tps-live-review.mjs <<'EOF'
          import { spawn } from 'node:child_process';
          import { writeFile } from 'node:fs/promises';
          const driver=process.env.WEBDRIVER_BIN;if(!driver)throw new Error('WEBDRIVER_BIN required');
          const port=9537; const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
          const proc=spawn(driver,[`--port=${port}`,'--allowed-ips='],{stdio:['ignore','pipe','pipe']}); let log='';proc.stdout.on('data',c=>log+=c);proc.stderr.on('data',c=>log+=c);
          async function cmd(path,method='GET',body){const r=await fetch(`http://127.0.0.1:${port}${path}`,{method,headers:body===undefined?undefined:{'content-type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok||j?.value?.error)throw new Error(`${r.status} ${JSON.stringify(j)}`);return j.value}
          async function exec(id,script,args=[]){return cmd(`/session/${id}/execute/sync`,'POST',{script,args})}
          async function shot(id,name){const b=await cmd(`/session/${id}/screenshot`);await writeFile(`artifacts/tps-live/${name}.png`,Buffer.from(b,'base64'))}
          async function click(id,text){return exec(id,`const b=[...document.querySelectorAll('button')].find(e=>e.textContent?.includes(arguments[0]));if(!b)return false;b.click();return true`,[text])}
          const lookup=`function fg(){const h=document.querySelector('main.poly-app');if(!h)return null;const k=Object.keys(h).find(k=>k.startsWith('__reactFiber$'));let f=k?h[k]:null,s=new Set;while(f&&!s.has(f)){s.add(f);let q=f.memoizedState;while(q){const v=q.memoizedState,c=v&&typeof v==='object'&&'current'in v?v.current:null;if(c&&c.p1&&c.p2&&c.renderer&&c.camera)return c;q=q.next}f=f.return}return null}`;
          for(let i=0;i<120;i++){try{if((await fetch(`http://127.0.0.1:${port}/status`)).ok)break}catch{}await sleep(100)}
          let id=null; const timeline={};
          try{
            const s=await cmd('/session','POST',{capabilities:{alwaysMatch:{browserName:'chrome','goog:chromeOptions':{args:['--headless=new','--no-sandbox','--disable-dev-shm-usage','--ignore-gpu-blocklist','--enable-webgl','--use-angle=swiftshader','--window-size=932,430','--hide-scrollbars']}}}}); id=s.sessionId;
            await cmd(`/session/${id}/url`,'POST',{url:'http://127.0.0.1:3000/'}); await sleep(800);
            if(!await click(id,'TPS LOCK-ON BATTLE'))throw new Error('TPS title button missing'); await sleep(180);
            if(!await click(id,'ENGAGE TPS'))throw new Error('ENGAGE TPS missing');
            let ready=false;for(let i=0;i<100;i++){ready=await exec(id,`${lookup}return !!fg()`);if(ready)break;await sleep(100)}if(!ready)throw new Error('TPS game missing');
            await sleep(900); await shot(id,'01-live-idle');
            timeline.idle=await exec(id,`${lookup}const g=fg();const c=g.renderer.domElement;return {w:c.width,h:c.height,p1:{x:g.p1.position.x,z:g.p1.position.z},p2:{x:g.p2.position.x,z:g.p2.position.z},msg:document.querySelector('.tps-badge')?.textContent??null}`);
            await exec(id,`${lookup}const g=fg();g.enemyOpeningGraceTicks=9999;g.press('right','live-step');return true`); await sleep(320); await exec(id,`${lookup}const g=fg();g.release('right','live-step');return true`); await sleep(80); await shot(id,'02-live-strafe');
            timeline.strafe=await exec(id,`${lookup}const g=fg();return {p1:{x:g.p1.position.x,z:g.p1.position.z},p2:{x:g.p2.position.x,z:g.p2.position.z},state:g.p1.state}`);
            await exec(id,`${lookup}const g=fg();g.input.clear();g.enemyOpeningGraceTicks=9999;g.p1.position.set(0,0,0.72);g.p2.position.set(0,0,-0.42);g.p1.health=100;g.p2.health=100;g.p1.currentMove=null;g.p2.currentMove=null;g.p1.state='IDLE';g.p2.state='IDLE';g.press('punch','live-attack');return true`); await sleep(55); await exec(id,`${lookup}const g=fg();if(g)g.release('punch','live-attack');return true`); await sleep(135); await shot(id,'03-live-attack');
            timeline.attack=await exec(id,`${lookup}const g=fg();return {p1State:g.p1.state,p2State:g.p2.state,p2Health:g.p2.health,msg:document.querySelector('.tps-badge')?.textContent??null}`);
            await exec(id,`${lookup}const g=fg();g.input.clear();g.enemyOpeningGraceTicks=9999;g.p1.health=100;g.p2.health=1;g.p1.currentMove=null;g.p2.currentMove=null;g.p1.state='IDLE';g.p2.state='IDLE';g.p1.position.set(0,0,0.8);g.p2.position.set(0,0,-0.4);g.p2.receiveDamage(20,18,0.7,1,true,4);g.checkFinish();return {pending:g.finishPending,state:g.p2.state}`);
            await sleep(180); await shot(id,'04-ko-180ms'); timeline.ko180=await exec(id,`${lookup}const g=fg();return g?{screen:'TPS',pending:g.finishPending,y:g.p2.position.y,grounded:g.p2.grounded,state:g.p2.state,clip:g.p2.visual.root.userData.quaterniusCurrentClip??null,badge:document.querySelector('.tps-badge')?.textContent??null,bounds:document.querySelector('.tps-badge')?.getBoundingClientRect().toJSON?.()??null}:{screen:'RESULT'}`);
            await sleep(520); await shot(id,'05-ko-700ms'); timeline.ko700=await exec(id,`${lookup}const g=fg();return g?{screen:'TPS',pending:g.finishPending,y:g.p2.position.y,grounded:g.p2.grounded,state:g.p2.state,clip:g.p2.visual.root.userData.quaterniusCurrentClip??null,badge:document.querySelector('.tps-badge')?.textContent??null}:{screen:'RESULT'}`);
            await sleep(430); await shot(id,'06-ko-1130ms'); timeline.ko1130=await exec(id,`${lookup}const g=fg();return g?{screen:'TPS',pending:g.finishPending,y:g.p2.position.y,grounded:g.p2.grounded,state:g.p2.state,clip:g.p2.visual.root.userData.quaterniusCurrentClip??null,badge:document.querySelector('.tps-badge')?.textContent??null}:{screen:'RESULT',body:document.body.innerText.slice(0,300)}`);
            await sleep(350); await shot(id,'07-after-1480ms'); timeline.after1480=await exec(id,`${lookup}const g=fg();return g?{screen:'TPS',pending:g.finishPending}:{screen:'RESULT',body:document.body.innerText.slice(0,500)}`);
            await writeFile('artifacts/tps-live/timeline.json',JSON.stringify(timeline,null,2)); console.log(JSON.stringify(timeline,null,2));
          } finally { if(id) await cmd(`/session/${id}`,'DELETE').catch(()=>{}); proc.kill('SIGTERM'); }
          EOF
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          WEBDRIVER_BIN="$DRIVER" node /tmp/tps-live-review.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tps-live-play-review
          path: artifacts
          retention-days: 14
      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/tps-live-play-review.yml
          git commit -m 'Remove one-shot TPS live play review'
          git push
