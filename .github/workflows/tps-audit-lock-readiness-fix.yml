name: TPS audit lock readiness fix

on:
  push:
    paths:
      - 'scripts/fix-tps-audit-lock-readiness.py'
      - '.github/workflows/tps-audit-lock-readiness-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Fix lock readiness audit
        run: python3 scripts/fix-tps-audit-lock-readiness.py
      - name: Check capture script syntax
        run: node --check scripts/capture-tps-visual-audit.mjs
      - name: TPS regression suite
        run: npm run test:ci:tps
      - name: Publish audit fix
        run: |
          rm -f scripts/fix-tps-audit-lock-readiness.py .github/workflows/tps-audit-lock-readiness-fix.yml
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit TPS lock readiness from rendered marker"
          git push origin HEAD:main
