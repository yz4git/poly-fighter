name: One-shot Rising Kick peak audit fix

on:
  push:
    branches: [motion-onoff-review]
    paths:
      - .github/workflows/fix-rising-kick-peak-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-onoff-review
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Measure authored Rising Kick peak
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, got {count}: {old[:100]!r}")
              p.write_text(s.replace(old, new, 1))

          path = 'scripts/capture-motion-readability-audit.mjs'
          replace_once(path,
            '''      let activeReached = false;\n      let steps = 0;''',
            '''      let activeReached = false;\n      let peakStrikeY = -Infinity;\n      let steps = 0;''')

          replace_once(path,
            '''        game.updateVisual(game.p1, game.p2, auditTime);\n        game.updateVisual(game.p2, game.p1, auditTime + 0.007);\n        const policy = game.p1.visual.root.userData.motionCorrectionPolicy;''',
            '''        game.updateVisual(game.p1, game.p2, auditTime);\n        game.updateVisual(game.p2, game.p1, auditTime + 0.007);\n        // Gameplay ACTIVE ticks and the Blender-authored foot trajectory do not\n        // share the same normalized clock. Track the actual rendered striking\n        // foot through the sampled window instead of assuming the last ACTIVE\n        // tick is the visual apex.\n        if (moveId === 'risingKick') {\n          const framePoints = bonePoints(game.p1);\n          const frameStrikeY = move.visualContact === 'LEFT_FOOT'\n            ? framePoints?.footL?.y\n            : move.visualContact === 'RIGHT_FOOT'\n              ? framePoints?.footR?.y\n              : null;\n          if (Number.isFinite(frameStrikeY)) peakStrikeY = Math.max(peakStrikeY, frameStrikeY);\n        }\n        const policy = game.p1.visual.root.userData.motionCorrectionPolicy;''')

          replace_once(path,
            '''        strikePoint,\n        targetHealth: game.p2.health,''',
            '''        strikePoint,\n        peakStrikeY: Number.isFinite(peakStrikeY) ? peakStrikeY : null,\n        targetHealth: game.p2.health,''')

          replace_once(path,
            '''  const risingY = results.risingKick?.strikePoint?.y;''',
            '''  const risingY = results.risingKick?.peakStrikeY ?? results.risingKick?.strikePoint?.y;''')

          path = 'tests/tps-audit-motion-policy.test.mjs'
          replace_once(path,
            '''  assert.match(source, /risingY > kickY \\+ 0\\.08/);''',
            '''  assert.match(source, /peakStrikeY = -Infinity/);\n  assert.match(source, /peakStrikeY = Math\\.max\\(peakStrikeY, frameStrikeY\\)/);\n  assert.match(source, /risingY = results\\.risingKick\\?\\.peakStrikeY \\?\\?/);\n  assert.match(source, /risingY > kickY \\+ 0\\.08/);''')
          PY
      - name: Validate audit policy
        run: |
          npm ci --no-audit --no-fund
          npm run test:ci:tps
          npm run lint
      - name: Commit audit repair and clean trigger files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-rising-kick-peak-audit.yml
          if [ -f tests/tps-close-readability-review.test.mjs ]; then git rm tests/tps-close-readability-review.test.mjs; fi
          git add scripts/capture-motion-readability-audit.mjs tests/tps-audit-motion-policy.test.mjs
          git commit -m "Audit authored Rising Kick by rendered foot peak"
          git push origin HEAD:motion-onoff-review
