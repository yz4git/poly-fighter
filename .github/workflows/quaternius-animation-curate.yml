name: Curate lightweight Quaternius fight clips

on:
  push:
    paths:
      - ".github/workflows/quaternius-animation-curate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install glTF Transform core
        run: npm install --no-save --ignore-scripts @gltf-transform/core@4.4.1

      - name: Fetch pinned source libraries
        run: |
          set -euxo pipefail
          mkdir -p .tmp-quaternius
          BASE_PIN=aa02a4e6d8337a0604d2da131bcbbeb1f01badf0
          BASE_URL=https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/$BASE_PIN/public/assets/vendor/quaternius
          UAL2_PIN=db3df04d1e4714298a09510b26fb6de6645138a2
          UAL2_URL="https://raw.githubusercontent.com/agentkaerf/FreeModels/$UAL2_PIN/Universal%20Animation%20Library%202%5BStandard%5D/Unreal-Godot/UAL2_Standard.glb"
          curl -L --fail --retry 3 "$BASE_URL/universal-animation-library.glb" -o .tmp-quaternius/ual1.glb
          curl -L --fail --retry 3 "$UAL2_URL" -o .tmp-quaternius/ual2.glb
          echo '4c748767741a3e495d89667b9a218b690ba9810b9517a12e960780e3ca72c4e9  .tmp-quaternius/ual1.glb' | sha256sum -c -
          test "$(git hash-object .tmp-quaternius/ual2.glb)" = "dc684c2a664927964307e8eb7b27b0000ebf6a18"

      - name: List combat motion candidates
        run: |
          node --input-type=module <<'NODE'
          import { NodeIO } from '@gltf-transform/core';
          const io = new NodeIO();
          for (const file of ['.tmp-quaternius/ual1.glb', '.tmp-quaternius/ual2.glb']) {
            const doc = await io.read(file);
            const names = doc.getRoot().listAnimations().map((a) => a.getName()).filter(Boolean).sort();
            const combat = names.filter((name) => /attack|combo|counter|death|dodge|fall|hit|hook|jab|jump|kick|knock|melee|punch|roll|slide|stagger|throw|upper|wake|shield|sword|lay/i.test(name));
            console.log(`=== ${file} COMBAT ${combat.length}/${names.length} ===`);
            console.log(combat.join('\n'));
          }
          NODE

      - name: Curate fight clips
        run: |
          set -euxo pipefail
          node scripts/curate-quaternius-animations.mjs \
            .tmp-quaternius/ual1.glb \
            public/models/quaternius/ual-fight-core.glb \
            Idle_Loop,Walk_Loop,Crouch_Idle_Loop,Jump_Start,Jump_Loop,Jump_Land,Punch_Jab,Punch_Cross,Hit_Chest,Hit_Head,Death01,Roll
          node scripts/curate-quaternius-animations.mjs \
            .tmp-quaternius/ual2.glb \
            public/models/quaternius/ual2-fight-core.glb \
            Hit_Knockback,Idle_Shield_Break,Idle_Shield_Loop,LayToIdle,Melee_Hook,Melee_Hook_Rec,NinjaJump_Start,NinjaJump_Idle_Loop,NinjaJump_Land,OverhandThrow,Shield_OneShot,Slide_Start,Slide_Loop,Slide_Exit,Sword_Regular_A,Sword_Regular_A_Rec,Sword_Regular_B,Sword_Regular_B_Rec,Sword_Regular_C,Sword_Regular_Combo
          ls -lh public/models/quaternius/*.glb

      - name: Publish curated assets
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/quaternius/ual-fight-core.glb public/models/quaternius/ual2-fight-core.glb
          if git diff --cached --quiet; then
            echo "Curated assets already current"
            exit 0
          fi
          git commit -m "Curate readable combat motion phases"
          # This workflow is branch-safe so development branches can generate the
          # pinned binary pack without ever writing directly to main.
          git push origin "HEAD:${GITHUB_REF_NAME}"
