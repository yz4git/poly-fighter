name: Apply procedural v7 kick kinematics

on:
  push:
    branches:
      - improve/procedural-v7-kick-kinematics-20260902
    paths:
      - .github/workflows/v7-kick-kinematics-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/procedural-v7-kick-kinematics-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock @gltf-transform/core@4.3.0
      - run: python scripts/patch-kick-motion-v7.py
      - name: Regenerate procedural fight core
        run: |
          node scripts/generate-procedural-fight-motions-v3.mjs \
            public/models/quaternius/ual-fight-core.glb \
            public/models/quaternius/procedural-fight-core.glb \
            public/models/quaternius/procedural-fight-core.metrics.json
      - name: Validate generated motion
        run: |
          grep -q 'KICK_MOTION_V7' scripts/generate-procedural-fight-motions-v3.mjs
          npm run test:ci:tps
          npm run lint
          npm run build
      - name: Commit v7 kick motion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-procedural-fight-motions-v3.mjs \
            public/models/quaternius/procedural-fight-core.glb \
            public/models/quaternius/procedural-fight-core.metrics.json
          git commit -m "Rebuild kick motion with chamber and recoil"
          git push origin HEAD:improve/procedural-v7-kick-kinematics-20260902
