name: Temporary V6 rising silhouette runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-v6-rising-silhouette-runner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-foundry-v6-reference-driven
          fetch-depth: 0
      - name: Apply rising silhouette correction
        run: |
          set -euo pipefail
          python3 scripts/patch-v6-rising-silhouette.py
          python3 -m py_compile tools/blender/build-fight-motion-foundry-v2-kicks.py
          node --check tests/blender-motion-foundry-v2-kicks.test.mjs
          git diff --check
      - name: Commit rising silhouette correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blender/build-fight-motion-foundry-v2-kicks.py tests/blender-motion-foundry-v2-kicks.test.mjs
          if git diff --cached --quiet; then
            echo "No V6 silhouette changes to commit."
            exit 0
          fi
          git commit -m "Move rising kick outside body silhouette"
          git push origin HEAD:motion-foundry-v6-reference-driven
