name: Apply Procedural Fight v2 runtime integration

on:
  push:
    paths:
      - scripts/apply-procedural-fight-v2-runtime.mjs
      - .github/workflows/apply-procedural-v2-runtime.yml

permissions:
  contents: write

concurrency:
  group: apply-procedural-v2-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Apply bounded root-motion and generated state routing
        run: node scripts/apply-procedural-fight-v2-runtime.mjs

      - name: Commit runtime integration
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/motion-expansion-runtime.ts
          if git diff --cached --quiet; then
            echo "Runtime integration already applied"
            exit 0
          fi
          git commit -m "Integrate Procedural Fight Motion Generator v2 runtime"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
