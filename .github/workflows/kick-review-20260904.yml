name: One-shot kick visual play review 20260904

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-review-20260904.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TPS regression
        run: npm run test:ci:tps
      - name: Production build
        run: npm run build
      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-kick-review-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/poly-fighter-kick-review-server.log
          exit 1
      - name: Capture authored kick poses in MODEL VIEW
        run: |
          mkdir -p artifacts/kick-review/model-view
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" MODEL_VIEW_AUDIT_DIR="artifacts/kick-review/model-view" node scripts/capture-model-view-audit.mjs
      - name: Capture kicks in real TPS composition
        run: |
          mkdir -p artifacts/kick-review/tps
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/kick-review/tps" node scripts/capture-motion-readability-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/kick-review/tps-gameplay" node scripts/capture-tps-visual-audit.mjs
      - name: Preserve metrics and logs
        if: always()
        run: |
          cp public/models/quaternius/blender-kicks-core.metrics.json artifacts/kick-review/blender-kicks-core.metrics.json || true
          cp /tmp/poly-fighter-kick-review-server.log artifacts/kick-review/server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kick-review-20260904
          path: artifacts/kick-review
          if-no-files-found: error
          retention-days: 7
