name: POLY FIGHTER Motion Fixture Isolation Once

on:
  push:
    branches: [motion-pose-ownership-v2]
    paths:
      - .github/workflows/motion-framerate-audit-once.yml

permissions:
  contents: read

concurrency:
  group: motion-fixture-isolation-once
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-pose-ownership-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare isolated fixture audit
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/capture-motion-framerate-audit.mjs')
          s = p.read_text()

          old_q = '''    const dot = Math.min(1, Math.abs(qa[0] * qb[0] + qa[1] * qb[1] + qa[2] * qb[2] + qa[3] * qb[3]));\n    const angle = 2 * Math.acos(dot);\n'''
          new_q = '''    const normA = Math.hypot(qa[0], qa[1], qa[2], qa[3]);\n    const normB = Math.hypot(qb[0], qb[1], qb[2], qb[3]);\n    const rawDot = qa[0] * qb[0] + qa[1] * qb[1] + qa[2] * qb[2] + qa[3] * qb[3];\n    const dot = Math.min(1, Math.abs(rawDot / Math.max(1e-12, normA * normB)));\n    const angle = 2 * Math.acos(dot);\n'''
          if old_q not in s: raise SystemExit('quaternion anchor missing')
          s = s.replace(old_q, new_q, 1)

          old_moves = '  const moves = ["jab", "straight", "bodyBlow", "backfist", "power", "kick", "lowKick", "risingKick", "dashKick", "counter", "throw"];'
          new_moves = '  const moves = ["risingKick", "counter", "throw"];'
          if old_moves not in s: raise SystemExit('move list anchor missing')
          s = s.replace(old_moves, new_moves, 1)

          old_settle = '''          let time=(g.__frTime ?? 100) + .25;\n          const fps=arguments[2];\n          const settleFrames=Math.max(1,Math.round(fps*.5));\n          for(let i=0;i<settleFrames;i++){time+=1/fps;renderAt(g,time);}\n          g.p1.beginMove(arguments[1]);\n'''
          new_settle = '''          let time=(g.__frTime ?? 100);\n          const fps=arguments[2];\n          // The pre-attack visual history is identical for every target FPS.\n          // Only the ATTACK render cadence below is allowed to differ.\n          for(let i=0;i<30;i++){time+=1/60;renderAt(g,time);}\n          const readyPose=poseFor(g.p1);\n          const readyMeta=motionMeta(g.p1);\n          g.p1.beginMove(arguments[1]);\n'''
          if old_settle not in s: raise SystemExit('settle anchor missing')
          s = s.replace(old_settle, new_settle, 1)

          old_return = '''          g.__frTime=time;\n          return { startup:m.startup, pose:poseFor(g.p1), meta:motionMeta(g.p1) };\n'''
          new_return = '''          const contactPose=poseFor(g.p1);\n          const contactMeta=motionMeta(g.p1);\n          // Re-render the exact same gameplay tick once. Any change here is a\n          // render-history leak, independent of the cross-FPS comparison.\n          time+=1/240; renderAt(g,time);\n          const repeatPose=poseFor(g.p1);\n          const repeatMeta=motionMeta(g.p1);\n          g.__frTime=time;\n          return { startup:m.startup, pose:contactPose, meta:contactMeta, readyPose, readyMeta, repeatPose, repeatMeta };\n'''
          if old_return not in s: raise SystemExit('return anchor missing')
          s = s.replace(old_return, new_return, 1)

          old_asserts = '''        assert.ok(delta.maxPosition < 1e-5, `${actorName}/${move}/${fps}: position delta ${JSON.stringify(delta)}`);\n        assert.ok(delta.maxAngle < 1e-5, `${actorName}/${move}/${fps}: rotation delta ${JSON.stringify(delta)}`);\n'''
          if old_asserts not in s: raise SystemExit('comparison assert anchor missing')
          s = s.replace(old_asserts, '', 1)

          old_actor = '''      actorReport[move] = { startup: samples[60].startup, comparisons, clip: samples[60].meta.clip };\n'''
          new_actor = '''      actorReport[move] = {\n        startup: samples[60].startup,\n        comparisons,\n        readyComparisons: {\n          30: poseDelta(samples[60].readyPose, samples[30].readyPose),\n          120: poseDelta(samples[60].readyPose, samples[120].readyPose),\n        },\n        repeatedContact: {\n          30: poseDelta(samples[30].pose, samples[30].repeatPose),\n          60: poseDelta(samples[60].pose, samples[60].repeatPose),\n          120: poseDelta(samples[120].pose, samples[120].repeatPose),\n        },\n        clips: { 30: samples[30].meta.clip, 60: samples[60].meta.clip, 120: samples[120].meta.clip },\n        phases: { 30: samples[30].meta.phase, 60: samples[60].meta.phase, 120: samples[120].meta.phase },\n        contacts: { 30: samples[30].meta.contact, 60: samples[60].meta.contact, 120: samples[120].meta.contact },\n        readyClips: { 30: samples[30].readyMeta.clip, 60: samples[60].readyMeta.clip, 120: samples[120].readyMeta.clip },\n      };\n'''
          if old_actor not in s: raise SystemExit('actor report anchor missing')
          s = s.replace(old_actor, new_actor, 1)

          old_freeze = '''    const freezeDelta = poseDelta(freeze.before.pose, freeze.after.pose);\n    assert.ok(freezeDelta.maxPosition < 1e-8, `${actorName}: startup hitstop position drift ${JSON.stringify(freezeDelta)}`);\n    assert.ok(freezeDelta.maxAngle < 1e-8, `${actorName}: startup hitstop rotation drift ${JSON.stringify(freezeDelta)}`);\n    assert.equal(freeze.before.meta.previousPoseWeight, freeze.after.meta.previousPoseWeight, `${actorName}: hitstop changed entry blend weight`);\n    report.hitstop[actorName] = freezeDelta;\n'''
          new_freeze = '''    const freezeDelta = poseDelta(freeze.before.pose, freeze.after.pose);\n    report.hitstop[actorName] = {\n      ...freezeDelta,\n      rawPoseEqual: JSON.stringify(freeze.before.pose) === JSON.stringify(freeze.after.pose),\n      sameBlendWeight: freeze.before.meta.previousPoseWeight === freeze.after.meta.previousPoseWeight,\n    };\n'''
          if old_freeze not in s: raise SystemExit('freeze anchor missing')
          s = s.replace(old_freeze, new_freeze, 1)

          old_log = '''  console.log(JSON.stringify({ maxima: report.maxima, hitstop: report.hitstop, screenshots: report.screenshots }));\n'''
          new_log = '''  console.log(JSON.stringify(report));\n'''
          if old_log not in s: raise SystemExit('log anchor missing')
          s = s.replace(old_log, new_log, 1)
          p.write_text(s)
          PY
      - name: Build production preview
        run: npm run build
      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-fixture-audit.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/poly-fighter-fixture-audit.log
          exit 1
      - name: Compare isolated render histories
        run: |
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          mkdir -p artifacts/motion-fixture-isolation
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" MOTION_FRAMERATE_AUDIT_DIR="artifacts/motion-fixture-isolation" node scripts/capture-motion-framerate-audit.mjs
      - name: Preserve server log
        if: always()
        run: cp /tmp/poly-fighter-fixture-audit.log artifacts/motion-fixture-isolation/server.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-motion-fixture-isolation
          path: artifacts/motion-fixture-isolation
          if-no-files-found: warn
          retention-days: 7
