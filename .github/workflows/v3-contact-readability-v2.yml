name: Apply v3 contact readability v2

on:
  push:
    branches:
      - improve/procedural-v3-contact-readability-2-20260902
    paths:
      - .github/workflows/v3-contact-readability-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/procedural-v3-contact-readability-2-20260902
          fetch-depth: 0

      - name: Apply contact depth and FX readability pass
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:140]!r}")
              p.write_text(text.replace(old, new))

          game = "src/game/tps-game-base.ts"
          replace_exact(
              game,
              "const TPS_IMPACT_CONTACT_MINIMUM = 1.28;",
              "const TPS_IMPACT_CONTACT_MINIMUM = 1.40;\nconst TPS_IMPACT_CONTACT_MINIMUM_HEAVY = 1.46;\nconst TPS_IMPACT_CONTACT_MINIMUM_KICK = 1.50;",
          )
          replace_exact(
              game,
              '''    const impactPair = impactFrozen && (p1Impacting || p2Impacting);\n    const throwContact = p1Throwing || p2Throwing;\n    const minimum = throwContact ? 0.98 : impactPair ? TPS_IMPACT_CONTACT_MINIMUM : 1.12;\n    const spacingMode = throwContact ? "THROW" : impactPair ? "IMPACT_PAIR" : "NEUTRAL";''',
              '''    const impactPair = impactFrozen && (p1Impacting || p2Impacting);\n    const throwContact = p1Throwing || p2Throwing;\n    const impactMove = p1Impacting ? this.p1.currentMove : p2Impacting ? this.p2.currentMove : null;\n    const impactMoveId = impactMove?.id ?? null;\n    const impactMinimum = impactMoveId && ["kick", "lowKick", "risingKick", "dashKick"].includes(impactMoveId)\n      ? TPS_IMPACT_CONTACT_MINIMUM_KICK\n      : impactMoveId && ["power", "backfist", "counter"].includes(impactMoveId)\n        ? TPS_IMPACT_CONTACT_MINIMUM_HEAVY\n        : TPS_IMPACT_CONTACT_MINIMUM;\n    const minimum = throwContact ? 0.98 : impactPair ? impactMinimum : 1.12;\n    const spacingMode = throwContact ? "THROW" : impactPair ? "IMPACT_PAIR" : "NEUTRAL";''',
          )
          replace_exact(
              game,
              '''    this.p1.visual.root.userData.tpsContactSpacingMinimum = minimum;\n    this.p2.visual.root.userData.tpsContactSpacingMinimum = minimum;''',
              '''    this.p1.visual.root.userData.tpsContactSpacingMinimum = minimum;\n    this.p2.visual.root.userData.tpsContactSpacingMinimum = minimum;\n    this.p1.visual.root.userData.tpsContactSpacingMove = impactMoveId;\n    this.p2.visual.root.userData.tpsContactSpacingMove = impactMoveId;''',
          )

          graphics = "src/game/tps-graphics.ts"
          replace_exact(graphics, "  maxImpactWaves: 3,", "  maxImpactWaves: 2,")
          replace_exact(
              graphics,
              '''interface ImpactWave {\n  mesh: THREE.Mesh<THREE.RingGeometry, THREE.MeshBasicMaterial>;\n  life: number;\n  maxLife: number;\n}''',
              '''interface ImpactWave {\n  mesh: THREE.Mesh<THREE.RingGeometry, THREE.MeshBasicMaterial>;\n  life: number;\n  maxLife: number;\n  baseOpacity: number;\n}''',
          )
          replace_exact(graphics, "      this.waves.push({ mesh, life: 0, maxLife: 0 });", "      this.waves.push({ mesh, life: 0, maxLife: 0, baseOpacity: 0 });")
          replace_exact(
              graphics,
              '''    const waveCount = event.blocked ? 1 : visualTier === 3 ? 3 : visualTier === 2 ? 2 : 1;\n    const facing = camera.position.clone().sub(new THREE.Vector3(event.position.x, event.position.y, event.position.z)).normalize();''',
              '''    const waveCount = event.blocked ? 1 : visualTier === 3 ? 2 : 1;\n    const contactPoint = new THREE.Vector3(event.position.x, event.position.y, event.position.z);\n    const facing = camera.position.clone().sub(contactPoint).normalize();\n    const visualPoint = contactPoint.clone().addScaledVector(facing, -0.055);''',
          )
          replace_exact(
              graphics,
              '''      wave.mesh.position.set(event.position.x, event.position.y, event.position.z);\n      wave.mesh.scale.setScalar(0.68 + strength * 0.20 + index * 0.17);\n      wave.mesh.material.color.setHex(color);\n      wave.mesh.material.opacity = event.blocked ? 0.45 : Math.max(0.48, 0.82 - index * 0.13);''',
              '''      wave.mesh.position.copy(visualPoint);\n      wave.mesh.scale.setScalar(0.60 + strength * 0.14 + index * 0.12);\n      wave.mesh.material.color.setHex(color);\n      wave.baseOpacity = event.blocked\n        ? 0.28\n        : visualTier === 3\n          ? Math.max(0.34, 0.50 - index * 0.10)\n          : visualTier === 2\n            ? 0.38\n            : 0.30;\n      wave.mesh.material.opacity = wave.baseOpacity;''',
          )
          replace_exact(
              graphics,
              "      wave.mesh.material.opacity = Math.max(0, (1 - progress) * 0.78);",
              "      wave.mesh.material.opacity = Math.max(0, (1 - progress) * wave.baseOpacity);",
          )
          replace_exact(
              graphics,
              '''      wave.life = 0;\n      wave.maxLife = 0;\n      wave.mesh.visible = false;''',
              '''      wave.life = 0;\n      wave.maxLife = 0;\n      wave.baseOpacity = 0;\n      wave.mesh.visible = false;''',
          )

          hype = "src/game/tps-hype.ts"
          replace_exact(hype, "  impactRingExpansion: 1.6,", "  impactRingExpansion: 1.34,")
          replace_exact(hype, "  heavyBurstScale: 0.48,", "  heavyBurstScale: 0.38,\n  impactDepthBias: 0.07,")
          replace_exact(
              hype,
              '''interface ShockRing {\n  mesh: THREE.Mesh<THREE.RingGeometry, THREE.MeshBasicMaterial>;\n  life: number;\n  maxLife: number;\n  startScale: number;\n}''',
              '''interface ShockRing {\n  mesh: THREE.Mesh<THREE.RingGeometry, THREE.MeshBasicMaterial>;\n  life: number;\n  maxLife: number;\n  startScale: number;\n  baseOpacity: number;\n}''',
          )
          replace_exact(
              hype,
              '''interface BurstSpokes {\n  lines: THREE.LineSegments<THREE.BufferGeometry, THREE.LineBasicMaterial>;\n  life: number;\n  maxLife: number;\n  startScale: number;\n}''',
              '''interface BurstSpokes {\n  lines: THREE.LineSegments<THREE.BufferGeometry, THREE.LineBasicMaterial>;\n  life: number;\n  maxLife: number;\n  startScale: number;\n  baseOpacity: number;\n}''',
          )
          replace_exact(hype, "      this.rings.push({ mesh, life: 0, maxLife: 0, startScale: 1 });", "      this.rings.push({ mesh, life: 0, maxLife: 0, startScale: 1, baseOpacity: 0 });")
          replace_exact(hype, "      this.bursts.push({ lines, life: 0, maxLife: 0, startScale: 1 });", "      this.bursts.push({ lines, life: 0, maxLife: 0, startScale: 1, baseOpacity: 0 });")
          replace_exact(
              hype,
              '''    const point = new THREE.Vector3(event.position.x, event.position.y, event.position.z);\n    const facing = camera.position.clone().sub(point).normalize();\n    const ringCount = event.blocked ? 1 : tier === 3 ? TPS_HYPE_PROFILE.heavyImpactRingCount : tier === 2 ? TPS_HYPE_PROFILE.mediumImpactRingCount : TPS_HYPE_PROFILE.lightImpactRingCount;''',
              '''    const point = new THREE.Vector3(event.position.x, event.position.y, event.position.z);\n    const facing = camera.position.clone().sub(point).normalize();\n    const visualPoint = point.clone().addScaledVector(facing, -TPS_HYPE_PROFILE.impactDepthBias);\n    const ringCount = event.blocked ? 1 : tier === 3 ? TPS_HYPE_PROFILE.heavyImpactRingCount : tier === 2 ? TPS_HYPE_PROFILE.mediumImpactRingCount : TPS_HYPE_PROFILE.lightImpactRingCount;''',
          )
          replace_exact(
              hype,
              '''      ring.mesh.position.copy(point);\n      ring.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), facing);\n      ring.mesh.rotateZ(index * 0.44 + tier * 0.11);\n      ring.mesh.scale.setScalar(ring.startScale);\n      ring.mesh.material.color.setHex(color);\n      ring.mesh.material.opacity = event.blocked ? 0.36 : Math.max(0.38, 0.76 - index * 0.10);''',
              '''      ring.mesh.position.copy(visualPoint);\n      ring.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), facing);\n      ring.mesh.rotateZ(index * 0.44 + tier * 0.11);\n      ring.mesh.scale.setScalar(ring.startScale);\n      ring.mesh.material.color.setHex(color);\n      ring.baseOpacity = event.blocked\n        ? 0.26\n        : tier === 3\n          ? Math.max(0.34, 0.46 - index * 0.08)\n          : tier === 2\n            ? 0.35\n            : 0.29;\n      ring.mesh.material.opacity = ring.baseOpacity;''',
          )
          replace_exact(
              hype,
              '''    burst.startScale = event.blocked ? 0.34 : tier === 3 ? TPS_HYPE_PROFILE.heavyBurstScale : tier === 2 ? 0.50 : 0.40;\n    burst.lines.visible = true;\n    burst.lines.position.copy(point);''',
              '''    burst.startScale = event.blocked ? 0.28 : tier === 3 ? TPS_HYPE_PROFILE.heavyBurstScale : tier === 2 ? 0.35 : 0.30;\n    burst.lines.visible = true;\n    burst.lines.position.copy(visualPoint);''',
          )
          replace_exact(
              hype,
              "    burst.lines.material.opacity = event.blocked ? 0.28 : tier === 3 ? 0.68 : 0.58;",
              "    burst.baseOpacity = event.blocked ? 0.22 : tier === 3 ? 0.46 : tier === 2 ? 0.37 : 0.29;\n    burst.lines.material.opacity = burst.baseOpacity;",
          )
          replace_exact(
              hype,
              "    ring.mesh.material.opacity = perfect ? 0.72 : 0.42;",
              "    ring.baseOpacity = perfect ? 0.62 : 0.38;\n    ring.mesh.material.opacity = ring.baseOpacity;",
          )
          replace_exact(
              hype,
              "      ring.mesh.material.opacity = Math.max(0, (1 - progress) * 0.82);",
              "      ring.mesh.material.opacity = Math.max(0, (1 - progress) * ring.baseOpacity);",
          )
          replace_exact(
              hype,
              "      burst.lines.scale.setScalar(burst.startScale * (1 + progress * 1.75));\n      burst.lines.material.opacity = Math.max(0, (1 - progress) * 0.92);",
              "      burst.lines.scale.setScalar(burst.startScale * (1 + progress * 1.20));\n      burst.lines.material.opacity = Math.max(0, (1 - progress) * burst.baseOpacity);",
          )
          replace_exact(
              hype,
              '''      ring.life = 0;\n      ring.mesh.visible = false;''',
              '''      ring.life = 0;\n      ring.baseOpacity = 0;\n      ring.mesh.visible = false;''',
          )
          replace_exact(
              hype,
              '''      burst.life = 0;\n      burst.lines.visible = false;''',
              '''      burst.life = 0;\n      burst.baseOpacity = 0;\n      burst.lines.visible = false;''',
          )

          test_mode = "tests/tps-mode.test.ts"
          replace_exact(test_mode, r"  assert.match(source, /TPS_IMPACT_CONTACT_MINIMUM = 1\.28/);", r"  assert.match(source, /TPS_IMPACT_CONTACT_MINIMUM = 1\.40/);\n  assert.match(source, /TPS_IMPACT_CONTACT_MINIMUM_HEAVY = 1\.46/);\n  assert.match(source, /TPS_IMPACT_CONTACT_MINIMUM_KICK = 1\.50/);")

          test_graphics = "tests/tps-graphics.test.ts"
          replace_exact(test_graphics, "  assert.ok(TPS_IMPACT_FEEL_PROFILE.maxImpactWaves <= TPS_GRAPHICS_PROFILE.impactWavePool);", "  assert.equal(TPS_IMPACT_FEEL_PROFILE.maxImpactWaves, 2);\n  assert.ok(TPS_IMPACT_FEEL_PROFILE.maxImpactWaves <= TPS_GRAPHICS_PROFILE.impactWavePool);")
          replace_exact(test_graphics, "  assert.ok(TPS_HYPE_PROFILE.impactRingExpansion <= 1.6);\n  assert.ok(TPS_HYPE_PROFILE.heavyBurstScale <= 0.48);", "  assert.ok(TPS_HYPE_PROFILE.impactRingExpansion <= 1.4);\n  assert.ok(TPS_HYPE_PROFILE.heavyBurstScale <= 0.4);\n  assert.ok(TPS_HYPE_PROFILE.impactDepthBias >= 0.05);")

          audit = "scripts/capture-tps-visual-audit.mjs"
          replace_exact(
              audit,
              '  if (punchProbe?.spacingMode !== "IMPACT_PAIR" || !(punchProbe?.spacingMinimum >= 1.28) || !(punchProbe?.impactWorldSeparation >= 1.27)) throw new Error(`TPS resolved impact did not open the v3 contact lane: ${JSON.stringify(punchProbe)}`);',
              '  if (punchProbe?.spacingMode !== "IMPACT_PAIR" || !(punchProbe?.spacingMinimum >= 1.40) || !(punchProbe?.impactWorldSeparation >= 1.39) || !(punchProbe?.impactScreenSeparation >= 90)) throw new Error(`TPS resolved impact did not open the v3.1 contact lane: ${JSON.stringify(punchProbe)}`);',
          )
          PY

      - name: Verify targeted tests
        run: |
          npm ci --ignore-scripts
          node --import tsx --test tests/tps-mode.test.ts tests/tps-graphics.test.ts
          npm run lint

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/tps-game-base.ts src/game/tps-graphics.ts src/game/tps-hype.ts tests/tps-mode.test.ts tests/tps-graphics.test.ts scripts/capture-tps-visual-audit.mjs
          git diff --cached --check
          git commit -m "Refine v3 contact depth and impact readability"
          git push origin HEAD:improve/procedural-v3-contact-readability-2-20260902
