name: Apply Procedural Fight v4 kinetic chain

on:
  push:
    branches:
      - improve/procedural-v4-kinetic-chain-20260902
    paths:
      - .github/workflows/v4-kinetic-chain-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/procedural-v4-kinetic-chain-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply v4 kinetic-chain motion pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime_path = Path('src/game/motion-expansion-runtime.ts')
          profile_path = Path('src/game/motion-profile.ts')
          test_path = Path('tests/motion-expansion.test.ts')
          audit_path = Path('scripts/capture-motion-readability-audit.mjs')

          runtime = runtime_path.read_text()
          profile = profile_path.read_text()
          tests = test_path.read_text()
          audit = audit_path.read_text()

          # Target the actual rendered Quaternius skeleton whenever its runtime is available.
          style_pattern = re.compile(r'function styleTarget\(opponent: FighterRuntime, style: MotionStyle, side: -1 \| 1\): THREE\.Vector3 \{.*?\n\}\n\nconst FULL_BODY_BALANCE_VERSION', re.S)
          style_replacement = '''function targetRigPoint(opponent: FighterRuntime, importedName: string, fallback: THREE.Object3D): THREE.Vector3 {
            const opponentRuntime = runtimes.get(opponent.visual.root);
            if (opponentRuntime) {
              opponentRuntime.model.updateMatrixWorld(true);
              const imported = opponentRuntime.bones.get(importedName);
              if (imported) return imported.getWorldPosition(new THREE.Vector3());
            }
            return fallback.getWorldPosition(new THREE.Vector3());
          }

          function styleTarget(opponent: FighterRuntime, style: MotionStyle, side: -1 | 1): THREE.Vector3 {
            opponent.visual.root.updateMatrixWorld(true);
            const visual = opponent.visual.rig.bones;
            const opponentRuntime = runtimes.get(opponent.visual.root);
            const hips = targetRigPoint(opponent, "pelvis", visual.hips);
            const chest = targetRigPoint(opponent, "spine_03", visual.chest);
            const neck = targetRigPoint(opponent, "neck_01", visual.head);
            const importedHead = opponentRuntime?.bones.get("head");
            const head = importedHead
              ? importedHead.getWorldPosition(new THREE.Vector3())
              : neck.clone().add(new THREE.Vector3(0, 0.20, 0));
            const leftShin = targetRigPoint(opponent, "calf_l", visual.leftShin);
            const rightShin = targetRigPoint(opponent, "calf_r", visual.rightShin);
            const body = chest.clone().lerp(hips, 0.42);
            const legs = leftShin.clone().lerp(rightShin, 0.5).lerp(hips, 0.18);
            const forward = opponent.position.clone().sub(hips);
            forward.y = 0;
            if (forward.lengthSq() < 1e-6) forward.set(0, 0, 1);
            forward.normalize();
            const lateral = new THREE.Vector3(forward.z, 0, -forward.x);

            switch (style) {
              case "JAB":
              case "CROSS":
                return head.addScaledVector(lateral, side * 0.070);
              case "HOOK":
                return head.addScaledVector(lateral, side * 0.105);
              case "COUNTER":
                return head.addScaledVector(lateral, side * 0.085);
              case "BODY_BLOW":
                return body.lerp(hips, 0.22).addScaledVector(lateral, side * 0.055);
              case "HEAVY":
                return body.addScaledVector(lateral, side * 0.080);
              case "LOW_KICK":
                return legs.addScaledVector(lateral, side * 0.140);
              case "RISING_KICK":
                return body.lerp(head, 0.72).addScaledVector(lateral, side * 0.075);
              case "DASH_KICK":
                return body.lerp(chest, 0.42).addScaledVector(lateral, side * 0.090);
              case "FRONT_KICK":
                return body.lerp(chest, 0.28).addScaledVector(lateral, side * 0.055);
              default:
                return body;
            }
          }

          const FULL_BODY_BALANCE_VERSION'''
          runtime, count = style_pattern.subn(style_replacement, runtime)
          assert count == 1, f'styleTarget replacement count={count}'

          runtime = runtime.replace(
            'const V3_KICK_CONTACT_SOLVER = "KICK_CONTACT_SOLVER_V1";',
            'const V3_KICK_CONTACT_SOLVER = "KICK_CONTACT_SOLVER_V1";\nconst V4_KINETIC_CHAIN = "SUPPORT_HIP_CHEST_STRIKE_V1";\nconst V4_TARGET_RIG = "VISIBLE_IMPORTED_RIG_V1";'
          )

          # Add a style-specific pole library. Generic lateral poles were the main source of flared elbows and folded knees.
          marker = '/**\n * Preserve the imported authored animation and only bias the striking limb near\n'
          assert marker in runtime
          pole_helper = '''function strikePoleLocal(style: MotionStyle, foot: boolean, suffix: "l" | "r"): THREE.Vector3 {
            const side = suffix === "l" ? -1 : 1;
            if (foot) {
              switch (style) {
                case "LOW_KICK": return new THREE.Vector3(side * 0.50, 0.38, 0.28);
                case "RISING_KICK": return new THREE.Vector3(side * 0.18, 0.98, 0.50);
                case "DASH_KICK": return new THREE.Vector3(side * 0.16, 0.82, 0.58);
                default: return new THREE.Vector3(side * 0.18, 0.76, 0.54);
              }
            }
            switch (style) {
              case "HOOK": return new THREE.Vector3(side * 0.44, 0.94, 0.24);
              case "BODY_BLOW": return new THREE.Vector3(side * 0.28, 0.72, 0.40);
              case "HEAVY": return new THREE.Vector3(side * 0.32, 0.86, 0.38);
              case "COUNTER": return new THREE.Vector3(side * 0.24, 0.90, 0.42);
              default: return new THREE.Vector3(side * 0.22, 0.92, 0.44);
            }
          }

          '''
          runtime = runtime.replace(marker, pole_helper + marker)

          pole_pattern = re.compile(r'  const kickPole = foot\n.*?  const pole = fighter\.visual\.root\.localToWorld\(new THREE\.Vector3\(\n.*?\n  \)\);', re.S)
          pole_replacement = '''  fighter.visual.root.updateMatrixWorld(true);
            const pole = fighter.visual.root.localToWorld(strikePoleLocal(spec.style, foot, suffix));'''
          runtime, count = pole_pattern.subn(pole_replacement, runtime)
          assert count == 1, f'strike pole replacement count={count}'

          # Add phase-aware whole-body kinetic sequencing before final strike IK and support-foot lock.
          capture_marker = 'function captureFootLocks(runtime: ExpansionRuntime, fighter: FighterRuntime): void {'
          assert capture_marker in runtime
          kinetic = '''function kineticChainAccent(runtime: ExpansionRuntime, fighter: FighterRuntime, opponent: FighterRuntime): void {
            const move = fighter.currentMove;
            if (fighter.state !== "ATTACK" || !move) return;
            const spec = motionSpecForMove(move);
            const weights = attackWeights(fighter);
            const timing = motionTimingForMove(move);
            const dna = motionDnaForFighter(fighter.definition);
            const side = strikeSide(fighter);
            const launch = smooth01((weights.poseU - timing.hold) / Math.max(0.001, timing.impact - timing.hold));
            const commit = THREE.MathUtils.clamp(Math.max(weights.drive * 0.72, weights.impact), 0, 1);
            const load = THREE.MathUtils.clamp(1 - launch, 0, 1);
            const target = styleTarget(opponent, spec.style, side);
            runtime.model.updateMatrixWorld(true);
            const localTarget = runtime.model.worldToLocal(target.clone());
            const aimYaw = THREE.MathUtils.clamp(Math.atan2(localTarget.x, Math.max(0.30, Math.abs(localTarget.z))), -0.26, 0.26);
            const kick = spec.style === "FRONT_KICK" || spec.style === "LOW_KICK" || spec.style === "RISING_KICK" || spec.style === "DASH_KICK";

            if (!kick && spec.style !== "THROW") {
              const factor = spec.style === "HEAVY" ? 1.16
                : spec.style === "HOOK" ? 1.04
                : spec.style === "BODY_BLOW" ? 0.90
                : spec.style === "COUNTER" ? 0.86
                : spec.style === "CROSS" ? 0.78
                : 0.58;
              // Rear foot/hip starts the strike, ribcage follows, shoulder arrives last.
              addRotation(runtime, "pelvis", -0.010 * factor, -side * 0.024 * factor * load + side * 0.052 * factor * dna.hipLead * launch, side * 0.008 * factor, commit);
              addRotation(runtime, "spine_02", -0.014 * factor, -side * 0.016 * factor * load + side * 0.040 * factor * dna.chestFollow * launch + aimYaw * 0.12, side * 0.006 * factor, commit);
              addRotation(runtime, "spine_03", spec.style === "HEAVY" ? -0.050 : spec.style === "BODY_BLOW" ? -0.026 : -0.012, side * 0.025 * factor * launch + aimYaw * 0.10, -side * 0.006 * factor, commit);
              const strikeLeft = move.visualContact?.startsWith("LEFT") === true;
              const clavicle = strikeLeft ? "clavicle_l" : "clavicle_r";
              addRotation(runtime, clavicle, 0, side * 0.012 * factor, -side * 0.030 * factor, weights.impact);
              return;
            }

            if (kick) {
              const turn = spec.style === "LOW_KICK" ? 0.16 : spec.style === "RISING_KICK" ? 0.085 : spec.style === "DASH_KICK" ? 0.065 : 0.095;
              const backLean = spec.style === "RISING_KICK" ? 0.050 : spec.style === "DASH_KICK" ? 0.042 : spec.style === "FRONT_KICK" ? 0.035 : 0.012;
              // The support hip turns into the kick while the ribcage counterbalances.
              addRotation(runtime, "pelvis", -0.010, -side * turn * dna.hipLead, side * (spec.style === "LOW_KICK" ? 0.026 : 0.012), commit);
              addRotation(runtime, "spine_02", -backLean, side * turn * 0.28, -side * 0.018, commit);
              addRotation(runtime, "spine_03", -backLean * 0.72, side * turn * 0.16, -side * 0.026, commit);
              addRotation(runtime, "head", 0.006, -side * turn * 0.12, side * 0.012, commit);
            }
          }

          '''
          runtime = runtime.replace(capture_marker, kinetic + capture_marker)

          runtime = runtime.replace(
            '  solveCenterOfMass(runtime, fighter, opponent);\n  attackSilhouette(runtime, fighter);',
            '  solveCenterOfMass(runtime, fighter, opponent);\n  kineticChainAccent(runtime, fighter, opponent);\n  attackSilhouette(runtime, fighter);'
          )
          runtime = runtime.replace(
            '  fighter.visual.root.userData.motionExpansionKickContactSolver = V3_KICK_CONTACT_SOLVER;\n  fighter.visual.root.userData.motionExpansionStrikeContactError = strikeContactError;',
            '  fighter.visual.root.userData.motionExpansionKickContactSolver = V3_KICK_CONTACT_SOLVER;\n  fighter.visual.root.userData.motionExpansionKineticChain = V4_KINETIC_CHAIN;\n  fighter.visual.root.userData.motionExpansionTargetRig = runtimes.get(opponent.visual.root) ? V4_TARGET_RIG : "LEGACY_VISUAL_RIG_FALLBACK";\n  fighter.visual.root.userData.motionExpansionStrikeContactError = strikeContactError;'
          )

          # Increase punch target bias moderately now that elbow poles and body chain are constrained.
          replacements = {
            'jab: { clip: "PF_Jab_L", style: "JAB", speedScale: 1.08, contactBlend: 0.24, plantFoot: "RIGHT" }': 'jab: { clip: "PF_Jab_L", style: "JAB", speedScale: 1.08, contactBlend: 0.34, plantFoot: "RIGHT" }',
            'straight: { clip: "PF_Cross_R", style: "CROSS", speedScale: 1.02, contactBlend: 0.28, plantFoot: "LEFT" }': 'straight: { clip: "PF_Cross_R", style: "CROSS", speedScale: 1.02, contactBlend: 0.40, plantFoot: "LEFT" }',
            'backfist: { clip: "PF_Backfist_R", recoveryClip: "PF_HeavyRecover", style: "HOOK", speedScale: 1.0, contactBlend: 0.31, plantFoot: "LEFT" }': 'backfist: { clip: "PF_Backfist_R", recoveryClip: "PF_HeavyRecover", style: "HOOK", speedScale: 1.0, contactBlend: 0.42, plantFoot: "LEFT" }',
            'bodyBlow: { clip: "PF_BodyBlow_L", style: "BODY_BLOW", speedScale: 1.05, contactBlend: 0.31, plantFoot: "RIGHT" }': 'bodyBlow: { clip: "PF_BodyBlow_L", style: "BODY_BLOW", speedScale: 1.05, contactBlend: 0.40, plantFoot: "RIGHT" }',
            'power: { clip: "PF_Power_R", recoveryClip: "PF_HeavyRecover", style: "HEAVY", speedScale: 0.92, contactBlend: 0.36, plantFoot: "LEFT" }': 'power: { clip: "PF_Power_R", recoveryClip: "PF_HeavyRecover", style: "HEAVY", speedScale: 0.92, contactBlend: 0.46, plantFoot: "LEFT" }',
            'counter: { clip: "PF_Counter_L", style: "COUNTER", speedScale: 1.08, contactBlend: 0.29, plantFoot: "RIGHT" }': 'counter: { clip: "PF_Counter_L", style: "COUNTER", speedScale: 1.08, contactBlend: 0.42, plantFoot: "RIGHT" }',
          }
          for old, new in replacements.items():
            assert old in profile, old
            profile = profile.replace(old, new)

          # Extend audit telemetry so real WebGL proves the new chain is active.
          audit = audit.replace(
            '        comPolicy: root.userData.motionExpansionComPolicy ?? null,\n        motionDna: root.userData.motionExpansionMotionDna ?? null,',
            '        comPolicy: root.userData.motionExpansionComPolicy ?? null,\n        kineticChain: root.userData.motionExpansionKineticChain ?? null,\n        targetRig: root.userData.motionExpansionTargetRig ?? null,\n        motionDna: root.userData.motionExpansionMotionDna ?? null,'
          )
          audit = audit.replace(
            '    if (result.motionDna !== "KAIRO_POWER") {',
            '    if (result.kineticChain !== "SUPPORT_HIP_CHEST_STRIKE_V1" || result.targetRig !== "VISIBLE_IMPORTED_RIG_V1") {\n      throw new Error(`Motion ${moveId} did not use the v4 kinetic chain / visible target rig: ${JSON.stringify(result)}`);\n    }\n    if (result.motionDna !== "KAIRO_POWER") {'
          )

          # Regression tests for the new solver contracts and higher-but-bounded punch reach.
          tests = tests.replace(
            '  assert.match(source, /fullBodyStrikeSolve/);',
            '  assert.match(source, /fullBodyStrikeSolve/);\n  assert.match(source, /kineticChainAccent/);\n  assert.match(source, /SUPPORT_HIP_CHEST_STRIKE_V1/);\n  assert.match(source, /VISIBLE_IMPORTED_RIG_V1/);\n  assert.match(source, /strikePoleLocal/);\n  assert.match(source, /targetRigPoint/);'
          )
          tests = tests.replace(
            '  assert.ok(kick.contactBlend >= 0.82 && kick.contactBlend <= 0.90);',
            '  assert.ok(jab.contactBlend >= 0.32 && jab.contactBlend <= 0.38);\n  assert.ok(backfist.contactBlend >= 0.40 && backfist.contactBlend <= 0.46);\n  assert.ok(body.contactBlend >= 0.38 && body.contactBlend <= 0.44);\n  assert.ok(power.contactBlend >= 0.44 && power.contactBlend <= 0.50);\n  assert.ok(kick.contactBlend >= 0.82 && kick.contactBlend <= 0.90);'
          )

          runtime_path.write_text(runtime)
          profile_path.write_text(profile)
          test_path.write_text(tests)
          audit_path.write_text(audit)
          PY
      - name: Validate targeted motion suite
        run: |
          npm run test:ci:tps
          npm run lint
          npm run build
      - name: Commit kinetic-chain pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/motion-expansion-runtime.ts src/game/motion-profile.ts tests/motion-expansion.test.ts scripts/capture-motion-readability-audit.mjs
          git commit -m "Naturalize full-body combat motion with kinetic-chain IK"
          git push origin HEAD:improve/procedural-v4-kinetic-chain-20260902
