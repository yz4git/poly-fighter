name: Reactable Enemy Attack Audit Fix Helper

on:
  push:
    branches: [reactable-enemy-attacks-v1]
    paths:
      - .github/workflows/reactable-enemy-audit-fix-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reactable-enemy-attacks-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Tighten threat range and add browser proof
        run: |
          python3 - <<'PY'
          from pathlib import Path

          base = Path('src/game/tps-game-base.ts')
          source = base.read_text()

          old = '''      const incomingMove = activeIncomingMove ?? (pendingReaction ? pendingMove : null);\n      const incomingDistance = Math.hypot(this.p2.position.x - this.p1.position.x, this.p2.position.z - this.p1.position.z);\n      const incomingFrames = activeIncomingMove\n'''
          new = '''      const incomingMove = activeIncomingMove ?? (pendingReaction ? pendingMove : null);\n      const incomingDistance = Math.hypot(this.p2.position.x - this.p1.position.x, this.p2.position.z - this.p1.position.z);\n      const incomingThreatReach = incomingMove\n        ? incomingMove.reach + (this.enemyDirectorPendingMove === \"dashKick\" ? 1.8 : 0.9)\n        : 0;\n      const incomingFrames = activeIncomingMove\n'''
          if old not in source: raise SystemExit('missing incoming move anchor')
          source = source.replace(old, new, 1)

          old = '''        && incomingFrames > 0\n        && incomingDistance <= incomingMove.reach + 0.9\n      );\n'''
          new = '''        && incomingFrames > 0\n        && incomingDistance <= incomingThreatReach\n      );\n'''
          if old not in source: raise SystemExit('missing incoming reach anchor')
          source = source.replace(old, new, 1)

          old = '''    if (interceptStrike) {\n      this.playerInterceptTicks = 0;\n      this.enemyDirectorPendingMove = null;\n      this.enemyDirectorTelegraphTicks = 0;\n      this.enemyDirectorDecision = null;\n'''
          new = '''    if (interceptStrike) {\n      this.playerInterceptTicks = 0;\n      this.enemyDirectorPendingMove = null;\n      this.enemyDirectorTelegraphTicks = 0;\n      this.enemyDirectorTelegraphTotalTicks = 0;\n      this.p2.visual.root.userData.tpsEnemyTelegraphProgress = 0;\n      this.p2.visual.root.userData.tpsEnemyTelegraphMove = null;\n      this.p2.visual.root.userData.tpsEnemyTelegraphPhase = \"INTERRUPTED\";\n      this.enemyDirectorDecision = null;\n'''
          if old not in source: raise SystemExit('missing intercept clear anchor')
          source = source.replace(old, new, 1)

          old = '''  private enemyThreatStatus(): { windup: boolean; incoming: boolean } {\n    const pending = this.enemyDirectorPendingMove !== null && this.enemyDirectorTelegraphTicks > 0;\n    const lateWindup = pending && this.enemyDirectorTelegraphTicks <= this.enemyReactionWindowTicks();\n    const windup = pending && !lateWindup;\n    const move = this.p2.currentMove;\n'''
          new = '''  private enemyThreatStatus(): { windup: boolean; incoming: boolean } {\n    const pending = this.enemyDirectorPendingMove !== null && this.enemyDirectorTelegraphTicks > 0;\n    const pendingMove = this.enemyDirectorPendingMove ? this.p2.definition.moves[this.enemyDirectorPendingMove] ?? null : null;\n    const pendingDistance = Math.hypot(\n      this.p2.position.x - this.p1.position.x,\n      this.p2.position.z - this.p1.position.z,\n    );\n    const pendingThreatReach = pendingMove\n      ? pendingMove.reach + (pendingMove.id === \"dashKick\" ? 1.8 : 0.9)\n      : 0;\n    const lateWindup = Boolean(\n      pending\n      && pendingMove\n      && this.enemyDirectorTelegraphTicks <= this.enemyReactionWindowTicks()\n      && pendingDistance <= pendingThreatReach\n    );\n    const windup = pending && !lateWindup;\n    const move = this.p2.currentMove;\n'''
          if old not in source: raise SystemExit('missing threat status anchor')
          source = source.replace(old, new, 1)
          base.write_text(source)

          audit = Path('scripts/capture-tps-combat-v2-audit.mjs')
          asource = audit.read_text()

          old = '''  game.enemyDirectorPendingMove = null;\n  game.enemyDirectorTelegraphTicks = 0;\n  game.enemyDirectorDecision = null;\n'''
          new = '''  game.enemyDirectorPendingMove = null;\n  game.enemyDirectorTelegraphTicks = 0;\n  game.enemyDirectorTelegraphTotalTicks = 0;\n  game.enemyDirectorDecision = null;\n  game.p2.visual.root.userData.tpsEnemyTelegraphProgress = 0;\n  game.p2.visual.root.userData.tpsEnemyTelegraphMove = null;\n  game.p2.visual.root.userData.tpsEnemyTelegraphPhase = 'NONE';\n'''
          if old not in asource: raise SystemExit('missing audit reset anchor')
          asource = asource.replace(old, new, 1)

          old = '''  const intercept = await execute(sessionId, `${gameLookup}\n    const game = findGame();\n    ${resetSnippet}\n    game.enemyDirectorPendingMove = 'power';\n    game.enemyDirectorTelegraphTicks = 10;\n    game.enemyDirectorDecision = {\n      intent: 'POWER', holdTicks: 1, telegraphTicks: 10,\n'''
          new = '''  const reactableStep = await execute(sessionId, `${gameLookup}\n    const game = findGame();\n    ${resetSnippet}\n    game.p1.position.set(0, 0, 0.72);\n    game.p2.position.set(0, 0, -0.72);\n    game.enemyDirectorPendingMove = 'jab';\n    game.enemyDirectorTelegraphTicks = 12;\n    game.enemyDirectorTelegraphTotalTicks = 18;\n    game.enemyDirectorDecision = {\n      intent: 'JAB', holdTicks: 1, telegraphTicks: 18,\n      reason: 'reactable-step-audit', comebackMercy: 0, pressure: 0,\n    };\n    game.p2.visual.root.userData.tpsEnemyTelegraphProgress = 1 - 12 / 18;\n    game.p2.visual.root.userData.tpsEnemyTelegraphMove = 'jab';\n    game.p2.visual.root.userData.tpsEnemyTelegraphPhase = 'REACT';\n    const threatBefore = game.enemyThreatStatus();\n    game.press('right', 'reactable-step-side');\n    game.press('guard', 'reactable-step');\n    game.step();\n    game.release('guard', 'reactable-step');\n    game.release('right', 'reactable-step-side');\n    const trackedBeforeAttack = game.playerStepThreatTicks;\n    let steps = 1;\n    while (steps < 60 && game.trainingProgress.perfectEvades < 1) {\n      game.renderTime += 1 / 60;\n      game.step();\n      steps += 1;\n    }\n    game.updateCamera(1 / 60);\n    game.updateLockOn();\n    game.renderer.render(game.scene, game.camera);\n    return {\n      steps,\n      threatBefore,\n      trackedBeforeAttack,\n      perfectEvades: game.trainingProgress.perfectEvades,\n      p1Health: game.p1.health,\n      reversalTicks: game.playerReversalTicks,\n      beat: game.combatBeatLabel,\n    };\n  `);\n  await delay(60);\n  if (!reactableStep?.threatBefore?.incoming || reactableStep?.threatBefore?.windup || reactableStep?.trackedBeforeAttack <= 0 || reactableStep?.perfectEvades < 1 || reactableStep?.p1Health < 100) {\n    throw new Error(`REACTABLE STEP browser probe failed: ${JSON.stringify(reactableStep)}`);\n  }\n  await screenshot(sessionId, `${outputDir}/tps-reactable-step.png`);\n\n  const intercept = await execute(sessionId, `${gameLookup}\n    const game = findGame();\n    ${resetSnippet}\n    game.enemyDirectorPendingMove = 'power';\n    game.enemyDirectorTelegraphTicks = 18;\n    game.enemyDirectorTelegraphTotalTicks = 23;\n    game.enemyDirectorDecision = {\n      intent: 'POWER', holdTicks: 1, telegraphTicks: 18,\n'''
          if old not in asource: raise SystemExit('missing intercept probe anchor')
          asource = asource.replace(old, new, 1)
          audit.write_text(asource)

          tests = Path('tests/tps-rival-core.test.ts')
          tsource = tests.read_text()
          old = '''  assert.match(source, /tpsEnemyTelegraphPhase/);\n  assert.match(presentation, /tpsEnemyTelegraphProgress/);\n'''
          new = '''  assert.match(source, /tpsEnemyTelegraphPhase/);\n  assert.match(source, /INTERRUPTED/);\n  assert.match(source, /pendingThreatReach/);\n  assert.match(source, /incomingThreatReach/);\n  assert.match(presentation, /tpsEnemyTelegraphProgress/);\n'''
          if old not in tsource: raise SystemExit('missing phase9 test anchor')
          tests.write_text(tsource.replace(old, new, 1))
          PY
      - run: npm ci --no-audit --no-fund
      - name: TPS regression suite
        run: npm run test:ci:tps
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit final fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/tps-game-base.ts scripts/capture-tps-combat-v2-audit.mjs tests/tps-rival-core.test.ts
          git commit -m "Prove reactable STEP timing in WebGL audit"
          git push origin HEAD:reactable-enemy-attacks-v1
