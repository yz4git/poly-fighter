name: One-shot KO presentation combo HUD retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ko-presentation-combo-hud-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Reapply implementation and update legacy winner regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/ko-presentation-combo-hud-pass.yml').read_text()
          start = source.index("          from pathlib import Path\n", source.index("python3 - <<'PY'"))
          end = source.index("\n          PY", start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/ko_patch.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/ko_patch.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/tps-mode.test.ts')
          text = path.read_text()
          old1 = 'assert.match(source, /p1Wins: this\\.resultWinner === "p1" \\? 1 : 0/);'
          old2 = 'assert.match(source, /p2Wins: this\\.resultWinner === "p2" \\? 1 : 0/);'
          new1 = 'assert.match(source, /p1Wins: this\\.finished && this\\.resultWinner === "p1" \\? 1 : 0/);'
          new2 = 'assert.match(source, /p2Wins: this\\.finished && this\\.resultWinner === "p2" \\? 1 : 0/);'
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise SystemExit('legacy TPS winner assertions not found exactly once')
          path.write_text(text.replace(old1, new1).replace(old2, new2))
          PY
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate TPS, lint, and production build
        run: |
          npm run test:ci:tps
          npm run lint
          npm run build
      - name: Commit implementation and clean one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/ko-presentation-combo-hud-pass.yml .github/workflows/ko-presentation-combo-hud-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Show KO landing before TPS result and move combo HUD"
          git push origin HEAD:main
