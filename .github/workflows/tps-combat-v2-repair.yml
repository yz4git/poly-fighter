name: TPS Combat v2 repair and validate

on:
  push:
    branches: [tps-combat-v2]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tps-combat-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply corrected TPS Combat v2 patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, textwrap

          helper = Path('.github/workflows/tps-combat-v2-impl.yml').read_text()
          match = re.search(r"python3 - <<'PY'\n(.*?)\n          PY", helper, flags=re.S)
          if not match:
              raise SystemExit('unable to extract TPS Combat v2 patch helper')
          script = textwrap.dedent(match.group(1))
          script = script.replace('&& distance > 1.65', '&& liveDistance > 1.65')
          script = script.replace('&& distance < 1.85', '&& liveDistance < 1.85')
          script = script.replace('&& distance < 2.0', '&& liveDistance < 2.0')
          exec(compile(script, 'tps-combat-v2-extracted.py', 'exec'), {'__name__': '__main__'})

          tests = Path('tests/tps-mode.test.ts')
          text = tests.read_text()
          replacements = {
              'assert.match(source, /const flankStrike = attacker === this\\.p1/);': 'assert.match(source, /const interceptStrike = attacker === this\\.p1/);',
              'assert.match(source, /&& !flankStrike/);': 'assert.match(source, /&& !reversalStrike && !interceptStrike/);',
              'assert.match(page, /"punch", "Attack", tpsPunish \\? "PUNISH" : "ATTACK"/);': 'assert.match(page, /"punch", "Attack", tpsPunish \\? "PUNISH" : tpsIntercept \\? "INTERCEPT" : "ATTACK"/);',
              'assert.match(page, /tpsPunish \\? "PUNISH" : "ATTACK"/);': 'assert.match(page, /tpsPunish \\? "PUNISH" : tpsIntercept \\? "INTERCEPT" : "ATTACK"/);',
              'assert.match(page, /\\["PERFECT STEP", "FLANK OPEN"\\]/);': 'assert.match(page, /\\["PERFECT STEP", "FLANK OPEN", "REVERSAL"\\]/);',
              'assert.match(page, /TAP COMBO/);': 'assert.match(page, /STEP OR INTERCEPT/);',
              'assert.match(page, /SIDE STEP/);': 'assert.match(page, /→ REVERSAL/);',
              'assert.match(page, /BACK STEP = SPACE/);': 'assert.match(page, /WINDUP/);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing test expectation anchor: {old}')
              text = text.replace(old, new, 1)
          tests.write_text(text)
          PY
          git diff --check
          node --import tsx --test tests/tps-mode.test.ts
          npm run lint
          npm run build
      - name: Commit validated TPS Combat v2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/tps-game-base.ts app/page.tsx app/playtest-polish.css tests/tps-mode.test.ts
          git commit -m "Implement TPS Combat v2"
          git push origin HEAD:tps-combat-v2
