name: Apply motion afterfeel combo links

on:
  push:
    branches: [improve/motion-afterfeel-combo-links-20260902]
    paths:
      - scripts/apply-motion-afterfeel-combo-links.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/motion-afterfeel-combo-links-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply motion and combo link pass
        run: python3 scripts/apply-motion-afterfeel-combo-links.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run TPS regression
        run: npm run test:rules:tps
      - name: Run lint
        run: npm run lint
      - name: Build production
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/motion-profile.ts src/game/tps-game.ts src/game/motion-expansion-runtime.ts tests/motion-expansion.test.ts tests/tps-mode.test.ts
          if git diff --cached --quiet; then
            echo "No implementation changes"
          else
            git commit -m "Add motion afterfeel and authored combo link windows"
            git push origin HEAD:improve/motion-afterfeel-combo-links-20260902
          fi