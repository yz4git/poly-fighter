name: Apply arm and fist playtest fix

on:
  push:
    paths:
      - '.github/workflows/tps-audit-ghost-capture-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arm-fist-playtest-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply arm/fist source fix
        run: python3 scripts/apply-arm-fist-playtest-fix.py
      - name: Publish source fix to review branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/visual-quaternius-runtime.ts src/game/quaternius-graphics-polish.ts tests/quaternius-model-skin.test.ts scripts/capture-motion-readability-audit.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Fix imported forearms and restore fist silhouettes [arm-fist-auto]"
            git push origin HEAD:fix/arm-fist-playtest-20260901
          fi
      - run: npm ci --no-audit --no-fund
      - name: TPS regression suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run test:ci:tps 2>&1 | tee arm-fist-test.log
      - name: Publish regression log
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arm-fist-test.log
          if ! git diff --cached --quiet; then
            git commit -m "Record arm fist regression output [arm-fist-log]"
            git push origin HEAD:fix/arm-fist-playtest-20260901
          fi
      - name: Stop on regression failure
        if: steps.tests.outcome != 'success'
        run: exit 1
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
