name: Apply kick ankle continuity fix once

on:
  push:
    branches: [kick-ankle-anatomy-v8]
    paths:
      - .github/workflows/kick-ankle-continuity-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kick-ankle-anatomy-v8
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Author continuous anatomical kick ankles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/game/combat-motion-authoring.ts')
          s = p.read_text()
          old = '''  const ankleFrames = new Map(["l", "r"].map(suffix => {
              const foot = nodes.get(`foot_${suffix}`)!;
              const calf = nodes.get(`calf_${suffix}`)!;
              const ball = nodes.get(`ball_${suffix}`)!;
              const toe = nodes.get(`ball_leaf_${suffix}`)!;
              const forward = toe.getWorldPosition(new THREE.Vector3()).sub(ball.getWorldPosition(new THREE.Vector3())).normalize();
              const localForward = forward.clone().applyQuaternion(calf.getWorldQuaternion(new THREE.Quaternion()).invert());
              const flexAxis = foot.position.clone().normalize().cross(localForward).normalize();
              const flatForward = forward.clone().setY(0).normalize();
              return [suffix, { flexAxis, flatForward }] as const;
            }));'''
          new = '''  const ankleFrames = new Map(["l", "r"].map(suffix => {
              const foot = nodes.get(`foot_${suffix}`)!;
              const calf = nodes.get(`calf_${suffix}`)!;
              const ball = nodes.get(`ball_${suffix}`)!;
              const toe = nodes.get(`ball_leaf_${suffix}`)!;
              const forward = toe.getWorldPosition(new THREE.Vector3()).sub(ball.getWorldPosition(new THREE.Vector3())).normalize();
              const restShin = foot.getWorldPosition(new THREE.Vector3()).sub(calf.getWorldPosition(new THREE.Vector3())).normalize();
              const toeLocal = forward.clone().applyQuaternion(bindWorld.get(`foot_${suffix}`)!.clone().invert()).normalize();
              const restPlane = forward.clone().addScaledVector(restShin, -forward.dot(restShin));
              if (restPlane.lengthSq() < 1e-8) restPlane.crossVectors(restShin, Math.abs(restShin.y) < .9 ? Y : Z);
              restPlane.normalize();
              const flatForward = forward.clone().setY(0).normalize();
              return [suffix, { toeLocal, restPlane, flatForward }] as const;
            }));
            // Carry corrected visible boot orientation between authored samples. The
            // next sample only rotates as much as anatomy requires, rather than copying
            // unstable calf axial twist from the retargeted source.
            const ankleWorldContinuity = new Map<string, THREE.Quaternion>();'''
          if old not in s:
              raise SystemExit('ankle calibration anchor missing')
          s = s.replace(old, new, 1)
          old = '''    const weight = smoothMotion((u - .04) / .20) * (1 - smoothMotion((u - .80) / .20));'''
          new = '''    // The common ready-pose stitch below owns the exit blend. Keep the ankle
              // correction authoritative through recovery so it does not double-fade.
              const weight = smoothMotion((u - .04) / .20);'''
          if old not in s:
              raise SystemExit('ankle weight anchor missing')
          s = s.replace(old, new, 1)
          old = '''        const degrees = suffix !== strike ? -24 : name === "BF_LowKick_L" ? -32 : name === "BF_RisingKick_R" ? -12 : 8;
                  const desired = new THREE.Quaternion().setFromAxisAngle(frame.flexAxis, THREE.MathUtils.degToRad(degrees)).multiply(bind.get(`foot_${suffix}`)!.rotation);
                  foot.quaternion.slerp(desired, weight);'''
          new = '''        const calf = nodes.get(`calf_${suffix}`)!;
                  const shin = foot.getWorldPosition(new THREE.Vector3()).sub(calf.getWorldPosition(new THREE.Vector3())).normalize();
                  const isStrike = suffix === strike;
                  const centerDegrees = !isStrike ? 80 : name === "BF_LowKick_L" ? 60 : name === "BF_RisingKick_R" ? 80 : 100;
                  // Author a small safety margin inside the public contract. The final
                  // ready-pose stitch and real male/female rest rolls can move the measured
                  // shin/toe angle by a fraction of a degree after this correction.
                  const minDegrees = !isStrike ? 47 : name === "BF_LowKick_L" ? 47 : name === "BF_RisingKick_R" ? 67 : 87;
                  const maxDegrees = !isStrike ? 118 : name === "BF_LowKick_L" ? 73 : name === "BF_RisingKick_R" ? 93 : 113;
                  const continuityKey = `${name}:${suffix}`;
                  if (u <= 1e-7) ankleWorldContinuity.delete(continuityKey);
                  const currentWorld = foot.getWorldQuaternion(new THREE.Quaternion());
                  const previousWorld = ankleWorldContinuity.get(continuityKey)?.clone() ?? currentWorld.clone();
                  const toeFor = (q: THREE.Quaternion) => frame.toeLocal.clone().applyQuaternion(q).normalize();
                  const ankleFor = (q: THREE.Quaternion) => THREE.MathUtils.radToDeg(shin.angleTo(toeFor(q)));
                  const previousToe = toeFor(previousWorld);
                  const plane = previousToe.clone().addScaledVector(shin, -previousToe.dot(shin));
                  if (plane.lengthSq() < 1e-8) {
                    plane.copy(frame.restPlane).addScaledVector(shin, -frame.restPlane.dot(shin));
                    if (plane.lengthSq() < 1e-8) plane.crossVectors(shin, Math.abs(shin.y) < .9 ? Y : Z);
                  }
                  plane.normalize();
                  const center = THREE.MathUtils.degToRad(centerDegrees);
                  const targetToe = shin.clone().multiplyScalar(Math.cos(center)).addScaledVector(plane, Math.sin(center)).normalize();
                  const exactWorld = new THREE.Quaternion().setFromUnitVectors(previousToe, targetToe).multiply(previousWorld).normalize();
                  // If the previous visible boot orientation is still anatomically valid
                  // against the new shin direction, keep it exactly. Otherwise walk only
                  // far enough toward the cone center to re-enter the accepted range.
                  let targetWorld = previousWorld.clone();
                  const previousAngle = ankleFor(previousWorld);
                  if (previousAngle < minDegrees || previousAngle > maxDegrees) {
                    let lo = 0;
                    let hi = 1;
                    for (let iteration = 0; iteration < 18; iteration++) {
                      const mid = (lo + hi) * .5;
                      const candidate = previousWorld.clone().slerp(exactWorld, mid).normalize();
                      const candidateAngle = ankleFor(candidate);
                      if (candidateAngle >= minDegrees && candidateAngle <= maxDegrees) hi = mid;
                      else lo = mid;
                    }
                    targetWorld = previousWorld.clone().slerp(exactWorld, hi).normalize();
                  }
                  const correctedWorld = currentWorld.clone().slerp(targetWorld, weight).normalize();
                  worldRotation(foot, correctedWorld);
                  ankleWorldContinuity.set(continuityKey, foot.getWorldQuaternion(new THREE.Quaternion()));'''
          if old not in s:
              raise SystemExit('strike ankle anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Validate ankle anatomy on both real skeletons
        run: node --import tsx --test tests/combat-motion.test.ts tests/kick-ankle.test.ts
      - run: npm run test:ci:tps
      - run: npm run lint
      - run: npm run build
      - name: Commit verified fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/kick-ankle-continuity-fix-once.yml
          git add src/game/combat-motion-authoring.ts tests/kick-ankle.test.ts
          git commit -m "Fix kick ankle twist continuity"
          git push origin HEAD:kick-ankle-anatomy-v8
