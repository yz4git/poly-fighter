name: One-shot kick naturalness v3 retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-naturalness-v3-retry.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reapply naturalness patch and relax low-kick extension
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/kick-naturalness-v3-implementation.yml').read_text().splitlines()
          marker = "          python3 - <<'PY'"
          start = source.index(marker) + 1
          end = next(i for i in range(start, len(source)) if source[i] == '          PY')
          patch = '\n'.join(line[10:] if line.startswith('          ') else line for line in source[start:end])
          exec(compile(patch, '<kick-v3-patch>', 'exec'), {})

          p = Path('tools/blender/build-fight-motion-foundry-v2-kicks.py')
          s = p.read_text()
          old = '''        (0.18, 0.22, 0.20),
        (0.40, 0.34, 0.18),
        (0.42, 0.42, 0.17),
        (0.02, 0.10, 0.14),'''
          new = '''        (0.18, 0.18, 0.20),
        (0.34, 0.27, 0.18),
        (0.36, 0.31, 0.17),
        (0.02, 0.08, 0.14),'''
          if old not in s:
              raise SystemExit('patched low-kick offsets not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              'foot_yaw=(0.0, 12.0, 38.0, 72.0, 86.0, 18.0, 0.0),\n    support_yaw=(0.0, 4.0, 14.0, 30.0, 38.0, 10.0, 0.0),',
              'foot_yaw=(0.0, 10.0, 34.0, 66.0, 78.0, 16.0, 0.0),\n    support_yaw=(0.0, 3.0, 12.0, 26.0, 32.0, 8.0, 0.0),',
              1,
          )
          p.write_text(s)

          t = Path('tests/blender-motion-foundry-v2-kicks.test.mjs')
          ts = t.read_text().replace(
              '  assert.match(workflow, /supportFootLockMaxAngularDriftDegrees/);',
              '  assert.match(workflow, /supportFootPivotMaxDegrees/);',
              1,
          )
          ts = ts.replace(
              'assert.ok(low.supportFootPivotMaxDegrees > 24 && low.supportFootPivotMaxDegrees < 48, low.supportFootPivotMaxDegrees);',
              'assert.ok(low.supportFootPivotMaxDegrees > 20 && low.supportFootPivotMaxDegrees < 40, low.supportFootPivotMaxDegrees);\n  assert.ok(low.strikeKneeExtensionDegrees > 145 && low.strikeKneeExtensionDegrees < 174, low.strikeKneeExtensionDegrees);',
              1,
          )
          t.write_text(ts)
          PY
      - name: Fetch pinned UAL authoring source
        run: |
          set -euxo pipefail
          mkdir -p .tmp-quaternius
          BASE_PIN=aa02a4e6d8337a0604d2da131bcbbeb1f01badf0
          BASE_URL=https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/$BASE_PIN/public/assets/vendor/quaternius
          curl -L --fail --retry 3 "$BASE_URL/universal-animation-library.glb" -o .tmp-quaternius/ual1-full.glb
          echo '4c748767741a3e495d89667b9a218b690ba9810b9517a12e960780e3ca72c4e9  .tmp-quaternius/ual1-full.glb' | sha256sum -c -
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri xvfb
      - name: Regenerate natural kick pack
        run: |
          set -euo pipefail
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          out="artifacts/kick-v3-build"
          mkdir -p "$out"
          xvfb-run -a blender --background --python-use-system-env --python-exit-code 1 --python tools/blender/build-fight-motion-foundry-v2-kicks.py -- --source .tmp-quaternius/ual1-full.glb --output-dir "$out"
          cp "$out/blender-kicks-core.glb" public/models/quaternius/blender-kicks-core.glb
          cp "$out/blender-kicks-core.metrics.json" public/models/quaternius/blender-kicks-core.metrics.json
          kick_hash="$(cat tools/blender/build-fight-motion-foundry-v1.py tools/blender/motion_foundry_v2_rig.py tools/blender/build-fight-motion-foundry-v2-kicks.py | sha256sum | awk '{print $1}')"
          printf '%s\n' "$kick_hash" > public/models/quaternius/blender-kicks-core.generator.sha256
          cat public/models/quaternius/blender-kicks-core.metrics.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate regenerated kicks
        run: |
          node --test tests/blender-motion-foundry-v2-kicks.test.mjs
          npm run test:ci:tps
          npm run lint
          npm run build
      - name: Start preview for post-fix screen audit
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-kick-v3-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/poly-fighter-kick-v3-server.log
          exit 1
      - name: Capture post-fix kicks
        run: |
          mkdir -p artifacts/kick-v3-screen/model-view artifacts/kick-v3-screen/tps artifacts/kick-v3-screen/tps-gameplay
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" MODEL_VIEW_AUDIT_DIR="artifacts/kick-v3-screen/model-view" node scripts/capture-model-view-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/kick-v3-screen/tps" node scripts/capture-motion-readability-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/kick-v3-screen/tps-gameplay" node scripts/capture-tps-visual-audit.mjs
          cp public/models/quaternius/blender-kicks-core.metrics.json artifacts/kick-v3-screen/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kick-naturalness-v3-retry-after
          path: |
            artifacts/kick-v3-build
            artifacts/kick-v3-screen
          if-no-files-found: error
          retention-days: 14
      - name: Commit regenerated natural kicks and clean workflows
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/kick-naturalness-v3-implementation.yml .github/workflows/kick-naturalness-v3-retry.yml
          git add tools/blender/build-fight-motion-foundry-v2-kicks.py tests/blender-motion-foundry-v2-kicks.test.mjs .github/workflows/blender-motion-foundry-v2-kicks.yml public/models/quaternius/blender-kicks-core.glb public/models/quaternius/blender-kicks-core.metrics.json public/models/quaternius/blender-kicks-core.generator.sha256
          git commit -m 'Rebuild kicks with natural support pivot and body mechanics'
          git push
