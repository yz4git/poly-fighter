name: Refresh v7.3 kick audit contract

on:
  push:
    branches:
      - improve/procedural-v7-kick-kinematics-20260902
    paths:
      - .github/workflows/v73-kick-plant-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/procedural-v7-kick-kinematics-20260902
      - name: Update readability audit to v7.3 solver contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/capture-motion-readability-audit.mjs')
          s = p.read_text()
          old = 'result.kickContactSolver !== "KICK_CONTACT_SOLVER_V1"'
          new = 'result.kickContactSolver !== "KICK_CONTACT_SOLVER_V2_PLANT_COMPENSATED"'
          if old not in s:
              if new in s:
                  raise SystemExit(0)
              raise SystemExit('kick solver audit anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate audit contract
        run: |
          npm run test:ci:tps
          npm run lint
          npm run build
      - name: Commit audit contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-motion-readability-audit.mjs
          git commit -m "Update kick readability audit for v7.3 solver"
          git push origin HEAD:improve/procedural-v7-kick-kinematics-20260902
