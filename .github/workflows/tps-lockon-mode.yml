name: Apply TPS lock-on battle mode

on:
  push:
    paths:
      - ".github/workflows/tps-lockon-mode.yml"
      - "scripts/apply-tps-lockon-mode.mjs"
      - "src/game/tps-game.ts"
      - "tests/tps-mode.test.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply TPS integration
        run: node scripts/apply-tps-lockon-mode.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test fighting rules and TPS mode
        run: npm run test:rules

      - name: Test PWA
        run: npm run test:pwa

      - name: Build production app
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Publish validated TPS mode
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css src/game/tps-game.ts package.json public/sw.js tests/pwa-cache.test.mjs tests/tps-mode.test.ts
          if git diff --cached --quiet; then
            echo "TPS mode already current"
            exit 0
          fi
          git commit -m "Integrate TPS lock-on battle mode"
          git push origin HEAD:main
