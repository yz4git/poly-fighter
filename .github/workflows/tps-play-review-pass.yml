name: Apply TPS play review quality pass

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/apply-tps-play-review-pass.mjs
      - .github/workflows/tps-play-review-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Protect nested audit template literals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-tps-play-review-pass.mjs')
          source = path.read_text()
          needle = 'import { readFile, writeFile } from "node:fs/promises";\n'
          replacement = '''import { readFile, writeFile } from "node:fs/promises";\n\nconst outputDir = '${outputDir}';\nconst sessionId = '${sessionId}';\nconst gameLookup = '${gameLookup}';\nconst iphone = { toJSON: () => '${JSON.stringify(iphone)}' };\n'''
          if needle not in source:
              raise SystemExit('apply script import marker not found')
          path.write_text(source.replace(needle, replacement, 1))
          PY
      - name: Apply TPS review improvements
        run: node scripts/apply-tps-play-review-pass.mjs
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regression tests
        run: npm run test:rules
      - name: Production build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit reviewed TPS implementation
        run: |
          if [ -z "$(git diff -- src/game/tps-game.ts app/page.tsx app/globals.css tests/tps-mode.test.ts scripts/capture-tps-visual-audit.mjs .github/workflows/tps-visual-audit.yml)" ]; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/tps-game.ts app/page.tsx app/globals.css tests/tps-mode.test.ts scripts/capture-tps-visual-audit.mjs .github/workflows/tps-visual-audit.yml
          git commit -m "Improve TPS lock-on battle from play review"
          git push origin HEAD:main
