name: Apply v3 impact anchor fix

on:
  push:
    branches:
      - improve/procedural-v3-visual-readability-20260902
    paths:
      - .github/workflows/v3-impact-anchor-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/procedural-v3-visual-readability-20260902
          fetch-depth: 0

      - name: Align impact FX with procedural strike contact
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          game = "src/game/tps-game-base.ts"
          heights = "\n".join([
              "const TPS_IMPACT_CONTACT_MINIMUM = 1.28;",
              "const TPS_IMPACT_HEIGHTS: Readonly<Record<string, number>> = Object.freeze({",
              "  jab: 2.62,",
              "  straight: 2.60,",
              "  backfist: 2.48,",
              "  bodyBlow: 2.12,",
              "  power: 2.35,",
              "  kick: 1.80,",
              "  lowKick: 0.92,",
              "  risingKick: 2.06,",
              "  dashKick: 1.98,",
              "  throw: 1.75,",
              "  counter: 2.66,",
              "});",
              "const MODEL_FORWARD = new THREE.Vector3(0, 0, 1);",
          ])
          replace_exact(
              game,
              "const TPS_IMPACT_CONTACT_MINIMUM = 1.28;\nconst MODEL_FORWARD = new THREE.Vector3(0, 0, 1);",
              heights,
          )
          replace_exact(
              game,
              '    impactPosition.y = move.hitLevel === "LOW" ? 0.55 : 1.35;',
              '    impactPosition.y = TPS_IMPACT_HEIGHTS[move.id] ?? (move.hitLevel === "LOW" ? 0.55 : 1.35);',
          )

          graphics = "src/game/tps-graphics.ts"
          replace_exact(
              graphics,
              "    this.group.userData.lastImpactTier = visualTier;\n    this.group.userData.lastSharedAttackerHitStop = sharedHitStop;",
              "    this.group.userData.lastImpactTier = visualTier;\n    this.group.userData.lastImpactMove = event.move.id;\n    this.group.userData.lastImpactHeight = event.position.y;\n    this.group.userData.lastSharedAttackerHitStop = sharedHitStop;",
          )
          replace_exact(
              graphics,
              "    this.group.userData.lastImpactTier = 0;\n    this.group.userData.lastSharedAttackerHitStop = 0;",
              "    this.group.userData.lastImpactTier = 0;\n    this.group.userData.lastImpactMove = null;\n    this.group.userData.lastImpactHeight = 0;\n    this.group.userData.lastSharedAttackerHitStop = 0;",
          )

          test = "tests/tps-mode.test.ts"
          replace_exact(
              test,
              r"  assert.match(source, /TPS_IMPACT_CONTACT_MINIMUM = 1\.28/);" + "\n" + "  assert.match(source, /tpsContactSpacingMode/);",
              r"  assert.match(source, /TPS_IMPACT_CONTACT_MINIMUM = 1\.28/);" + "\n" + "  assert.match(source, /TPS_IMPACT_HEIGHTS/);" + "\n" + r"  assert.match(source, /risingKick: 2\.06/);" + "\n" + r"  assert.match(source, /impactPosition\.y = TPS_IMPACT_HEIGHTS\[move\.id\]/);" + "\n" + "  assert.match(source, /tpsContactSpacingMode/);",
          )

          audit = "scripts/capture-tps-visual-audit.mjs"
          replace_exact(
              audit,
              "    const spacingMinimum = game.p1.visual.root.userData.tpsContactSpacingMinimum ?? 0;\n    return { steps, p1Health: game.p1.health, p2Health: game.p2.health, p1State: game.p1.state, p2State: game.p2.state, screenSeparation, impactScreenSeparation, impactWorldSeparation, spacingMode, spacingMinimum, targetGroundRing };",
              "    const spacingMinimum = game.p1.visual.root.userData.tpsContactSpacingMinimum ?? 0;\n    const impactFxMove = game.graphics.group.userData.lastImpactMove ?? null;\n    const impactFxHeight = game.graphics.group.userData.lastImpactHeight ?? 0;\n    return { steps, p1Health: game.p1.health, p2Health: game.p2.health, p1State: game.p1.state, p2State: game.p2.state, screenSeparation, impactScreenSeparation, impactWorldSeparation, spacingMode, spacingMinimum, impactFxMove, impactFxHeight, targetGroundRing };",
          )
          replace_exact(
              audit,
              '  if (punchProbe?.spacingMode !== "IMPACT_PAIR" || !(punchProbe?.spacingMinimum >= 1.28) || !(punchProbe?.impactWorldSeparation >= 1.27)) throw new Error(`TPS resolved impact did not open the v3 contact lane: ${JSON.stringify(punchProbe)}`);',
              '  if (punchProbe?.spacingMode !== "IMPACT_PAIR" || !(punchProbe?.spacingMinimum >= 1.28) || !(punchProbe?.impactWorldSeparation >= 1.27)) throw new Error(`TPS resolved impact did not open the v3 contact lane: ${JSON.stringify(punchProbe)}`);\n  if (punchProbe?.impactFxMove !== "jab" || !(punchProbe?.impactFxHeight >= 2.5)) throw new Error(`TPS impact FX did not follow the procedural strike contact height: ${JSON.stringify(punchProbe)}`);',
          )
          PY

      - name: Verify targeted tests
        run: |
          npm ci --ignore-scripts
          node --import tsx --test tests/tps-mode.test.ts tests/tps-graphics.test.ts

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/tps-game-base.ts src/game/tps-graphics.ts tests/tps-mode.test.ts scripts/capture-tps-visual-audit.mjs
          git diff --cached --check
          git commit -m "Align impact effects with v3 strike contacts"
          git push origin HEAD:improve/procedural-v3-visual-readability-20260902
