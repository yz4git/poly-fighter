name: SERA V10 WebGL visual audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - app/page.tsx
      - src/components/model-viewer-panel.tsx
      - src/game/model-viewer.ts
      - src/game/visual-v10.ts
      - src/game/visual-v10-stance.ts
      - src/game/visual-v10-polish.ts
      - src/game/visual-blender-runtime.ts
      - src/game/visual-blender-diagnostics.ts
      - src/game/visual-blender-metadata.ts
      - src/game/visual-blender-semantics.ts
      - src/game/visual-blender-skinning.ts
      - src/game/visual-blender-skinning-profile.ts
      - src/game/visual-entry.ts
      - public/models/sera-blender-runtime.glb
      - public/models/sera-blender-runtime.metrics.json
      - public/models/sera-v10.glb
      - public/sw.js
      - package.json
      - scripts/blender-runtime-audit-helpers.mjs
      - scripts/capture-model-view-audit.mjs
      - scripts/capture-v10-visual-audit.mjs
      - scripts/run-blender-prototype-ci.sh
      - tools/blender/**
      - tests/model-viewer.test.mjs
      - tests/pwa-cache.test.mjs
      - tests/visual-v9.test.ts
      - tests/visual-blender-skinning.test.ts
      - .github/workflows/v10-visual-audit.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Checkout Quaternius Universal Base Characters mirror
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: aaroohhiiii/ggj
          ref: 57c0855a6622d4654fe32e9208efb820051164e3
          path: .external/quaternius
          sparse-checkout: |
            first/assets/3d/characters/player
            first/assets/3d/characters/License_Standard.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run regression tests and optional Blender prototype
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SERA_RUN_BLENDER_PROTOTYPE=1 npm test
          else
            npm test
          fi
      - name: Stage Blender runtime asset for the real game audit
        if: github.event_name == 'pull_request'
        run: |
          generated="artifacts/visual-audit/blender-sera/sera-blender-runtime.glb"
          generated_metrics="artifacts/visual-audit/blender-sera/sera-blender-metrics.json"
          committed="public/models/sera-blender-runtime.glb"
          committed_metrics="public/models/sera-blender-runtime.metrics.json"
          mkdir -p public/models

          if [ -s "$generated" ] && [ -s "$generated_metrics" ]; then
            cp "$generated" "$committed"
            cp "$generated_metrics" "$committed_metrics"
            echo "Using generated Blender runtime for PR audit."
          else
            test -s "$committed"
            test -s "$committed_metrics"
            echo "Using committed Blender runtime for audit."
          fi
      - name: Rebuild with selected Blender runtime asset
        if: github.event_name == 'pull_request'
        run: npm run build
      - name: Run lint
        run: npm run lint
      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-server.log 2>&1 &
          echo $! > /tmp/poly-fighter-server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/poly-fighter-server.log
          exit 1
      - name: Verify Blender runtime and V10 reference models are locally served
        run: |
          curl --fail --silent http://127.0.0.1:3000/models/sera-blender-runtime.glb -o /tmp/sera-blender-runtime.glb
          test -s /tmp/sera-blender-runtime.glb
          curl --fail --silent http://127.0.0.1:3000/models/sera-v10.glb -o /tmp/sera-v10.glb
          test -s /tmp/sera-v10.glb
      - name: Capture title Model View with ChromeDriver
        run: |
          mkdir -p artifacts/visual-audit
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            DRIVER="$CHROMEWEBDRIVER/chromedriver"
          fi
          if [ -z "$DRIVER" ]; then
            echo "ChromeDriver is not available"
            exit 1
          fi
          WEBDRIVER_BIN="$DRIVER" \
            AUDIT_URL="http://127.0.0.1:3000/" \
            MODEL_VIEW_AUDIT_DIR="artifacts/visual-audit" \
            node scripts/capture-model-view-audit.mjs
          for fighter in sera kairo; do
            test -s "artifacts/visual-audit/model-view-${fighter}.png"
            file "artifacts/visual-audit/model-view-${fighter}.png" | grep -q "PNG image data"
          done
          test -s artifacts/visual-audit/model-view-state.json
      - name: Capture actual match frame with ChromeDriver
        run: |
          mkdir -p artifacts/visual-audit
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            DRIVER="$CHROMEWEBDRIVER/chromedriver"
          fi
          if [ -z "$DRIVER" ]; then
            echo "ChromeDriver is not available"
            exit 1
          fi
          WEBDRIVER_BIN="$DRIVER" \
            AUDIT_URL="http://127.0.0.1:3000/" \
            AUDIT_OUTPUT="artifacts/visual-audit/sera-v10-canvas-idle.png" \
            node scripts/capture-v10-visual-audit.mjs
          for pose in idle guard punch kick; do
            test -s "artifacts/visual-audit/sera-v10-canvas-${pose}.png"
            file "artifacts/visual-audit/sera-v10-canvas-${pose}.png" | grep -q "PNG image data"
          done
          test -s artifacts/visual-audit/blender-runtime-state.json
          cp /tmp/poly-fighter-server.log artifacts/visual-audit/server.log
          printf '%s\n' "Real WebGL screenshots captured in headless Chrome via ChromeDriver for title MODEL VIEW and match poses, with the Blender-authored SERA runtime asset and part-aware SERA_BLENDER_SKIN_V3 weights." > artifacts/visual-audit/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sera-v10-webgl-visual-audit
          path: artifacts/visual-audit
          if-no-files-found: error
      - name: Upload same-repository runtime candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: sera-runtime-candidate
          path: |
            public/models/sera-blender-runtime.glb
            public/models/sera-blender-runtime.metrics.json
          if-no-files-found: error
          retention-days: 1

  publish-runtime:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: capture
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: sera-runtime-candidate
          path: runtime-candidate
      - name: Publish generated Blender runtime asset to same-repository PR branch
        run: |
          runtime_glb="$(find runtime-candidate -type f -name 'sera-blender-runtime.glb' -print -quit)"
          runtime_metrics="$(find runtime-candidate -type f -name 'sera-blender-runtime.metrics.json' -print -quit)"
          test -n "$runtime_glb" && test -s "$runtime_glb"
          test -n "$runtime_metrics" && test -s "$runtime_metrics"
          cp "$runtime_glb" public/models/sera-blender-runtime.glb
          cp "$runtime_metrics" public/models/sera-blender-runtime.metrics.json
          if git diff --quiet -- public/models/sera-blender-runtime.glb public/models/sera-blender-runtime.metrics.json; then
            echo "Generated runtime is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/sera-blender-runtime.glb public/models/sera-blender-runtime.metrics.json
          git commit -m "Checkpoint: publish Blender SERA runtime asset"
          git push origin HEAD:${{ github.head_ref }}
