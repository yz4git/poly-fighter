name: Integrate procedural fight motion pack

on:
  push:
    branches:
      - chatgpt/procedural-fight-motion-generator-v1
    paths:
      - .github/workflows/procedural-fight-integration-patch.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/procedural-fight-motion-generator-v1
          fetch-depth: 0

      - name: Patch runtime, audit and regression contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          runtime = 'src/game/motion-expansion-runtime.ts'
          replace(runtime,
              'const UAL2_URL = `${BASE_PATH}/models/quaternius/ual2-fight-core.glb`;\n',
              'const UAL2_URL = `${BASE_PATH}/models/quaternius/ual2-fight-core.glb`;\nconst PROCEDURAL_URL = `${BASE_PATH}/models/quaternius/procedural-fight-core.glb`;\n')

          replace(runtime,
              'const FALLBACK_CLIPS: Readonly<Record<string, string>> = {\n',
              '''const FALLBACK_CLIPS: Readonly<Record<string, string>> = {\n  PF_Jab_L: "Punch_Jab",\n  PF_Cross_R: "Punch_Cross",\n  PF_Backfist_R: "Melee_Hook",\n  PF_BodyBlow_L: "Shield_OneShot",\n  PF_Power_R: "Sword_Regular_C",\n  PF_FrontKick_R: "NinjaJump_Start",\n  PF_LowKick_L: "Slide_Start",\n  PF_RisingKick_R: "NinjaJump_Start",\n  PF_DashKick_R: "NinjaJump_Start",\n  PF_Throw: "OverhandThrow",\n  PF_Counter_R: "Punch_Cross",\n  PF_HitHeavy: "Hit_Knockback",\n  PF_Launch: "NinjaJump_Start",\n  PF_DownBack: "Death01",\n  PF_Wakeup: "LayToIdle",\n''')

          replace(runtime,
              '''    loader.loadAsync(UAL2_URL)\n      .then((gltf) => ({ source: gltf.scene, clips: gltf.animations }))\n      .catch(() => null),\n  ]).then((packs) => packs.filter((pack): pack is SourcePack => Boolean(pack)));''',
              '''    loader.loadAsync(UAL2_URL)\n      .then((gltf) => ({ source: gltf.scene, clips: gltf.animations }))\n      .catch(() => null),\n    loader.loadAsync(PROCEDURAL_URL)\n      .then((gltf) => ({ source: gltf.scene, clips: gltf.animations }))\n      .catch(() => null),\n  ]).then((packs) => packs.filter((pack): pack is SourcePack => Boolean(pack)));''')

          replace(runtime,
              '''    fighter.visual.root.userData.motionExpansionClipCount = runtime.clips.size;\n    fighter.visual.root.userData.motionExpansionHasUAL2 = runtime.clips.has("Melee_Hook");\n    fighter.visual.root.userData.motionExpansionLoading = false;''',
              '''    fighter.visual.root.userData.motionExpansionClipCount = runtime.clips.size;\n    fighter.visual.root.userData.motionExpansionHasUAL2 = runtime.clips.has("Melee_Hook");\n    fighter.visual.root.userData.motionExpansionHasProcedural = runtime.clips.has("PF_Jab_L") && runtime.clips.has("PF_RisingKick_R");\n    fighter.visual.root.userData.motionExpansionProceduralClipCount = Array.from(runtime.clips.keys()).filter((name) => name.startsWith("PF_")).length;\n    fighter.visual.root.userData.motionExpansionProceduralVersion = "PROCEDURAL_FIGHT_V1";\n    fighter.visual.root.userData.motionExpansionLoading = false;''')

          replace(runtime,
              'return { name: reaction.kind === "LAUNCH" ? "NinjaJump_Start" : "Hit_Knockback", loop: false, speed: 1.2, phase: "AIR" };',
              'return { name: reaction.kind === "LAUNCH" ? "PF_Launch" : "PF_HitHeavy", loop: false, speed: 1.2, phase: "AIR" };')
          replace(runtime,
              'return { name: "Death01", loop: false, speed: fighter.health <= 0 ? 0.78 : 0.96, phase: "DOWN" };',
              'return { name: "PF_DownBack", loop: false, speed: fighter.health <= 0 ? 0.78 : 0.96, phase: "DOWN" };')
          replace(runtime,
              'if (fighter.state === "WAKEUP") return { name: "LayToIdle", loop: false, speed: 1.05, phase: "DOWN" };',
              'if (fighter.state === "WAKEUP") return { name: "PF_Wakeup", loop: false, speed: 1.05, phase: "DOWN" };')

          audit = 'scripts/capture-motion-readability-audit.mjs'
          replace(audit,
              '''const expectedClips = {\n  jab: "Punch_Jab",\n  straight: "Punch_Cross",\n  bodyBlow: "Shield_OneShot",\n  backfist: "Melee_Hook",\n  power: "Sword_Regular_C",\n  kick: "NinjaJump_Start",\n  lowKick: "Slide_Start",\n  risingKick: "NinjaJump_Start",\n  dashKick: "NinjaJump_Start",\n  throw: "OverhandThrow",\n  counter: "Punch_Cross",\n};''',
              '''const expectedClips = {\n  jab: "PF_Jab_L",\n  straight: "PF_Cross_R",\n  bodyBlow: "PF_BodyBlow_L",\n  backfist: "PF_Backfist_R",\n  power: "PF_Power_R",\n  kick: "PF_FrontKick_R",\n  lowKick: "PF_LowKick_L",\n  risingKick: "PF_RisingKick_R",\n  dashKick: "PF_DashKick_R",\n  throw: "PF_Throw",\n  counter: "PF_Counter_R",\n};''')

          replace(audit,
              '''        ready: root.userData.motionExpansionClipCount >= 30,\n        clips: root.userData.motionExpansionClipCount ?? 0,\n        version: root.userData.motionExpansionVersion ?? null,\n        loading: root.userData.motionExpansionLoading ?? null,''',
              '''        ready: root.userData.motionExpansionHasProcedural === true && root.userData.motionExpansionProceduralClipCount === 15,\n        clips: root.userData.motionExpansionClipCount ?? 0,\n        version: root.userData.motionExpansionVersion ?? null,\n        proceduralVersion: root.userData.motionExpansionProceduralVersion ?? null,\n        proceduralClips: root.userData.motionExpansionProceduralClipCount ?? 0,\n        procedural: root.userData.motionExpansionHasProcedural ?? false,\n        loading: root.userData.motionExpansionLoading ?? null,''')
          replace(audit,
              'if (!preload?.ready || preload.version !== "MOTION_READABILITY_V2") {',
              'if (!preload?.ready || preload.version !== "MOTION_READABILITY_V2" || preload.proceduralVersion !== "PROCEDURAL_FIGHT_V1") {')

          tests = 'tests/motion-expansion.test.ts'
          replace(tests,
              'test("Motion Readability v2 maps every authored move to explicit motion and reaction data", () => {',
              'test("Procedural Fight v1 maps every authored move to generated motion and reaction data", () => {')
          replace(tests,
              '''  assert.equal(MOTION_EXPANSION_PROFILE.secondaryLibraryClips, 20);\n  assert.ok(MOTION_EXPANSION_PROFILE.reactionKinds >= 9);\n  assert.equal(MOTION_EXPANSION_PROFILE.guardBreakClip, "Idle_Shield_Break");\n  assert.equal(MOTION_EXPANSION_PROFILE.wakeupClip, "LayToIdle");''',
              '''  assert.equal(MOTION_EXPANSION_PROFILE.secondaryLibraryClips, 20);\n  assert.equal(MOTION_EXPANSION_PROFILE.proceduralVersion, "PROCEDURAL_FIGHT_V1");\n  assert.equal(MOTION_EXPANSION_PROFILE.proceduralLibraryClips, 15);\n  assert.ok(MOTION_EXPANSION_PROFILE.reactionKinds >= 9);\n  assert.equal(MOTION_EXPANSION_PROFILE.guardBreakClip, "Idle_Shield_Break");\n  assert.equal(MOTION_EXPANSION_PROFILE.wakeupClip, "PF_Wakeup");''')
          replace(tests,
              '''  assert.equal(jab.clip, "Punch_Jab");\n  assert.equal(backfist.clip, "Melee_Hook");\n  assert.equal(backfist.recoveryClip, "Melee_Hook_Rec");\n  assert.equal(body.clip, "Shield_OneShot");\n  assert.equal(power.clip, "Sword_Regular_C");''',
              '''  assert.equal(jab.clip, "PF_Jab_L");\n  assert.equal(backfist.clip, "PF_Backfist_R");\n  assert.equal(backfist.recoveryClip, "Melee_Hook_Rec");\n  assert.equal(body.clip, "PF_BodyBlow_L");\n  assert.equal(power.clip, "PF_Power_R");''')
          replace(tests,
              '''  assert.equal(kick.recoveryClip, "NinjaJump_Land");\n  assert.equal(low.recoveryClip, "Slide_Exit");\n  assert.equal(rising.recoveryClip, "NinjaJump_Land");\n  assert.notEqual(dash.clip, "Roll");''',
              '''  assert.equal(kick.clip, "PF_FrontKick_R");\n  assert.equal(low.clip, "PF_LowKick_L");\n  assert.equal(rising.clip, "PF_RisingKick_R");\n  assert.equal(dash.clip, "PF_DashKick_R");\n  assert.equal(kick.recoveryClip, "NinjaJump_Land");\n  assert.equal(low.recoveryClip, "Slide_Exit");\n  assert.equal(rising.recoveryClip, "NinjaJump_Land");\n  assert.notEqual(dash.clip, "Roll");''')
          replace(tests,
              '''  assert.match(source, /motionExpansionContactMode = "OPPONENT_WEIGHTED_IK"/);\n  assert.match(source, /styleTarget\\(opponent, spec\\.style, side\\)/);''',
              '''  assert.match(source, /motionExpansionContactMode = "OPPONENT_WEIGHTED_IK"/);\n  assert.match(source, /PROCEDURAL_URL/);\n  assert.match(source, /motionExpansionHasProcedural/);\n  assert.match(source, /styleTarget\\(opponent, spec\\.style, side\\)/);''')
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/motion-expansion-runtime.ts scripts/capture-motion-readability-audit.mjs tests/motion-expansion.test.ts
          git commit -m "Integrate procedural fight motions into runtime"
          git push origin HEAD:chatgpt/procedural-fight-motion-generator-v1
