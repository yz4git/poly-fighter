name: POLY FIGHTER CMU motion visual decision

on:
  pull_request:
    paths:
      - scripts/capture-cmu-motion-audit.mjs
      - .github/workflows/cmu-visual-audit.yml
      - src/game/cmu-*.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmu-visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build preview
        run: npm run build
      - name: Start preview
        run: |
          PORT=3000 npm start > /tmp/pf-cmu-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pf-cmu-server.log
          exit 1
      - name: Capture CMU animations in headless WebGL
        run: |
          mkdir -p artifacts/cmu-visual
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -x "${CHROMEWEBDRIVER:-}/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL='http://127.0.0.1:3000/?cmuAudit=1' CMU_AUDIT_DIR=artifacts/cmu-visual node scripts/capture-cmu-motion-audit.mjs
      - name: Retain screens, report and server log
        if: always()
        run: |
          mkdir -p artifacts/cmu-visual
          cp /tmp/pf-cmu-server.log artifacts/cmu-visual/server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-cmu-motion-visual
          path: artifacts/cmu-visual
          if-no-files-found: error
          retention-days: 7
