name: Extract Quaternius motion data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/import-quaternius-motion-data.mjs
      - .github/workflows/quaternius-motion-extract.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Extract normalized CC0 motion trajectories
        run: node scripts/import-quaternius-motion-data.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: quaternius-motion-data
          path: |
            artifacts/quaternius-motion-data.ts
            artifacts/quaternius-motion-data-report.json
          if-no-files-found: error
          retention-days: 1
      - name: Publish generated motion data
        run: |
          mkdir -p src/game/generated
          cp artifacts/quaternius-motion-data.ts src/game/generated/quaternius-motion-data.ts
          if git diff --quiet -- src/game/generated/quaternius-motion-data.ts; then
            echo "Generated motion data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/generated/quaternius-motion-data.ts
          git commit -m "Add Quaternius CC0 motion trajectories"
          git push origin HEAD:main
