name: TMP tune V6 rising chamber

on:
  push:
    branches:
      - motion-foundry-v6-leg-anatomy-fix

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Rising chamber anatomy tune'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-foundry-v6-leg-anatomy-fix
          fetch-depth: 0
      - name: Preserve a readable chamber after leg-axis correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/blender/build-fight-motion-foundry-v2-kicks.py')
          text = path.read_text()
          old = '        (-0.07, 0.00, 0.29),\n'
          new = '        (-0.07, 0.00, 0.34),\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('Rising chamber offset anchor not found')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          python -m py_compile tools/blender/build-fight-motion-foundry-v2-kicks.py
          node --test tests/motion-foundry-v6-leg-anatomy.test.mjs
      - name: Commit tune
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No tune required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/blender/build-fight-motion-foundry-v2-kicks.py
          git commit -m 'Apply Rising chamber anatomy tune'
          git push origin HEAD:motion-foundry-v6-leg-anatomy-fix
