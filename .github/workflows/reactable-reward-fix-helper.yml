name: Reactable Reward Fix Helper

on:
  push:
    branches: [reactable-enemy-attacks-v1]
    paths:
      - .github/workflows/reactable-reward-fix-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reactable-enemy-attacks-v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - name: Patch confirmed-evade reward timing
        run: |
          sed -i '/^      if (reactiveSideStep) {$/,/^      }$/d' src/game/tps-game-base.ts
          sed -i 's|  assert.match(source, /TPS_STEP_TICKS \\+ TPS_FLANK_WINDOW_TICKS/);|  assert.doesNotMatch(source, /this\\.playerFlankWindowTicks = TPS_STEP_TICKS \\+ TPS_FLANK_WINDOW_TICKS/);|' tests/tps-mode.test.ts
          grep -q 'this.playerStepThreatTicks = reactiveSideStep' src/game/tps-game-base.ts
          ! grep -q 'this.playerFlankWindowTicks = TPS_STEP_TICKS + TPS_FLANK_WINDOW_TICKS' src/game/tps-game-base.ts
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TPS regression suite
        run: npm run test:ci:tps
      - name: Lint
        run: npm run lint
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/tps-game-base.ts tests/tps-mode.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "Delay Perfect STEP reward until confirmed evade"
          git push origin HEAD:reactable-enemy-attacks-v1
