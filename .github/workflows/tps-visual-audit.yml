name: POLY FIGHTER TPS WebGL audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - src/game/**
      - public/models/**
      - package.json
      - package-lock.json
      - scripts/capture-tps-visual-audit.mjs
      - scripts/capture-motion-readability-audit.mjs
      - scripts/touch-input-safety-audit.mjs
      - tests/fight-rules.test.ts
      - tests/input-rules.test.ts
      - tests/runtime-regression.test.ts
      - tests/quaternius-motion.test.ts
      - tests/quaternius-model-skin.test.ts
      - tests/motion-expansion.test.ts
      - tests/tps-mode.test.ts
      - .github/workflows/tps-visual-audit.yml
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - src/game/**
      - public/models/**
      - package.json
      - package-lock.json
      - scripts/capture-tps-visual-audit.mjs
      - scripts/capture-motion-readability-audit.mjs
      - scripts/touch-input-safety-audit.mjs
      - tests/fight-rules.test.ts
      - tests/input-rules.test.ts
      - tests/runtime-regression.test.ts
      - tests/quaternius-motion.test.ts
      - tests/quaternius-model-skin.test.ts
      - tests/motion-expansion.test.ts
      - tests/tps-mode.test.ts
      - .github/workflows/tps-visual-audit.yml

permissions:
  contents: read

concurrency:
  group: tps-webgl-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run TPS-focused regression suite
        run: npm run test:ci:tps
      - name: Run lint
        run: npm run lint
      - name: Build production preview
        run: npm run build
      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-tps-server.log 2>&1 &
          echo $! > /tmp/poly-fighter-tps-server.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/poly-fighter-tps-server.log
          exit 1
      - name: Capture and exercise TPS battle
        run: |
          mkdir -p artifacts/tps-visual-audit
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            DRIVER="$CHROMEWEBDRIVER/chromedriver"
          fi
          if [ -z "$DRIVER" ]; then
            echo "ChromeDriver is not available"
            exit 1
          fi
          WEBDRIVER_BIN="$DRIVER" \
            AUDIT_URL="http://127.0.0.1:3000/" \
            TPS_AUDIT_DIR="artifacts/tps-visual-audit" \
            node scripts/capture-tps-visual-audit.mjs
          WEBDRIVER_BIN="$DRIVER" \
            AUDIT_URL="http://127.0.0.1:3000/" \
            TPS_AUDIT_DIR="artifacts/tps-visual-audit" \
            node scripts/capture-motion-readability-audit.mjs
          WEBDRIVER_BIN="$DRIVER" \
            AUDIT_URL="http://127.0.0.1:3000/" \
            TPS_AUDIT_DIR="artifacts/tps-visual-audit" \
            node scripts/touch-input-safety-audit.mjs
          for image in \
            tps-idle tps-iphone-idle tps-quickstep tps-punch tps-punch-settled tps-throw \
            tps-motion-jab tps-motion-straight tps-motion-bodyblow tps-motion-backfist \
            tps-motion-power tps-motion-kick tps-motion-lowkick tps-motion-risingkick \
            tps-motion-dashkick tps-motion-throw tps-motion-counter; do
            test -s "artifacts/tps-visual-audit/${image}.png"
            file "artifacts/tps-visual-audit/${image}.png" | grep -q "PNG image data"
          done
          test -s artifacts/tps-visual-audit/tps-runtime-state.json
          test -s artifacts/tps-visual-audit/motion-readability.json
          test -s artifacts/tps-visual-audit/touch-input-safety.json
          cp /tmp/poly-fighter-tps-server.log artifacts/tps-visual-audit/server.log
      - name: Preserve server log
        if: always()
        run: |
          mkdir -p artifacts/tps-visual-audit
          if [ -f /tmp/poly-fighter-tps-server.log ]; then
            cp /tmp/poly-fighter-tps-server.log artifacts/tps-visual-audit/server.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-tps-webgl-audit
          path: artifacts/tps-visual-audit
          if-no-files-found: error
          retention-days: 14
