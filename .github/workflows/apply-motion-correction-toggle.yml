name: Apply motion correction toggle

on:
  push:
    branches: [motion-corrections-toggle]

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-corrections-toggle
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply correction toggle wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "src/game/settings.ts",
              'export type Quality = "LOW" | "NORMAL" | "HIGH";\n',
              'import { setMotionCorrectionsEnabled } from "./motion-correction-state";\n\nexport type Quality = "LOW" | "NORMAL" | "HIGH";\n',
          )
          replace(
              "src/game/settings.ts",
              '  vibration: boolean;\n}',
              '  vibration: boolean;\n  motionCorrections: boolean;\n}',
          )
          replace(
              "src/game/settings.ts",
              '  vibration: true,\n};',
              '  vibration: true,\n  motionCorrections: false,\n};',
          )
          replace(
              "src/game/settings.ts",
              '    } catch {\n      this.value = { ...DEFAULTS };\n    }\n    return { ...this.value };',
              '    } catch {\n      this.value = { ...DEFAULTS };\n    }\n    setMotionCorrectionsEnabled(this.value.motionCorrections);\n    return { ...this.value };',
          )
          replace(
              "src/game/settings.ts",
              '  update(patch: Partial<Settings>): Settings {\n    this.value = { ...this.value, ...patch };',
              '  update(patch: Partial<Settings>): Settings {\n    this.value = { ...this.value, ...patch };\n    setMotionCorrectionsEnabled(this.value.motionCorrections);',
          )

          replace(
              "app/page.tsx",
              '  vibration: boolean;\n};',
              '  vibration: boolean;\n  motionCorrections: boolean;\n};',
          )
          replace(
              "app/page.tsx",
              '  vibration: true,\n};',
              '  vibration: true,\n  motionCorrections: false,\n};',
          )
          replace(
              "app/page.tsx",
              '          <button type="button" className="setting-row" onClick={() => persistSettings({ vibration: !settings.vibration })}><span>HAPTIC FEEDBACK</span><b>{settings.vibration ? "ON" : "OFF"}</b></button>\n          <button type="button" className="ghost-button" onClick={() => setShowSettings(false)}>DONE</button>',
              '          <button type="button" className="setting-row" onClick={() => persistSettings({ vibration: !settings.vibration })}><span>HAPTIC FEEDBACK</span><b>{settings.vibration ? "ON" : "OFF"}</b></button>\n          <button type="button" className="setting-row" onClick={() => persistSettings({ motionCorrections: !settings.motionCorrections })}><span>MOTION CORRECTION</span><b>{settings.motionCorrections ? "ON" : "OFF"}</b></button>\n          <button type="button" className="ghost-button" onClick={() => setShowSettings(false)}>DONE</button>',
          )

          replace(
              "src/game/presentation-animation.ts",
              'import { updateMotionExpansionSkin } from "./motion-expansion-runtime";\n',
              'import { updateMotionExpansionSkin } from "./motion-expansion-runtime";\nimport { motionCorrectionsEnabled } from "./motion-correction-state";\n',
          )
          replace(
              "src/game/presentation-animation.ts",
              '    super.update(fighter, opponent, timeSeconds);\n\n    if (fighter.visual.root.userData.visualVersion === "KAIRO_V1" && KAIRO_READY_STATES.has(fighter.state)) {',
              '    super.update(fighter, opponent, timeSeconds);\n    const correctionsEnabled = motionCorrectionsEnabled();\n\n    if (correctionsEnabled && fighter.visual.root.userData.visualVersion === "KAIRO_V1" && KAIRO_READY_STATES.has(fighter.state)) {',
          )
          replace(
              "src/game/presentation-animation.ts",
              '    if (!updateMotionExpansionSkin(fighter, opponent, timeSeconds)) {\n      updateQuaterniusModelSkin(fighter, timeSeconds);\n    }',
              '    if (correctionsEnabled) {\n      if (!updateMotionExpansionSkin(fighter, opponent, timeSeconds)) {\n        updateQuaterniusModelSkin(fighter, timeSeconds);\n      }\n    } else {\n      // Raw-motion diagnostic mode: keep authored clip selection/playback, but\n      // bypass every post-playback IK, pose, COM, foot-lock and contact correction.\n      updateQuaterniusModelSkin(fighter, timeSeconds);\n    }\n    fighter.visual.root.userData.motionCorrectionsEnabled = correctionsEnabled;',
          )

          replace(
              "src/game/visual-quaternius-runtime.ts",
              'import type { FighterRuntime } from "./fighter";\n',
              'import type { FighterRuntime } from "./fighter";\nimport { motionCorrectionsEnabled } from "./motion-correction-state";\n',
          )
          replace(
              "src/game/visual-quaternius-runtime.ts",
              '  playClip(runtime, desired.name, desired.loop, desired.speed, restartingAttack || restartingReaction);\n  advance(runtime, timeSeconds, fighter.hitStop > 0);\n  neutralPoseCorrection(runtime, fighter);\n  guardPoseCorrection(runtime, fighter);\n  attackContactCorrection(runtime, fighter);\n  runtime.model.updateMatrixWorld(true);',
              '  playClip(runtime, desired.name, desired.loop, desired.speed, restartingAttack || restartingReaction);\n  advance(runtime, timeSeconds, fighter.hitStop > 0);\n  const correctionsEnabled = motionCorrectionsEnabled();\n  if (correctionsEnabled) {\n    neutralPoseCorrection(runtime, fighter);\n    guardPoseCorrection(runtime, fighter);\n    attackContactCorrection(runtime, fighter);\n  }\n  runtime.host.userData.quaterniusMotionCorrectionsEnabled = correctionsEnabled;\n  runtime.host.userData.quaterniusMotionMode = correctionsEnabled ? "CORRECTED" : "RAW_CLIP_PLAYBACK";\n  runtime.model.updateMatrixWorld(true);',
          )

          replace(
              "package.json",
              'tests/hud-face-safe.test.mjs"',
              'tests/hud-face-safe.test.mjs tests/motion-correction-toggle.test.ts"',
          )

          Path("tests/motion-correction-toggle.test.ts").write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\nimport { motionCorrectionsEnabled, setMotionCorrectionsEnabled } from "../src/game/motion-correction-state";\n\ntest("motion corrections default OFF and can be toggled", () => {\n  assert.equal(motionCorrectionsEnabled(), false);\n  setMotionCorrectionsEnabled(true);\n  assert.equal(motionCorrectionsEnabled(), true);\n  setMotionCorrectionsEnabled(false);\n  assert.equal(motionCorrectionsEnabled(), false);\n});\n\ntest("settings expose persistent motion correction switch with OFF default", async () => {\n  const settings = await readFile(new URL("../src/game/settings.ts", import.meta.url), "utf8");\n  const page = await readFile(new URL("../app/page.tsx", import.meta.url), "utf8");\n  assert.match(settings, /motionCorrections: false/);\n  assert.match(settings, /setMotionCorrectionsEnabled\\(this\\.value\\.motionCorrections\\)/);\n  assert.match(page, /MOTION CORRECTION/);\n  assert.match(page, /motionCorrections: !settings\\.motionCorrections/);\n});\n\ntest("raw mode bypasses post-playback arm and body corrections", async () => {\n  const presentation = await readFile(new URL("../src/game/presentation-animation.ts", import.meta.url), "utf8");\n  const quaternius = await readFile(new URL("../src/game/visual-quaternius-runtime.ts", import.meta.url), "utf8");\n  assert.match(presentation, /if \\(correctionsEnabled\\) \\{[\\s\\S]*updateMotionExpansionSkin/);\n  assert.match(presentation, /else \\{[\\s\\S]*updateQuaterniusModelSkin/);\n  assert.match(quaternius, /if \\(correctionsEnabled\\) \\{[\\s\\S]*neutralPoseCorrection[\\s\\S]*guardPoseCorrection[\\s\\S]*attackContactCorrection/);\n  assert.match(quaternius, /RAW_CLIP_PLAYBACK/);\n});\n''')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate toggle and production build
        run: |
          node --import tsx --test tests/motion-correction-toggle.test.ts
          npm run build
          npm run lint

      - name: Commit generated patch
        run: |
          if git diff --quiet; then
            echo "No patch changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx src/game/settings.ts src/game/presentation-animation.ts src/game/visual-quaternius-runtime.ts src/game/motion-correction-state.ts tests/motion-correction-toggle.test.ts package.json
          git commit -m "Add raw motion correction toggle"
          git push origin HEAD:motion-corrections-toggle
