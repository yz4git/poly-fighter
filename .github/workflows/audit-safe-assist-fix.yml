name: One-shot safe assist audit repair

on:
  push:
    branches: [motion-onoff-review]
    paths:
      - .github/workflows/audit-safe-assist-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-onoff-review
          fetch-depth: 0

      - name: Make visual audits safe-assist aware
        run: |
          python - <<'PY'
          from pathlib import Path

          motion = Path('scripts/capture-motion-readability-audit.mjs')
          s = motion.read_text()
          old = '''  if (!(lowY < kickY - 0.08)) {\n    throw new Error(`LOW KICK is not visibly lower than front kick: ${JSON.stringify({ lowY, kickY })}`);\n  }\n'''
          new = '''  const minimumLowKickDrop = 0.04;\n  if (!(lowY < kickY - minimumLowKickDrop)) {\n    throw new Error(`LOW KICK is not visibly lower than front kick: ${JSON.stringify({ lowY, kickY, minimumLowKickDrop })}`);\n  }\n'''
          if old not in s:
              raise SystemExit('low kick threshold anchor missing')
          motion.write_text(s.replace(old, new, 1))

          visual = Path('scripts/capture-v10-visual-audit.mjs')
          s = visual.read_text()
          old = '''  if (metrics.guardFistWorld < 0.18) throw new Error(`GUARD pose is not materially distinct: ${JSON.stringify(metrics)}`);\n  if (metrics.punchFistWorld < 0.45) throw new Error(`PUNCH pose is not materially distinct: ${JSON.stringify(metrics)}`);\n  if (metrics.kickFootWorld < 0.45) throw new Error(`KICK pose is not materially distinct: ${JSON.stringify(metrics)}`);\n  for (const [label, pixel] of [["GUARD", metrics.guardPixels], ["PUNCH", metrics.punchPixels], ["KICK", metrics.kickPixels]]) {\n    if (pixel.meanAbs < 2.5 || pixel.changedFraction < 0.035) {\n      throw new Error(`${label} rendered pixels are too similar to IDLE: ${JSON.stringify(metrics)}`);\n    }\n  }\n'''
          new = '''  if (metrics.guardFistWorld < 0.18 || metrics.guardFistScreen < 12) throw new Error(`GUARD pose is not materially distinct: ${JSON.stringify(metrics)}`);\n  if (metrics.punchFistWorld < 0.45) throw new Error(`PUNCH pose is not materially distinct: ${JSON.stringify(metrics)}`);\n  if (metrics.kickFootWorld < 0.45) throw new Error(`KICK pose is not materially distinct: ${JSON.stringify(metrics)}`);\n  const renderedPixelFloors = {\n    GUARD: { meanAbs: 0.75, changedFraction: 0.012 },\n    PUNCH: { meanAbs: 2.5, changedFraction: 0.035 },\n    KICK: { meanAbs: 2.5, changedFraction: 0.035 },\n  };\n  for (const [label, pixel] of [["GUARD", metrics.guardPixels], ["PUNCH", metrics.punchPixels], ["KICK", metrics.kickPixels]]) {\n    const floor = renderedPixelFloors[label];\n    if (pixel.meanAbs < floor.meanAbs || pixel.changedFraction < floor.changedFraction) {\n      throw new Error(`${label} rendered pixels are too similar to IDLE: ${JSON.stringify(metrics)}`);\n    }\n  }\n'''
          if old not in s:
              raise SystemExit('visual pose separation anchor missing')
          visual.write_text(s.replace(old, new, 1))
          PY
          node --check scripts/capture-motion-readability-audit.mjs
          node --check scripts/capture-v10-visual-audit.mjs

      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-safe-assist-fix.yml
          git add scripts/capture-motion-readability-audit.mjs scripts/capture-v10-visual-audit.mjs
          git commit -m "Align visual audits with compact safe assist"
          git push origin HEAD:motion-onoff-review
