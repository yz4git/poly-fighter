name: TEMP V6.8 Recovery Continuity Patch

on:
  push:
    branches:
      - kick-frame-audit-v1
    paths:
      - .github/tmp/v6-8-recovery-continuity.py
      - .github/workflows/tmp-v6-8-recovery-continuity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: kick-frame-audit-v1
          fetch-depth: 0
      - name: Apply V6.8 recovery patch
        run: |
          python3 .github/tmp/v6-8-recovery-continuity.py
          python3 -m py_compile tools/blender/build-fight-motion-foundry-v2-kicks.py
          grep -c 'reference_impact_u + 0.44' tools/blender/build-fight-motion-foundry-v2-kicks.py | grep -qx '2'
          grep -q 'recovery retreat ratio' tests/blender-motion-foundry-v2-kicks.test.mjs
      - name: Commit patch
        run: |
          git config user.name yz4git
          git config user.email 65384484+yz4git@users.noreply.github.com
          git add tools/blender/build-fight-motion-foundry-v2-kicks.py tests/blender-motion-foundry-v2-kicks.test.mjs
          git commit -m 'V6.8: make kick recovery return continuously'
          git push origin HEAD:kick-frame-audit-v1
