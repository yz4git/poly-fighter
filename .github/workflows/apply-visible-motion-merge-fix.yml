name: Apply visible motion merge fix

on:
  push:
    branches:
      - fix/arm-fist-playtest-20260901
    paths:
      - '.github/workflows/apply-visible-motion-merge-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arm-fist-playtest-20260901
          fetch-depth: 0
      - name: Apply visible motion merge
        run: python3 scripts/merge-visible-motion-sources.py
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/visual-quaternius-runtime.ts tests/quaternius-model-skin.test.ts
          git commit -m "Combine UAL locomotion with Procedural Fight v2 clips"
          git push origin HEAD:fix/arm-fist-playtest-20260901
