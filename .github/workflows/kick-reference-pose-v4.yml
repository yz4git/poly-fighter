name: Kick v4 Source Harvest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-reference-pose-v4.yml'

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified five-pose patch
        run: python3 scripts/apply-kick-reference-pose-v4.py
      - name: Apply verified post-patch tuning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          builder = Path('tools/blender/build-fight-motion-foundry-v2-kicks.py')
          s = builder.read_text()
          s = s.replace('    @property\n    @property\n    def reference_pose_frames', '    @property\n    def reference_pose_frames', 1)
          s = s.replace('reach_ratios=(0.0, 0.0, 0.88, 0.960, 0.965, 0.0, 0.0)', 'reach_ratios=(0.0, 0.0, 0.88, 0.962, 0.966, 0.0, 0.0)', 1)
          builder.write_text(s)
          tests = Path('tests/blender-motion-foundry-v2-kicks.test.mjs')
          t = tests.read_text()
          old = '    assert.ok(chamber.strikeFootRise > 0.10, `${move.action} chamber rise ${chamber.strikeFootRise}`);'
          new = '    const minimumChamberRise = move.action === "BF_LowKick_L" ? 0.05 : 0.10;\n    assert.ok(chamber.strikeFootRise > minimumChamberRise, `${move.action} chamber rise ${chamber.strikeFootRise}`);'
          if old not in t:
              raise SystemExit('verified test gate anchor missing')
          tests.write_text(t.replace(old, new, 1))
          PY
      - name: Stage exact verified source set
        run: |
          mkdir -p harvest/tools/blender harvest/tests harvest/scripts harvest/.github/workflows harvest/docs
          cp tools/blender/build-fight-motion-foundry-v2-kicks.py harvest/tools/blender/
          cp tests/blender-motion-foundry-v2-kicks.test.mjs harvest/tests/
          cp scripts/capture-model-view-audit.mjs harvest/scripts/
          cp .github/workflows/blender-motion-foundry-v2-kicks.yml harvest/.github/workflows/
          cp docs/KICK_REFERENCE_POSE_V4.md harvest/docs/
      - uses: actions/upload-artifact@v4
        with:
          name: kick-v4-source-harvest
          path: harvest
          if-no-files-found: error
          retention-days: 2
