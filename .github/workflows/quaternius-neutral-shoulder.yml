name: Quaternius neutral shoulder tuning

on:
  push:
    branches: [main]
    paths:
      - scripts/tune-quaternius-neutral-shoulder.mjs
      - .github/workflows/quaternius-neutral-shoulder.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quaternius-neutral-shoulder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply neutral shoulder reach clamp
        run: node scripts/tune-quaternius-neutral-shoulder.mjs
      - name: Shoulder regression
        run: node --import tsx --test tests/quaternius-shoulder.test.ts
      - name: TPS combat regressions
        run: npm run test:ci:tps
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Publish validated neutral tuning
        run: |
          if [ -z "$(git status --porcelain src/game/visual-quaternius-runtime.ts tests/quaternius-shoulder.test.ts)" ]; then
            echo "Neutral shoulder tuning already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/visual-quaternius-runtime.ts tests/quaternius-shoulder.test.ts
          git commit -m "Keep Quaternius neutral shoulders relaxed"
          git push origin HEAD:main
