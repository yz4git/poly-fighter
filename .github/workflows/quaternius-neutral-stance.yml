name: Apply Quaternius neutral combat stance

on:
  push:
    paths:
      - ".github/workflows/quaternius-neutral-stance.yml"
      - "scripts/apply-quaternius-neutral-stance.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply neutral stance correction
        run: node scripts/apply-quaternius-neutral-stance.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate rules
        run: npm run test:rules

      - name: Build production app
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Publish validated stance
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/visual-quaternius-runtime.ts
          if git diff --cached --quiet; then
            echo "Neutral stance already current"
            exit 0
          fi
          git commit -m "Correct Quaternius neutral combat stance"
          git push origin HEAD:main
