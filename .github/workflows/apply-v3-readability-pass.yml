name: Apply Procedural Fight v3 readability pass

on:
  push:
    branches: [improve/procedural-v3-visual-readability-20260902]
    paths:
      - scripts/apply-v3-readability-pass.py
      - .github/workflows/apply-v3-readability-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/procedural-v3-visual-readability-20260902
          fetch-depth: 0
      - name: Apply visual readability pass
        run: python3 scripts/apply-v3-readability-pass.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TPS regression
        run: npm run test:ci:tps
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/tps-game-base.ts src/game/tps-hype.ts src/game/motion-expansion-runtime.ts tests/tps-mode.test.ts tests/tps-graphics.test.ts tests/motion-expansion.test.ts
          git commit -m "Improve Procedural Fight v3 visual readability"
          git pull --rebase origin improve/procedural-v3-visual-readability-20260902
          git push origin HEAD:improve/procedural-v3-visual-readability-20260902
