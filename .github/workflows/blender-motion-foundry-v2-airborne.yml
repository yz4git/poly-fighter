name: POLY FIGHTER Blender Motion Foundry v2 Airborne

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/blender/build-fight-motion-foundry-v1.py
      - tools/blender/motion_foundry_v2_rig.py
      - tools/blender/build-fight-motion-foundry-v2-kicks.py
      - tools/blender/build-fight-motion-foundry-v2-airborne.py
      - scripts/apply-blender-motion-foundry-v2-airborne.mjs
      - src/game/visual-quaternius-runtime.ts
      - src/game/model-viewer-motion.ts
      - scripts/capture-model-view-audit.mjs
      - public/models/quaternius/blender-airborne-core.glb
      - public/models/quaternius/blender-airborne-core.metrics.json
      - public/models/quaternius/blender-airborne-core.generator.sha256
      - tests/blender-motion-foundry-v2-airborne.test.mjs
      - .github/workflows/blender-motion-foundry-v2-airborne.yml
  workflow_dispatch:

jobs:
  build-airborne:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Check whether Blender airborne artifact is current
        id: foundry
        shell: bash
        run: |
          set -euo pipefail
          airborne_hash="$(cat tools/blender/build-fight-motion-foundry-v1.py tools/blender/motion_foundry_v2_rig.py tools/blender/build-fight-motion-foundry-v2-kicks.py tools/blender/build-fight-motion-foundry-v2-airborne.py | sha256sum | awk '{print $1}')"
          echo "airborne_hash=$airborne_hash" >> "$GITHUB_OUTPUT"
          if [ -s public/models/quaternius/blender-airborne-core.glb ] \
            && [ -s public/models/quaternius/blender-airborne-core.metrics.json ] \
            && [ -s public/models/quaternius/blender-airborne-core.generator.sha256 ] \
            && grep -qx "$airborne_hash" public/models/quaternius/blender-airborne-core.generator.sha256; then
            echo "needs_generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch pinned full UAL authoring source
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          set -euxo pipefail
          mkdir -p .tmp-quaternius
          BASE_PIN=aa02a4e6d8337a0604d2da131bcbbeb1f01badf0
          BASE_URL=https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/$BASE_PIN/public/assets/vendor/quaternius
          curl -L --fail --retry 3 "$BASE_URL/universal-animation-library.glb" -o .tmp-quaternius/ual1-full.glb
          echo '4c748767741a3e495d89667b9a218b690ba9810b9517a12e960780e3ca72c4e9  .tmp-quaternius/ual1-full.glb' | sha256sum -c -

      - name: Install Blender
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri xvfb
          blender --version | head -n 2
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          blender --background --python-use-system-env --python-expr "import numpy; print('BLENDER_NUMPY', numpy.__version__)"

      - name: Generate airborne Dash Kick pack in Blender
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          set -euo pipefail
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          out="artifacts/blender-motion-foundry-v2-airborne"
          mkdir -p "$out"
          xvfb-run -a blender --background \
            --python-use-system-env \
            --python-exit-code 1 \
            --python tools/blender/build-fight-motion-foundry-v2-airborne.py \
            -- \
            --source .tmp-quaternius/ual1-full.glb \
            --output-dir "$out"
          test -s "$out/blender-airborne-core.glb"
          test -s "$out/blender-airborne-core.metrics.json"
          test -s "$out/blender-airborne-core-v2.blend"
          cat "$out/blender-airborne-core.metrics.json"

      - name: Validate airborne metrics and GLB action
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          root = Path('artifacts/blender-motion-foundry-v2-airborne')
          m = json.loads((root / 'blender-airborne-core.metrics.json').read_text())
          assert m['version'] == 'BLENDER_MOTION_FOUNDRY_V2_AIRBORNE', m
          assert m['sharedRig'] == 'MOTION_FOUNDRY_V2_AIRBORNE_STRIKE_RIG', m
          assert m['actions'] == ['BF_DashKick_R'], m
          move = m['moves'][0]
          assert move['action'] == 'BF_DashKick_R', move
          assert move['strikeFootForwardReach'] > 0.55, move
          assert move['strikeKneeExtensionDegrees'] > 150, move
          assert move['strikeLegReachRatio'] > 0.96, move
          assert move['trailFootVerticalRise'] > 0.18, move
          assert move['trailKneeAngleDegrees'] < 130, move
          assert move['pelvisApexRise'] > 0.14, move
          assert move['airborneFeetAtImpact'] > 0.16, move
          assert move['landingVerticalResidual'] < 0.06, move
          assert move['guardHandMaxChestDistance'] < 0.34, move
          assert move['guardHandMinChestHeight'] > 0.08, move
          assert move['boneCount'] >= 40, move
          raw = (root / 'blender-airborne-core.glb').read_bytes()
          assert raw[:4] == b'glTF' and len(raw) > 20
          json_len, json_type = struct.unpack_from('<II', raw, 12)
          assert json_type == 0x4E4F534A
          doc = json.loads(raw[20:20 + json_len].decode('utf-8').rstrip('\x00 '))
          names = {a.get('name') for a in doc.get('animations', [])}
          assert 'BF_DashKick_R' in names, sorted(n for n in names if n)
          print('BLENDER_MOTION_FOUNDRY_V2_AIRBORNE_OK', move)
          PY

      - name: Stage generated airborne library
        if: steps.foundry.outputs.needs_generate == 'true'
        run: |
          set -euo pipefail
          cp artifacts/blender-motion-foundry-v2-airborne/blender-airborne-core.glb public/models/quaternius/blender-airborne-core.glb
          cp artifacts/blender-motion-foundry-v2-airborne/blender-airborne-core.metrics.json public/models/quaternius/blender-airborne-core.metrics.json
          printf '%s\n' '${{ steps.foundry.outputs.airborne_hash }}' > public/models/quaternius/blender-airborne-core.generator.sha256

      - name: Apply airborne runtime integration
        run: node scripts/apply-blender-motion-foundry-v2-airborne.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate airborne contract
        run: node --test tests/blender-motion-foundry-v2-airborne.test.mjs

      - name: Build, rules and lint integrated game
        run: |
          npm run build
          npm run test:rules
          npm run test:pwa
          npm run lint

      - name: Publish generated airborne motion and integration to PR branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code && [ -z "$(git status --porcelain)" ]; then
            echo "Blender airborne branch is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/models/quaternius/blender-airborne-core.glb \
            public/models/quaternius/blender-airborne-core.metrics.json \
            public/models/quaternius/blender-airborne-core.generator.sha256 \
            src/game/visual-quaternius-runtime.ts \
            src/game/model-viewer-motion.ts \
            scripts/capture-model-view-audit.mjs
          git commit -m "Generate Blender v2 airborne Dash Kick"
          git pull --rebase origin "${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-blender-motion-foundry-v2-airborne
          path: |
            artifacts/blender-motion-foundry-v2-airborne
            public/models/quaternius/blender-airborne-core.metrics.json
          if-no-files-found: ignore
          retention-days: 14
