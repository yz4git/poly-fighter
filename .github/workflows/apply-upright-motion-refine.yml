name: Apply upright motion refine

on:
  push:
    branches: [fix/full-body-motion-balance-20260902]
    paths:
      - scripts/refine-upright-motion-bases.py
      - .github/workflows/apply-upright-motion-refine.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-body-motion-balance-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Refine upright motion bases and audit
        run: python3 scripts/refine-upright-motion-bases.py
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --ignore-scripts @gltf-transform/core@4.4.1
      - name: Regenerate procedural motion pack
        run: |
          node scripts/generate-procedural-fight-motions-v2.mjs \
            public/models/quaternius/ual-fight-core.glb \
            public/models/quaternius/procedural-fight-core.glb \
            public/models/quaternius/procedural-fight-core.metrics.json
      - name: Validate
        run: |
          npm run test:rules:tps
          npm run lint
          npm run build
      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/generate-procedural-fight-motions-v2.mjs scripts/capture-motion-readability-audit.mjs src/game/motion-expansion-runtime.ts tests/motion-expansion.test.ts public/models/quaternius/procedural-fight-core.glb public/models/quaternius/procedural-fight-core.metrics.json
          if git diff --cached --quiet; then
            echo "No refinement changes"
          else
            git commit -m "Author upright power body and throw motions"
            git pull --rebase origin fix/full-body-motion-balance-20260902
            git push origin HEAD:fix/full-body-motion-balance-20260902
          fi
