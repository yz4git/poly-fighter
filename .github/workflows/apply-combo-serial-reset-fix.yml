name: Apply combo serial reset fix

on:
  push:
    branches: [improve/motion-afterfeel-combo-links-20260902]
    paths:
      - scripts/apply-combo-serial-reset-fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/motion-afterfeel-combo-links-20260902
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Fix combo link serial reset detection
        run: python3 scripts/apply-combo-serial-reset-fix.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run TPS regression
        run: npm run test:rules:tps
      - name: Run lint
        run: npm run lint
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/motion-expansion-runtime.ts tests/motion-expansion.test.ts
          if git diff --cached --quiet; then
            echo "No fix changes"
          else
            git commit -m "Handle combo link serial resets across rounds"
            git push origin HEAD:improve/motion-afterfeel-combo-links-20260902
          fi