name: Apply Motion Foundry V6 reference-driven kicks

on:
  push:
    branches: [motion-foundry-v6-reference-driven]
    paths:
      - .github/workflows/motion-v6-reference-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-foundry-v6-reference-driven
          fetch-depth: 0

      - name: Upgrade kick generator to reference-driven V6
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/blender/build-fight-motion-foundry-v2-kicks.py')
          text = path.read_text()

          def once(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'patch anchor missing: {old[:120]!r}')
              text = text.replace(old, new, 1)

          once('from dataclasses import dataclass', 'from dataclasses import dataclass, replace')
          once('from typing import List, Tuple', 'from typing import List, Tuple, Sequence')
          once('    source_action_hint: str = "Idle_Loop_Armature"\n    source_knots:', '    source_action_hint: str = "Idle_Loop_Armature"\n    reference_candidates: Tuple[str, ...] = ()\n    source_knots:')

          text = text.replace('version="BLENDER_MOTION_FOUNDRY_V2_FRONT_KICK"', 'version="BLENDER_MOTION_FOUNDRY_V6_FRONT_KICK"')
          text = text.replace('version="BLENDER_MOTION_FOUNDRY_V2_LOW_KICK"', 'version="BLENDER_MOTION_FOUNDRY_V6_LOW_KICK"')
          text = text.replace('version="BLENDER_MOTION_FOUNDRY_V2_RISING_KICK"', 'version="BLENDER_MOTION_FOUNDRY_V6_RISING_KICK"')

          text = text.replace('ik_influences=(0.0, 0.74, 0.96, 1.0, 1.0, 0.76, 0.0),', 'ik_influences=(0.0, 0.16, 0.52, 1.0, 0.72, 0.12, 0.0),', 1)
          text = text.replace('ik_influences=(0.0, 0.70, 0.94, 1.0, 1.0, 0.72, 0.0),', 'ik_influences=(0.0, 0.12, 0.48, 1.0, 0.68, 0.10, 0.0),', 1)
          text = text.replace('ik_influences=(0.0, 0.72, 0.96, 1.0, 1.0, 0.74, 0.0),', 'ik_influences=(0.0, 0.18, 0.56, 1.0, 0.78, 0.14, 0.0),', 1)

          once('    upper_pitch=(0.0, -2.0, -5.0, -7.0, -7.0, -2.0, 0.0),\n    knee_pole_bias=', '    upper_pitch=(0.0, -2.0, -5.0, -7.0, -7.0, -2.0, 0.0),\n    reference_candidates=("Melee_Hook_Armature", "OverhandThrow_Armature", "Sword_Regular_A_Armature"),\n    guard_influences=(0.0, 0.18, 0.30, 0.58, 0.42, 0.22, 0.0),\n    knee_pole_bias=')
          once('    upper_pitch=(0.0, -2.0, -4.0, -6.0, -6.0, -2.0, 0.0),\n    guard_width=0.12,', '    upper_pitch=(0.0, -2.0, -4.0, -6.0, -6.0, -2.0, 0.0),\n    reference_candidates=("Melee_Hook_Armature", "Sword_Regular_A_Armature", "OverhandThrow_Armature"),\n    guard_influences=(0.0, 0.10, 0.24, 0.45, 0.32, 0.16, 0.0),\n    guard_width=0.12,')
          once('    upper_pitch=(0.0, -3.0, -6.0, -9.0, -10.0, -3.0, 0.0),\n    guard_height=0.165,', '    upper_pitch=(0.0, -3.0, -6.0, -9.0, -10.0, -3.0, 0.0),\n    reference_candidates=("NinjaJump_Start_Armature", "Melee_Hook_Armature", "OverhandThrow_Armature"),\n    guard_influences=(0.0, 0.12, 0.26, 0.50, 0.36, 0.18, 0.0),\n    guard_height=0.165,')

          anchor = '''def _find_action_exact(name: str) -> bpy.types.Action:\n    exact = next((action for action in bpy.data.actions if action.name == name), None)\n    if exact is not None:\n        return exact\n    raise RuntimeError(f"Required action {name!r} missing; available: {[a.name for a in bpy.data.actions]}")\n\n\n'''
          insert = anchor + '''def _normalized_action_name(name: str) -> str:\n    stem = name.split(".", 1)[0].lower().replace("armature", "")\n    return "".join(ch for ch in stem if ch.isalnum())\n\n\ndef _find_action_fuzzy(name: str):\n    exact = next((action for action in bpy.data.actions if action.name == name), None)\n    if exact is not None:\n        return exact\n    wanted = _normalized_action_name(name)\n    return next((action for action in bpy.data.actions if _normalized_action_name(action.name) == wanted), None)\n\n\ndef import_reference_actions(path: str) -> List[str]:\n    before_objects = {obj.name for obj in bpy.context.scene.objects}\n    before_actions = {action.name for action in bpy.data.actions}\n    bpy.ops.import_scene.gltf(filepath=os.path.abspath(path))\n    imported = [action.name for action in bpy.data.actions if action.name not in before_actions]\n    for obj in list(bpy.context.scene.objects):\n        if obj.name not in before_objects:\n            bpy.data.objects.remove(obj, do_unlink=True)\n    if not imported:\n        raise RuntimeError(f"Reference source {path!r} did not provide any new Actions")\n    return imported\n\n\ndef choose_reference_action(spec: KickSpec) -> bpy.types.Action:\n    for candidate in spec.reference_candidates:\n        action = _find_action_fuzzy(candidate)\n        if action is not None:\n            return action\n    fallback = _find_action_fuzzy(spec.source_action_hint)\n    if fallback is not None:\n        return fallback\n    raise RuntimeError(\n        f"{spec.action_name}: no reference action found from {spec.reference_candidates}; "\n        f"available: {[a.name for a in bpy.data.actions]}"\n    )\n\n\ndef _normalize_series(values: Sequence[float]) -> List[float]:\n    if not values:\n        return []\n    low, high = min(values), max(values)\n    span = high - low\n    if span < 1e-8:\n        return [0.0 for _ in values]\n    return [(value - low) / span for value in values]\n\n\ndef derive_reference_knots(\n    scene: bpy.types.Scene,\n    armature: bpy.types.Object,\n    action: bpy.types.Action,\n    spec: KickSpec,\n    up: Vector,\n):\n    """Align the authored reference's kinetic peak to gameplay impact.\n\n    V5 stretched an Idle pose and asked IK to invent almost the entire kick.\n    V6 preserves an authored full-body combat sequence and only constrains the\n    strike limb near contact. The reference peak is found from hand reach, torso\n    rotation, pelvis travel and (for rising kicks) vertical pelvis velocity.\n    """\n    armature.animation_data.action = action\n    start, end = action.frame_range\n    if end - start < 2.0:\n        raise RuntimeError(f"{spec.action_name}: reference {action.name} is too short")\n    sample_count = 49\n    reaches, twists, pelvis_travel, vertical_speed = [], [], [], []\n    pelvis0 = None\n    torso0 = None\n    previous_pelvis = None\n    for index in range(sample_count):\n        frame = start + (end - start) * index / (sample_count - 1)\n        rig.v1.set_scene_frame(scene, frame)\n        pelvis = rig.v1.pose_head(armature, "pelvis")\n        left_hand = rig.v1.pose_head(armature, "hand_l")\n        right_hand = rig.v1.pose_head(armature, "hand_r")\n        torso_q = rig.pose_world_matrix(armature, "spine_03").to_quaternion()\n        if pelvis0 is None:\n            pelvis0 = pelvis.copy()\n            torso0 = torso_q.copy()\n        reach_l = left_hand - pelvis\n        reach_r = right_hand - pelvis\n        reaches.append(max(reach_l.length, reach_r.length))\n        twists.append(math.degrees(torso0.rotation_difference(torso_q).angle))\n        pelvis_travel.append((pelvis - pelvis0).length)\n        vertical_speed.append(0.0 if previous_pelvis is None else abs((pelvis - previous_pelvis).dot(up)))\n        previous_pelvis = pelvis.copy()\n\n    nr = _normalize_series(reaches)\n    nt = _normalize_series(twists)\n    np = _normalize_series(pelvis_travel)\n    nv = _normalize_series(vertical_speed)\n    rising = spec.action_name == "BF_RisingKick_R"\n    scores = [\n        0.92 * nr[i] + 1.00 * nt[i] + 0.45 * np[i] + (0.85 if rising else 0.20) * nv[i]\n        for i in range(sample_count)\n    ]\n    lo, hi = int(sample_count * 0.10), int(sample_count * 0.90)\n    peak_index = max(range(lo, hi), key=lambda i: scores[i])\n    reference_impact_u = peak_index / (sample_count - 1)\n    reference_impact_u = max(0.18, min(0.82, reference_impact_u))\n    prior_score = scores[peak_index] / (3.22 if rising else 2.57)\n\n    def du(frame: int) -> float:\n        return (frame - spec.start_frame) / max(1, spec.end_frame - spec.start_frame)\n\n    src_load = max(0.0, reference_impact_u - 0.30)\n    src_pre = max(src_load + 0.02, reference_impact_u - 0.085)\n    src_over = min(1.0, reference_impact_u + 0.075)\n    src_recovery = min(1.0, reference_impact_u + 0.31)\n    knots = (\n        (0.0, 0.0),\n        (du(spec.load_frame), src_load),\n        (du(spec.precontact_frame), src_pre),\n        (du(spec.impact_frame), reference_impact_u),\n        (du(spec.overtravel_frame), src_over),\n        (du(spec.recovery_frame), src_recovery),\n        (1.0, 1.0),\n    )\n    return knots, reference_impact_u, max(0.0, min(1.0, prior_score))\n\n\n'''
          once(anchor, insert)

          old_build = '''def build_kick_action(scene: bpy.types.Scene, armature: bpy.types.Object, spec: KickSpec, axes):\n    rig.configure_v1_for_spec(spec)\n    ensure_kick_bones(armature, spec)\n    source = rig.v1.find_source_action()\n    source_name = source.name\n    samples = rig.v1.sample_source_basis(scene, armature, source)\n'''
          new_build = '''def build_kick_action(scene: bpy.types.Scene, armature: bpy.types.Object, spec: KickSpec, axes):\n    # Reference-driven V6: the full-body authored motion is primary.\n    # IK is only a contact-window constraint layered over that motion prior.\n    reference = choose_reference_action(spec)\n    spec = replace(spec, source_action_hint=reference.name)\n    rig.configure_v1_for_spec(spec)\n    ensure_kick_bones(armature, spec)\n    reference_knots, reference_impact_u, reference_prior_score = derive_reference_knots(\n        scene, armature, reference, spec, axes[2]\n    )\n    spec = replace(spec, source_knots=reference_knots)\n    rig.configure_v1_for_spec(spec)\n    source = reference\n    source_name = source.name\n    samples = rig.v1.sample_source_basis(scene, armature, source)\n'''
          once(old_build, new_build)

          once('        "sourceAction": source_name,\n        "fps": rig.FPS,', '        "sourceAction": source_name,\n        "referenceSourceAction": source_name,\n        "referenceImpactNormalizedTime": reference_impact_u,\n        "referencePriorActivityScore": reference_prior_score,\n        "referenceTimeWarpKnots": [list(knot) for knot in spec.source_knots],\n        "contactIKPolicy": "IMPACT_WINDOW_ONLY",\n        "fps": rig.FPS,')
          text = text.replace('"naturalnessPass": "SCREEN_REVIEW_V5"', '"naturalnessPass": "REFERENCE_DRIVEN_V6"')
          text = text.replace('"referencePoseMethod": "FIVE_KEY_REFERENCE_V4"', '"referencePoseMethod": "FULL_BODY_REFERENCE_V6"')
          text = text.replace('            "Idle_Loop whole-body base",', '            f"full-body authored reference base: {source_name}",\n            "automatic kinetic-peak alignment to gameplay impact",\n            "reference motion retained outside the contact window",')
          text = text.replace('            f"{spec.strike_side.upper()} strike-leg two-bone IK",', '            f"{spec.strike_side.upper()} contact-window strike-leg IK",')

          once('    parser.add_argument("--source", required=True)\n    parser.add_argument("--output-dir", required=True)', '    parser.add_argument("--source", required=True)\n    parser.add_argument("--reference-source", required=True)\n    parser.add_argument("--output-dir", required=True)')
          once('    armature = rig.v1.import_source(os.path.abspath(args.source))\n    scene = bpy.context.scene\n    axes = body_axes(scene, armature)', '    armature = rig.v1.import_source(os.path.abspath(args.source))\n    scene = bpy.context.scene\n    imported_reference_actions = import_reference_actions(args.reference_source)\n    print("MOTION_FOUNDRY_V6_REFERENCE_ACTIONS", imported_reference_actions)\n    axes = body_axes(scene, armature)')
          text = text.replace('"version": "BLENDER_MOTION_FOUNDRY_V2_KICKS"', '"version": "BLENDER_MOTION_FOUNDRY_V6_KICKS"')
          path.write_text(text)

          runtime = Path('src/game/visual-quaternius-runtime.ts')
          rt = runtime.read_text().replace('"BLENDER_MOTION_FOUNDRY_V2_KICKS"', '"BLENDER_MOTION_FOUNDRY_V6_REFERENCE_KICKS"')
          runtime.write_text(rt)

          test = Path('tests/blender-motion-foundry-v2-kicks.test.mjs')
          t = test.read_text()
          t = t.replace('assert.match(generator, /source_action_hint: str = "Idle_Loop_Armature"/);', 'assert.match(generator, /reference_candidates/);\n  assert.match(generator, /derive_reference_knots/);\n  assert.match(generator, /IMPACT_WINDOW_ONLY/);')
          t = t.replace('"BLENDER_MOTION_FOUNDRY_V2_KICKS"', '"BLENDER_MOTION_FOUNDRY_V6_KICKS"')
          t = t.replace('"SCREEN_REVIEW_V5"', '"REFERENCE_DRIVEN_V6"')
          t = t.replace('assert.equal(move.sourceAction, "Idle_Loop_Armature");', 'assert.notEqual(move.sourceAction, "Idle_Loop_Armature");\n    assert.ok(move.referencePriorActivityScore > 0.05, `${move.action}: ${move.referencePriorActivityScore}`);\n    assert.equal(move.contactIKPolicy, "IMPACT_WINDOW_ONLY");')
          t = t.replace('assert.ok(move.guardHandMaxChestDistance < 0.34,', 'assert.ok(move.guardHandMaxChestDistance < 0.55,')
          t = t.replace('assert.ok(move.guardHandMinChestHeight > 0.08,', 'assert.ok(move.guardHandMinChestHeight > -0.05,')
          t = t.replace('/BLENDER_MOTION_FOUNDRY_V2_KICKS/', '/BLENDER_MOTION_FOUNDRY_V6_REFERENCE_KICKS/')
          t = t.replace('assert.equal(metrics.referencePoseMethod, "FIVE_KEY_REFERENCE_V4");', 'assert.equal(metrics.referencePoseMethod, "FULL_BODY_REFERENCE_V6");')
          t = t.replace('assert.equal(move.referencePoseMethod, "FIVE_KEY_REFERENCE_V4");', 'assert.equal(move.referencePoseMethod, "FULL_BODY_REFERENCE_V6");')
          test.write_text(t)
          PY

      - name: Add V6 architecture document
        run: |
          cat > docs/MOTION_FOUNDRY_V6_REFERENCE_DRIVEN.md <<'EOF'
          # Motion Foundry V6 — Reference-Driven Generative Motion Pipeline

          V6 changes the role of procedural control. V5 started from `Idle_Loop` and used IK plus hand-authored pelvis/foot curves to invent a kick. V6 starts from a full-body authored combat reference and keeps that time-series motion as the primary signal.

          ## Current bootstrap

          - Reference provider: Quaternius Universal Animation Library 2 (same universal humanoid skeleton).
          - Front kick prior: `Melee_Hook`, fallback `OverhandThrow` / `Sword_Regular_A`.
          - Low kick prior: `Melee_Hook`, fallback `Sword_Regular_A` / `OverhandThrow`.
          - Rising kick prior: `NinjaJump_Start`, fallback `Melee_Hook` / `OverhandThrow`.
          - Automatic reference event alignment finds a kinetic peak from hand reach, torso rotation, pelvis travel and vertical pelvis velocity, then maps that event to the gameplay impact frame.
          - Strike-leg IK is reduced to an impact window instead of generating the full motion.
          - Guard IK is deliberately weakened so authored arm counterbalance and torso momentum survive.
          - Support-foot lock/pivot and exact hit-line constraints remain deterministic for gameplay.

          ## Generative-provider contract

          The Blender generator accepts `--reference-source <GLB>`. A future Kimodo, GEM, DMP or other motion model only needs to export a compatible humanoid GLB/BVH-converted GLB. The same V6 alignment, contact constraints, validation, retargeting and game bake can then operate without changing the iPhone runtime.

          Generated clips remain ordinary 60 Hz glTF `AnimationClip`s. No neural network runs on iPhone.

          ## Quality principle

          Human motion is primary; constraints are secondary. IK may correct the final centimeters around contact, but may not invent anticipation, weight transfer, counter-rotation, recovery or arm counterbalance.
          EOF

      - name: Commit source implementation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blender/build-fight-motion-foundry-v2-kicks.py src/game/visual-quaternius-runtime.ts tests/blender-motion-foundry-v2-kicks.test.mjs docs/MOTION_FOUNDRY_V6_REFERENCE_DRIVEN.md
          git diff --cached --check
          git commit -m "Build reference-driven Motion Foundry V6 kicks"
          git push origin HEAD:motion-foundry-v6-reference-driven
