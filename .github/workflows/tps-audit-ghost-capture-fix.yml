name: Apply arm and fist playtest fix

on:
  push:
    paths:
      - '.github/workflows/tps-audit-ghost-capture-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/arm-fist-playtest-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply arm/fist source fix
        run: python3 scripts/apply-arm-fist-playtest-fix.py
      - run: npm ci --no-audit --no-fund
      - name: TPS regression suite
        run: npm run test:ci:tps
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Publish verified fix to review branch
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/visual-quaternius-runtime.ts src/game/quaternius-graphics-polish.ts tests/quaternius-model-skin.test.ts scripts/capture-motion-readability-audit.mjs
          git commit -m "Fix imported forearms and restore fist silhouettes [arm-fist-auto]"
          git push origin HEAD:fix/arm-fist-playtest-20260901
