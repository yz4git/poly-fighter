name: TMP V6.2 lower-limb anatomy patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-foundry-v6-leg-anatomy-fix
          fetch-depth: 0
      - name: Apply V6.2 anatomy patch
        run: |
          python tools/blender/_tmp_v6_2_leg_patch.py
          python -m py_compile tools/blender/build-fight-motion-foundry-v2-kicks.py
          cat > tests/motion-foundry-v6-leg-anatomy-v62.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          const kicks = fs.readFileSync('tools/blender/build-fight-motion-foundry-v2-kicks.py', 'utf8');

          test('V6.2 knee poles preserve the measured bend hemisphere with bounded projected bias', () => {
            assert.match(kicks, /ANIMATED_MEASURED_KNEE_PLANE_V6_2/);
            assert.match(kicks, /safe_bias -= axis \* safe_bias\.dot\(axis\)/);
            assert.match(kicks, /max_bias = min\(0\.045/);
            assert.match(kicks, /knee_plane_min_dot/);
            assert.match(kicks, /strikeKneePlaneMinDot/);
            assert.match(kicks, /supportKneePlaneMinDot/);
          });

          test('V6.2 foot orientation follows fighter anatomical axes instead of world X', () => {
            assert.match(kicks, /ANATOMICAL_BODY_AXES_V6_2/);
            assert.match(kicks, /pitch_axis=left, yaw_axis=up/);
            assert.doesNotMatch(kicks, /pitch = Quaternion\(Vector\(\(1\.0, 0\.0, 0\.0\)\), math\.radians\(pitch_deg\)\)/);
          });
          EOF
          node --test tests/motion-foundry-v6-leg-anatomy.test.mjs tests/motion-foundry-v6-leg-anatomy-v62.test.mjs
          git diff --check
      - name: Commit anatomy fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/blender/build-fight-motion-foundry-v2-kicks.py tests/motion-foundry-v6-leg-anatomy-v62.test.mjs
          git commit -m 'Preserve kick knee planes and anatomical foot axes'
          git push origin HEAD:motion-foundry-v6-leg-anatomy-fix
