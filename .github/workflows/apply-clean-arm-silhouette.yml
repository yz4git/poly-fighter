name: Apply clean arm silhouette fix

on:
  push:
    paths:
      - '.github/workflows/apply-clean-arm-silhouette.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remove-dangling-arm-addons-20260901
          fetch-depth: 0

      - name: Remove dangling arm add-on geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def remove_specs(path: str, names: list[str]) -> None:
              p = Path(path)
              text = p.read_text()
              for name in names:
                  pattern = re.compile(
                      r'    \{\n      name: "' + re.escape(name) + r'",\n.*?\n    \},\n',
                      re.S,
                  )
                  text, count = pattern.subn('', text, count=1)
                  if count != 1:
                      raise SystemExit(f'expected exactly one {name} block in {path}, removed {count}')
              p.write_text(text)

          remove_specs('src/game/quaternius-graphics-polish.ts', [
              'ubc-kairo-outfit-left-sleeve',
              'ubc-kairo-outfit-right-sleeve',
              'ubc-kairo-left-gauntlet',
              'ubc-kairo-right-gauntlet',
              'ubc-sera-outfit-left-sleeve',
              'ubc-sera-outfit-right-sleeve',
              'ubc-sera-left-forearm-guard',
              'ubc-sera-right-forearm-guard',
          ])

          remove_specs('src/game/quaternius-character-graphics-v2.ts', [
              'ubc-sera-v2-left-forearm-fin',
              'ubc-sera-v2-right-forearm-fin',
          ])

          p = Path('tests/quaternius-model-skin.test.ts')
          text = p.read_text()
          text = text.replace('    "ubc-kairo-outfit-left-sleeve",\n', '')
          text = text.replace('    "ubc-sera-outfit-left-sleeve",\n', '')
          text = text.replace(
              '  assert.match(polish, /ubc-kairo-left-gauntlet/);\n',
              '  for (const removedArmAddon of [\n'
              '    "ubc-kairo-outfit-left-sleeve",\n'
              '    "ubc-kairo-outfit-right-sleeve",\n'
              '    "ubc-kairo-left-gauntlet",\n'
              '    "ubc-kairo-right-gauntlet",\n'
              '    "ubc-sera-outfit-left-sleeve",\n'
              '    "ubc-sera-outfit-right-sleeve",\n'
              '    "ubc-sera-left-forearm-guard",\n'
              '    "ubc-sera-right-forearm-guard",\n'
              '  ]) {\n'
              '    assert.doesNotMatch(polish, new RegExp(removedArmAddon));\n'
              '  }\n'
          )
          text = text.replace('  assert.match(polish, /ubc-sera-left-forearm-guard/);\n', '')
          text = text.replace('  assert.match(polish, /lowerarm_l/);\n', '')
          p.write_text(text)

          p = Path('tests/quaternius-character-graphics-v2.test.ts')
          text = p.read_text()
          marker = '  assert.match(v2, /KAIRO_FORGE_V2_FACE_FRAME_COLLAR_ARMORED_SILHOUETTE/);\n'
          insertion = (
              '  assert.doesNotMatch(v2, /ubc-sera-v2-left-forearm-fin/);\n'
              '  assert.doesNotMatch(v2, /ubc-sera-v2-right-forearm-fin/);\n'
              + marker
          )
          if marker not in text:
              raise SystemExit('v2 test insertion marker not found')
          text = text.replace(marker, insertion, 1)
          p.write_text(text)
          PY

      - name: Verify dangling arm add-ons are gone
        run: |
          set -euxo pipefail
          ! grep -R -E 'ubc-(kairo-outfit-(left|right)-sleeve|kairo-(left|right)-gauntlet|sera-outfit-(left|right)-sleeve|sera-(left|right)-forearm-guard|sera-v2-(left|right)-forearm-fin)' src/game/quaternius-graphics-polish.ts src/game/quaternius-character-graphics-v2.ts
          grep -q 'ubc-kairo-left-fist' src/game/quaternius-graphics-polish.ts
          grep -q 'ubc-sera-left-fist' src/game/quaternius-graphics-polish.ts
          grep -q 'ubc-kairo-v2-left-knuckle-cap' src/game/quaternius-character-graphics-v2.ts
          grep -q 'ubc-sera-v2-left-shoulder-wing' src/game/quaternius-character-graphics-v2.ts

      - name: Commit implementation
        run: |
          set -euxo pipefail
          git config user.name 'yz4git'
          git config user.email '65384484+yz4git@users.noreply.github.com'
          git rm .github/workflows/apply-clean-arm-silhouette.yml
          git add src/game/quaternius-graphics-polish.ts src/game/quaternius-character-graphics-v2.ts tests/quaternius-model-skin.test.ts tests/quaternius-character-graphics-v2.test.ts
          git commit -m 'Remove dangling arm add-on geometry'
          git push origin HEAD:fix/remove-dangling-arm-addons-20260901
