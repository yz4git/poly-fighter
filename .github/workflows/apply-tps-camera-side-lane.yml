name: Apply TPS camera side lane

on:
  push:
    branches: [improve/tps-readability-playtest-20260901]
    paths:
      - scripts/apply-tps-camera-side-lane.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/tps-readability-playtest-20260901
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply camera side-lane fix
        run: python3 scripts/apply-tps-camera-side-lane.py
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run TPS rules
        run: npm run test:rules:tps
      - name: Run lint
        run: npm run lint
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/tps-game-base.ts tests/tps-mode.test.ts
          if git diff --cached --quiet; then
            echo "No camera changes"
          else
            git commit -m "Turn close TPS camera into side lane"
            git push origin HEAD:improve/tps-readability-playtest-20260901
          fi
