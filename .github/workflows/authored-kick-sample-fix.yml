name: One-shot authored kick sample fix

on:
  push:
    branches: [motion-onoff-review]
    paths:
      - .github/workflows/authored-kick-sample-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: motion-onoff-review
          fetch-depth: 0
      - name: Sample only rising kick at late contact
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/capture-motion-readability-audit.mjs')
          s = p.read_text()
          old = '''        const footContact = move.visualContact === 'LEFT_FOOT' || move.visualContact === 'RIGHT_FOOT';\n        const authoredContactReady = game.p1.isActive() && (!footContact || game.p1.moveTick >= authoredContactTick);\n'''
          new = '''        const lateContactSample = moveId === 'risingKick';\n        const authoredContactReady = game.p1.isActive() && (!lateContactSample || game.p1.moveTick >= authoredContactTick);\n'''
          if old not in s:
              raise SystemExit('contact sampling anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check scripts/capture-motion-readability-audit.mjs
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/authored-kick-sample-fix.yml
          git add scripts/capture-motion-readability-audit.mjs
          git commit -m "Sample authored kicks at representative contact frames"
          git push origin HEAD:motion-onoff-review
