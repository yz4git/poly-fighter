name: POLY FIGHTER CMU mocap source probe

on:
  pull_request:
    paths:
      - 'src/game/cmu-mocap-pilot.ts'
      - 'src/game/cmu-anatomical-retarget.ts'
      - 'src/game/cmu-foot-lock.ts'
      - 'src/game/cmu-strike-extraction.ts'
      - 'src/game/cmu-boxing-fist.ts'
      - 'src/game/cmu-pose-retarget.ts'
      - 'scripts/check-cmu-mocap.mjs'
      - 'scripts/check-cmu-runtime.mjs'
      - 'scripts/diagnose-cmu-foot-contacts.mjs'
      - 'scripts/diagnose-cmu-punches.mjs'
      - 'scripts/inspect-cmu-finger-rigs.mjs'
      - '.github/workflows/cmu-mocap-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe upstream skeleton-only GLB files
        run: node scripts/check-cmu-mocap.mjs
        continue-on-error: true
      - name: Install dependencies for full retarget smoke
        run: npm ci --no-audit --no-fund
      - name: Inspect actual finger rigs and bone skin weights
        run: node scripts/inspect-cmu-finger-rigs.mjs
      - name: Retarget actual CMU GLBs onto both UBC models and verify leg clearance
        run: node --import tsx scripts/check-cmu-runtime.mjs
      - name: Probe actual planted-foot intervals
        run: node --import tsx scripts/diagnose-cmu-foot-contacts.mjs
      - name: Scan CMU boxing for candidate impact timing
        run: node --import tsx scripts/diagnose-cmu-punches.mjs
