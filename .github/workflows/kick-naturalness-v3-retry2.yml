name: One-shot kick naturalness v3 retry2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-naturalness-v3-retry2.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply natural kick source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/kick-naturalness-v3-implementation.yml').read_text().splitlines()
          marker = "          python3 - <<'PY'"
          start = lines.index(marker) + 1
          end = next(i for i in range(start, len(lines)) if lines[i] == '          PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(code, '<natural-kick-v3-base>', 'exec'), {})

          p = Path('tools/blender/build-fight-motion-foundry-v2-kicks.py')
          s = p.read_text()
          old = "        (0.18, 0.22, 0.20),\n        (0.40, 0.34, 0.18),\n        (0.42, 0.42, 0.17),\n        (0.02, 0.10, 0.14),"
          new = "        (0.18, 0.18, 0.20),\n        (0.34, 0.27, 0.18),\n        (0.36, 0.31, 0.17),\n        (0.02, 0.08, 0.14),"
          if old not in s:
              raise SystemExit('low kick v3 offsets missing')
          s = s.replace(old, new, 1)
          old = "foot_yaw=(0.0, 12.0, 38.0, 72.0, 86.0, 18.0, 0.0),\n    support_yaw=(0.0, 4.0, 14.0, 30.0, 38.0, 10.0, 0.0),"
          new = "foot_yaw=(0.0, 10.0, 34.0, 66.0, 78.0, 16.0, 0.0),\n    support_yaw=(0.0, 3.0, 12.0, 26.0, 32.0, 8.0, 0.0),"
          if old not in s:
              raise SystemExit('low kick v3 yaw missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('tests/blender-motion-foundry-v2-kicks.test.mjs')
          ts = t.read_text()
          ts = ts.replace('  assert.match(workflow, /supportFootLockMaxAngularDriftDegrees/);', '  assert.match(workflow, /supportFootPivotMaxDegrees/);', 1)
          needle = '  assert.ok(low.supportFootPivotMaxDegrees > 24 && low.supportFootPivotMaxDegrees < 48, low.supportFootPivotMaxDegrees);'
          replacement = '  assert.ok(low.supportFootPivotMaxDegrees > 20 && low.supportFootPivotMaxDegrees < 40, low.supportFootPivotMaxDegrees);\n  assert.ok(low.strikeKneeExtensionDegrees > 145 && low.strikeKneeExtensionDegrees < 174, low.strikeKneeExtensionDegrees);'
          if needle not in ts:
              raise SystemExit('low kick v3 test marker missing')
          t.write_text(ts.replace(needle, replacement, 1))
          PY

      - name: Fetch pinned UAL source
        run: |
          mkdir -p .tmp-quaternius
          BASE_PIN=aa02a4e6d8337a0604d2da131bcbbeb1f01badf0
          BASE_URL=https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/$BASE_PIN/public/assets/vendor/quaternius
          curl -L --fail --retry 3 "$BASE_URL/universal-animation-library.glb" -o .tmp-quaternius/ual1-full.glb
          echo '4c748767741a3e495d89667b9a218b690ba9810b9517a12e960780e3ca72c4e9  .tmp-quaternius/ual1-full.glb' | sha256sum -c -

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri xvfb

      - name: Regenerate authored kick pack
        run: |
          set -euo pipefail
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          mkdir -p artifacts/kick-v3-build
          xvfb-run -a blender --background --python-use-system-env --python-exit-code 1 --python tools/blender/build-fight-motion-foundry-v2-kicks.py -- --source .tmp-quaternius/ual1-full.glb --output-dir artifacts/kick-v3-build
          cp artifacts/kick-v3-build/blender-kicks-core.glb public/models/quaternius/blender-kicks-core.glb
          cp artifacts/kick-v3-build/blender-kicks-core.metrics.json public/models/quaternius/blender-kicks-core.metrics.json
          kick_hash="$(cat tools/blender/build-fight-motion-foundry-v1.py tools/blender/motion_foundry_v2_rig.py tools/blender/build-fight-motion-foundry-v2-kicks.py | sha256sum | awk '{print $1}')"
          printf '%s\n' "$kick_hash" > public/models/quaternius/blender-kicks-core.generator.sha256
          cat public/models/quaternius/blender-kicks-core.metrics.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Validate regenerated kicks
        run: |
          node --test tests/blender-motion-foundry-v2-kicks.test.mjs
          npm run test:ci:tps
          npm run lint
          npm run build

      - name: Start preview
        run: |
          PORT=3000 npm start > /tmp/kick-v3-server.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kick-v3-server.log
          exit 1

      - name: Capture post-fix kick screens
        run: |
          mkdir -p artifacts/kick-v3-screen/model-view artifacts/kick-v3-screen/tps artifacts/kick-v3-screen/tps-gameplay
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" MODEL_VIEW_AUDIT_DIR="artifacts/kick-v3-screen/model-view" node scripts/capture-model-view-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/kick-v3-screen/tps" node scripts/capture-motion-readability-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/kick-v3-screen/tps-gameplay" node scripts/capture-tps-visual-audit.mjs
          cp public/models/quaternius/blender-kicks-core.metrics.json artifacts/kick-v3-screen/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kick-naturalness-v3-final
          path: |
            artifacts/kick-v3-build
            artifacts/kick-v3-screen
          if-no-files-found: error
          retention-days: 14

      - name: Commit kick rebuild and remove temporary workflows
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/kick-naturalness-v3-implementation.yml .github/workflows/kick-naturalness-v3-retry.yml .github/workflows/kick-naturalness-v3-retry2.yml
          git add tools/blender/build-fight-motion-foundry-v2-kicks.py tests/blender-motion-foundry-v2-kicks.test.mjs .github/workflows/blender-motion-foundry-v2-kicks.yml public/models/quaternius/blender-kicks-core.glb public/models/quaternius/blender-kicks-core.metrics.json public/models/quaternius/blender-kicks-core.generator.sha256
          git commit -m 'Rebuild kicks with natural support pivot and body mechanics'
          git push
