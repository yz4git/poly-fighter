name: POLY FIGHTER Airborne Import Fix One Shot

on:
  push:
    branches:
      - feature/blender-motion-foundry-v2-airborne-dash-20260903
    paths:
      - .github/workflows/airborne-import-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/blender-motion-foundry-v2-airborne-dash-20260903
          fetch-depth: 0
      - name: Register dynamically imported helper module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/blender/build-fight-motion-foundry-v2-airborne.py')
          text = path.read_text()
          text = text.replace('import os\nfrom pathlib import Path', 'import os\nimport sys\nfrom pathlib import Path')
          text = text.replace('    module = importlib.util.module_from_spec(spec)\n    spec.loader.exec_module(module)', '    module = importlib.util.module_from_spec(spec)\n    sys.modules[spec.name] = module\n    spec.loader.exec_module(module)')
          path.write_text(text)
          PY
          git rm .github/workflows/airborne-import-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blender/build-fight-motion-foundry-v2-airborne.py
          git commit -m "Fix Python 3.12 airborne helper import"
          git push origin HEAD:feature/blender-motion-foundry-v2-airborne-dash-20260903
