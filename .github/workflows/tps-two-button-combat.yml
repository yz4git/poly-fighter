name: Apply TPS two-button combat

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tps-two-button-combat.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tps-two-button-combat
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply ATTACK + STEP combat pass
        run: python3 scripts/apply-tps-two-button-combat.py
      - name: Keep existing audit workflow unchanged
        run: git checkout -- .github/workflows/tps-visual-audit.yml
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: TPS regression suite
        run: npm run test:ci:tps
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Verify diff
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
      - name: Commit implementation
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/game/tps-game.ts app/page.tsx app/playtest-polish.css tests/tps-mode.test.ts scripts/capture-tps-visual-audit.mjs
          git commit -m "Implement TPS attack and directional step combat"
          git push
