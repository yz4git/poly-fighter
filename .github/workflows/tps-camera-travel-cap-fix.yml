name: Apply TPS camera frame travel cap

on:
  push:
    branches: [tps-continuous-play-polish-v1]
    paths:
      - .github/workflows/tps-camera-travel-cap-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Bound total TPS camera frame travel
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/game/tps-game-base.ts')
          s = p.read_text()
          anchor = 'const TPS_CAMERA_IMPACT_SHOULDER = 0.18;\n'
          assert anchor in s
          s = s.replace(anchor, anchor + 'const TPS_CAMERA_MAX_TRAVEL_SPEED = 15.0;\n', 1)
          anchor = '  private readonly cameraDesired = new THREE.Vector3();\n'
          assert anchor in s
          s = s.replace(anchor, anchor + '  private readonly cameraFrameStart = new THREE.Vector3();\n  private readonly cameraFrameDelta = new THREE.Vector3();\n', 1)
          anchor = '  private updateCamera(delta: number): void {\n'
          assert anchor in s
          s = s.replace(anchor, anchor + '    this.cameraFrameStart.copy(this.camera.position);\n', 1)
          old = '''    if (this.cameraImpact > 0.001) {\n      const impact = this.cameraImpact;\n      this.cameraImpact *= Math.exp(-10 * delta);\n      this.camera.position.addScaledVector(right, Math.sin(this.renderTime * 76) * impact);\n      this.camera.position.y += Math.cos(this.renderTime * 91) * impact * 0.36;\n    }\n    // Smooth the look target as well as camera position.'''
          new = '''    if (this.cameraImpact > 0.001) {\n      const impact = this.cameraImpact;\n      this.cameraImpact *= Math.exp(-10 * delta);\n      this.camera.position.addScaledVector(right, Math.sin(this.renderTime * 76) * impact);\n      this.camera.position.y += Math.cos(this.renderTime * 91) * impact * 0.36;\n    }\n    // Cap the complete frame displacement after both follow motion and impact shake.\n    // Close orbit can rotate a wide shoulder rig quickly; the cap preserves the\n    // composition and hit feel while preventing a single-frame camera surge.\n    const maxCameraTravel = TPS_CAMERA_MAX_TRAVEL_SPEED * delta;\n    this.cameraFrameDelta.copy(this.camera.position).sub(this.cameraFrameStart);\n    if (maxCameraTravel > 0 && this.cameraFrameDelta.lengthSq() > maxCameraTravel * maxCameraTravel) {\n      this.camera.position.copy(this.cameraFrameStart).add(this.cameraFrameDelta.setLength(maxCameraTravel));\n    }\n    // Smooth the look target as well as camera position.'''
          assert old in s
          p.write_text(s.replace(old, new, 1))

          t = Path('tests/tps-mode.test.ts')
          ts = t.read_text()
          anchor = '  assert.match(source, /TPS_CAMERA_IMPACT_SHOULDER = 0\\.18/);\n'
          assert anchor in ts
          ts = ts.replace(anchor, anchor + '  assert.match(source, /TPS_CAMERA_MAX_TRAVEL_SPEED = 15\\.0/);\n  assert.match(source, /cameraFrameStart/);\n', 1)
          t.write_text(ts)
          PY
          git diff --check
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/game/tps-game-base.ts tests/tps-mode.test.ts
          git rm .github/workflows/tps-camera-travel-cap-fix.yml
          git commit -m "Cap TPS camera frame travel"
          git push
