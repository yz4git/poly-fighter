name: POLY FIGHTER Kick Extension v3 One Shot

on:
  push:
    branches:
      - feature/blender-motion-foundry-v2-kicks-20260903
    paths:
      - .github/workflows/kick-extension-v3-patch.yml
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/blender-motion-foundry-v2-kicks-20260903
          fetch-depth: 0
      - name: Apply extension and knee-angle quality gate
        run: python3 tools/blender/patch-kick-extension-v3.py
      - name: Remove one-shot patch helpers
        run: git rm tools/blender/patch-kick-extension-v3.py .github/workflows/kick-extension-v3-patch.yml
      - name: Publish patched kick authoring source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/blender/build-fight-motion-foundry-v2-kicks.py tests/blender-motion-foundry-v2-kicks.test.mjs
          git commit -m "Extend Front and Rising kick impact legs"
          git push origin HEAD:feature/blender-motion-foundry-v2-kicks-20260903
