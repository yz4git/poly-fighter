name: Rival Core Phase 6-8 Helper

on:
  push:
    branches: [rival-core-update-v1]
    paths:
      - .github/workflows/rival-core-phase123-helper.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rival-core-update-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Apply Rival Core phase 6-8 patch
        run: python3 scripts/apply-rival-core-phase678.py
      - run: npm ci --no-audit --no-fund
      - name: Static regression suite
        run: npm run test:ci:static
      - name: TPS regression suite
        run: npm run test:ci:tps
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/tps-game.ts src/game/tps-game-base.ts src/game/audio.ts src/game/tps-training.ts app/page.tsx app/playtest-polish.css package.json tests/tps-rival-core.test.ts
          git commit -m "Implement Rival Core phases 6-8"
          git push origin HEAD:rival-core-update-v1
