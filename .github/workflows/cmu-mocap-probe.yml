name: POLY FIGHTER CMU mocap source probe

on:
  pull_request:
    paths:
      - 'src/game/cmu-mocap-pilot.ts'
      - 'scripts/check-cmu-mocap.mjs'
      - 'scripts/check-cmu-runtime.mjs'
      - 'scripts/diagnose-cmu-legs.mjs'
      - 'scripts/discover-cmu-kicks.mjs'
      - '.github/workflows/cmu-mocap-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe upstream skeleton-only GLB files
        run: node scripts/check-cmu-mocap.mjs
        continue-on-error: true
      - name: Install dependencies for full retarget smoke
        run: npm ci --no-audit --no-fund
      - name: Retarget actual CMU GLBs onto both UBC models
        run: node --import tsx scripts/check-cmu-runtime.mjs
        continue-on-error: true
      - name: Diagnose source and target hip/knee/ankle paths
        run: node --import tsx scripts/diagnose-cmu-legs.mjs
      - name: Check martial arts kick alternatives (optional)
        run: node scripts/discover-cmu-kicks.mjs
