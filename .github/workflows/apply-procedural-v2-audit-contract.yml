name: Apply Procedural v2 audit contract

on:
  push:
    paths:
      - scripts/apply-procedural-v2-audit-contract.mjs
      - .github/workflows/apply-procedural-v2-audit-contract.yml

permissions:
  contents: write

concurrency:
  group: apply-procedural-v2-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Update motion readability audit contract
        run: node scripts/apply-procedural-v2-audit-contract.mjs
      - name: Commit audit contract
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-motion-readability-audit.mjs
          if git diff --cached --quiet; then
            echo "Audit contract already current"
            exit 0
          fi
          git commit -m "Update motion readability audit for Procedural Fight v2"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
