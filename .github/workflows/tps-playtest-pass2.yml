name: TPS Playtest Pass 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tps-playtest-pass2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Fix lock-relative TPS audit probes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/capture-tps-visual-audit.mjs')
          s = p.read_text()
          s = s.replace(
            "if (initial?.ready && initial?.tpsText && initial?.arena && initial?.canvasWidth > 2 && initial?.canvasHeight > 2) break;",
            "if (initial?.ready && initial?.targetLocked && initial?.arena && initial?.canvasWidth > 2 && initial?.canvasHeight > 2) break;",
          )
          old = '''  const afterStrafe = await state(sessionId);\n  if (!afterStrafe?.p1 || !initial?.p1 || Math.abs(afterStrafe.p1.x - initial.p1.x) < 0.25) {\n    throw new Error(`TPS strafe did not move laterally: ${JSON.stringify({ initial, afterStrafe })}`);\n  }'''
          new = '''  const afterStrafe = await state(sessionId);\n  if (!afterStrafe?.p1 || !initial?.p1 || !initial?.p2) throw new Error(`TPS strafe state missing: ${JSON.stringify({ initial, afterStrafe })}`);\n  const initialForwardX = initial.p2.x - initial.p1.x;\n  const initialForwardZ = initial.p2.z - initial.p1.z;\n  const initialForwardLength = Math.max(1e-5, Math.hypot(initialForwardX, initialForwardZ));\n  const initialRightX = -initialForwardZ / initialForwardLength;\n  const initialRightZ = initialForwardX / initialForwardLength;\n  const strafeDX = afterStrafe.p1.x - initial.p1.x;\n  const strafeDZ = afterStrafe.p1.z - initial.p1.z;\n  const lateralTravel = Math.abs(strafeDX * initialRightX + strafeDZ * initialRightZ);\n  if (lateralTravel < 0.25) {\n    throw new Error(`TPS strafe did not move along the lock-relative tangent: ${JSON.stringify({ lateralTravel, initial, afterStrafe })}`);\n  }'''
          if old not in s:
              raise SystemExit('expected strafe probe block not found')
          s = s.replace(old, new)
          s = s.replace(
            "const report = { initial, iphone, afterStrafe, beforeForwardDistance, afterForward, afterForwardDistance, punchProbe, afterPunch, afterBoundary, radial };",
            "const report = { initial, iphone, afterStrafe, lateralTravel, beforeForwardDistance, afterForward, afterForwardDistance, punchProbe, afterPunch, afterBoundary, radial };",
          )
          p.write_text(s)
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run test:rules
      - run: npm run build
      - run: npm run lint
      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-tps-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/poly-fighter-tps-server.log
          exit 1
      - name: Capture current TPS battle
        run: |
          mkdir -p artifacts/tps-playtest-pass2
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-playtest-pass2" node scripts/capture-tps-visual-audit.mjs
          cp /tmp/poly-fighter-tps-server.log artifacts/tps-playtest-pass2/server.log
      - uses: actions/upload-artifact@v4
        with:
          name: poly-fighter-tps-playtest-pass2
          path: artifacts/tps-playtest-pass2
          if-no-files-found: error
      - name: Publish corrected TPS audit probe
        run: |
          if git diff --quiet -- scripts/capture-tps-visual-audit.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-tps-visual-audit.mjs
          git commit -m "Measure TPS strafe in lock-on space"
          git push
