name: POLY FIGHTER VANTA WebGL audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - src/game/**
      - public/models/**
      - package-lock.json
      - scripts/capture-vanta-fighter-audit.mjs
      - .github/workflows/vanta-fighter-audit.yml
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - src/game/**
      - public/models/**
      - package-lock.json
      - scripts/capture-vanta-fighter-audit.mjs
      - .github/workflows/vanta-fighter-audit.yml

permissions:
  contents: read

concurrency:
  group: vanta-webgl-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build production preview
        run: npm run build
      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-vanta-server.log 2>&1 &
          echo $! > /tmp/poly-fighter-vanta-server.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/poly-fighter-vanta-server.log
          exit 1
      - name: Capture VANTA Rival Circuit fight
        run: |
          mkdir -p artifacts/vanta-webgl-audit
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            DRIVER="$CHROMEWEBDRIVER/chromedriver"
          fi
          if [ -z "$DRIVER" ]; then
            echo "ChromeDriver is not available"
            exit 1
          fi
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/vanta-webgl-audit" node scripts/capture-vanta-fighter-audit.mjs
          test -s artifacts/vanta-webgl-audit/rival-circuit-vanta-iphone.png
          file artifacts/vanta-webgl-audit/rival-circuit-vanta-iphone.png | grep -q "PNG image data"
          test -s artifacts/vanta-webgl-audit/rival-circuit-vanta.json
      - name: Preserve server log
        if: always()
        run: |
          mkdir -p artifacts/vanta-webgl-audit
          if [ -f /tmp/poly-fighter-vanta-server.log ]; then
            cp /tmp/poly-fighter-vanta-server.log artifacts/vanta-webgl-audit/server.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-vanta-webgl-audit
          path: artifacts/vanta-webgl-audit
          if-no-files-found: error
          retention-days: 7
