name: Kick v4 Product Finalizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kick-reference-pose-v4.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified five-pose patch
        run: python3 scripts/apply-kick-reference-pose-v4.py

      - name: Apply verified post-patch tuning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          builder = Path('tools/blender/build-fight-motion-foundry-v2-kicks.py')
          s = builder.read_text()
          broken = '    @property\n    @property\n    def reference_pose_frames'
          if broken not in s:
              raise SystemExit('verified property anchor missing')
          s = s.replace(broken, '    @property\n    def reference_pose_frames', 1)
          old_reach = 'reach_ratios=(0.0, 0.0, 0.88, 0.960, 0.965, 0.0, 0.0)'
          if old_reach not in s:
              raise SystemExit('verified front reach anchor missing')
          s = s.replace(old_reach, 'reach_ratios=(0.0, 0.0, 0.88, 0.962, 0.966, 0.0, 0.0)', 1)
          builder.write_text(s)

          tests = Path('tests/blender-motion-foundry-v2-kicks.test.mjs')
          t = tests.read_text()
          old = '    assert.ok(chamber.strikeFootRise > 0.10, `${move.action} chamber rise ${chamber.strikeFootRise}`);'
          new = '    const minimumChamberRise = move.action === "BF_LowKick_L" ? 0.05 : 0.10;\n    assert.ok(chamber.strikeFootRise > minimumChamberRise, `${move.action} chamber rise ${chamber.strikeFootRise}`);'
          if old not in t:
              raise SystemExit('verified chamber gate anchor missing')
          tests.write_text(t.replace(old, new, 1))
          PY

      - name: Fetch pinned animation source
        run: |
          set -euo pipefail
          mkdir -p .tmp-quaternius
          BASE_PIN=aa02a4e6d8337a0604d2da131bcbbeb1f01badf0
          BASE_URL=https://raw.githubusercontent.com/Seyamalam/blood-league-kickoff/$BASE_PIN/public/assets/vendor/quaternius
          curl -L --fail --retry 3 "$BASE_URL/universal-animation-library.glb" -o .tmp-quaternius/ual1-full.glb
          echo '4c748767741a3e495d89667b9a218b690ba9810b9517a12e960780e3ca72c4e9  .tmp-quaternius/ual1-full.glb' | sha256sum -c -

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1-mesa-dri xvfb

      - name: Regenerate verified kick pack
        run: |
          set -euo pipefail
          export PYTHONPATH="tools/blender:/usr/lib/python3/dist-packages${PYTHONPATH:+:$PYTHONPATH}"
          mkdir -p artifacts/kick-reference-v4-build
          xvfb-run -a blender --background --python-use-system-env --python-exit-code 1 --python tools/blender/build-fight-motion-foundry-v2-kicks.py -- --source .tmp-quaternius/ual1-full.glb --output-dir artifacts/kick-reference-v4-build
          cp artifacts/kick-reference-v4-build/blender-kicks-core.glb public/models/quaternius/blender-kicks-core.glb
          cp artifacts/kick-reference-v4-build/blender-kicks-core.metrics.json public/models/quaternius/blender-kicks-core.metrics.json
          kick_hash="$(cat tools/blender/build-fight-motion-foundry-v1.py tools/blender/motion_foundry_v2_rig.py tools/blender/build-fight-motion-foundry-v2-kicks.py | sha256sum | awk '{print $1}')"
          printf '%s\n' "$kick_hash" > public/models/quaternius/blender-kicks-core.generator.sha256
          test "$(sha256sum public/models/quaternius/blender-kicks-core.glb | awk '{print $1}')" = '52fb37dad5d2e68344da393f060bd1ab20f72743080621b3f86ac6d5a814051c'
          test "$(cat public/models/quaternius/blender-kicks-core.generator.sha256)" = '190c193e688894fb520528183490bbbacc9206059876085ea84bebadf1b92c26c'

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Validate exact verified product
        run: |
          node --test tests/blender-motion-foundry-v2-kicks.test.mjs
          npm run test:ci:tps
          npm run lint
          npm run build

      - name: Commit product files only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/blender/build-fight-motion-foundry-v2-kicks.py \
            tests/blender-motion-foundry-v2-kicks.test.mjs \
            scripts/capture-model-view-audit.mjs \
            docs/KICK_REFERENCE_POSE_V4.md \
            public/models/quaternius/blender-kicks-core.glb \
            public/models/quaternius/blender-kicks-core.metrics.json \
            public/models/quaternius/blender-kicks-core.generator.sha256
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'Reconstruct kicks from five-pose motion references'
          git push origin HEAD:main
