name: POLY FIGHTER Motion ON-OFF Review

on:
  push:
    branches: [motion-onoff-review]
    paths:
      - app/**
      - src/**
      - public/**
      - scripts/capture-motion-onoff-review.mjs
      - package.json
      - package-lock.json
      - .github/workflows/motion-onoff-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production preview
        run: npm run build

      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-motion-review.log 2>&1 &
          echo $! > /tmp/poly-fighter-motion-review.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/poly-fighter-motion-review.log
          exit 1

      - name: Prime correction assets for deterministic A-B capture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/capture-motion-onoff-review.mjs')
          text = p.read_text()
          anchor = '  if (!(await clickButton(sessionId, "ENGAGE TPS"))) throw new Error("TPS engage button not found");\n\n  let ready = null;'
          replacement = '  if (!(await clickButton(sessionId, "ENGAGE TPS"))) throw new Error("TPS engage button not found");\n  await delay(120);\n  await execute(sessionId, `${gameLookup}\\n    const game = findGame();\\n    if (!game) return false;\\n    game.updateSettings({ motionCorrections: true });\\n    return true;\\n  `);\n\n  let ready = null;'
          if anchor not in text:
              raise SystemExit('capture prime anchor missing')
          p.write_text(text.replace(anchor, replacement, 1))
          PY

      - name: Capture correction OFF and ON at identical poses
        run: |
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            DRIVER="$CHROMEWEBDRIVER/chromedriver"
          fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" \
            AUDIT_URL="http://127.0.0.1:3000/" \
            AUDIT_DIR="artifacts/motion-onoff-review" \
            node scripts/capture-motion-onoff-review.mjs

      - name: Preserve server log
        if: always()
        run: |
          mkdir -p artifacts/motion-onoff-review
          cp /tmp/poly-fighter-motion-review.log artifacts/motion-onoff-review/server.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-motion-onoff-review
          path: artifacts/motion-onoff-review
          if-no-files-found: error
          retention-days: 14
