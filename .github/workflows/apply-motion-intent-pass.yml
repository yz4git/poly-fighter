name: Apply motion intent improvement pass

on:
  push:
    paths:
      - .github/workflows/apply-motion-intent-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply motion intent fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              text = text.replace(old, new, -1 if count is None else count)
              p.write_text(text)

          # Generator: add mirrored side-specific clips and reduce over-twist on hook/heavy.
          g = "scripts/generate-procedural-fight-motions-v2.mjs"
          replace(g,
            '  { name: "PF_Backfist_R", base: "Punch_Cross", family: "punch", style: "HOOK", side: 1, power: 0.92, contactU: 0.62, plantFoot: "LEFT" },\n',
            '  { name: "PF_Backfist_R", base: "Punch_Cross", family: "punch", style: "HOOK", side: 1, power: 0.88, contactU: 0.62, plantFoot: "LEFT" },\n'
            '  { name: "PF_Backfist_L", base: "Punch_Cross", family: "punch", style: "HOOK", side: -1, power: 0.88, contactU: 0.62, plantFoot: "RIGHT" },\n')
          replace(g,
            '  { name: "PF_BodyBlow_L", base: "Punch_Jab", family: "punch", style: "BODY", side: -1, power: 0.88, contactU: 0.70, plantFoot: "RIGHT" },\n',
            '  { name: "PF_BodyBlow_L", base: "Punch_Jab", family: "punch", style: "BODY", side: -1, power: 0.88, contactU: 0.70, plantFoot: "RIGHT" },\n'
            '  { name: "PF_BodyBlow_R", base: "Punch_Jab", family: "punch", style: "BODY", side: 1, power: 0.88, contactU: 0.70, plantFoot: "LEFT" },\n')
          replace(g,
            '  { name: "PF_Counter_R", base: "Punch_Cross", family: "punch", style: "COUNTER", side: 1, power: 1.04, contactU: 0.55, plantFoot: "LEFT" },\n',
            '  { name: "PF_Counter_R", base: "Punch_Cross", family: "punch", style: "COUNTER", side: 1, power: 1.00, contactU: 0.55, plantFoot: "LEFT" },\n'
            '  { name: "PF_Counter_L", base: "Punch_Cross", family: "punch", style: "COUNTER", side: -1, power: 1.00, contactU: 0.55, plantFoot: "RIGHT" },\n')

          replace(g,
'''    case "HOOK":
      torso(24, 2, 5); rootDrive(0.028, -0.016, 0.014);
      bones.spine_01 = bones.pelvis;
      bones.upperarm_r = [K(0, R()), K(anticipate, R(12, -12, 22)), K(impact, R(-21, 28, -25)), K(settle, R(-8, 11, -10)), K(1, R())];
      bones.lowerarm_r = [K(0, R()), K(anticipate, R(0, 22, 11)), K(impact, R(0, -36, -9)), K(1, R())];
      break;
''',
'''    case "HOOK": {
      const arm = s < 0 ? "l" : "r";
      torso(17, 1, 2); rootDrive(0.040, -0.010, 0.012);
      bones.spine_01 = bones.pelvis;
      bones[`upperarm_${arm}`] = [K(0, R()), K(anticipate, R(9, -9 * s, 15 * s)), K(impact, R(-14, 19 * s, -14 * s)), K(settle, R(-6, 8 * s, -6 * s)), K(1, R())];
      bones[`lowerarm_${arm}`] = [K(0, R()), K(anticipate, R(0, 16 * s, 7 * s)), K(impact, R(0, -24 * s, -6 * s)), K(settle, R(0, -8 * s, -2 * s)), K(1, R())];
      break;
    }
''')
          replace(g,
'''    case "BODY":
      torso(14, 14, -4); rootDrive(0.040, 0.012, 0.028);
      bones.spine_01 = bones.pelvis;
      bones.clavicle_l = [K(0, R()), K(anticipate, R(0, 0, -8)), K(impact, R(0, 0, 13)), K(1, R())];
      bones.upperarm_l = [K(0, R()), K(anticipate, R(13, -9, -12)), K(impact, R(-18, 17, 11)), K(1, R())];
      break;
''',
'''    case "BODY": {
      const arm = s < 0 ? "l" : "r";
      torso(11, 11, -2); rootDrive(0.044, 0.010, 0.024);
      bones.spine_01 = bones.pelvis;
      bones[`clavicle_${arm}`] = [K(0, R()), K(anticipate, R(0, 0, 8 * s)), K(impact, R(0, 0, -13 * s)), K(1, R())];
      bones[`upperarm_${arm}`] = [K(0, R()), K(anticipate, R(11, 9 * s, 10 * s)), K(impact, R(-16, -15 * s, -10 * s)), K(settle, R(-6, -6 * s, -4 * s)), K(1, R())];
      break;
    }
''')
          replace(g,
'''    case "HEAVY":
      torso(28, 12, 6); rootDrive(0.070, 0.026, 0.032);
      bones.spine_01 = bones.pelvis;
      bones.neck_01 = [K(0, R()), K(anticipate, R(0, -5 * s, 0)), K(impact, R(1, 9 * s, 0)), K(1, R())];
      bones.clavicle_r = [K(0, R()), K(anticipate, R(0, 0, 15)), K(impact, R(0, 0, -22)), K(1, R())];
      bones.upperarm_r = [K(0, R()), K(anticipate, R(16, 15, 17)), K(impact, R(-24, -29, -17)), K(settle, R(-10, -12, -7)), K(1, R())];
      break;
''',
'''    case "HEAVY":
      torso(20, 6, 2); rootDrive(0.085, 0.014, 0.024);
      bones.spine_01 = bones.pelvis;
      bones.neck_01 = [K(0, R()), K(anticipate, R(0, -3 * s, 0)), K(impact, R(1, 5 * s, 0)), K(1, R())];
      bones.clavicle_r = [K(0, R()), K(anticipate, R(0, 0, 11)), K(impact, R(0, 0, -16)), K(1, R())];
      bones.upperarm_r = [K(0, R()), K(anticipate, R(12, 11, 12)), K(impact, R(-18, -21, -12)), K(settle, R(-7, -9, -5)), K(1, R())];
      bones.lowerarm_r = [K(0, R()), K(anticipate, R(0, 8, 5)), K(impact, R(0, -12, -4)), K(settle, R(0, -5, -2)), K(1, R())];
      break;
''')
          replace(g,
'''    case "COUNTER":
      torso(22, 3, 4); rootDrive(0.045, 0.020, 0.018);
      bones.clavicle_r = [K(0, R()), K(anticipate, R(0, 0, 13)), K(impact, R(0, 0, -19)), K(1, R())];
      bones.upperarm_r = [K(0, R()), K(anticipate, R(13, 11, 16)), K(impact, R(-19, -23, -15)), K(1, R())];
      break;
''',
'''    case "COUNTER": {
      const arm = s < 0 ? "l" : "r";
      torso(14, 2, 1); rootDrive(0.050, 0.010, 0.015);
      bones[`clavicle_${arm}`] = [K(0, R()), K(anticipate, R(0, 0, 10 * s)), K(impact, R(0, 0, -15 * s)), K(1, R())];
      bones[`upperarm_${arm}`] = [K(0, R()), K(anticipate, R(10, 9 * s, 12 * s)), K(impact, R(-16, -18 * s, -11 * s)), K(settle, R(-6, -7 * s, -4 * s)), K(1, R())];
      break;
    }
''')

          # Runtime mapping: select side-specific clips from visualContact.
          p = "src/game/motion-profile.ts"
          replace(p, '  secondaryLibraryClips: 20,\n  proceduralLibraryClips: 20,', '  secondaryLibraryClips: 23,\n  proceduralLibraryClips: 23,')
          replace(p, '  counter: { clip: "PF_Counter_R", style: "COUNTER", speedScale: 1.08, contactBlend: 0.29 },', '  counter: { clip: "PF_Counter_L", style: "COUNTER", speedScale: 1.08, contactBlend: 0.29 },')
          replace(p,
'''export function motionSpecForMove(move: MoveDefinition): MoveMotionSpec {
  return MOVE_MOTIONS[move.id] ?? {
    clip: move.motionId ?? (move.animation === "kick" ? "NinjaJump_Start" : "Punch_Cross"),
    style: move.animation === "kick" ? "FRONT_KICK" : "CROSS",
    speedScale: 1,
    contactBlend: 0.5,
  };
}
''',
'''function handedClipForMove(move: MoveDefinition, fallback: string): string {
  const left = move.visualContact?.startsWith("LEFT") === true;
  if (move.id === "backfist") return left ? "PF_Backfist_L" : "PF_Backfist_R";
  if (move.id === "bodyBlow") return left ? "PF_BodyBlow_L" : "PF_BodyBlow_R";
  if (move.id === "counter") return left ? "PF_Counter_L" : "PF_Counter_R";
  return fallback;
}

export function motionSpecForMove(move: MoveDefinition): MoveMotionSpec {
  const authored = MOVE_MOTIONS[move.id];
  if (authored) return { ...authored, clip: handedClipForMove(move, authored.clip) };
  return {
    clip: move.motionId ?? (move.animation === "kick" ? "NinjaJump_Start" : "Punch_Cross"),
    style: move.animation === "kick" ? "FRONT_KICK" : "CROSS",
    speedScale: 1,
    contactBlend: 0.5,
  };
}
''')

          r = "src/game/motion-expansion-runtime.ts"
          replace(r, '  PF_Backfist_R: "Melee_Hook",\n', '  PF_Backfist_R: "Melee_Hook",\n  PF_Backfist_L: "Melee_Hook",\n')
          replace(r, '  PF_BodyBlow_L: "Shield_OneShot",\n', '  PF_BodyBlow_L: "Shield_OneShot",\n  PF_BodyBlow_R: "Shield_OneShot",\n')
          replace(r, '  PF_Counter_R: "Punch_Cross",\n', '  PF_Counter_R: "Punch_Cross",\n  PF_Counter_L: "Punch_Cross",\n')
          replace(r,
'''    fighter.visual.root.userData.motionExpansionHasProcedural = runtime.clips.has("PF_Jab_L")
      && runtime.clips.has("PF_RisingKick_R")
      && runtime.clips.has("PF_GuardBreak")
      && runtime.clips.has("PF_KickRecover");
''',
'''    fighter.visual.root.userData.motionExpansionHasProcedural = runtime.clips.has("PF_Jab_L")
      && runtime.clips.has("PF_Backfist_L")
      && runtime.clips.has("PF_BodyBlow_R")
      && runtime.clips.has("PF_Counter_L")
      && runtime.clips.has("PF_RisingKick_R")
      && runtime.clips.has("PF_GuardBreak")
      && runtime.clips.has("PF_KickRecover");
''')
          replace(r,
'''    case "HOOK":
      addRotation(runtime, "pelvis", 0, side * 0.11, 0, w);
      addRotation(runtime, "spine_02", 0, side * 0.24, side * 0.035, w);
      addRotation(runtime, "spine_03", 0, side * 0.16, side * 0.075, w);
      break;
''',
'''    case "HOOK":
      addRotation(runtime, "pelvis", 0, side * 0.06, 0, w);
      addRotation(runtime, "spine_02", 0, side * 0.11, side * 0.015, w);
      addRotation(runtime, "spine_03", 0, side * 0.08, side * 0.025, w);
      break;
''')
          replace(r,
'''    case "HEAVY":
      addRotation(runtime, "pelvis", 0, side * 0.15, 0, w);
      addRotation(runtime, "spine_02", 0.10, side * 0.29, side * 0.045, w);
      addRotation(runtime, "spine_03", 0.08, side * 0.20, side * 0.065, w);
      addRotation(runtime, "head", 0, -side * 0.05, 0, w);
      break;
''',
'''    case "HEAVY":
      addRotation(runtime, "pelvis", 0, side * 0.08, 0, w);
      addRotation(runtime, "spine_02", 0.05, side * 0.14, side * 0.020, w);
      addRotation(runtime, "spine_03", 0.03, side * 0.10, side * 0.025, w);
      addRotation(runtime, "head", 0, -side * 0.025, 0, w);
      break;
''')

          # Existing KAIRO readability audit now expects the left-hand counter and 23 clips.
          a = "scripts/capture-motion-readability-audit.mjs"
          replace(a, 'motionExpansionProceduralClipCount === 20', 'motionExpansionProceduralClipCount === 23')
          replace(a, 'counter: "PF_Counter_R",', 'counter: "PF_Counter_L",')

          # Permanent generator workflow inventory.
          w = ".github/workflows/procedural-fight-motion-generator.yml"
          replace(w,
            "            'PF_Jab_L','PF_Cross_R','PF_Backfist_R','PF_BodyBlow_L','PF_Power_R',\n",
            "            'PF_Jab_L','PF_Cross_R','PF_Backfist_R','PF_Backfist_L','PF_BodyBlow_L','PF_BodyBlow_R','PF_Power_R',\n")
          replace(w,
            "            'PF_Throw','PF_Counter_R','PF_HitHeavy','PF_Launch','PF_DownBack','PF_Wakeup',\n",
            "            'PF_Throw','PF_Counter_R','PF_Counter_L','PF_HitHeavy','PF_Launch','PF_DownBack','PF_Wakeup',\n")

          # Static regression contract.
          t = "tests/motion-expansion.test.ts"
          replace(t, 'assert.equal(MOTION_EXPANSION_PROFILE.secondaryLibraryClips, 20);', 'assert.equal(MOTION_EXPANSION_PROFILE.secondaryLibraryClips, 23);')
          replace(t, 'assert.equal(MOTION_EXPANSION_PROFILE.proceduralLibraryClips, 20);', 'assert.equal(MOTION_EXPANSION_PROFILE.proceduralLibraryClips, 23);')
          replace(t, 'test("procedural v2 generator artifact contains 20 clips, root motion and deterministic timing metadata", async () => {', 'test("procedural v2 generator artifact contains 23 clips, handed variants, root motion and deterministic timing metadata", async () => {')
          replace(t, '  assert.equal(metrics.generatedClipCount, 20);\n  assert.equal(metrics.clips.length, 20);', '  assert.equal(metrics.generatedClipCount, 23);\n  assert.equal(metrics.clips.length, 23);')
          replace(t,
            '    "PF_Jab_L", "PF_LowKick_L", "PF_DownBack", "PF_GuardBreak",\n',
            '    "PF_Jab_L", "PF_Backfist_L", "PF_BodyBlow_R", "PF_Counter_L", "PF_LowKick_L", "PF_DownBack", "PF_GuardBreak",\n')
          marker = '''test("motion runtime uses bounded procedural center-of-mass motion and generated guard/evasion states", async () => {'''
          insert = '''test("side-sensitive punches select the clip that matches each fighter's authored contact hand", () => {
  const kairo = FIGHTER_DEFINITIONS.red;
  const sera = FIGHTER_DEFINITIONS.blue;
  assert.equal(motionSpecForMove(kairo.moves.backfist).clip, "PF_Backfist_R");
  assert.equal(motionSpecForMove(sera.moves.backfist).clip, "PF_Backfist_L");
  assert.equal(motionSpecForMove(kairo.moves.bodyBlow).clip, "PF_BodyBlow_L");
  assert.equal(motionSpecForMove(sera.moves.bodyBlow).clip, "PF_BodyBlow_R");
  assert.equal(motionSpecForMove(kairo.moves.counter).clip, "PF_Counter_L");
  assert.equal(motionSpecForMove(sera.moves.counter).clip, "PF_Counter_L");
});

'''
          replace(t, marker, insert + marker)

          # New real-WebGL audit for the three character-dependent punch families.
          intent = r'''import { spawn } from "node:child_process";
import { mkdir, writeFile } from "node:fs/promises";
import process from "node:process";

const driver = process.env.WEBDRIVER_BIN;
const url = process.env.AUDIT_URL ?? "http://127.0.0.1:3000/";
const outputDir = process.env.TPS_AUDIT_DIR ?? "artifacts/tps-visual-audit";
if (!driver) throw new Error("WEBDRIVER_BIN is required");
const port = 9522;
const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const proc = spawn(driver, [`--port=${port}`, "--allowed-ips="], { stdio: ["ignore", "pipe", "pipe"] });
let driverLog = "";
proc.stdout.on("data", (c) => { driverLog += c.toString(); });
proc.stderr.on("data", (c) => { driverLog += c.toString(); });
async function waitForDriver() { for (let i = 0; i < 150; i += 1) { try { const r = await fetch(`http://127.0.0.1:${port}/status`); if (r.ok) return; } catch {} await delay(100); } throw new Error(driverLog); }
async function command(path, method = "GET", body) { const r = await fetch(`http://127.0.0.1:${port}${path}`, { method, headers: body === undefined ? undefined : { "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) }); const p = await r.json().catch(() => ({})); if (!r.ok || p?.value?.error) throw new Error(`${method} ${path}: ${r.status} ${JSON.stringify(p)}`); return p.value; }
async function execute(id, script, args = []) { return command(`/session/${id}/execute/sync`, "POST", { script, args }); }
async function screenshot(id, path) { const encoded = await command(`/session/${id}/screenshot`); await writeFile(path, Buffer.from(encoded, "base64")); }
async function clickButton(id, text) { return execute(id, `const b=[...document.querySelectorAll('button')].find(x=>x.textContent?.includes(arguments[0])); if(!b)return false;b.click();return true;`, [text]); }
const lookup = `function findGame(){const host=document.querySelector('main.poly-app');if(!host)return null;const key=Object.keys(host).find(k=>k.startsWith('__reactFiber$'));let f=key?host[key]:null;const seen=new Set();while(f&&!seen.has(f)){seen.add(f);let h=f.memoizedState;while(h){const v=h.memoizedState;const c=v&&typeof v==='object'&&'current'in v?v.current:null;if(c&&c.p1&&c.p2&&c.renderer&&c.camera&&c.scene)return c;h=h.next;}f=f.return;}return null;}`;
const reset = `function resetFighter(f){f.currentMove=null;f.moveTick=0;f.hitStop=0;f.hitStun=0;f.blockStun=0;f.knockdownTicks=0;f.guardDamage=0;f.velocity.set(0,0,0);f.hitTargets.clear();f.health=100;f.state='IDLE';f.grounded=true;const n={left:false,right:false,up:false,down:false,punch:false,kick:false,guard:false};f.input={...n};f.previousInput={...n};}`;
const cases = [
  { fighter: "p1", name: "kairo", move: "backfist", clip: "PF_Backfist_R", contact: "RIGHT_FIST" },
  { fighter: "p1", name: "kairo", move: "bodyBlow", clip: "PF_BodyBlow_L", contact: "LEFT_FIST" },
  { fighter: "p1", name: "kairo", move: "counter", clip: "PF_Counter_L", contact: "LEFT_FIST" },
  { fighter: "p2", name: "sera", move: "backfist", clip: "PF_Backfist_L", contact: "LEFT_FIST" },
  { fighter: "p2", name: "sera", move: "bodyBlow", clip: "PF_BodyBlow_R", contact: "RIGHT_FIST" },
  { fighter: "p2", name: "sera", move: "counter", clip: "PF_Counter_L", contact: "LEFT_FIST" },
];
let sessionId = null;
try {
  await waitForDriver();
  const session = await command("/session", "POST", { capabilities: { alwaysMatch: { browserName: "chrome", "goog:chromeOptions": { args: ["--headless=new","--no-sandbox","--disable-dev-shm-usage","--ignore-gpu-blocklist","--enable-webgl","--use-angle=swiftshader","--window-size=1200,650","--hide-scrollbars"] } } } });
  sessionId = session.sessionId;
  await command(`/session/${sessionId}/url`, "POST", { url });
  await delay(650);
  if (!(await clickButton(sessionId, "TPS LOCK-ON BATTLE"))) throw new Error("TPS title button not found");
  await delay(120);
  if (!(await clickButton(sessionId, "ENGAGE TPS"))) throw new Error("TPS engage button not found");
  let ready = false;
  for (let i = 0; i < 160; i += 1) {
    ready = await execute(sessionId, `${lookup}const g=findGame();if(!g)return false;return [g.p1,g.p2].every(f=>f.visual.root.userData.motionExpansionHasProcedural===true&&f.visual.root.userData.motionExpansionProceduralClipCount===23);`);
    if (ready) break;
    await delay(100);
  }
  if (!ready) throw new Error("Both fighters did not preload 23 procedural clips");
  await mkdir(outputDir, { recursive: true });
  await execute(sessionId, `${lookup}const g=findGame();cancelAnimationFrame(g.raf);g.running=false;g.finished=false;g.input.clear();g.enemyOpeningGraceTicks=9999;g.updateEnemy=()=>{};return true;`);
  const results = [];
  for (const c of cases) {
    const result = await execute(sessionId, `${lookup}${reset}const c=arguments[0];const g=findGame();resetFighter(g.p1);resetFighter(g.p2);g.finished=false;g.input.clear();g.p1.position.set(0,0,0.74);g.p2.position.set(0,0,-0.48);g.p1.facing=1;g.p2.facing=-1;const a=g[c.fighter],o=c.fighter==='p1'?g.p2:g.p1;if(!a.beginMove(c.move))return {error:'move-not-found'};const contact=a.currentMove?.visualContact??null;let t=performance.now()/1000;let active=false;for(let i=0;i<90;i+=1){g.p1.hitStop=0;g.p2.hitStop=0;g.step();g.p1.hitStop=0;g.p2.hitStop=0;t+=1/60;g.updateVisual(a,o,t);g.updateVisual(o,a,t+0.007);if(a.visual.root.userData.motionExpansionPhase==='ACTIVE'&&a.state==='ATTACK'){active=true;break;}if(a.state!=='ATTACK')break;}g.updateCamera(1/60);g.updateLockOn();g.renderer.render(g.scene,g.camera);return {active,state:a.state,move:c.move,clip:a.visual.root.userData.motionExpansionCurrentClip??null,phase:a.visual.root.userData.motionExpansionPhase??null,contact,currentMove:a.visual.root.userData.motionExpansionCurrentMove??null,visible:a.visual.root.userData.motionExpansionTargetsVisibleQuaternius===true};`, [c]);
    if (result?.error || !result?.active || result.phase !== "ACTIVE" || result.state !== "ATTACK") throw new Error(`Intent case failed to reach ACTIVE: ${JSON.stringify({ c, result })}`);
    if (result.clip !== c.clip || result.contact !== c.contact || result.currentMove !== c.move || !result.visible) throw new Error(`Intent mismatch: ${JSON.stringify({ c, result })}`);
    results.push({ ...c, ...result });
    await screenshot(sessionId, `${outputDir}/tps-intent-${c.name}-${c.move.toLowerCase()}.png`);
  }
  await writeFile(`${outputDir}/motion-intent.json`, JSON.stringify({ proceduralClipCount: 23, cases: results }, null, 2));
  console.log(JSON.stringify(results, null, 2));
} finally {
  if (sessionId) await command(`/session/${sessionId}`, "DELETE").catch(() => undefined);
  proc.kill("SIGTERM");
}
'''
          Path("scripts/capture-motion-intent-audit.mjs").write_text(intent)

          tw = ".github/workflows/tps-visual-audit.yml"
          text = Path(tw).read_text()
          text = text.replace('      - scripts/capture-motion-readability-audit.mjs\n', '      - scripts/capture-motion-readability-audit.mjs\n      - scripts/capture-motion-intent-audit.mjs\n')
          needle = '''          WEBDRIVER_BIN="$DRIVER" \\
            AUDIT_URL="http://127.0.0.1:3000/" \\
            TPS_AUDIT_DIR="artifacts/tps-visual-audit" \\
            node scripts/touch-input-safety-audit.mjs
'''
          addition = '''          WEBDRIVER_BIN="$DRIVER" \\
            AUDIT_URL="http://127.0.0.1:3000/" \\
            TPS_AUDIT_DIR="artifacts/tps-visual-audit" \\
            node scripts/capture-motion-intent-audit.mjs
''' + needle
          if needle not in text:
              raise SystemExit("TPS audit execution block not found")
          text = text.replace(needle, addition, 1)
          text = text.replace('          test -s artifacts/tps-visual-audit/motion-readability.json\n', '          test -s artifacts/tps-visual-audit/motion-readability.json\n          test -s artifacts/tps-visual-audit/motion-intent.json\n')
          Path(tw).write_text(text)
          PY

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --ignore-scripts @gltf-transform/core@4.4.1

      - name: Regenerate procedural motion pack
        run: |
          node scripts/generate-procedural-fight-motions-v2.mjs \
            public/models/quaternius/ual-fight-core.glb \
            public/models/quaternius/procedural-fight-core.glb \
            public/models/quaternius/procedural-fight-core.metrics.json

      - name: Validate implementation
        run: |
          npm run test:ci:tps
          npm run lint
          npm run build
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const m = JSON.parse(await readFile('public/models/quaternius/procedural-fight-core.metrics.json', 'utf8'));
          if (m.generatedClipCount !== 23) throw new Error(`expected 23 clips, got ${m.generatedClipCount}`);
          for (const name of ['PF_Backfist_L','PF_BodyBlow_R','PF_Counter_L']) if (!m.clips.includes(name)) throw new Error(`missing ${name}`);
          NODE

      - name: Commit motion intent pass
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/generate-procedural-fight-motions-v2.mjs \
            scripts/capture-motion-readability-audit.mjs \
            scripts/capture-motion-intent-audit.mjs \
            src/game/motion-profile.ts \
            src/game/motion-expansion-runtime.ts \
            tests/motion-expansion.test.ts \
            .github/workflows/procedural-fight-motion-generator.yml \
            .github/workflows/tps-visual-audit.yml \
            public/models/quaternius/procedural-fight-core.glb \
            public/models/quaternius/procedural-fight-core.metrics.json
          git commit -m "Improve motion intent and handedness"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
