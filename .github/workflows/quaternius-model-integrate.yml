name: Integrate selectable Quaternius model skin

on:
  push:
    paths:
      - ".github/workflows/quaternius-model-integrate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Apply model selection UI integration
        run: node scripts/apply-quaternius-model-ui.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate model, motion and fighting rules
        run: npm run test:rules

      - name: Validate PWA and model viewer
        run: npm run test:pwa

      - name: Build production app
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Publish validated integration
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx src/game/game.ts src/game/model-viewer.ts src/components/model-viewer-panel.tsx
          if git diff --cached --quiet; then
            echo "Integration already current"
            exit 0
          fi
          git commit -m "Enable Quaternius UBC as default selectable model"
          git push origin HEAD:main
