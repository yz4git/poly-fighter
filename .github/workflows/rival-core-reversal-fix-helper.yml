name: Rival Core Reversal Fix Helper

on:
  push:
    branches: [rival-core-update-v1]
    paths:
      - .github/workflows/rival-core-reversal-fix-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rival-core-update-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Restore bounded pursuit to signature reversals
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/game/tps-game.ts')
          source = path.read_text()
          old = '''    if (signatureChoice.beat) game.setCombatBeat(signatureChoice.beat);
    if (reversalOpen) game.playerReversalTicks = 0;
    if (flank) {
'''
          new = '''    if (signatureChoice.beat) game.setCombatBeat(signatureChoice.beat);
    if (reversalOpen) {
      // Signature reversals are earned from the same large lateral STEP as the
      // legacy PERFECT route. Preserve its bounded pursuit so the counter does
      // not whiff only because the successful evade created extra separation.
      const towardTarget = horizontalDirection(game.p1.position, game.p2.position);
      const currentDistance = Math.hypot(
        game.p2.position.x - game.p1.position.x,
        game.p2.position.z - game.p1.position.z,
      );
      const lunge = THREE.MathUtils.clamp(
        currentDistance - PERFECT_COUNTER_TARGET_DISTANCE,
        0,
        PERFECT_COUNTER_MAX_LUNGE,
      );
      game.p1.position.addScaledVector(towardTarget, lunge);
      game.p1.visual.root.userData.tpsPerfectCounterLunge = lunge;
      game.p1.visual.root.userData.tpsSignaturePursuitLunge = lunge;
      game.playerReversalTicks = 0;
    }
    if (flank) {
'''
          if old not in source:
              raise SystemExit('missing signature reversal anchor')
          path.write_text(source.replace(old, new, 1))

          test_path = Path('tests/tps-rival-core.test.ts')
          tests = test_path.read_text()
          anchor = '''  assert.match(source, /baseFov - factor \\* 3\\.2/);
});
'''
          replacement = '''  assert.match(source, /baseFov - factor \\* 3\\.2/);
  assert.match(source, /if \\(reversalOpen\\) \\{/);
  assert.match(source, /PERFECT_COUNTER_MAX_LUNGE/);
  assert.match(source, /tpsSignaturePursuitLunge/);
});
'''
          if anchor not in tests:
              raise SystemExit('missing phase 6 test anchor')
          test_path.write_text(tests.replace(anchor, replacement, 1))
          PY
      - run: npm ci --no-audit --no-fund
      - name: TPS regression suite
        run: npm run test:ci:tps
      - name: Lint
        run: npm run lint
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game/tps-game.ts tests/tps-rival-core.test.ts
          git commit -m "Keep signature reversals in contact after STEP"
          git push origin HEAD:rival-core-update-v1
