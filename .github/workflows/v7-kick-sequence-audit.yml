name: V7.3 kick sequence WebGL audit

on:
  push:
    branches:
      - improve/procedural-v7-kick-kinematics-20260902
    paths:
      - .github/workflows/v7-kick-sequence-audit.yml
      - scripts/capture-kick-sequence-v7.mjs
      - src/game/motion-expansion-runtime.ts
      - src/game/motion-profile.ts
      - public/models/quaternius/procedural-fight-core.glb

permissions:
  contents: read

concurrency:
  group: v73-kick-sequence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Select v7.3 contact frames
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/capture-kick-sequence-v7.mjs')
          s = p.read_text()
          s = s.replace('PHASE_ALIGNED_KICK_V1 recovery segment', 'PHASE_ALIGNED_KICK_V2 recovery segment')
          s = s.replace('kick:       { startup: 9,  active: 5, recovery: 17, chamber: 8,  impact: 11, recoil: 19 }', 'kick:       { startup: 9,  active: 5, recovery: 17, chamber: 8,  impact: 9, recoil: 19 }')
          s = s.replace('lowKick:    { startup: 8,  active: 5, recovery: 14, chamber: 7,  impact: 10, recoil: 18 }', 'lowKick:    { startup: 8,  active: 5, recovery: 14, chamber: 7,  impact: 8, recoil: 18 }')
          s = s.replace('risingKick: { startup: 12, active: 5, recovery: 22, chamber: 11, impact: 14, recoil: 26 }', 'risingKick: { startup: 12, active: 5, recovery: 22, chamber: 11, impact: 12, recoil: 26 }')
          s = s.replace('dashKick:   { startup: 13, active: 6, recovery: 21, chamber: 12, impact: 16, recoil: 26 }', 'dashKick:   { startup: 13, active: 6, recovery: 21, chamber: 12, impact: 13, recoil: 26 }')
          p.write_text(s)
          PY
      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-v73-sequence.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/poly-fighter-v73-sequence.log
          exit 1
      - name: Capture kick sequence
        run: |
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then DRIVER="$CHROMEWEBDRIVER/chromedriver"; fi
          test -n "$DRIVER"
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" KICK_AUDIT_DIR="artifacts/kick-sequence-v73" node scripts/capture-kick-sequence-v7.mjs
          test -s artifacts/kick-sequence-v73/kick-sequence.json
          for move in kick lowKick risingKick dashKick; do
            for phase in chamber impact recoil; do
              test -s "artifacts/kick-sequence-v73/${move}-${phase}.png"
            done
          done
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('artifacts/kick-sequence-v73/kick-sequence.json', 'utf8'));
          for (const [move, data] of Object.entries(report)) {
            for (const phase of ['chamber', 'impact', 'recoil']) {
              if (data[phase]?.timelinePolicy !== 'PHASE_ALIGNED_KICK_V2') throw new Error(`${move}/${phase} is not V2: ${JSON.stringify(data[phase])}`);
            }
            if (data.impact?.phase !== 'ACTIVE') throw new Error(`${move} impact is not ACTIVE: ${JSON.stringify(data.impact)}`);
            if ((data.impact?.footLockError ?? 1) > 0.03) throw new Error(`${move} Foot Lock regression: ${data.impact?.footLockError}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-v73-kick-sequence
          path: artifacts/kick-sequence-v73
          if-no-files-found: error
          retention-days: 7
