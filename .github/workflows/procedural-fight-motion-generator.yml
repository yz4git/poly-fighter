name: Generate procedural fight motions

# Source changes intentionally regenerate and publish the deterministic motion pack.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/generate-procedural-fight-motions.mjs
      - scripts/generate-procedural-fight-motions-v2.mjs
      - scripts/generate-procedural-fight-motions-v3.mjs
      - .github/workflows/procedural-fight-motion-generator.yml
      - public/models/quaternius/ual-fight-core.glb

permissions:
  contents: write

concurrency:
  group: procedural-fight-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install project and glTF generator dependency
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --ignore-scripts @gltf-transform/core@4.4.1

      - name: Generate deterministic fight motion pack v3
        run: |
          set -euxo pipefail
          node scripts/generate-procedural-fight-motions-v3.mjs \
            public/models/quaternius/ual-fight-core.glb \
            public/models/quaternius/procedural-fight-core.glb \
            public/models/quaternius/procedural-fight-core.metrics.json
          test -s public/models/quaternius/procedural-fight-core.glb
          test -s public/models/quaternius/procedural-fight-core.metrics.json

      - name: Verify generated v3 clip inventory and motion contract
        run: |
          node --input-type=module <<'NODE'
          import { NodeIO } from '@gltf-transform/core';
          import { readFile } from 'node:fs/promises';
          const required = [
            'PF_Jab_L','PF_Cross_R','PF_Backfist_R','PF_Backfist_L','PF_BodyBlow_L','PF_BodyBlow_R','PF_Power_R',
            'PF_FrontKick_R','PF_LowKick_L','PF_RisingKick_R','PF_DashKick_R',
            'PF_Throw','PF_Counter_R','PF_Counter_L','PF_HitHeavy','PF_Launch','PF_DownBack','PF_Wakeup',
            'PF_GuardBreak','PF_Sidestep_L','PF_Sidestep_R','PF_KickRecover','PF_HeavyRecover',
          ];
          const io = new NodeIO();
          const doc = await io.read('public/models/quaternius/procedural-fight-core.glb');
          const names = doc.getRoot().listAnimations().map((a) => a.getName()).sort();
          for (const name of required) {
            if (!names.includes(name)) throw new Error(`missing procedural clip ${name}`);
          }
          if (names.length !== required.length) throw new Error(`unexpected procedural clip count ${names.length}`);
          const metrics = JSON.parse(await readFile('public/models/quaternius/procedural-fight-core.metrics.json', 'utf8'));
          if (metrics.version !== 'PROCEDURAL_FIGHT_V3') throw new Error(`unexpected generator version ${metrics.version}`);
          if (metrics.rootMotionPolicy !== 'POSE_GRAPH_COM_WITH_RUNTIME_FOOT_LOCK') throw new Error(`unexpected root policy ${metrics.rootMotionPolicy}`);
          if (metrics.timingPolicy !== 'MOVE_SPECIFIC_9_POSE_TIMING') throw new Error(`unexpected timing policy ${metrics.timingPolicy}`);
          if (!Array.isArray(metrics.poseGraph) || metrics.poseGraph.length !== 9) throw new Error('v3 pose graph contract missing');
          if (metrics.motionDna?.POWER?.id !== 'KAIRO_POWER' || metrics.motionDna?.SPEED?.id !== 'SERA_SPEED') {
            throw new Error(`v3 motion DNA contract missing: ${JSON.stringify(metrics.motionDna)}`);
          }
          if (metrics.metrics.some((entry) => entry.missingAnimated.length)) {
            throw new Error(`modifier paths absent from base animation: ${JSON.stringify(metrics.metrics.filter((entry) => entry.missingAnimated.length))}`);
          }
          if (metrics.metrics.filter((entry) => entry.maxPlanarRootShift > 0.001).length < 12) {
            throw new Error('v3 expected planar center-of-mass movement on most clips');
          }
          console.log(JSON.stringify({ names, rootMotionPolicy: metrics.rootMotionPolicy, timingPolicy: metrics.timingPolicy, poseGraph: metrics.poseGraph, motionDna: metrics.motionDna }, null, 2));
          NODE

      - name: Publish generated pack to current branch
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/quaternius/procedural-fight-core.glb public/models/quaternius/procedural-fight-core.metrics.json
          if git diff --cached --quiet; then
            echo "Procedural motion pack already current"
            exit 0
          fi
          git commit -m "Generate procedural fight motion pack v3"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
