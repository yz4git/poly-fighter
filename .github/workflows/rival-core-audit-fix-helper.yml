name: Rival Core Audit Fix Helper

on:
  push:
    branches: [rival-core-update-v1]
    paths:
      - .github/workflows/rival-core-audit-fix-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rival-core-update-v1
      - name: Accept Fighter DNA signature beat in combat v2 audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/capture-tps-combat-v2-audit.mjs')
          source = path.read_text()
          old = "if (intercept?.reaction !== 'INTERCEPT' || intercept?.p2Health >= 100 || intercept?.beat !== 'INTERCEPT') {"
          new = "if (intercept?.reaction !== 'INTERCEPT' || intercept?.p2Health >= 100 || !['INTERCEPT', 'BREAK LINE', 'BLUE SHIFT'].includes(intercept?.beat)) {"
          if old not in source:
              raise SystemExit('missing INTERCEPT audit contract')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check scripts/capture-tps-combat-v2-audit.mjs
      - name: Commit audit contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-tps-combat-v2-audit.mjs
          git commit -m "Allow Fighter DNA intercept signatures in TPS audit"
          git push origin HEAD:rival-core-update-v1
