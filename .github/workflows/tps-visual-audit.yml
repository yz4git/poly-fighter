name: POLY FIGHTER TPS WebGL audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - app/**
      - src/game/**
      - public/models/**
      - package-lock.json
      - scripts/capture-tps-entry-audit.mjs
      - scripts/capture-tps-reactive-cues.mjs
      - scripts/capture-tps-combat-v2-audit.mjs
      - scripts/capture-tps-visual-audit.mjs
      - scripts/capture-tps-recovery-handoff-audit.mjs
      - scripts/capture-tps-counterattack-handoff-audit.mjs
      - scripts/capture-tps-block-punish-handoff-audit.mjs
      - scripts/capture-motion-readability-audit.mjs
      - scripts/capture-motion-intent-audit.mjs
      - scripts/touch-input-safety-audit.mjs
      - .github/workflows/tps-visual-audit.yml
  pull_request:
    branches:
      - main
    paths:
      - app/**
      - src/game/**
      - public/models/**
      - package-lock.json
      - scripts/capture-tps-entry-audit.mjs
      - scripts/capture-tps-reactive-cues.mjs
      - scripts/capture-tps-combat-v2-audit.mjs
      - scripts/capture-tps-visual-audit.mjs
      - scripts/capture-tps-recovery-handoff-audit.mjs
      - scripts/capture-tps-counterattack-handoff-audit.mjs
      - scripts/capture-tps-block-punish-handoff-audit.mjs
      - scripts/capture-motion-readability-audit.mjs
      - scripts/capture-motion-intent-audit.mjs
      - scripts/touch-input-safety-audit.mjs
      - .github/workflows/tps-visual-audit.yml

permissions:
  contents: read

concurrency:
  group: tps-webgl-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install Japanese fonts for training screenshots
        run: |
          if fc-list :lang=ja | grep -q .; then
            echo "Japanese font already available"
            exit 0
          fi
          # The hosted runner also registers Google's Chrome apt repository.
          # It can briefly publish a Release file before its Packages mirror has
          # converged, producing an unrelated Hash Sum mismatch. Refresh only the
          # Ubuntu archive here; Chrome/ChromeDriver are already installed.
          sudo apt-get update -qq \
            -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y fonts-noto-cjk
      - name: Build production preview
        run: npm run build
      - name: Start production preview
        run: |
          PORT=3000 npm start > /tmp/poly-fighter-tps-server.log 2>&1 &
          echo $! > /tmp/poly-fighter-tps-server.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/poly-fighter-tps-server.log
          exit 1
      - name: Capture and exercise TPS battle
        run: |
          mkdir -p artifacts/tps-visual-audit
          DRIVER="$(command -v chromedriver || true)"
          if [ -z "$DRIVER" ] && [ -n "${CHROMEWEBDRIVER:-}" ] && [ -x "$CHROMEWEBDRIVER/chromedriver" ]; then
            DRIVER="$CHROMEWEBDRIVER/chromedriver"
          fi
          if [ -z "$DRIVER" ]; then
            echo "ChromeDriver is not available"
            exit 1
          fi
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-visual-audit" node scripts/capture-tps-entry-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-visual-audit" node scripts/capture-tps-reactive-cues.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-visual-audit" node scripts/capture-tps-combat-v2-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-visual-audit" node scripts/capture-tps-visual-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-visual-audit" node scripts/capture-tps-recovery-handoff-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-visual-audit" node scripts/capture-tps-counterattack-handoff-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-visual-audit" node scripts/capture-tps-block-punish-handoff-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-visual-audit" node scripts/capture-motion-readability-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-visual-audit" node scripts/capture-motion-intent-audit.mjs
          WEBDRIVER_BIN="$DRIVER" AUDIT_URL="http://127.0.0.1:3000/" TPS_AUDIT_DIR="artifacts/tps-visual-audit" node scripts/touch-input-safety-audit.mjs
          for image in \
            tps-title-iphone tps-loadout-iphone tps-title tps-loadout tps-idle tps-iphone-idle tps-quickstep tps-windup-cue tps-incoming-cue tps-punish-cue tps-v2-intercept tps-v2-reversal tps-v2-final-impact tps-punch tps-punch-settled tps-throw \
            tps-recovery-handoff-guard tps-recovery-handoff-walk tps-recovery-handoff-sidestep \
            tps-counterattack-handoff-jab tps-counterattack-handoff-kick tps-counterattack-handoff-power \
            tps-block-punish-handoff-block-jab tps-block-punish-handoff-punish-power \
            tps-motion-jab tps-motion-straight tps-motion-bodyblow tps-motion-backfist \
            tps-motion-power tps-motion-kick tps-motion-lowkick tps-motion-risingkick \
            tps-motion-dashkick tps-motion-throw tps-motion-counter \
            tps-intent-kairo-backfist tps-intent-kairo-bodyblow tps-intent-kairo-counter \
            tps-intent-sera-backfist tps-intent-sera-bodyblow tps-intent-sera-counter; do
            test -s "artifacts/tps-visual-audit/${image}.png"
            file "artifacts/tps-visual-audit/${image}.png" | grep -q "PNG image data"
          done
          test -s artifacts/tps-visual-audit/tps-entry-layout.json
          test -s artifacts/tps-visual-audit/tps-reactive-cues.json
          test -s artifacts/tps-visual-audit/tps-combat-v2.json
          test -s artifacts/tps-visual-audit/tps-runtime-state.json
          test -s artifacts/tps-visual-audit/tps-recovery-handoff.json
          test -s artifacts/tps-visual-audit/tps-counterattack-handoff.json
          test -s artifacts/tps-visual-audit/tps-block-punish-handoff.json
          test -s artifacts/tps-visual-audit/motion-readability.json
          test -s artifacts/tps-visual-audit/motion-intent.json
          test -s artifacts/tps-visual-audit/touch-input-safety.json
          cp /tmp/poly-fighter-tps-server.log artifacts/tps-visual-audit/server.log
      - name: Preserve server log
        if: always()
        run: |
          mkdir -p artifacts/tps-visual-audit
          if [ -f /tmp/poly-fighter-tps-server.log ]; then
            cp /tmp/poly-fighter-tps-server.log artifacts/tps-visual-audit/server.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poly-fighter-tps-webgl-audit
          path: artifacts/tps-visual-audit
          if-no-files-found: error
          retention-days: 7
