name: TPS quickstep audit capture fix

on:
  push:
    paths:
      - '.github/workflows/tps-audit-ghost-capture-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Make deterministic quickstep capture exercise graphics director
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/capture-tps-visual-audit.mjs')
          text = path.read_text()
          old = '''    game.press('guard', 'tps-audit-evade-g');
    game.press('right', 'tps-audit-evade-side');
    for (let index = 0; index < 6; index += 1) game.step();
    game.release('guard', 'tps-audit-evade-g');
    game.release('right', 'tps-audit-evade-side');
    for (let index = 0; index < 18; index += 1) game.updateCamera(1 / 60);
    game.updateLockOn();
    game.renderer.render(game.scene, game.camera);
    return { start, end: { x: game.p1.position.x, z: game.p1.position.z }, state: game.p1.state };
'''
          new = '''    game.press('guard', 'tps-audit-evade-g');
    game.press('right', 'tps-audit-evade-side');
    const graphicsBaseTime = game.renderTime;
    for (let index = 0; index < 6; index += 1) {
      game.step();
      game.graphics.update(game.p1, game.p2, graphicsBaseTime + index * 0.06, 1 / 60);
    }
    game.release('guard', 'tps-audit-evade-g');
    game.release('right', 'tps-audit-evade-side');
    for (let index = 0; index < 18; index += 1) game.updateCamera(1 / 60);
    game.updateLockOn();
    game.renderer.render(game.scene, game.camera);
    const visibleGhosts = game.graphics.group.children.filter((child) => child.name.startsWith('tps-quickstep-ghost-') && child.visible).length;
    return { start, end: { x: game.p1.position.x, z: game.p1.position.z }, state: game.p1.state, visibleGhosts };
'''
          if old not in text:
              raise SystemExit('quickstep capture anchor missing')
          text = text.replace(old, new, 1)
          old_assert = '''  if (quickstepTravel < 0.45) throw new Error(`TPS quickstep travel too small: ${JSON.stringify({ quickstepProbe, quickstepTravel })}`);
  await screenshot(sessionId, `${outputDir}/tps-quickstep.png`);
'''
          new_assert = '''  if (quickstepTravel < 0.45) throw new Error(`TPS quickstep travel too small: ${JSON.stringify({ quickstepProbe, quickstepTravel })}`);
  if (!(quickstepProbe.visibleGhosts >= 1)) throw new Error(`TPS quickstep afterimage did not render: ${JSON.stringify(quickstepProbe)}`);
  await screenshot(sessionId, `${outputDir}/tps-quickstep.png`);
'''
          if old_assert not in text:
              raise SystemExit('quickstep assertion anchor missing')
          path.write_text(text.replace(old_assert, new_assert, 1))
          PY
      - name: TPS regression suite
        run: npm run test:ci:tps
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Publish audit fix
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-tps-visual-audit.mjs
          git commit -m "Audit TPS quickstep afterimage rendering"
          git push origin HEAD:main
