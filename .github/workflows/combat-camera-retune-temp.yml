name: Combat camera retune temp
on:
  push:
    branches: [chatgpt/combat-readability-pass-v1]
    paths: [.github/workflows/combat-camera-retune-temp.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/combat-readability-pass-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - shell: python
        run: |
          from pathlib import Path
          def rep(path,a,b):
            p=Path(path); s=p.read_text()
            if a not in s: raise SystemExit('missing target '+path)
            p.write_text(s.replace(a,b,1))
          g='src/game/tps-game.ts'
          rep(g,'this.camera.fov = width > height && aspect < 2.4 ? 54 : 47;','this.camera.fov = width > height && aspect < 2.4 ? 52 : 47;')
          rep(g,'''    const backDistance = 5.05 + closeFactor * 0.72 + compactLandscapeFactor * 0.34;
              const shoulderOffset = 2.08 + closeFactor * 1.08 + compactLandscapeFactor * (0.46 + closeFactor * 0.38);
              const cameraHeight = 2.30 + closeFactor * 0.22 + compactLandscapeFactor * 0.05;
              this.cameraTarget.copy(this.p2.position)
                .lerp(this.p1.position, closeFactor * 0.16)
                .addScaledVector(right, -0.20 * closeFactor)
                .add(new THREE.Vector3(0, 1.18 + closeFactor * 0.05, 0));
              this.cameraDesired.copy(this.p1.position)
                .addScaledVector(forward, -backDistance)
                .addScaledVector(right, shoulderOffset)
                .add(new THREE.Vector3(0, cameraHeight, 0));
              ease(this.camera.position, this.cameraDesired, 10.8, delta);
          ''','''    // Keep a modest extra pullback at contact, but preserve the strong lateral
              // shoulder angle that keeps both fighter centers separated on iPhone.
              const backDistance = 4.80 + compactLandscapeFactor * 0.20;
              const shoulderOffset = 2.50 + closeFactor * 1.70 + compactLandscapeFactor * (0.55 + closeFactor * 0.50);
              const cameraHeight = 2.32 + closeFactor * 0.18 + compactLandscapeFactor * 0.04;
              this.cameraTarget.copy(this.p2.position)
                .addScaledVector(right, -0.30 * closeFactor)
                .add(new THREE.Vector3(0, 1.18 + closeFactor * 0.04, 0));
              this.cameraDesired.copy(this.p1.position)
                .addScaledVector(forward, -backDistance)
                .addScaledVector(right, shoulderOffset)
                .add(new THREE.Vector3(0, cameraHeight, 0));
              ease(this.camera.position, this.cameraDesired, 11.6, delta);
          ''')
          rep(g,'''    this.camera.position.copy(this.p1.position)
                .addScaledVector(forward, -5.05)
                .addScaledVector(right, 2.08)
                .add(new THREE.Vector3(0, 2.30, 0));
          ''','''    this.camera.position.copy(this.p1.position)
                .addScaledVector(forward, -4.92)
                .addScaledVector(right, 2.50)
                .add(new THREE.Vector3(0, 2.32, 0));
          ''')
          t='tests/tps-mode.test.ts'
          rep(t,'assert.match(source, /aspect < 2\\.4 \\? 54 : 47/);','assert.match(source, /aspect < 2\\.4 \\? 52 : 47/);')
          rep(t,'assert.match(source, /backDistance = 5\\.05 \\+ closeFactor \\* 0\\.72/);','assert.match(source, /backDistance = 4\\.80 \\+ compactLandscapeFactor \\* 0\\.20/);')
          rep(t,'assert.match(source, /shoulderOffset = 2\\.08 \\+ closeFactor \\* 1\\.08/);','assert.match(source, /shoulderOffset = 2\\.50 \\+ closeFactor \\* 1\\.70/);')
          rep(t,'  assert.match(source, /lerp\\(this\\.p1\\.position, closeFactor \\* 0\\.16\\)/);\n','')
      - run: npm ci --no-audit --no-fund
      - run: npm run test:ci:tps && npm run lint && npm run build && git diff --check
      - run: |
          git config user.name yz4git
          git config user.email 65384484+yz4git@users.noreply.github.com
          git add src/game/tps-game.ts tests/tps-mode.test.ts
          git commit -m "Retune close combat camera for fighter separation"
          git push origin HEAD:chatgpt/combat-readability-pass-v1
