name: Apply TPS continuous play polish v1

on:
  push:
    branches: [tps-continuous-play-polish-v1]
    paths:
      - .github/workflows/tps-continuous-play-polish-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tps-continuous-play-polish-v1
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Reapply already-validated TPS continuous-play patch
        run: |
          sed -i '/const insertMarker =/i const gameLookup = "${gameLookup}";\nconst outputDir = "${outputDir}";' scripts/apply-tps-continuous-play-polish-v1.mjs
          node scripts/apply-tps-continuous-play-polish-v1.mjs
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'scripts/capture-tps-visual-audit.mjs';
          const source = readFileSync(path, 'utf8');
          writeFileSync(path, source.replaceAll('\\`', '`').replaceAll('\\${', '${'));
          NODE
          git checkout -- .github/workflows/tps-visual-audit.yml
          git diff --check
      - name: Push validated gameplay and audit changes
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/game/tps-game-base.ts tests/tps-mode.test.ts scripts/capture-tps-visual-audit.mjs
          git commit -m "Polish TPS contact spacing and camera continuity"
          git push
